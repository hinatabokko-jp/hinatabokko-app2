<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEETING UP - 位置情報共有・待ち合わせ支援</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Custom Styles & Dark Theme Adjustments */
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation;
        }

        /* Instagram Style Gradient Text & Borders */
        .brand-gradient-text {
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-gradient-bg {
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
        }

        .brand-gradient-border {
            border-image: linear-gradient(90deg, #6366f1 0%, #a855f7 50%, #ec4899 100%) 1;
        }

        /* Custom Leaflet Map Dark Styling */
        .leaflet-container {
            background-color: #1e293b !important;
            border-radius: 1rem;
            width: 100%;
            height: 100%;
        }
        
        .leaflet-tile {
            filter: brightness(0.85) contrast(1.1);
        }

        /* Hide scrollbars for smooth app feel */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Glassmorphism elements */
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Header / Navbar -->
    <header class="glass-panel sticky top-0 z-40 px-4 py-3 flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full brand-gradient-bg flex items-center justify-center font-bold text-white shadow-lg">
                <i class="fa-solid font-bold text-sm">M</i>
            </div>
            <span class="text-xl font-extrabold tracking-tight brand-gradient-text">MEETING UP</span>
        </div>
        <div id="headerUserNav" class="hidden flex items-center space-x-3">
            <button id="btnUserMenu" class="text-xs font-semibold text-slate-300 bg-slate-800/80 hover:bg-slate-700/80 px-2.5 py-1 rounded-full border border-slate-700 transition flex items-center space-x-1 cursor-pointer">
                <span id="navNickname"></span>
                <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
            </button>
            <button id="btnAdminDashboard" class="hidden text-xs bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-lg hover:bg-amber-500/30 transition flex items-center font-bold">
                <i class="fa-solid fa-shield-halved text-amber-400 mr-1.5"></i>管理者
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main id="appContainer" class="flex-1 max-w-md w-full mx-auto p-4 relative flex flex-col justify-center">

        <!-- Screen 1: Login / Join View -->
        <section id="authSection" class="w-full space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-black brand-gradient-text">Meeting Up app</h1>
                <p class="text-slate-400 text-sm">リアルタイム位置共有＆待ち合わせ支援</p>
            </div>

            <div class="glass-panel p-6 rounded-2xl shadow-2xl space-y-4 border border-slate-800">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">ニックネーム</label>
                    <input type="text" id="inputNickname" placeholder="例: たろう" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">アプリ合言葉</label>
                    <input type="password" id="inputPassphrase" placeholder="合言葉を入力" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <button id="btnLogin" class="w-full brand-gradient-bg text-white font-bold py-3.5 rounded-xl shadow-lg hover:opacity-95 transition transform active:scale-95 text-sm">
                    認証して入室
                </button>
            </div>
        </section>

        <!-- Screen 2: Room Selection / Main Dashboard -->
        <section id="roomSelectSection" class="hidden w-full space-y-6">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold text-slate-100">ルームを選択</h2>
                    <p class="text-xs text-slate-400">待ち合わせグループに参加または作成</p>
                </div>
                <button id="btnCreateRoomModal" class="brand-gradient-bg px-3.5 py-2 rounded-xl text-xs font-bold shadow hover:opacity-90 transition">
                    <i class="fa-solid fa-plus mr-1"></i>新規作成
                </button>
            </div>

            <!-- Join Code Input Box -->
            <div class="glass-panel p-4 rounded-xl space-y-2 border border-slate-800">
                <span class="text-xs text-slate-400 font-semibold">招待コードで直接参加</span>
                <div class="flex gap-2">
                    <input type="text" id="inputInviteCode" placeholder="6桁のコード" class="uppercase flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-purple-500">
                    <button id="btnJoinByCode" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-xs font-bold transition">参加</button>
                </div>
            </div>

            <!-- Room Tabs -->
            <div class="space-y-3">
                <h3 class="text-xs uppercase tracking-wider text-slate-500 font-bold">利用可能なルーム</h3>
                <div id="roomList" class="space-y-3 max-h-80 overflow-y-auto no-scrollbar">
                    <!-- Rooms loaded via JS -->
                </div>
            </div>
        </section>

        <!-- Screen 3: Map & Active Room Workspace -->
        <section id="activeRoomSection" class="hidden w-full flex-1 flex flex-col space-y-3 h-[calc(100vh-80px)]">
            <!-- Top Info Bar -->
            <div class="glass-panel p-3 rounded-xl flex items-center justify-between">
                <div>
                    <div class="flex items-center space-x-2">
                        <span id="activeRoomTitle" class="font-bold text-sm text-slate-100"></span>
                        <span id="activeRoomBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300"></span>
                    </div>
                    <div class="text-[11px] text-slate-400 flex items-center space-x-2 mt-0.5">
                        <span>コード: <strong id="activeRoomCode" class="text-purple-400"></strong></span>
                        <span>•</span>
                        <span id="participantCount">0名参加中</span>
                    </div>
                </div>
                <button id="btnLeaveRoom" class="bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 px-3 py-1.5 rounded-lg text-xs font-bold transition">
                    退室
                </button>
            </div>

            <!-- Map Area -->
            <div class="relative h-[45vh] min-h-[300px] flex-none rounded-2xl overflow-hidden border border-slate-800 shadow-inner">
                <div id="map" class="w-full h-full min-h-[300px]"></div>
                
                <!-- GPS Share Overlay Toggle -->
                <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between glass-panel p-3 rounded-xl z-[400] shadow-xl">
                    <div class="flex items-center space-x-2">
                        <div id="gpsStatusDot" class="w-3 h-3 rounded-full bg-slate-500 animate-pulse"></div>
                        <span id="gpsStatusText" class="text-xs font-semibold text-slate-300">位置共有: OFF</span>
                    </div>
                    <button id="btnToggleGps" class="brand-gradient-bg text-white px-4 py-2 rounded-lg text-xs font-bold shadow hover:opacity-90 transition">
                        位置共有を開始
                    </button>
                </div>
            </div>

            <!-- Member Proximity & Distance Info Cards -->
            <div id="proximityList" class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                <!-- Participant Proximity Cards loaded dynamically -->
            </div>

            <!-- Chat & Preset Messages Accordion -->
            <div class="glass-panel p-3 rounded-xl space-y-2">
                <!-- Preset Buttons -->
                <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                    <button class="preset-msg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 px-3 py-1.5 rounded-lg whitespace-nowrap border border-slate-700">そっちに向かっているよ！</button>
                    <button class="preset-msg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 px-3 py-1.5 rounded-lg whitespace-nowrap border border-slate-700">ここで待ってるよ</button>
                    <button class="preset-msg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 px-3 py-1.5 rounded-lg whitespace-nowrap border border-slate-700">どこにいる？</button>
                    <button class="preset-msg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 px-3 py-1.5 rounded-lg whitespace-nowrap border border-slate-700">見つけた！</button>
                </div>
                
                <!-- Chat Feed -->
                <div id="chatFeed" class="h-20 overflow-y-auto no-scrollbar space-y-1.5 text-xs bg-slate-950/50 p-2 rounded-lg border border-slate-800/80">
                    <div class="text-center text-slate-500 text-[10px]">メッセージ履歴はありません</div>
                </div>

                <!-- Input box -->
                <div class="flex gap-2">
                    <input type="text" id="inputChatMessage" placeholder="メッセージを入力..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:ring-1 focus:ring-purple-500">
                    <button id="btnSendMessage" class="brand-gradient-bg px-3 py-1.5 rounded-lg text-xs font-bold text-white shadow">送信</button>
                </div>
            </div>
        </section>

        <!-- Admin View Modal -->
        <section id="adminModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 p-4 flex items-center justify-center">
            <div class="glass-panel max-w-md w-full p-5 rounded-2xl space-y-4 border border-slate-700 max-h-[85vh] overflow-y-auto">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 class="font-extrabold text-slate-100 text-base"><i class="fa-solid fa-user-shield text-amber-400 mr-2"></i>管理者ダッシュボード</h3>
                    <button id="btnCloseAdmin" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>

                <!-- User Management -->
                <div class="space-y-2">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">登録ユーザー管理</h4>
                    <div id="adminUserList" class="space-y-2">
                        <!-- Admin list loaded dynamically -->
                    </div>
                </div>

                <!-- Active Rooms Management -->
                <div class="space-y-2 pt-2 border-t border-slate-800">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">アクティブルーム強制終了</h4>
                    <div id="adminRoomList" class="space-y-2">
                        <!-- Admin room list -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Create Room Modal -->
        <section id="createRoomModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 p-4 flex items-center justify-center">
            <div class="glass-panel max-w-sm w-full p-5 rounded-2xl space-y-4 border border-slate-700">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <h3 class="font-bold text-slate-100 text-sm">新しいルームを作成</h3>
                    <button id="btnCloseCreateRoom" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">ルーム名</label>
                        <input type="text" id="newRoomName" placeholder="例: スタジアム中央ゲート" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:ring-1 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">形式</label>
                        <select id="newRoomType" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none">
                            <option value="invite">一時的な招待ルーム (自動招待コード)</option>
                            <option value="fixed">固定メンバーグループ</option>
                        </select>
                    </div>
                    <button id="btnConfirmCreateRoom" class="w-full brand-gradient-bg py-2.5 text-xs font-bold rounded-xl text-white shadow">作成する</button>
                </div>
            </div>
        </section>

        <!-- Floating Alert / Toast Box -->
        <div id="toast" class="hidden fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800 text-slate-100 border border-purple-500 px-4 py-2.5 rounded-full shadow-2xl text-xs font-semibold flex items-center space-x-2">
            <span id="toastMessage"></span>
        </div>
    </main>

    <!-- Leaflet JS for Interactive OpenMaps -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase SDKs & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Obfuscated Verification Keys (Base64 Encodings)
        const _k1 = "MTIzNA=="; // 1234
        const _k2 = "MDgxMw=="; // 0813

        function verifyToken(input, token) {
            try {
                return btoa(input) === token;
            } catch (e) {
                return false;
            }
        }

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD7zMaJys6IGRN1gV0cPEQveVO6Oq7hNlM",
            authDomain: "meetingupapp-99624.firebaseapp.com",
            projectId: "meetingupapp-99624",
            storageBucket: "meetingupapp-99624.firebasestorage.app",
            messagingSenderId: "675238703207",
            appId: "1:675238703207:web:64a2d64c1e33340e47e4c2",
            measurementId: "G-7Q2KK5ZDB1"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Global State
        const STATE = {
            currentUser: null,
            currentRoom: null,
            watchPositionId: null,
            map: null,
            markers: {},
            myLocation: null,
            users: [],
            rooms: [],
            chatMessages: [],
            roomListenerUnsub: null,
            chatListenerUnsub: null,
            usersListenerUnsub: null
        };

        document.addEventListener("DOMContentLoaded", () => {
            initApp();
        });

        function initApp() {
            // Authenticate anonymously to Firebase backend
            signInAnonymously(auth).catch(err => console.error("Firebase Auth Error:", err));
            setupInitialData();
            bindEvents();
        }

        function setupInitialData() {
            // Subscribe to Firebase Rooms Data
            const roomsRef = ref(db, "rooms");
            onValue(roomsRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    STATE.rooms = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                } else {
                    // Seed initial default fixed room if DB is empty
                    const defaultRoom = {
                        name: "待ち合わせ",
                        type: "fixed",
                        inviteCode: "999888",
                        members: {},
                        locations: {}
                    };
                    set(ref(db, "rooms/ROOM_FIXED_WAITING"), defaultRoom);
                    STATE.rooms = [{ id: "ROOM_FIXED_WAITING", ...defaultRoom }];
                }
                renderRoomsList();
                if (STATE.currentRoom) {
                    const updatedRoom = STATE.rooms.find(r => r.id === STATE.currentRoom.id);
                    if (updatedRoom) {
                        STATE.currentRoom = updatedRoom;
                        updateRoomUI();
                        updateMapMarkers();
                        updateProximityCards();
                    }
                }
            });

            // Subscribe to Online Users List
            const usersRef = ref(db, "users");
            onValue(usersRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    STATE.users = Object.keys(data).map(key => ({ uid: key, ...data[key] }));
                } else {
                    STATE.users = [];
                }
            });
        }

        function bindEvents() {
            document.getElementById("btnLogin").addEventListener("click", handleLogin);
            document.getElementById("btnUserMenu").addEventListener("click", handleUserMenuClick);
            document.getElementById("btnCreateRoomModal").addEventListener("click", () => showModal("createRoomModal"));
            document.getElementById("btnCloseCreateRoom").addEventListener("click", () => hideModal("createRoomModal"));
            document.getElementById("btnConfirmCreateRoom").addEventListener("click", handleCreateRoom);
            document.getElementById("btnJoinByCode").addEventListener("click", handleJoinByCode);
            document.getElementById("btnLeaveRoom").addEventListener("click", handleLeaveRoom);
            document.getElementById("btnToggleGps").addEventListener("click", toggleGpsSharing);
            document.getElementById("btnSendMessage").addEventListener("click", handleSendMessage);
            
            document.querySelectorAll(".preset-msg").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    document.getElementById("inputChatMessage").value = e.target.innerText;
                    handleSendMessage();
                });
            });

            document.getElementById("btnAdminDashboard").addEventListener("click", openAdminDashboard);
            document.getElementById("btnCloseAdmin").addEventListener("click", () => hideModal("adminModal"));
        }

        function handleLogin() {
            const nickname = document.getElementById("inputNickname").value.trim();
            const passphrase = document.getElementById("inputPassphrase").value.trim();

            if (!nickname) {
                showToast("ニックネームを入力してください");
                return;
            }

            const isUserValid = verifyToken(passphrase, _k1);
            const isAdminValid = verifyToken(passphrase, _k2);

            if (!isUserValid && !isAdminValid) {
                showToast("合言葉が正しくありません");
                return;
            }

            const isAdmin = isAdminValid;
            const uid = auth.currentUser ? auth.currentUser.uid : "UID_" + Math.random().toString(36).substring(2, 9);

            STATE.currentUser = {
                uid: uid,
                nickname: nickname,
                isAdmin: isAdmin
            };

            // Sync user details to Firebase Database
            set(ref(db, `users/${uid}`), {
                nickname: nickname,
                isAdmin: isAdmin,
                status: "active",
                updatedAt: Date.now()
            });

            document.getElementById("headerUserNav").classList.remove("hidden");
            document.getElementById("navNickname").innerText = nickname + (isAdmin ? " 👑" : "");

            const btnAdmin = document.getElementById("btnAdminDashboard");
            if (isAdmin) {
                btnAdmin.classList.remove("hidden");
                btnAdmin.style.display = "inline-flex";
            } else {
                btnAdmin.classList.add("hidden");
                btnAdmin.style.display = "none";
            }

            document.getElementById("authSection").classList.add("hidden");
            document.getElementById("roomSelectSection").classList.remove("hidden");

            renderRoomsList();
            showToast(`ようこそ、${nickname} さん！${isAdmin ? '（管理者権限）' : ''}`);
        }

        function handleUserMenuClick() {
            if (!STATE.currentUser) return;
            if (STATE.currentUser.isAdmin) {
                openAdminDashboard();
            } else {
                if (confirm("ログアウトしてログイン画面に戻りますか？")) {
                    location.reload();
                }
            }
        }

        function enterRoom(roomId) {
            const room = STATE.rooms.find(r => r.id === roomId);
            if (!room) return;

            STATE.currentRoom = room;

            // Register user to room in Firebase
            update(ref(db, `rooms/${roomId}/members`), {
                [STATE.currentUser.uid]: STATE.currentUser.nickname
            });

            document.getElementById("roomSelectSection").classList.add("hidden");
            document.getElementById("activeRoomSection").classList.remove("hidden");

            updateRoomUI();

            // 画面表示切り替え直後に地図サイズを再計算・タイル再描画させる
            setTimeout(() => {
                initMap();
            }, 100);

            // Chat Listener for room
            const chatRef = ref(db, `rooms/${roomId}/messages`);
            onValue(chatRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    STATE.chatMessages = Object.values(data);
                } else {
                    STATE.chatMessages = [];
                }
                renderChatMessages();
            });

            showToast(`「${room.name}」に入室しました`);
        }

        function updateRoomUI() {
            if (!STATE.currentRoom) return;
            const r = STATE.currentRoom;
            const memberCount = r.members ? Object.keys(r.members).length : 0;
            document.getElementById("activeRoomTitle").innerText = r.name;
            document.getElementById("activeRoomBadge").innerText = r.type === "fixed" ? "固定グループ" : "招待ルーム";
            document.getElementById("activeRoomCode").innerText = r.inviteCode;
            document.getElementById("participantCount").innerText = `${memberCount}名参加中`;
        }

        function renderRoomsList() {
            const list = document.getElementById("roomList");
            if (!list) return;
            list.innerHTML = "";

            if (STATE.rooms.length === 0) {
                list.innerHTML = '<div class="text-center text-slate-500 text-xs py-4">現在利用可能なルームはありません</div>';
                return;
            }

            STATE.rooms.forEach(room => {
                const memberCount = room.members ? Object.keys(room.members).length : 0;
                const item = document.createElement("div");
                item.className = "glass-panel p-3.5 rounded-xl border border-slate-800 flex justify-between items-center cursor-pointer hover:border-purple-500/50 transition";
                item.innerHTML = `
                    <div class="space-y-0.5">
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-sm text-slate-200">${room.name}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full ${room.type === 'fixed' ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' : 'bg-pink-500/20 text-pink-300 border border-pink-500/30'}">${room.type === 'fixed' ? '固定' : '招待'}</span>
                        </div>
                        <div class="text-[11px] text-slate-400">コード: <strong class="text-purple-400 font-mono">${room.inviteCode}</strong> • メンバー: ${memberCount}名</div>
                    </div>
                    <button class="brand-gradient-bg text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow hover:opacity-90 transition">入室</button>
                `;
                item.addEventListener("click", () => enterRoom(room.id));
                list.appendChild(item);
            });
        }

        function handleCreateRoom() {
            const name = document.getElementById("newRoomName").value.trim();
            const type = document.getElementById("newRoomType").value;

            if (!name) {
                showToast("ルーム名を入力してください");
                return;
            }

            const inviteCode = Math.floor(100000 + Math.random() * 900000).toString();
            const roomId = "ROOM_" + Date.now();
            const newRoom = {
                id: roomId,
                name: name,
                type: type,
                inviteCode: inviteCode,
                createdBy: STATE.currentUser.uid,
                members: { [STATE.currentUser.uid]: STATE.currentUser.nickname },
                locations: {}
            };

            // ローカルの rooms リストにも追加して即座に参照可能にする
            const existingIndex = STATE.rooms.findIndex(r => r.id === roomId);
            if (existingIndex >= 0) {
                STATE.rooms[existingIndex] = newRoom;
            } else {
                STATE.rooms.unshift(newRoom);
            }

            set(ref(db, `rooms/${roomId}`), {
                name: name,
                type: type,
                inviteCode: inviteCode,
                createdBy: STATE.currentUser.uid,
                members: { [STATE.currentUser.uid]: STATE.currentUser.nickname },
                locations: {}
            }).then(() => {
                hideModal("createRoomModal");
                document.getElementById("newRoomName").value = "";
                renderRoomsList();
                enterRoom(roomId);
                showToast(`ルーム「${name}」を作成しました`);
            }).catch((err) => {
                console.error("Room creation error:", err);
                showToast("ルーム作成に失敗しました");
            });
        }

        function handleJoinByCode() {
            const code = document.getElementById("inputInviteCode").value.trim();
            if (!code) {
                showToast("招待コードを入力してください");
                return;
            }

            const room = STATE.rooms.find(r => r.inviteCode === code);
            if (!room) {
                showToast("該当するルームが見つかりません");
                return;
            }

            document.getElementById("inputInviteCode").value = "";
            enterRoom(room.id);
        }

        function toggleGpsSharing() {
            const btn = document.getElementById("btnToggleGps");
            const dot = document.getElementById("gpsStatusDot");
            const text = document.getElementById("gpsStatusText");

            if (STATE.watchPositionId === null) {
                if (!navigator.geolocation) {
                    showToast("お使いの端末は位置情報機能に対応していません");
                    return;
                }

                STATE.watchPositionId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        STATE.myLocation = { lat, lng };

                        if (STATE.currentRoom) {
                            set(ref(db, `rooms/${STATE.currentRoom.id}/locations/${STATE.currentUser.uid}`), {
                                lat: lat,
                                lng: lng,
                                accuracy: pos.coords.accuracy,
                                updatedAt: Date.now()
                            });
                        }
                    },
                    (err) => {
                        showToast("位置情報の取得に失敗しました: " + err.message);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );

                btn.innerText = "位置共有を停止";
                btn.classList.remove("brand-gradient-bg");
                btn.classList.add("bg-rose-600");
                dot.className = "w-3 h-3 rounded-full bg-emerald-400 animate-ping";
                text.innerText = "位置共有: ON";
                showToast("位置情報のリアルタイム共有を開始しました");
            } else {
                navigator.geolocation.clearWatch(STATE.watchPositionId);
                STATE.watchPositionId = null;

                if (STATE.currentRoom) {
                    remove(ref(db, `rooms/${STATE.currentRoom.id}/locations/${STATE.currentUser.uid}`));
                }

                btn.innerText = "位置共有を開始";
                btn.classList.remove("bg-rose-600");
                btn.classList.add("brand-gradient-bg");
                dot.className = "w-3 h-3 rounded-full bg-slate-500";
                text.innerText = "位置共有: OFF";
                showToast("位置共有を停止しました");
            }
        }

        function initMap() {
            if (STATE.map) {
                STATE.map.remove();
                STATE.map = null;
            }

            const defaultLat = 35.681236;
            const defaultLng = 139.767125;

            const mapContainer = document.getElementById("map");
            if (!mapContainer) return;

            // コンテナサイズ確定を保証
            if (mapContainer.clientHeight === 0) {
                mapContainer.style.minHeight = "300px";
            }

            STATE.map = L.map("map", { zoomControl: false }).setView([defaultLat, defaultLng], 16);

            // 安定した標準OpenStreetMapタイル（ダークフィルタ適用）を使用
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(STATE.map);

            L.control.zoom({ position: "topright" }).addTo(STATE.map);

            if (STATE.myLocation) {
                STATE.map.setView([STATE.myLocation.lat, STATE.myLocation.lng], 16);
            }

            // タイルの読み込み残しを防ぐため段階的に描画を更新
            [100, 300, 600, 1000].forEach(delay => {
                setTimeout(() => {
                    if (STATE.map) {
                        STATE.map.invalidateSize();
                    }
                }, delay);
            });

            // コンテナのサイズ変化に連動して自動再計算
            if (window.ResizeObserver && mapContainer) {
                const ro = new ResizeObserver(() => {
                    if (STATE.map) {
                        STATE.map.invalidateSize();
                    }
                });
                ro.observe(mapContainer);
            }
        }
