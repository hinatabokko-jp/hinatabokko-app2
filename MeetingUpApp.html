<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEETING UP - 1対1 待ち合わせ支援</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Styles & Dark Theme Adjustments */
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation;
        }

        /* Instagram Style Gradient Text & Borders */
        .brand-gradient-text {
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-gradient-bg {
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
        }

        /* Hide scrollbars for smooth app feel */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Glassmorphism elements */
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Header / Navbar -->
    <header class="glass-panel sticky top-0 z-40 px-4 py-3 flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full brand-gradient-bg flex items-center justify-center font-bold text-white shadow-lg">
                <i class="fa-solid font-bold text-sm">M</i>
            </div>
            <span class="text-xl font-extrabold tracking-tight brand-gradient-text">MEETING UP</span>
        </div>
        <div id="headerUserNav" class="hidden flex items-center space-x-2">
            <button id="btnSettingsModal" class="p-2 text-slate-300 hover:text-white transition flex items-center justify-center rounded-lg bg-slate-800/80 border border-slate-700" title="設定・ユーザー情報">
                <span class="text-lg">⚙️</span>
            </button>
            <button id="btnUserMenu" class="text-xs font-semibold text-slate-300 bg-slate-800/80 hover:bg-slate-700/80 px-2.5 py-1.5 rounded-full border border-slate-700 transition flex items-center space-x-1 cursor-pointer">
                <span id="navNickname"></span>
                <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main id="appContainer" class="flex-1 max-w-md w-full mx-auto p-4 relative flex flex-col justify-center">

        <!-- Screen 1: Login / Join View -->
        <section id="authSection" class="w-full space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-black brand-gradient-text">Meeting Up</h1>
                <p class="text-slate-400 text-sm">1対1 リアルタイム方位・距離 待ち合わせ支援</p>
            </div>

            <div class="glass-panel p-6 rounded-2xl shadow-2xl space-y-4 border border-slate-800">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">ニックネーム</label>
                    <input type="text" id="inputNickname" placeholder="ニックネームを入力" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">パスワード (UID)</label>
                    <input type="text" id="inputUidPassword" readonly placeholder="自動発行されます" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm font-mono text-purple-300 focus:outline-none cursor-not-allowed">
                </div>
                <button id="btnLogin" class="w-full brand-gradient-bg text-white font-bold py-3.5 rounded-xl shadow-lg hover:opacity-95 transition transform active:scale-95 text-sm">
                    認証して入室
                </button>
            </div>
        </section>

        <!-- Screen 3: 1-on-1 Proximity & Direction Workspace -->
        <section id="activeRoomSection" class="hidden w-full flex-1 flex flex-col space-y-3">
            <!-- Top Info Bar -->
            <div class="glass-panel p-3 rounded-xl flex items-center justify-between">
                <div>
                    <div class="flex items-center space-x-2">
                        <span id="activeRoomTitle" class="font-bold text-sm text-slate-100">1対1 待ち合わせルーム</span>
                        <span id="activeRoomBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">ペア専用</span>
                    </div>
                    <div class="text-[11px] text-slate-400 flex items-center space-x-2 mt-0.5">
                        <span id="participantCount">0/2名参加中</span>
                    </div>
                </div>
                <button id="btnLeaveRoom" class="bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 px-3 py-1.5 rounded-lg text-xs font-bold transition">
                    退室
                </button>
            </div>

            <!-- GPS & Compass Share Overlay Toggles -->
            <div class="grid grid-cols-2 gap-2">
                <div class="glass-panel p-3 rounded-xl flex flex-col justify-between shadow-xl space-y-2">
                    <div class="flex items-center space-x-2">
                        <div id="gpsStatusDot" class="w-2.5 h-2.5 rounded-full bg-slate-500 animate-pulse shrink-0"></div>
                        <span id="gpsStatusText" class="text-[11px] font-semibold text-slate-300 truncate">位置共有: OFF</span>
                    </div>
                    <button id="btnToggleGps" class="brand-gradient-bg text-white px-3 py-1.5 rounded-lg text-[11px] font-bold shadow hover:opacity-90 transition">
                        位置共有開始
                    </button>
                </div>
                <div class="glass-panel p-3 rounded-xl flex flex-col justify-between shadow-xl space-y-2">
                    <div class="flex items-center space-x-2">
                        <div id="compassStatusDot" class="w-2.5 h-2.5 rounded-full bg-slate-500 animate-pulse shrink-0"></div>
                        <span id="compassStatusText" class="text-[11px] font-semibold text-slate-300 truncate">コンパス: OFF</span>
                    </div>
                    <button id="btnToggleCompass" class="bg-slate-800 border border-slate-700 text-purple-300 px-3 py-1.5 rounded-lg text-[11px] font-bold shadow hover:bg-slate-700 transition">
                        コンパス有効化
                    </button>
                </div>
            </div>

            <!-- 1-on-1 Direction & Distance Display Card -->
            <div class="glass-panel p-6 rounded-2xl flex flex-col items-center justify-center space-y-4 text-center border border-slate-800 shadow-2xl">
                <div class="text-xs uppercase tracking-wider text-slate-400 font-bold">相手の方向と距離</div>
                <div id="targetNameDisplay" class="text-sm font-semibold text-purple-300">相手の接続を待っています...</div>
                
                <!-- Direction Compass Icon / Indicator -->
                <div class="w-24 h-24 rounded-full bg-slate-900/80 border-2 border-purple-500/40 flex items-center justify-center shadow-inner relative">
                    <i id="directionArrow" class="fa-solid fa-location-arrow text-3xl brand-gradient-text transition-transform duration-100"></i>
                </div>

                <div class="space-y-1">
                    <div id="targetDirectionText" class="text-lg font-bold text-slate-200">-- 方向</div>
                    <div id="targetDistanceText" class="text-3xl font-black brand-gradient-text">--- m</div>
                </div>
            </div>

            <!-- Chat & Message Workspace -->
            <div class="glass-panel p-4 rounded-xl space-y-3">
                <!-- Chat Feed (LINE風吹き出し形式) -->
                <div id="chatFeed" class="h-32 overflow-y-auto no-scrollbar space-y-3 text-sm bg-slate-950/50 p-3 rounded-xl border border-slate-800/80 flex flex-col">
                    <div class="text-center text-slate-500 text-xs my-auto">メッセージ履歴はありません</div>
                </div>

                <!-- Input box -->
                <div class="flex gap-2">
                    <input type="text" id="inputChatMessage" placeholder="メッセージを入力..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <button id="btnSendMessage" class="brand-gradient-bg px-4 py-2 rounded-xl text-sm font-bold text-white shadow hover:opacity-90 transition">送信</button>
                </div>
            </div>
        </section>

        <!-- Admin Passcode Modal -->
        <section id="adminPassModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 p-4 flex items-center justify-center">
            <div class="glass-panel max-w-sm w-full p-5 rounded-2xl space-y-4 border border-slate-700">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <h3 class="font-bold text-slate-100 text-sm"><i class="fa-solid fa-lock text-amber-400 mr-2"></i>管理者認証</h3>
                    <button id="btnCloseAdminPass" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">あいことばを入力してください</label>
                        <input type="password" id="inputAdminPasscode" placeholder="あいことば" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:ring-1 focus:ring-amber-500">
                    </div>
                    <button id="btnSubmitAdminPass" class="w-full bg-amber-600 hover:bg-amber-500 py-2.5 text-xs font-bold rounded-xl text-white shadow transition">認証して入室</button>
                </div>
            </div>
        </section>

        <!-- Admin View Modal -->
        <section id="adminModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 p-4 flex items-center justify-center">
            <div class="glass-panel max-w-md w-full p-5 rounded-2xl space-y-4 border border-slate-700 max-h-[85vh] overflow-y-auto">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 class="font-extrabold text-slate-100 text-base"><i class="fa-solid fa-user-shield text-amber-400 mr-2"></i>管理者ダッシュボード</h3>
                    <button id="btnCloseAdmin" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>

                <!-- Security & Access Restriction Toggle -->
                <div class="glass-panel p-3.5 rounded-xl border border-slate-800 flex justify-between items-center bg-slate-900/60">
                    <div>
                        <span class="font-bold text-xs text-slate-200 block">未認識端末のアクセス制限</span>
                        <span class="text-[10px] text-slate-400">登録履歴のない新規端末からの接続を制限</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggleAccessRestriction" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600"></div>
                    </label>
                </div>

                <!-- User Management -->
                <div class="space-y-2">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">登録ユーザー管理</h4>
                    <div id="adminUserList" class="space-y-2 max-h-48 overflow-y-auto no-scrollbar"></div>
                </div>

                <!-- Active Rooms Management -->
                <div class="space-y-2 pt-2 border-t border-slate-800">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">アクティブルーム管理</h4>
                    <div id="adminRoomList" class="space-y-2 max-h-40 overflow-y-auto no-scrollbar"></div>
                </div>

                <!-- Chat Messages Management -->
                <div class="space-y-2 pt-2 border-t border-slate-800">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">メッセージ管理</h4>
                    <div id="adminMessageList" class="space-y-2 max-h-48 overflow-y-auto no-scrollbar"></div>
                </div>
            </div>
        </section>

        <!-- User Settings & Profile Modal -->
        <section id="settingsModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 p-4 flex items-center justify-center">
            <div class="glass-panel max-w-sm w-full p-5 rounded-2xl space-y-4 border border-slate-700">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <h3 class="font-bold text-slate-100 text-sm">ユーザー設定</h3>
                    <button id="btnCloseSettings" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">自分のUID (パスワード)</label>
                        <div class="flex gap-2">
                            <input type="text" id="displayMyUid" readonly class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs font-mono text-purple-300 focus:outline-none">
                            <button id="btnCopyUid" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl text-xs font-bold transition">コピー</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">ニックネームの変更</label>
                        <input type="text" id="editNicknameInput" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:ring-1 focus:ring-purple-500">
                    </div>
                    <button id="btnSaveProfile" class="w-full brand-gradient-bg py-2.5 text-xs font-bold rounded-xl text-white shadow">変更を保存</button>
                </div>
                <div class="pt-2 border-t border-slate-800 flex justify-center">
                    <button id="btnOpenAdminFromModal" class="p-2 text-amber-400 hover:text-amber-300 transition flex items-center justify-center rounded-lg bg-slate-800/80 border border-slate-700 text-xs space-x-1 cursor-pointer w-full" title="管理者画面を開く">
                        <span>⚙️ 管理者画面を開く</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Floating Alert / Toast Box -->
        <div id="toast" class="hidden fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800 text-slate-100 border border-purple-500 px-4 py-2.5 rounded-full shadow-2xl text-xs font-semibold flex items-center space-x-2">
            <span id="toastMessage"></span>
        </div>
    </main>

    <!-- Firebase SDKs & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, push, remove, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD7zMaJys6IGRN1gV0cPEQveVO6Oq7hNlM",
            authDomain: "meetingupapp-99624.firebaseapp.com",
            databaseURL: "https://meetingupapp-99624-default-rtdb.firebaseio.com",
            projectId: "meetingupapp-99624",
            storageBucket: "meetingupapp-99624.firebasestorage.app",
            messagingSenderId: "675238703207",
            appId: "1:675238703207:web:64a2d64c1e33340e47e4c2",
            measurementId: "G-7Q2KK5ZDB1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const SINGLE_ROOM_ID = "ROOM_1ON1_GLOBAL";

        const STATE = {
            currentUser: null,
            currentRoom: null,
            watchPositionId: null,
            myLocation: null,
            heading: 0,           // スマホが向いている方位角 (0〜360度)
            isCompassActive: false,
            users: [],
            chatMessages: {},
            accessRestricted: false
        };

        document.addEventListener("DOMContentLoaded", () => {
            initApp();
        });

        function initApp() {
            signInAnonymously(auth).then(() => {
                setupInitialData();
                checkLocalStoredUser();
            }).catch(err => {
                console.error("Firebase Auth Error:", err);
                setupInitialData();
                checkLocalStoredUser();
            });
            bindEvents();
        }

        function checkLocalStoredUser() {
            const savedNickname = localStorage.getItem("meetingup_nickname");
            const savedUid = localStorage.getItem("meetingup_uid");

            if (savedNickname && savedUid) {
                document.getElementById("inputNickname").value = savedNickname;
                document.getElementById("inputUidPassword").value = savedUid;
                setTimeout(() => {
                    handleLogin(true);
                }, 500);
            } else {
                const newUid = "UID_" + Math.random().toString(36).substring(2, 9).toUpperCase();
                document.getElementById("inputUidPassword").value = newUid;
            }
        }

        function setupInitialData() {
            const roomRef = ref(db, `rooms/${SINGLE_ROOM_ID}`);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    STATE.currentRoom = { id: SINGLE_ROOM_ID, ...data };
                } else {
                    const defaultRoom = {
                        name: "1対1 待ち合わせルーム",
                        members: {},
                        locations: {}
                    };
                    set(ref(db, `rooms/${SINGLE_ROOM_ID}`), defaultRoom);
                    STATE.currentRoom = { id: SINGLE_ROOM_ID, ...defaultRoom };
                }
                if (STATE.currentUser && !document.getElementById("activeRoomSection").classList.contains("hidden")) {
                    updateRoomUI();
                    updateProximityDisplay();
                }
                if (STATE.currentUser && !document.getElementById("activeRoomSection").classList.contains("hidden")) {
                    const members = STATE.currentRoom.members || {};
                    if (!members[STATE.currentUser.uid] && !STATE.currentUser.isAdmin) {
                        handleForcedLeave();
                    }
                }
            });

            const usersRef = ref(db, "users");
            onValue(usersRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    STATE.users = Object.keys(data).map(key => ({ uid: key, ...data[key] }));
                } else {
                    STATE.users = [];
                }
            });

            const settingsRef = ref(db, "system/accessRestricted");
            onValue(settingsRef, (snapshot) => {
                STATE.accessRestricted = snapshot.val() || false;
                const toggle = document.getElementById("toggleAccessRestriction");
                if (toggle) toggle.checked = STATE.accessRestricted;
            });
        }

        function bindEvents() {
            document.getElementById("btnLogin").addEventListener("click", () => handleLogin(false));
            document.getElementById("btnUserMenu").addEventListener("click", handleUserMenuClick);
            document.getElementById("btnSettingsModal").addEventListener("click", openSettingsModal);
            document.getElementById("btnCloseSettings").addEventListener("click", () => hideModal("settingsModal"));
            
            document.getElementById("btnOpenAdminFromModal").addEventListener("click", () => {
                hideModal("settingsModal");
                document.getElementById("inputAdminPasscode").value = "";
                showModal("adminPassModal");
            });

            document.getElementById("btnCloseAdminPass").addEventListener("click", () => hideModal("adminPassModal"));
            document.getElementById("btnSubmitAdminPass").addEventListener("click", () => {
                const pass = document.getElementById("inputAdminPasscode").value.trim();
                if (pass === "0813") {
                    hideModal("adminPassModal");
                    openAdminDashboard();
                } else {
                    showToast("あいことばが違います");
                }
            });

            document.getElementById("btnSaveProfile").addEventListener("click", handleSaveProfile);
            document.getElementById("btnCopyUid").addEventListener("click", copyUidToClipboard);
            document.getElementById("btnLeaveRoom").addEventListener("click", handleLeaveRoom);
            document.getElementById("btnToggleGps").addEventListener("click", toggleGpsSharing);
            document.getElementById("btnToggleCompass").addEventListener("click", toggleCompass);
            document.getElementById("btnSendMessage").addEventListener("click", handleSendMessage);

            document.getElementById("btnCloseAdmin").addEventListener("click", () => hideModal("adminModal"));
            document.getElementById("toggleAccessRestriction").addEventListener("change", handleToggleAccessRestriction);
        }

        async function handleLogin(isAutoLogin = false) {
            const nickname = document.getElementById("inputNickname").value.trim();
            const uidInput = document.getElementById("inputUidPassword").value.trim();

            if (!nickname) {
                showToast("ニックネームを入力してください");
                return;
            }
            if (!uidInput) {
                showToast("パスワード(UID)を入力してください");
                return;
            }

            const savedUid = localStorage.getItem("meetingup_uid");
            const isKnownDevice = (savedUid === uidInput);

            if (STATE.accessRestricted && !isKnownDevice) {
                if (uidInput !== "ADMIN_SECRET_KEY" && uidInput !== "ADMIN_0813") {
                    showToast("現在、管理者により未認識端末からのアクセスが制限されています。");
                    return;
                }
            }

            const isAdmin = (uidInput === "ADMIN_0813" || uidInput === "ADMIN_SECRET_KEY");
            const uid = uidInput;

            localStorage.setItem("meetingup_nickname", nickname);
            localStorage.setItem("meetingup_uid", uid);

            STATE.currentUser = {
                uid: uid,
                nickname: nickname,
                isAdmin: isAdmin
            };

            await set(ref(db, `users/${uid}`), {
                nickname: nickname,
                isAdmin: isAdmin,
                status: "active",
                updatedAt: Date.now()
            });

            document.getElementById("headerUserNav").classList.remove("hidden");
            document.getElementById("navNickname").innerText = nickname;

            if (isAdmin) {
                openAdminDashboard();
            } else {
                attemptEnterRoom();
            }
        }

        async function attemptEnterRoom() {
            const roomSnap = await get(ref(db, `rooms/${SINGLE_ROOM_ID}/members`));
            const members = roomSnap.val() || {};
            const memberUids = Object.keys(members);

            const isAlreadyMember = memberUids.includes(STATE.currentUser.uid);

            if (!isAlreadyMember && memberUids.length >= 2) {
                showToast("申し訳ありません。このルームは満員（2名定員）です。");
                document.getElementById("authSection").classList.remove("hidden");
                return;
            }

            await update(ref(db, `rooms/${SINGLE_ROOM_ID}/members`), {
                [STATE.currentUser.uid]: STATE.currentUser.nickname
            });

            document.getElementById("authSection").classList.add("hidden");
            document.getElementById("activeRoomSection").classList.remove("hidden");

            const chatRef = ref(db, `rooms/${SINGLE_ROOM_ID}/messages`);
            onValue(chatRef, (snapshot) => {
                const data = snapshot.val();
                STATE.chatMessages = data || {};
                renderChatMessages();
                if (!document.getElementById("adminModal").classList.contains("hidden")) {
                    renderAdminMessages();
                }
            });

            updateRoomUI();
            showToast(`ようこそ、${STATE.currentUser.nickname} さん！`);
        }

        function handleUserMenuClick() {
            if (!STATE.currentUser) return;
            if (confirm("ログアウトしてログイン画面に戻りますか？")) {
                location.reload();
            }
        }

        function updateRoomUI() {
            if (!STATE.currentRoom) return;
            const r = STATE.currentRoom;
            const memberCount = r.members ? Object.keys(r.members).length : 0;
            document.getElementById("participantCount").innerText = `${memberCount}/2名参加中`;
            updateProximityDisplay();
        }

        function openSettingsModal() {
            if (!STATE.currentUser) return;
            document.getElementById("displayMyUid").value = STATE.currentUser.uid;
            document.getElementById("editNicknameInput").value = STATE.currentUser.nickname;
            showModal("settingsModal");
        }

        function copyUidToClipboard() {
            const uidInput = document.getElementById("displayMyUid");
            navigator.clipboard.writeText(uidInput.value).then(() => {
                showToast("UIDをコピーしました");
            }).catch(() => {
                showToast("コピーに失敗しました");
            });
        }

        async function handleSaveProfile() {
            const newName = document.getElementById("editNicknameInput").value.trim();
            if (!newName) {
                showToast("ニックネームを入力してください");
                return;
            }

            STATE.currentUser.nickname = newName;
            localStorage.setItem("meetingup_nickname", newName);
            document.getElementById("navNickname").innerText = newName;

            await update(ref(db, `users/${STATE.currentUser.uid}`), { nickname: newName });
            if (STATE.currentRoom) {
                await update(ref(db, `rooms/${SINGLE_ROOM_ID}/members`), { [STATE.currentUser.uid]: newName });
            }

            hideModal("settingsModal");
            showToast("プロフィールを更新しました");
        }

        function toggleGpsSharing() {
            const btn = document.getElementById("btnToggleGps");
            const dot = document.getElementById("gpsStatusDot");
            const text = document.getElementById("gpsStatusText");

            if (STATE.watchPositionId === null) {
                if (!navigator.geolocation) {
                    showToast("お使いの端末は位置情報機能に対応していません");
                    return;
                }

                STATE.watchPositionId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        STATE.myLocation = { lat, lng };

                        if (STATE.currentRoom) {
                            set(ref(db, `rooms/${SINGLE_ROOM_ID}/locations/${STATE.currentUser.uid}`), {
                                lat: lat,
                                lng: lng,
                                accuracy: pos.coords.accuracy,
                                updatedAt: Date.now()
                            });
                        }
                    },
                    (err) => {
                        showToast("位置情報の取得に失敗しました: " + err.message);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );

                btn.innerText = "位置共有停止";
                btn.classList.remove("brand-gradient-bg");
                btn.classList.add("bg-rose-600");
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping shrink-0";
                text.innerText = "位置共有: ON";
                showToast("位置情報のリアルタイム共有を開始しました");
            } else {
                navigator.geolocation.clearWatch(STATE.watchPositionId);
                STATE.watchPositionId = null;

                if (STATE.currentRoom) {
                    remove(ref(db, `rooms/${SINGLE_ROOM_ID}/locations/${STATE.currentUser.uid}`));
                }

                btn.innerText = "位置共有開始";
                btn.classList.remove("bg-rose-600");
                btn.classList.add("brand-gradient-bg");
                dot.className = "w-2.5 h-2.5 rounded-full bg-slate-500 shrink-0";
                text.innerText = "位置共有: OFF";
                showToast("位置共有を停止しました");
            }
        }

        // コンパス（デバイス方位センサー）の有効化・無効化
        function toggleCompass() {
            const btn = document.getElementById("btnToggleCompass");
            const dot = document.getElementById("compassStatusDot");
            const text = document.getElementById("compassStatusText");

            if (!STATE.isCompassActive) {
                // iOS 13+ などでパーミッションが必要な場合の処理
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(response => {
                        if (response === 'granted') {
                            startCompassListener(btn, dot, text);
                        } else {
                            showToast("コンパスのアクセスが拒否されました");
                        }
                    }).catch(console.error);
                } else if ('ondeviceorientation' in window) {
                    startCompassListener(btn, dot, text);
                } else {
                    showToast("お使いの端末はコンパス機能に対応していません");
                }
            } else {
                window.removeEventListener('deviceorientation', handleOrientation);
                STATE.isCompassActive = false;
                btn.innerText = "コンパス有効化";
                btn.classList.remove("bg-purple-600", "text-white");
                btn.classList.add("bg-slate-800", "text-purple-300");
                dot.className = "w-2.5 h-2.5 rounded-full bg-slate-500 shrink-0";
                text.innerText = "コンパス: OFF";
                showToast("コンパスを無効化しました");
                updateProximityDisplay(); // 向きをリセット
            }
        }

        function startCompassListener(btn, dot, text) {
            window.addEventListener('deviceorientation', handleOrientation, true);
            STATE.isCompassActive = true;
            btn.innerText = "コンパス停止";
            btn.classList.remove("bg-slate-800", "text-purple-300");
            btn.classList.add("bg-purple-600", "text-white");
            dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping shrink-0";
            text.innerText = "コンパス: ON";
            showToast("コンパスを有効化しました");
        }

        function handleOrientation(event) {
            let heading = null;
            // iOS (webkitCompassHeading) または Android (alpha) から絶対方位を取得
            if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
                heading = event.webkitCompassHeading;
            } else if (event.alpha !== null) {
                heading = 360 - event.alpha;
            }

            if (heading !== null) {
                STATE.heading = heading;
                updateProximityDisplay();
            }
        }

        function updateProximityDisplay() {
            if (!STATE.currentRoom) return;

            const nameDisplay = document.getElementById("targetNameDisplay");
            const distText = document.getElementById("targetDistanceText");
            const dirText = document.getElementById("targetDirectionText");
            const arrow = document.getElementById("directionArrow");

            const locations = STATE.currentRoom.locations || {};
            const otherUids = Object.keys(locations).filter(uid => uid !== STATE.currentUser.uid);

            if (otherUids.length === 0) {
                nameDisplay.innerText = "相手の接続・位置共有待ち...";
                distText.innerText = "--- m";
                dirText.innerText = "-- 方向";
                arrow.style.transform = "rotate(0deg)";
                return;
            }

            const targetUid = otherUids[0];
            const targetLoc = locations[targetUid];
            const targetName = getNicknameByUid(targetUid);

            nameDisplay.innerText = `相手: ${targetName} さん`;

            if (!STATE.myLocation) {
                distText.innerText = "位置情報OFF";
                dirText.innerText = "位置共有を開始してください";
                return;
            }

            const dist = calculateDistance(STATE.myLocation.lat, STATE.myLocation.lng, targetLoc.lat, targetLoc.lng);
            const bearing = calculateBearing(STATE.myLocation.lat, STATE.myLocation.lng, targetLoc.lat, targetLoc.lng);
            const directionName = getDirectionName(bearing);

            distText.innerText = dist < 1000 ? `${Math.round(dist)} m` : `${(dist / 1000).toFixed(1)} km`;
            dirText.innerText = directionName;

            // 【重要】コンパスが有効な場合は「画面上の上方向＝スマホが向いている方位」を基準にし、
            // 相手がいる方向（bearing）との差分（bearing - STATE.heading）だけ矢印を回転させます。
            // これにより、スマホを相手に向けると矢印が真上を向くようになります。
            let rotationAngle = bearing;
            if (STATE.isCompassActive) {
                rotationAngle = (bearing - STATE.heading + 360) % 360;
            }
            arrow.style.transform = `rotate(${rotationAngle}deg)`;

            if (dist <= 20) {
                showToast(`✨ ${targetName} さんが近くにいます！（${Math.round(dist)}m）`);
            }
        }

        function handleSendMessage() {
            const input = document.getElementById("inputChatMessage");
            const text = input.value.trim();
            if (!text || !STATE.currentRoom) return;

            const msgRef = ref(db, `rooms/${SINGLE_ROOM_ID}/messages`);
            push(msgRef, {
                sender: STATE.currentUser.nickname,
                senderUid: STATE.currentUser.uid,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            });

            input.value = "";
        }

        function renderChatMessages() {
            const feed = document.getElementById("chatFeed");
            feed.innerHTML = "";

            const messageList = Object.values(STATE.chatMessages);

            if (messageList.length === 0) {
                feed.innerHTML = '<div class="text-center text-slate-500 text-xs my-auto">メッセージ履歴はありません</div>';
                return;
            }

            messageList.forEach(msg => {
                const isMe = STATE.currentUser && (msg.senderUid === STATE.currentUser.uid || msg.sender === STATE.currentUser.nickname);
                const item = document.createElement("div");
                
                if (isMe) {
                    item.className = "flex flex-col items-end space-y-0.5 w-full";
                    item.innerHTML = `
                        <div class="flex items-end space-x-1.5 max-w-[85%]">
                            <span class="text-[10px] text-slate-400 self-end mb-0.5">${msg.time}</span>
                            <div class="brand-gradient-bg text-white px-3.5 py-2 rounded-2xl rounded-tr-sm text-sm shadow break-words font-medium leading-normal">
                                ${escapeHtml(msg.text)}
                            </div>
                        </div>
                    `;
                } else {
                    item.className = "flex flex-col items-start space-y-0.5 w-full";
                    item.innerHTML = `
                        <span class="text-[11px] text-purple-300 ml-1 font-bold">${escapeHtml(msg.sender)}</span>
                        <div class="flex items-end space-x-1.5 max-w-[85%]">
                            <div class="bg-slate-800 border border-slate-700 text-slate-100 px-3.5 py-2 rounded-2xl rounded-tl-sm text-sm shadow break-words font-medium leading-normal">
                                ${escapeHtml(msg.text)}
                            </div>
                            <span class="text-[10px] text-slate-400 self-end mb-0.5">${msg.time}</span>
                        </div>
                    `;
                }
                feed.appendChild(item);
            });

            feed.scrollTop = feed.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function openAdminDashboard() {
            showModal("adminModal");

            const userContainer = document.getElementById("adminUserList");
            userContainer.innerHTML = "";

            STATE.users.forEach(u => {
                const isJoined = STATE.currentRoom && STATE.currentRoom.members && STATE.currentRoom.members[u.uid];

                const row = document.createElement("div");
                row.className = "flex justify-between items-center glass-panel p-2.5 rounded-lg text-xs border border-slate-800";
                row.innerHTML = `
                    <div>
                        <div class="flex items-center space-x-1.5">
                            <span class="font-bold text-slate-200">${escapeHtml(u.nickname)}</span>
                            ${isJoined ? '<span class="bg-purple-500/20 text-purple-300 text-[9px] px-1.5 py-0.5 rounded font-semibold">入室中</span>' : ''}
                        </div>
                        <span class="text-[10px] text-slate-500 block font-mono">UID: ${u.uid}</span>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        ${isJoined ? `<button class="btn-kick-user bg-amber-600 text-white text-[10px] px-2.5 py-1 rounded font-bold hover:bg-amber-700 transition">退室させる</button>` : ''}
                        <button class="btn-delete-user bg-rose-600 text-white text-[10px] px-2.5 py-1 rounded font-bold hover:bg-rose-700 transition">削除</button>
                    </div>
                `;

                if (isJoined) {
                    row.querySelector(".btn-kick-user").addEventListener("click", () => {
                        if (confirm(`ユーザー「${u.nickname}」をルームから強制退室させますか？`)) {
                            Promise.all([
                                remove(ref(db, `rooms/${SINGLE_ROOM_ID}/members/${u.uid}`)),
                                remove(ref(db, `rooms/${SINGLE_ROOM_ID}/locations/${u.uid}`))
                            ]).then(() => {
                                showToast(`「${u.nickname}」を退室させました`);
                                openAdminDashboard();
                            });
                        }
                    });
                }

                row.querySelector(".btn-delete-user").addEventListener("click", () => {
                    if (confirm(`ユーザー「${u.nickname}」のデータを削除しますか？`)) {
                        remove(ref(db, `users/${u.uid}`)).then(() => {
                            remove(ref(db, `rooms/${SINGLE_ROOM_ID}/members/${u.uid}`));
                            remove(ref(db, `rooms/${SINGLE_ROOM_ID}/locations/${u.uid}`));
                            showToast("ユーザーデータを削除しました");
                            openAdminDashboard();
                        });
                    }
                });
                userContainer.appendChild(row);
            });

            const roomContainer = document.getElementById("adminRoomList");
            roomContainer.innerHTML = "";

            if (STATE.currentRoom) {
                const row = document.createElement("div");
                row.className = "flex justify-between items-center glass-panel p-2.5 rounded-lg text-xs border border-slate-800";
                row.innerHTML = `
                    <div>
                        <span class="font-bold text-slate-200">${STATE.currentRoom.name}</span>
                        <span class="text-[10px] text-slate-400 block">ID: ${SINGLE_ROOM_ID}</span>
                    </div>
                    <button class="bg-rose-600 text-white text-[10px] px-2 py-1 rounded font-bold shadow hover:bg-rose-700">クリア</button>
                `;
                row.querySelector("button").addEventListener("click", () => {
                    if (confirm("ルームの参加者情報および位置情報をクリアしますか？")) {
                        set(ref(db, `rooms/${SINGLE_ROOM_ID}`), {
                            name: "1対1 待ち合わせルーム",
                            members: {},
                            locations: {}
                        }).then(() => {
                            showToast("ルームをクリアしました");
                            openAdminDashboard();
                        });
                    }
                });
                roomContainer.appendChild(row);
            }

            renderAdminMessages();
        }

        function renderAdminMessages() {
            const msgContainer = document.getElementById("adminMessageList");
            if (!msgContainer) return;
            msgContainer.innerHTML = "";

            const entries = Object.entries(STATE.chatMessages);

            if (entries.length === 0) {
                msgContainer.innerHTML = '<div class="text-slate-500 text-xs text-center py-2">メッセージ履歴はありません</div>';
                return;
            }

            entries.forEach(([key, msg]) => {
                const row = document.createElement("div");
                row.className = "flex justify-between items-center glass-panel p-2.5 rounded-lg text-xs border border-slate-800";
                row.innerHTML = `
                    <div class="pr-2 overflow-hidden">
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-purple-300">${escapeHtml(msg.sender)}</span>
                            <span class="text-[10px] text-slate-500">${msg.time}</span>
                        </div>
                        <div class="text-slate-200 truncate mt-0.5">${escapeHtml(msg.text)}</div>
                    </div>
                    <button class="btn-delete-msg bg-rose-600 text-white text-[10px] px-2.5 py-1 rounded font-bold hover:bg-rose-700 transition shrink-0">削除</button>
                `;
                row.querySelector(".btn-delete-msg").addEventListener("click", () => {
                    if (confirm("このメッセージを削除しますか？")) {
                        remove(ref(db, `rooms/${SINGLE_ROOM_ID}/messages/${key}`)).then(() => {
                            showToast("メッセージを削除しました");
                        });
                    }
                });
                msgContainer.appendChild(row);
            });
        }

        function handleToggleAccessRestriction(e) {
            const restricted = e.target.checked;
            set(ref(db, "system/accessRestricted"), restricted).then(() => {
                showToast(restricted ? "未認識端末からのアクセスを制限しました" : "アクセス制限を解除しました");
            });
        }

        function handleLeaveRoom() {
            if (STATE.watchPositionId !== null) {
                toggleGpsSharing();
            }
            if (STATE.isCompassActive) {
                toggleCompass();
            }

            if (STATE.currentUser) {
                remove(ref(db, `rooms/${SINGLE_ROOM_ID}/members/${STATE.currentUser.uid}`));
                remove(ref(db, `rooms/${SINGLE_ROOM_ID}/locations/${STATE.currentUser.uid}`));
            }

            document.getElementById("activeRoomSection").classList.add("hidden");
            document.getElementById("authSection").classList.remove("hidden");

            showToast("退室しました");
        }

        function handleForcedLeave() {
            if (STATE.watchPositionId !== null) {
                toggleGpsSharing();
            }
            if (STATE.isCompassActive) {
                toggleCompass();
            }
            document.getElementById("activeRoomSection").classList.add("hidden");
            document.getElementById("authSection").classList.remove("hidden");
            showToast("管理者によってルームから退室させられました");
        }

        function getNicknameByUid(uid) {
            if (STATE.currentRoom && STATE.currentRoom.members && STATE.currentRoom.members[uid]) {
                return STATE.currentRoom.members[uid];
            }
            const user = STATE.users.find(u => u.uid === uid);
            return user ? user.nickname : "メンバー";
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
            const θ = Math.atan2(y, x);
            return (θ * 180 / Math.PI + 360) % 360;
        }

        function getDirectionName(bearing) {
            const directions = ["北", "北東", "東", "南東", "南", "南西", "西", "北西"];
            const index = Math.round(bearing / 45) % 8;
            return directions[index] + "方向";
        }

        function showModal(id) {
            document.getElementById(id).classList.remove("hidden");
        }

        function hideModal(id) {
            document.getElementById(id).classList.add("hidden");
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            document.getElementById("toastMessage").innerText = message;
            toast.classList.remove("hidden");
            setTimeout(() => {
                toast.classList.add("hidden");
            }, 3000);
        }
    </script>
