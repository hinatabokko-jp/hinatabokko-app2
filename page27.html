<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日程調整・投票</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                            hover: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-dark-bg text-slate-100 min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-slate-950">

    <!-- Authentication Lock Screen -->
    <div id="authLockScreen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
        <div class="bg-dark-card border border-dark-border rounded-2xl w-full max-w-md p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute -right-12 -top-12 w-36 h-36 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-amber-500/20 border border-amber-500/30 text-amber-400 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-inner">
                    <i data-lucide="lock" class="w-7 h-7"></i>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">日程調整・投票</h1>
                <p class="text-slate-400 text-xs sm:text-sm mt-1.5">投票ボードを表示するには、合言葉を入力してください。</p>
            </div>

            <form id="passcodeForm" class="space-y-4">
                <div>
                    <label for="passcodeInput" class="block text-xs font-semibold text-slate-300 mb-1.5">合言葉 <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="key-round" class="w-4 h-4"></i>
                        </span>
                        <input type="password" id="passcodeInput" required placeholder="合言葉を入力してください" class="w-full bg-slate-900 border border-dark-border focus:border-amber-500 focus:ring-1 focus:ring-amber-500 rounded-xl pl-10 pr-4 py-3 text-slate-100 placeholder-slate-500 text-sm outline-none transition-all">
                    </div>
                </div>
                <div id="passcodeError" class="text-rose-400 text-xs hidden flex items-center gap-1">
                    <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> 合言葉が正しくありません。
                </div>
                <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-amber-500/20 transition-all text-sm flex items-center justify-center gap-2">
                    <span>入室して投票する</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-dark-border/60 text-center">
                <p class="text-[11px] text-slate-500">
                    ※ 初期合言葉: <code class="bg-slate-900 px-1.5 py-0.5 rounded text-amber-300 font-mono">shukketsu123</code>
                </p>
            </div>
        </div>
    </div>

    <!-- Main Application Container -->
    <div id="app" class="flex-1 flex flex-col min-h-screen relative overflow-x-hidden hidden">

        <!-- Top Navigation Bar -->
        <header class="bg-dark-card/80 backdrop-blur-md border-b border-dark-border sticky top-0 z-30 px-4 py-3 sm:px-6">
            <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-amber-500/20 text-amber-400 rounded-xl border border-amber-500/30">
                        <i data-lucide="calendar-days" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight tracking-tight text-white flex items-center gap-2">
                            日程調整ボード
                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1 animate-pulse"></span>
                                リアルタイム同期中
                            </span>
                        </h1>
                        <p class="text-xs text-slate-400">ご都合の良い日時に〇×△で回答してください</p>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button id="exportCsvBtn" class="flex items-center gap-1.5 px-3 py-1.5 text-xs sm:text-sm bg-dark-border hover:bg-slate-700 text-slate-200 font-medium rounded-lg border border-slate-600/50 transition-all">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">CSV出力</span>
                    </button>
                    <button id="logoutBtn" title="ロック画面に戻る" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-dark-border rounded-lg transition-colors">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6">

            <!-- Voting Form Section -->
            <div class="bg-dark-card border border-dark-border rounded-2xl p-5 sm:p-6 shadow-xl relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-amber-500/5 rounded-full blur-2xl pointer-events-none"></div>
                <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i data-lucide="pen-tool" class="w-5 h-5 text-amber-400"></i>
                    <span id="formTitle">あなたの都合を入力する</span>
                </h3>

                <form id="voteForm" class="space-y-4">
                    <input type="hidden" id="editMemberId" value="">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="memberName" class="block text-xs font-semibold text-slate-300 mb-1.5">お名前 / ニックネーム <span class="text-rose-500">*</span></label>
                            <input type="text" id="memberName" required placeholder="例: 山田 太郎" class="w-full bg-slate-900/90 border border-dark-border focus:border-amber-500 focus:ring-1 focus:ring-amber-500 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 text-sm outline-none transition-all">
                        </div>
                        <div>
                            <label for="memberComment" class="block text-xs font-semibold text-slate-300 mb-1.5">コメント・条件など（任意）</label>
                            <input type="text" id="memberComment" placeholder="例: 遅れて参加可能です 等" class="w-full bg-slate-900/90 border border-dark-border focus:border-amber-500 focus:ring-1 focus:ring-amber-500 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 text-sm outline-none transition-all">
                        </div>
                    </div>

                    <!-- Date Candidates Selection List -->
                    <div class="space-y-2 pt-2">
                        <label class="block text-xs font-semibold text-slate-300">各候補日時の可否を選択 <span class="text-rose-500">*</span></label>
                        <div id="dateCandidatesFormContainer" class="grid grid-cols-1 gap-2.5">
                            <!-- JS側で候補日時行を動的生成 -->
                        </div>
                    </div>

                    <div class="flex items-center justify-end gap-3 pt-3">
                        <button type="button" id="cancelEditBtn" class="hidden px-4 py-2 text-sm text-slate-400 hover:text-white transition-colors">
                            キャンセル
                        </button>
                        <button type="submit" id="submitVoteBtn" class="px-6 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-amber-500/20 transition-all text-sm flex items-center gap-2">
                            <i data-lucide="send" class="w-4 h-4"></i>
                            回答を保存する
                        </button>
                    </div>
                </form>
            </div>

            <!-- Attendance Result Matrix Table Section -->
            <div class="bg-dark-card border border-dark-border rounded-2xl p-5 sm:p-6 shadow-xl overflow-hidden">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-white flex items-center gap-2">
                        <i data-lucide="table" class="w-5 h-5 text-amber-400"></i>
                        集計一覧表
                    </h3>
                    <div id="totalRespondents" class="text-xs text-slate-400 bg-slate-900 px-3 py-1.5 rounded-lg border border-dark-border">
                        回答数: <span class="font-bold text-amber-400">0</span> 人
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead>
                            <tr class="bg-slate-900/80 text-xs font-semibold text-slate-300 border-b border-dark-border">
                                <th class="p-3 w-48 sticky left-0 bg-slate-900 z-10">候補日時</th>
                                <th class="p-3 text-center w-28 bg-amber-500/10 text-amber-300">〇の数</th>
                                <th class="p-3 text-center w-24">△の数</th>
                                <th class="p-3 text-center w-24">×の数</th>
                                <th class="p-3 min-w-[200px]">回答者一覧</th>
                            </tr>
                        </thead>
                        <tbody id="matrixTableBody" class="divide-y divide-dark-border text-sm">
                            <!-- JS側でリアルタイム描画 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Individual Responses Cards Section -->
            <div class="bg-dark-card border border-dark-border rounded-2xl p-5 sm:p-6 shadow-xl">
                <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i data-lucide="users" class="w-5 h-5 text-amber-400"></i>
                    回答者ごとの詳細
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="individualListContainer">
                    <!-- JS側で動的生成 -->
                </div>
            </div>

        </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Firebase Script Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, push, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // =============================================================
        // 【候補日時の設定】★ここを変更・追加することで日時を変えられます★
        // =============================================================
        const DATE_CANDIDATES = [
            "10月15日(木) 19:00〜",
            "10月16日(金) 19:00〜",
            "10月17日(土) 14:00〜",
            "10月17日(土) 18:00〜",
            "10月18日(日) 14:00〜"
        ];

        // Firebase Configuration (提供された設定情報を使用)[cite: 2]
        const firebaseConfig = {
            apiKey: "AIzaSyAP4KPPgbc8W6rYJhwfRna6xtmWql5ZDvQ",
            authDomain: "nittei-chousei-98260.firebaseapp.com",
            databaseURL: "https://nittei-chousei-98260-default-rtdb.firebaseio.com",
            projectId: "nittei-chousei-98260",
            storageBucket: "nittei-chousei-98260.firebasestorage.app",
            messagingSenderId: "889598003053",
            appId: "1:889598003053:web:bbcaa32253ffc25512fc64",
            measurementId: "G-TFR1YMRGY7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const CORRECT_PASSCODE = "shukketsu123";
        let voteData = [];

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600 text-white' : 
                            type === 'error' ? 'bg-rose-600 text-white' : 
                            'bg-slate-800 text-slate-100 border border-slate-700';

            toast.className = `px-4 py-3 rounded-xl shadow-xl ${bgClass} text-sm font-medium flex items-center gap-2 transform transition-all duration-300 translate-y-5 opacity-0 pointer-events-auto`;
            toast.innerHTML = `<span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-5', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 入室済みチェック
        if (sessionStorage.getItem('shukketsu_auth') === 'true') {
            unlockApp();
        }

        // 合言葉認証
        document.getElementById('passcodeForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const inputVal = document.getElementById('passcodeInput').value.trim();
            if (inputVal === CORRECT_PASSCODE) {
                sessionStorage.setItem('shukketsu_auth', 'true');
                unlockApp();
                showToast("認証成功！日程調整ボードへようこそ", "success");
            } else {
                document.getElementById('passcodeError').classList.remove('hidden');
            }
        });

        function unlockApp() {
            document.getElementById('authLockScreen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            renderFormCandidates();
            subscribeRealtimeData();
            lucide.createIcons();
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem('shukketsu_auth');
            document.getElementById('passcodeInput').value = '';
            document.getElementById('app').classList.add('hidden');
            document.getElementById('authLockScreen').classList.remove('hidden');
        });

        // フォーム内の候補日時リスト生成
        function renderFormCandidates() {
            const container = document.getElementById('dateCandidatesFormContainer');
            container.innerHTML = DATE_CANDIDATES.map((date, idx) => `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 bg-slate-900/90 rounded-xl border border-dark-border gap-2">
                    <span class="text-sm font-semibold text-slate-200">${escapeHtml(date)}</span>
                    <div class="grid grid-cols-3 gap-1.5 w-full sm:w-auto">
                        <label class="cursor-pointer">
                            <input type="radio" name="candidate_${idx}" value="〇" checked class="peer sr-only">
                            <div class="px-3 py-1.5 text-center rounded-lg border border-dark-border text-slate-400 text-xs font-bold peer-checked:bg-emerald-500/20 peer-checked:border-emerald-500 peer-checked:text-emerald-300 hover:bg-slate-800 transition-all flex items-center justify-center gap-1">
                                〇 可能
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="candidate_${idx}" value="△" class="peer sr-only">
                            <div class="px-3 py-1.5 text-center rounded-lg border border-dark-border text-slate-400 text-xs font-bold peer-checked:bg-amber-500/20 peer-checked:border-amber-500 peer-checked:text-amber-300 hover:bg-slate-800 transition-all flex items-center justify-center gap-1">
                                △ 微妙
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="candidate_${idx}" value="×" class="peer sr-only">
                            <div class="px-3 py-1.5 text-center rounded-lg border border-dark-border text-slate-400 text-xs font-bold peer-checked:bg-rose-500/20 peer-checked:border-rose-500 peer-checked:text-rose-300 hover:bg-slate-800 transition-all flex items-center justify-center gap-1">
                                × 不可
                            </div>
                        </label>
                    </div>
                </div>
            `).join('');
        }

        // リアルタイムデータ受信 (schedule_votes ノードを使用)
        function subscribeRealtimeData() {
            const votesRef = ref(db, 'schedule_votes');
            onValue(votesRef, (snapshot) => {
                const data = snapshot.val();
                voteData = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        voteData.push({ id: key, ...data[key] });
                    });
                }
                voteData.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
                renderMatrixTable();
                renderIndividualList();
            }, (error) => {
                console.error("Firebase Read Error:", error);
                showToast("データの読み込みに失敗しました", "error");
            });
        }

        // 集計テーブルの描画
        function renderMatrixTable() {
            document.querySelector('#totalRespondents span').textContent = voteData.length;
            const tbody = document.getElementById('matrixTableBody');

            tbody.innerHTML = DATE_CANDIDATES.map((date) => {
                let countOk = 0;
                let countMaybe = 0;
                let countNg = 0;
                const membersOk = [];

                voteData.forEach(item => {
                    const status = (item.votes && item.votes[date]) || '未回答';
                    if (status === '〇') {
                        countOk++;
                        membersOk.push(item.name);
                    } else if (status === '△') {
                        countMaybe++;
                    } else if (status === '×') {
                        countNg++;
                    }
                });

                const memberTags = membersOk.length > 0 
                    ? membersOk.map(m => `<span class="inline-block bg-emerald-500/10 text-emerald-300 border border-emerald-500/20 text-[11px] px-2 py-0.5 rounded-md mr-1 mb-1">${escapeHtml(m)}</span>`).join('')
                    : `<span class="text-xs text-slate-500">〇の回答者なし</span>`;

                return `
                    <tr class="hover:bg-slate-800/40 transition-colors">
                        <td class="p-3 font-semibold text-white sticky left-0 bg-dark-card border-r border-dark-border">${escapeHtml(date)}</td>
                        <td class="p-3 text-center font-extrabold text-emerald-400 bg-emerald-950/10 text-base">${countOk}</td>
                        <td class="p-3 text-center font-bold text-amber-400 text-sm">${countMaybe}</td>
                        <td class="p-3 text-center font-bold text-rose-400 text-sm">${countNg}</td>
                        <td class="p-3">${memberTags}</td>
                    </tr>
                `;
            }).join('');
        }

        // 回答者個別のカード描画
        function renderIndividualList() {
            const container = document.getElementById('individualListContainer');
            if (voteData.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-8 text-slate-500 text-sm">まだ回答がありません。最初の希望を入力してみましょう！</div>`;
                return;
            }

            container.innerHTML = voteData.map(item => {
                const updatedTime = item.updatedAt ? new Date(item.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                
                const votesSummary = DATE_CANDIDATES.map(date => {
                    const status = (item.votes && item.votes[date]) || '-';
                    let badgeClass = status === '〇' ? 'text-emerald-400 font-bold' : status === '△' ? 'text-amber-400 font-bold' : 'text-rose-400 font-bold';
                    return `<div class="flex justify-between text-xs py-1 border-b border-slate-800/40"><span class="text-slate-400 truncate">${escapeHtml(date)}</span><span class="${badgeClass}">${status}</span></div>`;
                }).join('');

                return `
                    <div class="bg-slate-900/60 border border-dark-border/80 rounded-xl p-4 flex flex-col justify-between hover:border-slate-700 transition-all">
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center gap-2">
                                    <div class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-xs text-amber-400">
                                        ${escapeHtml((item.name || '').substring(0, 1))}
                                    </div>
                                    <div>
                                        <div class="font-bold text-slate-200 text-sm">${escapeHtml(item.name)}</div>
                                        <div class="text-[10px] text-slate-500">${updatedTime} 更新</div>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-slate-950/40 rounded-lg p-2.5 my-2">
                                ${votesSummary}
                            </div>
                            ${item.comment ? `<p class="text-xs text-slate-300 mt-2 italic bg-slate-900 p-2 rounded border border-slate-800">"${escapeHtml(item.comment)}"</p>` : ''}
                        </div>
                        <div class="flex justify-end gap-2 mt-3 pt-2 border-t border-slate-800/40">
                            <button onclick="window.editVote('${item.id}')" class="text-xs text-amber-400 hover:text-amber-300 px-2 py-1 rounded hover:bg-amber-500/10 transition-colors font-medium">編集</button>
                            <button onclick="window.deleteVote('${item.id}')" class="text-xs text-rose-400 hover:text-rose-300 px-2 py-1 rounded hover:bg-rose-500/10 transition-colors font-medium">削除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (m) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        // 保存処理
        document.getElementById('voteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('memberName').value.trim();
            const comment = document.getElementById('memberComment').value.trim();
            const editId = document.getElementById('editMemberId').value;

            if (!name) return;

            const votes = {};
            DATE_CANDIDATES.forEach((date, idx) => {
                const checkedRadio = document.querySelector(`input[name="candidate_${idx}"]:checked`);
                votes[date] = checkedRadio ? checkedRadio.value : '〇';
            });

            try {
                if (editId) {
                    const itemRef = ref(db, `schedule_votes/${editId}`);
                    await update(itemRef, { name, comment, votes, updatedAt: Date.now() });
                    showToast("回答を更新しました", "success");
                } else {
                    const votesRef = ref(db, 'schedule_votes');
                    const newRef = push(votesRef);
                    await set(newRef, { name, comment, votes, updatedAt: Date.now() });
                    showToast("回答を送信しました！", "success");
                }
                resetForm();
            } catch (err) {
                console.error("Save Error:", err);
                showToast("保存に失敗しました", "error");
            }
        });

        window.editVote = function(id) {
            const target = voteData.find(v => v.id === id);
            if (!target) return;

            document.getElementById('editMemberId').value = id;
            document.getElementById('memberName').value = target.name;
            document.getElementById('memberComment').value = target.comment || '';
            document.getElementById('formTitle').textContent = "回答を変更する";

            DATE_CANDIDATES.forEach((date, idx) => {
                const val = (target.votes && target.votes[date]) || '〇';
                const radio = document.querySelector(`input[name="candidate_${idx}"][value="${val}"]`);
                if (radio) radio.checked = true;
            });

            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('submitVoteBtn').innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> 変更を更新する`;
            lucide.createIcons();
            document.getElementById('voteForm').scrollIntoView({ behavior: 'smooth' });
        };

        window.deleteVote = async function(id) {
            if (confirm("この回答を削除してもよろしいですか？")) {
                try {
                    const itemRef = ref(db, `schedule_votes/${id}`);
                    await remove(itemRef);
                    showToast("回答を削除しました", "info");
                    resetForm();
                } catch (err) {
                    showToast("削除に失敗しました", "error");
                }
            }
        };

        function resetForm() {
            document.getElementById('editMemberId').value = '';
            document.getElementById('memberName').value = '';
            document.getElementById('memberComment').value = '';
            document.getElementById('formTitle').textContent = "あなたの都合を入力する";

            DATE_CANDIDATES.forEach((_, idx) => {
                const defaultRadio = document.querySelector(`input[name="candidate_${idx}"][value="〇"]`);
                if (defaultRadio) defaultRadio.checked = true;
            });

            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('submitVoteBtn').innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> 回答を保存する`;
            lucide.createIcons();
        }

        document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

        // CSV出力
        document.getElementById('exportCsvBtn').addEventListener('click', () => {
            if (voteData.length === 0) {
                showToast("出力するデータがグラムありません", "error"); // 修正
                return;
            }

            let csvContent = "\uFEFFお名前," + DATE_CANDIDATES.map(d => `"${d}"`).join(',') + ",コメント,更新日時\n";
            voteData.forEach(item => {
                const timeStr = item.updatedAt ? new Date(item.updatedAt).toLocaleString('ja-JP') : '';
                const row = [
                    `"${(item.name || '').replace(/"/g, '""')}"`,
                    ...DATE_CANDIDATES.map(d => `"${((item.votes && item.votes[d]) || '').replace(/"/g, '""')}"`),
                    `"${(item.comment || '').replace(/"/g, '""')}"`,
                    `"${timeStr}"`
                ].join(',');
                csvContent += row + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `日程調整結果.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast("CSVファイルをダウンロードしました", "success");
        });

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
