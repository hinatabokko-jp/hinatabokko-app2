<!DOCTYPE html>
<html lang="ja" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Canvas Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Styling Library -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Inter', '"Segoe UI"', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: #131b2e;
            --surface-glass: rgba(19, 27, 46, 0.78);
            --primary-gradient: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #3b82f6 100%);
            --primary-hover-gradient: linear-gradient(135deg, #9333ea 0%, #db2777 50%, #2563eb 100%);
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-blue: #3b82f6;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(168, 85, 247, 0.35);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.14);
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 999px; }
        .dark ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.35); }

        /* MEMO.html スタイル継承 */
        .memo-gradient-text {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .memo-gradient-bg {
            background: var(--primary-gradient);
        }
        .memo-gradient-bg:hover {
            background: var(--primary-hover-gradient);
        }
        .memo-logo-ring {
            background: var(--primary-gradient);
            padding: 2px;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.25);
        }

        .dark body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(168, 85, 247, 0.08), transparent 45%),
                              radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.06), transparent 50%);
        }

        .dark .glass-header {
            background-color: var(--surface-glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-color);
        }

        .dark .surface-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        /* タブアクティブ装飾 */
        .tab-btn {
            position: relative;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            color: #c084fc;
            font-weight: 700;
        }
        html:not(.dark) .tab-btn.active {
            color: #9333ea;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 12%;
            width: 76%;
            height: 2.5px;
            border-radius: 999px;
            background: var(--primary-gradient);
        }

        /* タイプボタン・スタイルボタンのアクティブ時 */
        .type-btn.active,
        .dot-style-btn.active,
        .corner-style-btn.active,
        .preset-logo-btn.active {
            border-color: rgba(168, 85, 247, 0.65) !important;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.18) 0%, rgba(236, 72, 153, 0.12) 100%) !important;
            color: #e9d5ff !important;
            box-shadow: 0 0 14px rgba(168, 85, 247, 0.2);
        }
        html:not(.dark) .type-btn.active,
        html:not(.dark) .dot-style-btn.active,
        html:not(.dark) .corner-style-btn.active,
        html:not(.dark) .preset-logo-btn.active {
            color: #7e22ce !important;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.12) 0%, rgba(236, 72, 153, 0.08) 100%) !important;
        }

        /* QRコードスキャン枠（読み取り精度＆デザイン両立） */
        .qr-stage-outer {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.35), rgba(236, 72, 153, 0.25), rgba(59, 130, 246, 0.35));
            padding: 1.5px;
            border-radius: 22px;
            box-shadow: var(--shadow-lg);
        }
        .qr-quiet-zone {
            background-color: #ffffff;
            border-radius: 20.5px;
            padding: 16px;
            box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.06);
            transition: background-color 0.25s ease;
        }
        /* 透明背景選択時用の市松模様＋白ベース確保 */
        .qr-quiet-zone.is-transparent {
            background-color: #f8fafc;
            background-image:
                linear-gradient(45deg, #e2e8f0 25%, transparent 25%),
                linear-gradient(-45deg, #e2e8f0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e2e8f0 75%),
                linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        }
        #qrcode-container canvas,
        #qrcode-container svg {
            max-width: 100% !important;
            height: auto !important;
            display: block;
            border-radius: 8px;
        }

        /* 横スクロールバー非表示（スマホのタイプ選択用） */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-[#0b0f19] dark:text-[#f1f5f9] min-h-full flex flex-col transition-colors duration-200 antialiased">

    <!-- Header (MEMO.html 統一スタイル) -->
    <header class="glass-header bg-white/90 border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="memo-logo-ring w-10 h-10 sm:w-11 sm:h-11 rounded-2xl flex items-center justify-center transition-transform hover:scale-105">
                    <div class="w-full h-full bg-white dark:bg-[#131b2e] rounded-[14px] flex items-center justify-center">
                        <i class="fa-solid fa-qrcode text-lg sm:text-xl memo-gradient-text"></i>
                    </div>
                </div>
                <div>
                    <h1 class="font-extrabold text-base sm:text-lg tracking-tight leading-tight memo-gradient-text">QR Canvas Studio</h1>
                    <p class="text-[11px] sm:text-xs text-slate-500 dark:text-[#94a3b8]">モダンなQRコード作成ツール</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="themeToggleBtn" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-100/70 dark:bg-white/5 hover:bg-purple-500/15 text-slate-600 dark:text-purple-300 flex items-center justify-center transition-all" title="テーマ切替">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content: スマホではプレビューを上部(order-1)に配置し操作性を向上 -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-3.5 sm:px-6 lg:px-8 py-4 sm:py-6 grid grid-cols-1 lg:grid-cols-12 gap-5 lg:gap-8">
        
        <!-- Preview & Export Column (Mobile: Top / Desktop: Right) -->
        <div class="order-1 lg:order-2 lg:col-span-5 xl:col-span-4 flex flex-col gap-4">
            <div class="surface-card bg-white rounded-2xl p-4 sm:p-6 border border-slate-200 lg:sticky lg:top-24 flex flex-col items-center">
                <div class="w-full flex items-center justify-between mb-3 sm:mb-4">
                    <h2 class="font-bold text-sm sm:text-base text-slate-800 dark:text-[#f1f5f9] flex items-center gap-2">
                        <i class="fa-solid fa-eye text-purple-400"></i> プレビュー
                    </h2>
                    <span class="text-[11px] px-2.5 py-1 bg-purple-500/10 text-purple-600 dark:text-purple-300 border border-purple-500/25 rounded-full font-semibold flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-pink-500 animate-pulse"></span> リアルタイム
                    </span>
                </div>

                <!-- QR Canvas Stage: 読み取り精度を保つ白クワイエットゾーン＋角ファインダー装飾 -->
                <div class="w-full flex flex-col items-center justify-center py-3 sm:py-5 px-4 rounded-2xl bg-slate-100/80 dark:bg-[#0b0f19]/80 border border-slate-200/70 dark:border-white/[0.06]">
                    <div class="qr-stage-outer relative max-w-[230px] sm:max-w-[260px] w-full aspect-square flex items-center justify-center">
                        <!-- スキャンガイドの四隅アクセント -->
                        <span class="pointer-events-none absolute -top-1.5 -left-1.5 w-4 h-4 border-t-2 border-l-2 border-purple-400 rounded-tl-lg"></span>
                        <span class="pointer-events-none absolute -top-1.5 -right-1.5 w-4 h-4 border-t-2 border-r-2 border-pink-400 rounded-tr-lg"></span>
                        <span class="pointer-events-none absolute -bottom-1.5 -left-1.5 w-4 h-4 border-b-2 border-l-2 border-pink-400 rounded-bl-lg"></span>
                        <span class="pointer-events-none absolute -bottom-1.5 -right-1.5 w-4 h-4 border-b-2 border-r-2 border-blue-400 rounded-br-lg"></span>

                        <div id="qrQuietZone" class="qr-quiet-zone w-full h-full flex items-center justify-center">
                            <div id="qrcode-container" class="w-full h-full flex items-center justify-center"></div>
                        </div>
                    </div>
                    <p class="mt-2.5 text-[11px] text-slate-400 dark:text-[#94a3b8] flex items-center gap-1">
                        <i class="fa-solid fa-camera text-purple-400/80"></i> スキャン最適化余白を確保しています
                    </p>
                </div>

                <!-- Export Options -->
                <div class="w-full grid grid-cols-2 gap-2.5 sm:gap-3 mt-4">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 dark:text-[#94a3b8] mb-1">出力サイズ</label>
                        <select id="exportSize" class="w-full px-3 py-2 text-xs sm:text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] text-slate-800 dark:text-[#f1f5f9] outline-none focus:border-purple-500">
                            <option value="300">300 x 300</option>
                            <option value="600" selected>600 x 600</option>
                            <option value="1200">1200 x 1200</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 dark:text-[#94a3b8] mb-1">形式</label>
                        <select id="exportFormat" class="w-full px-3 py-2 text-xs sm:text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] text-slate-800 dark:text-[#f1f5f9] outline-none focus:border-purple-500">
                            <option value="png">PNG 画像</option>
                            <option value="svg">SVG ベクター</option>
                            <option value="webp">WEBP 画像</option>
                        </select>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="w-full grid grid-cols-1 sm:grid-cols-1 gap-2 mt-4">
                    <button id="downloadBtn" class="memo-gradient-bg w-full py-3 sm:py-3.5 px-4 text-white font-bold text-sm rounded-xl shadow-lg shadow-purple-500/25 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-download"></i> QRコードをダウンロード
                    </button>
                    <button id="copyImageBtn" class="w-full py-2.5 px-3 bg-slate-100 dark:bg-white/5 hover:bg-slate-200 dark:hover:bg-white/10 border border-slate-200 dark:border-white/10 text-slate-700 dark:text-slate-200 font-semibold text-xs rounded-xl transition flex items-center justify-center gap-1.5">
                        <i class="fa-regular fa-copy text-purple-400"></i> クリップボードに画像コピー
                    </button>
                </div>
            </div>
        </div>

        <!-- Controls & Input Tabs Column (Mobile: Bottom / Desktop: Left) -->
        <div class="order-2 lg:order-1 lg:col-span-7 xl:col-span-8 flex flex-col gap-4 sm:gap-6">
            
            <!-- Type Selectors -->
            <div class="surface-card bg-white rounded-2xl p-3.5 sm:p-5 border border-slate-200">
                <label class="block text-[11px] font-bold text-slate-400 dark:text-[#94a3b8] uppercase tracking-wider mb-2.5">1. タイプを選択</label>
                <div class="grid grid-cols-5 gap-1.5 sm:gap-2.5" id="typeContainer">
                    <button data-type="url" class="type-btn active flex flex-col items-center justify-center gap-1.5 py-2.5 px-1 sm:p-3 rounded-xl border border-slate-200 dark:border-white/10 text-slate-600 dark:text-slate-300 font-medium text-[10px] sm:text-xs transition-all">
                        <i class="fa-solid fa-link text-sm sm:text-lg"></i>
                        <span class="truncate max-w-full">URL/文字</span>
                    </button>
                    <button data-type="wifi" class="type-btn flex flex-col items-center justify-center gap-1.5 py-2.5 px-1 sm:p-3 rounded-xl border border-slate-200 dark:border-white/10 hover:border-purple-400/40 text-slate-600 dark:text-slate-300 font-medium text-[10px] sm:text-xs transition-all">
                        <i class="fa-solid fa-wifi text-sm sm:text-lg"></i>
                        <span>Wi-Fi</span>
                    </button>
                    <button data-type="vcard" class="type-btn flex flex-col items-center justify-center gap-1.5 py-2.5 px-1 sm:p-3 rounded-xl border border-slate-200 dark:border-white/10 hover:border-purple-400/40 text-slate-600 dark:text-slate-300 font-medium text-[10px] sm:text-xs transition-all">
                        <i class="fa-solid fa-address-card text-sm sm:text-lg"></i>
                        <span>名刺</span>
                    </button>
                    <button data-type="email" class="type-btn flex flex-col items-center justify-center gap-1.5 py-2.5 px-1 sm:p-3 rounded-xl border border-slate-200 dark:border-white/10 hover:border-purple-400/40 text-slate-600 dark:text-slate-300 font-medium text-[10px] sm:text-xs transition-all">
                        <i class="fa-solid fa-envelope text-sm sm:text-lg"></i>
                        <span>メール</span>
                    </button>
                    <button data-type="phone" class="type-btn flex flex-col items-center justify-center gap-1.5 py-2.5 px-1 sm:p-3 rounded-xl border border-slate-200 dark:border-white/10 hover:border-purple-400/40 text-slate-600 dark:text-slate-300 font-medium text-[10px] sm:text-xs transition-all">
                        <i class="fa-solid fa-phone text-sm sm:text-lg"></i>
                        <span>電話/SMS</span>
                    </button>
                </div>
            </div>

            <!-- Settings Tabs & Input Content -->
            <div class="surface-card bg-white rounded-2xl border border-slate-200 overflow-hidden flex flex-col">
                <div class="grid grid-cols-3 border-b border-slate-200 dark:border-white/[0.08] bg-slate-50/70 dark:bg-white/[0.02]">
                    <button id="tabInput" class="tab-btn active py-3.5 px-2 text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 flex items-center justify-center gap-1.5 hover:text-purple-400">
                        <i class="fa-solid fa-pen-to-square"></i> <span>入力データ</span>
                    </button>
                    <button id="tabStyle" class="tab-btn py-3.5 px-2 text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 flex items-center justify-center gap-1.5 hover:text-purple-400">
                        <i class="fa-solid fa-palette"></i> <span>スタイル</span>
                    </button>
                    <button id="tabLogo" class="tab-btn py-3.5 px-2 text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 flex items-center justify-center gap-1.5 hover:text-purple-400">
                        <i class="fa-solid fa-image"></i> <span>ロゴ挿入</span>
                    </button>
                </div>

                <div class="p-4 sm:p-6">
                    <!-- Tab 1: Input Content -->
                    <div id="contentSection" class="space-y-4">
                        <div id="formUrl" class="space-y-2.5">
                            <label class="block text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200">URLまたはテキスト</label>
                            <textarea id="inputUrlText" rows="3" class="w-full px-3.5 py-3 text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] text-slate-800 dark:text-white focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 outline-none transition" placeholder="https://example.com または 自由なテキストを入力">https://example.com</textarea>
                        </div>

                        <div id="formWifi" class="space-y-4 hidden">
                            <div>
                                <label class="block text-xs sm:text-sm font-semibold mb-1.5">ネットワーク名 (SSID)</label>
                                <input type="text" id="wifiSsid" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] focus:border-purple-500 outline-none" placeholder="Wi-Fiネットワーク名">
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                                <div>
                                    <label class="block text-xs sm:text-sm font-semibold mb-1.5">パスワード</label>
                                    <input type="text" id="wifiPassword" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] focus:border-purple-500 outline-none" placeholder="パスワード">
                                </div>
                                <div>
                                    <label class="block text-xs sm:text-sm font-semibold mb-1.5">暗号化方式</label>
                                    <select id="wifiType" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] focus:border-purple-500 outline-none">
                                        <option value="WPA">WPA / WPA2 / WPA3</option>
                                        <option value="WEP">WEP</option>
                                        <option value="nopass">なし (オープン)</option>
                                    </select>
                                </div>
                            </div>
                            <label class="flex items-center gap-2.5 cursor-pointer select-none">
                                <input type="checkbox" id="wifiHidden" class="rounded accent-purple-500 h-4 w-4">
                                <span class="text-xs sm:text-sm text-slate-600 dark:text-slate-300">非公開ネットワーク (SSIDステルス)</span>
                            </label>
                        </div>

                        <div id="formVcard" class="space-y-3.5 hidden">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                                <div>
                                    <label class="block text-xs sm:text-sm font-semibold mb-1">氏名</label>
                                    <input type="text" id="vcardName" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] focus:border-purple-500 outline-none" placeholder="山田 太郎">
                                </div>
                                <div>
                                    <label class="block text-xs sm:text-sm font-semibold mb-1">会社名</label>
                                    <input type="text" id="vcardOrg" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] focus:border-purple-500 outline-none" placeholder="株式会社サンプル">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                                <div>
                                    <label class="block text-xs sm:text-sm font-semibold mb-1">役職</label>
                                    <input type="text" id="vcardTitle" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] focus:border-purple-500 outline-none" placeholder="マネージャー">
                                </div>
                                <div>
                                    <label class="block text-xs sm:text-sm font-semibold mb-1">電話番号</label>
                                    <input type="tel" id="vcardTel" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] focus:border-purple-500 outline-none" placeholder="090-1234-5678">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                                <div>
                                    <label class="block text-xs sm:text-sm font-semibold mb-1">メールアドレス</label>
                                    <input type="email" id="vcardEmail" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] focus:border-purple-500 outline-none" placeholder="example@domain.com">
                                </div>
                                <div>
                                    <label class="block text-xs sm:text-sm font-semibold mb-1">Webサイト URL</label>
                                    <input type="url" id="vcardUrl" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] focus:border-purple-500 outline-none" placeholder="https://example.com">
                                </div>
                            </div>
                        </div>

                        <div id="formEmail" class="space-y-3.5 hidden">
                            <div>
                                <label class="block text-xs sm:text-sm font-semibold mb-1">宛先メールアドレス</label>
                                <input type="email" id="emailTo" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] focus:border-purple-500 outline-none" placeholder="contact@example.com">
                            </div>
                            <div>
                                <label class="block text-xs sm:text-sm font-semibold mb-1">件名</label>
                                <input type="text" id="emailSubject" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] focus:border-purple-500 outline-none" placeholder="件名を入力">
                            </div>
                            <div>
                                <label class="block text-xs sm:text-sm font-semibold mb-1">本文</label>
                                <textarea id="emailBody" rows="3" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] focus:border-purple-500 outline-none" placeholder="本文を入力"></textarea>
                            </div>
                        </div>

                        <div id="formPhone" class="space-y-3.5 hidden">
                            <div>
                                <label class="block text-xs sm:text-sm font-semibold mb-1">電話番号</label>
                                <input type="tel" id="phoneNum" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] focus:border-purple-500 outline-none" placeholder="09012345678">
                            </div>
                            <label class="flex items-center gap-2.5 my-2 cursor-pointer select-none">
                                <input type="checkbox" id="isSms" class="rounded accent-purple-500 h-4 w-4">
                                <span class="text-xs sm:text-sm font-medium">SMSメッセージとして生成する</span>
                            </label>
                            <div id="smsMessageArea" class="hidden">
                                <label class="block text-xs sm:text-sm font-semibold mb-1">SMSメッセージ本文</label>
                                <textarea id="smsBody" rows="2" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] focus:border-purple-500 outline-none" placeholder="メッセージを入力"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Tab 2: Style Controls -->
                    <div id="styleSection" class="space-y-5 hidden">
                        <div>
                            <h3 class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200 mb-2.5 flex items-center gap-2">
                                <i class="fa-solid fa-droplet text-purple-400"></i> カラー設定
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-50 dark:bg-[#0b0f19]/70 p-3.5 rounded-xl border border-slate-200/70 dark:border-white/[0.06]">
                                <div>
                                    <label class="block text-[11px] font-medium text-slate-500 dark:text-[#94a3b8] mb-1">ドットの色 (前景色)</label>
                                    <div class="flex items-center gap-2">
                                        <input type="color" id="colorDot" value="#000000" class="h-9 w-11 rounded-lg border-0 cursor-pointer bg-transparent">
                                        <input type="text" id="colorDotText" value="#000000" class="flex-grow px-3 py-1.5 text-xs sm:text-sm rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-[#131b2e]">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-[11px] font-medium text-slate-500 dark:text-[#94a3b8] mb-1">背景色</label>
                                    <div class="flex items-center gap-2">
                                        <input type="color" id="colorBg" value="#ffffff" class="h-9 w-11 rounded-lg border-0 cursor-pointer bg-transparent">
                                        <input type="text" id="colorBgText" value="#ffffff" class="flex-grow px-3 py-1.5 text-xs sm:text-sm rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-[#131b2e]">
                                    </div>
                                </div>
                            </div>
                            <label class="flex items-center gap-2.5 mt-3 cursor-pointer select-none">
                                <input type="checkbox" id="bgTransparent" class="rounded accent-purple-500 h-4 w-4">
                                <span class="text-xs sm:text-sm text-slate-600 dark:text-slate-300">背景を透明にする</span>
                            </label>
                        </div>

                        <div>
                            <label class="flex items-center justify-between mb-2 cursor-pointer select-none">
                                <span class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2">
                                    <i class="fa-solid fa-wand-magic-sparkles text-pink-400"></i> グラデーションを使用
                                </span>
                                <input type="checkbox" id="useGradient" class="rounded accent-purple-500 h-4 w-4">
                            </label>
                            <div id="gradientControls" class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-50 dark:bg-[#0b0f19]/70 p-3.5 rounded-xl border border-slate-200/70 dark:border-white/[0.06] hidden">
                                <div>
                                    <label class="block text-[11px] font-medium text-slate-500 dark:text-[#94a3b8] mb-1">グラデーション終了色</label>
                                    <div class="flex items-center gap-2">
                                        <input type="color" id="colorGradientEnd" value="#a855f7" class="h-9 w-11 rounded-lg border-0 cursor-pointer bg-transparent">
                                        <input type="text" id="colorGradientEndText" value="#a855f7" class="flex-grow px-3 py-1.5 text-xs sm:text-sm rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-[#131b2e]">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-[11px] font-medium text-slate-500 dark:text-[#94a3b8] mb-1">グラデーション方向</label>
                                    <select id="gradientType" class="w-full px-3 py-2 text-xs sm:text-sm rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-[#131b2e]">
                                        <option value="linear">斜め (Linear)</option>
                                        <option value="radial">中央放射 (Radial)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-3.5">
                            <h3 class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2">
                                <i class="fa-solid fa-shapes text-blue-400"></i> 形状とパターン
                            </h3>
                            <div>
                                <label class="block text-[11px] font-medium text-slate-500 dark:text-[#94a3b8] mb-2">ドット形状</label>
                                <div class="grid grid-cols-3 sm:grid-cols-6 gap-2" id="dotsStyleOptions">
                                    <button data-dotstyle="square" class="dot-style-btn active py-2.5 px-1.5 border border-slate-200 dark:border-white/10 rounded-xl text-xs font-medium text-center transition">正方形</button>
                                    <button data-dotstyle="dots" class="dot-style-btn py-2.5 px-1.5 border border-slate-200 dark:border-white/10 rounded-xl text-xs font-medium text-center transition">丸ドット</button>
                                    <button data-dotstyle="rounded" class="dot-style-btn py-2.5 px-1.5 border border-slate-200 dark:border-white/10 rounded-xl text-xs font-medium text-center transition">角丸</button>
                                    <button data-dotstyle="extra-rounded" class="dot-style-btn py-2.5 px-1.5 border border-slate-200 dark:border-white/10 rounded-xl text-xs font-medium text-center transition">大角丸</button>
                                    <button data-dotstyle="classy" class="dot-style-btn py-2.5 px-1.5 border border-slate-200 dark:border-white/10 rounded-xl text-xs font-medium text-center transition">クラシック</button>
                                    <button data-dotstyle="classy-rounded" class="dot-style-btn py-2.5 px-1.5 border border-slate-200 dark:border-white/10 rounded-xl text-xs font-medium text-center transition">優美</button>
                                </div>
                            </div>

                            <div>
                                <label class="block text-[11px] font-medium text-slate-500 dark:text-[#94a3b8] mb-2">角の四角枠</label>
                                <div class="grid grid-cols-3 gap-2" id="cornerSquareOptions">
                                    <button data-cornerstyle="square" class="corner-style-btn active py-2.5 px-2 border border-slate-200 dark:border-white/10 rounded-xl text-xs font-medium text-center transition">四角</button>
                                    <button data-cornerstyle="dot" class="corner-style-btn py-2.5 px-2 border border-slate-200 dark:border-white/10 rounded-xl text-xs font-medium text-center transition">丸</button>
                                    <button data-cornerstyle="extra-rounded" class="corner-style-btn py-2.5 px-2 border border-slate-200 dark:border-white/10 rounded-xl text-xs font-medium text-center transition">角丸</button>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[11px] font-medium text-slate-500 dark:text-[#94a3b8] mb-1">エラー訂正レベル</label>
                            <select id="errorCorrectionLevel" class="w-full px-3.5 py-2.5 text-xs sm:text-sm rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#0b0f19] outline-none focus:border-purple-500">
                                <option value="L">L - 低 (7%復元)</option>
                                <option value="M" selected>M - 中 (15%復元)</option>
                                <option value="Q">Q - 高 (25%復元)</option>
                                <option value="H">H - 最高 (30%復元 - ロゴ推奨)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Tab 3: Logo Insertion -->
                    <div id="logoSection" class="space-y-5 hidden">
                        <div>
                            <h3 class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200 mb-3 flex items-center gap-2">
                                <i class="fa-solid fa-icons text-purple-400"></i> プリセットアイコン
                            </h3>
                            <div class="grid grid-cols-5 sm:grid-cols-6 gap-2 sm:gap-3" id="presetLogoContainer">
                                <button data-logo="" class="preset-logo-btn active p-2.5 sm:p-3 rounded-xl border border-slate-200 dark:border-white/10 flex flex-col items-center gap-1 transition">
                                    <i class="fa-solid fa-ban text-slate-400 text-lg sm:text-xl"></i>
                                    <span class="text-[10px]">なし</span>
                                </button>
                                <button data-logo="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%23000000'><path d='M389.2 48h70.6L305.6 224.2 487 464H345L233.7 318.6 106.5 464H35.8L200.7 275.5 26.8 48H173l100.2 132.5L389.2 48z'/></svg>" class="preset-logo-btn p-2.5 sm:p-3 rounded-xl border border-slate-200 dark:border-white/10 hover:border-purple-400/40 flex flex-col items-center gap-1 transition">
                                    <i class="fa-brands fa-x-twitter text-lg sm:text-xl"></i>
                                    <span class="text-[10px]">X</span>
                                </button>
                                <button data-logo="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512' fill='%23E4405F'><path d='M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8z'/></svg>" class="preset-logo-btn p-2.5 sm:p-3 rounded-xl border border-slate-200 dark:border-white/10 hover:border-purple-400/40 flex flex-col items-center gap-1 transition">
                                    <i class="fa-brands fa-instagram text-pink-500 text-lg sm:text-xl"></i>
                                    <span class="text-[10px]">Instagram</span>
                                </button>
                                <button data-logo="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 576 512' fill='%23FF0000'><path d='M549.655 124.083c-6.281-23.65-24.787-42.276-48.284-48.597C458.781 64 288 64 288 64S117.22 64 74.629 75.486c-23.497 6.322-42.003 24.947-48.284 48.597-11.412 42.867-11.412 132.305-11.412 132.305s0 89.438 11.412 132.305c6.281 23.65 24.787 41.5 48.284 47.821C117.22 448 288 448 288 448s170.78 0 213.371-11.486c23.497-6.321 42.003-24.171 48.284-47.821 11.412-42.867 11.412-132.305 11.412-132.305s0-89.438-11.412-132.305zm-317.51 213.508V175.185l142.739 81.206-142.739 81.200z'/></svg>" class="preset-logo-btn p-2.5 sm:p-3 rounded-xl border border-slate-200 dark:border-white/10 hover:border-purple-400/40 flex flex-col items-center gap-1 transition">
                                    <i class="fa-brands fa-youtube text-red-500 text-lg sm:text-xl"></i>
                                    <span class="text-[10px]">YouTube</span>
                                </button>
                                <button data-logo="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512' fill='%2300B900'><path d='M272.1 215.5H252v-17c0-4.4-3.6-8-8-8h-16c-4.4 0-8 3.6-8 8v17h-20.1c-4.4 0-8 3.6-8 8v16c0 4.4 3.6 8 8 8H212v57c0 4.4 3.6 8 8 8h16c0 4.4 8-3.6 8-8v-57h20.1c4.4 0 8-3.6 8-8v-16c0-4.4-3.6-8-8-8zM224 32C100.3 32 0 120.5 0 229.7c0 98.2 79.8 178.5 186.2 195.1 7.2 1.6 17 4.8 19.5 11 2.2 5.6 1.4 14.4.7 20.1-2.2 18.2-10 70.9-10.4 74.3-.6 4.7 2.2 9.3 6.8 9.3 3.6 0 7.8-2 11.2-4.5 17.5-12.8 98.4-71.1 138-106.1 63.8-56.3 96-121.2 96-198.3C448 120.5 347.7 32 224 32z'/></svg>" class="preset-logo-btn p-2.5 sm:p-3 rounded-xl border border-slate-200 dark:border-white/10 hover:border-purple-400/40 flex flex-col items-center gap-1 transition">
                                    <i class="fa-brands fa-line text-green-500 text-lg sm:text-xl"></i>
                                    <span class="text-[10px]">LINE</span>
                                </button>
                            </div>
                        </div>

                        <div>
                            <h3 class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200 mb-2.5 flex items-center gap-2">
                                <i class="fa-solid fa-upload text-pink-400"></i> カスタムロゴ画像をアップロード
                            </h3>
                            <label class="flex flex-col items-center justify-center w-full h-28 border-2 border-slate-300 dark:border-purple-500/30 border-dashed rounded-xl cursor-pointer bg-slate-50 dark:bg-[#0b0f19]/60 hover:bg-purple-500/10 transition">
                                <i class="fa-solid fa-cloud-arrow-up text-xl text-purple-400 mb-1.5"></i>
                                <span class="text-xs text-slate-500 dark:text-slate-300 font-medium">画像ファイルを選択 (PNG/JPG)</span>
                                <input id="logoFileInput" type="file" accept="image/*" class="hidden" />
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification Box -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 sm:left-auto sm:right-5 sm:translate-x-0 bg-[#131b2e] border border-purple-500/40 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 translate-y-24 opacity-0 transition-all duration-300 z-50 pointer-events-none whitespace-nowrap">
        <i id="toastIcon" class="fa-solid fa-circle-check text-purple-400"></i>
        <span id="toastMsg" class="text-xs sm:text-sm font-semibold">通知</span>
    </div>

    <script src="js/qrcode.js"></script>
</body>
</html>
