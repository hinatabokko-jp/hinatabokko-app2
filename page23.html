<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Canvas Pro - Firebase Sync</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Styling Library -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-200">

    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-blue-600 to-indigo-500 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid font-bold fa-qrcode text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">QR Canvas Pro</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Firebase クラウド連携版 (RTDB)</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div id="firebaseStatus" class="flex items-center gap-1.5 text-xs text-amber-500 font-medium bg-amber-50 dark:bg-amber-950/40 px-2.5 py-1 rounded-full border border-amber-200 dark:border-amber-800">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span> 接続準備中...
                </div>
                <button id="themeToggleBtn" class="p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Side: Controls & Input Tabs -->
        <div class="lg:col-span-7 xl:col-span-8 flex flex-col gap-6">
            
            <!-- Type Selectors -->
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700">
                <label class="block text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-3">1. タイプを選択</label>
                <div class="grid grid-cols-3 sm:grid-cols-5 gap-2" id="typeContainer">
                    <button data-type="url" class="type-btn active flex flex-col items-center gap-2 p-3 rounded-xl border border-blue-500 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 font-medium text-xs transition-all">
                        <i class="fa-solid fa-link text-lg"></i>
                        <span>URL / テキスト</span>
                    </button>
                    <button data-type="wifi" class="type-btn flex flex-col items-center gap-2 p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 text-slate-600 dark:text-slate-300 font-medium text-xs transition-all">
                        <i class="fa-solid fa-wifi text-lg"></i>
                        <span>Wi-Fi</span>
                    </button>
                    <button data-type="vcard" class="type-btn flex flex-col items-center gap-2 p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 text-slate-600 dark:text-slate-300 font-medium text-xs transition-all">
                        <i class="fa-solid fa-address-card text-lg"></i>
                        <span>名刺 (vCard)</span>
                    </button>
                    <button data-type="email" class="type-btn flex flex-col items-center gap-2 p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 text-slate-600 dark:text-slate-300 font-medium text-xs transition-all">
                        <i class="fa-solid fa-envelope text-lg"></i>
                        <span>メール</span>
                    </button>
                    <button data-type="phone" class="type-btn flex flex-col items-center gap-2 p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 text-slate-600 dark:text-slate-300 font-medium text-xs transition-all">
                        <i class="fa-solid fa-phone text-lg"></i>
                        <span>電話 / SMS</span>
                    </button>
                </div>
            </div>

            <!-- Settings Tabs & Input Content -->
            <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col">
                <div class="flex border-b border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50 px-4 overflow-x-auto">
                    <button id="tabInput" class="tab-btn active px-4 py-3.5 text-sm font-medium text-slate-600 dark:text-slate-300 flex items-center gap-2 border-b-2 border-transparent hover:text-blue-600 whitespace-nowrap">
                        <i class="fa-solid fa-pen-to-square"></i> 入力
                    </button>
                    <button id="tabStyle" class="tab-btn px-4 py-3.5 text-sm font-medium text-slate-600 dark:text-slate-300 flex items-center gap-2 border-b-2 border-transparent hover:text-blue-600 whitespace-nowrap">
                        <i class="fa-solid fa-palette"></i> スタイル
                    </button>
                    <button id="tabLogo" class="tab-btn px-4 py-3.5 text-sm font-medium text-slate-600 dark:text-slate-300 flex items-center gap-2 border-b-2 border-transparent hover:text-blue-600 whitespace-nowrap">
                        <i class="fa-solid fa-image"></i> ロゴ
                    </button>
                    <button id="tabHistory" class="tab-btn px-4 py-3.5 text-sm font-medium text-slate-600 dark:text-slate-300 flex items-center gap-2 border-b-2 border-transparent hover:text-blue-600 whitespace-nowrap">
                        <i class="fa-solid fa-cloud text-blue-500"></i> クラウド保存履歴
                    </button>
                </div>

                <div class="p-6">
                    <!-- Input Form Content -->
                    <div id="contentSection" class="space-y-4">
                        <div id="formUrl" class="space-y-3">
                            <label class="block text-sm font-medium">URLまたはテキスト</label>
                            <textarea id="inputUrlText" rows="3" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://example.com または 自由なテキストを入力"></textarea>
                        </div>

                        <div id="formWifi" class="space-y-4 hidden">
                            <div>
                                <label class="block text-sm font-medium mb-1">ネットワーク名 (SSID)</label>
                                <input type="text" id="wifiSsid" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 outline-none" placeholder="Wi-Fiネットワーク名">
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">パスワード</label>
                                    <input type="password" id="wifiPassword" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 outline-none" placeholder="パスワード">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">暗号化方式</label>
                                    <select id="wifiType" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 outline-none">
                                        <option value="WPA">WPA / WPA2 / WPA3</option>
                                        <option value="WEP">WEP</option>
                                        <option value="nopass">なし (オープン)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <input type="checkbox" id="wifiHidden" class="rounded text-blue-600 h-4 w-4">
                                <label for="wifiHidden" class="text-sm">非公開ネットワーク (SSIDステルス)</label>
                            </div>
                        </div>

                        <div id="formVcard" class="space-y-4 hidden">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">氏名</label>
                                    <input type="text" id="vcardName" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 outline-none" placeholder="山田 太郎">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">会社名</label>
                                    <input type="text" id="vcardOrg" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 outline-none" placeholder="株式会社サンプル">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">役職</label>
                                    <input type="text" id="vcardTitle" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 outline-none" placeholder="マネージャー">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">電話番号</label>
                                    <input type="tel" id="vcardTel" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 outline-none" placeholder="090-1234-5678">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">メールアドレス</label>
                                    <input type="email" id="vcardEmail" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 outline-none" placeholder="example@domain.com">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">Webサイト URL</label>
                                    <input type="url" id="vcardUrl" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 outline-none" placeholder="https://example.com">
                                </div>
                            </div>
                        </div>

                        <div id="formEmail" class="space-y-4 hidden">
                            <div>
                                <label class="block text-sm font-medium mb-1">宛先メールアドレス</label>
                                <input type="email" id="emailTo" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 outline-none" placeholder="contact@example.com">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">件名</label>
                                <input type="text" id="emailSubject" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 outline-none" placeholder="件名を入力">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">本文</label>
                                <textarea id="emailBody" rows="3" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 outline-none" placeholder="本文を入力"></textarea>
                            </div>
                        </div>

                        <div id="formPhone" class="space-y-4 hidden">
                            <div>
                                <label class="block text-sm font-medium mb-1">電話番号</label>
                                <input type="tel" id="phoneNum" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 outline-none" placeholder="09012345678">
                            </div>
                            <div class="flex items-center gap-2 my-2">
                                <input type="checkbox" id="isSms" class="rounded text-blue-600 h-4 w-4">
                                <label for="isSms" class="text-sm font-medium">SMSメッセージとして生成する</label>
                            </div>
                            <div id="smsMessageArea" class="hidden">
                                <label class="block text-sm font-medium mb-1">SMSメッセージ本文</label>
                                <textarea id="smsBody" rows="2" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 outline-none" placeholder="メッセージを入力"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Style Options -->
                    <div id="styleSection" class="space-y-6 hidden">
                        <div>
                            <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3 flex items-center gap-2">
                                <i class="fa-solid fa-droplet text-blue-500"></i> カラー設定
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-100 dark:border-slate-700/50">
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">ドットの色 (前景色)</label>
                                    <div class="flex items-center gap-2">
                                        <input type="color" id="colorDot" value="#000000" class="h-10 w-12 rounded border-0 cursor-pointer bg-transparent">
                                        <input type="text" id="colorDotText" value="#000000" class="flex-grow px-3 py-1.5 text-sm rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">背景色</label>
                                    <div class="flex items-center gap-2">
                                        <input type="color" id="colorBg" value="#ffffff" class="h-10 w-12 rounded border-0 cursor-pointer bg-transparent">
                                        <input type="text" id="colorBgText" value="#ffffff" class="flex-grow px-3 py-1.5 text-sm rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800">
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 mt-3">
                                <input type="checkbox" id="bgTransparent" class="rounded text-blue-600 h-4 w-4">
                                <label for="bgTransparent" class="text-sm">背景を透明にする</label>
                            </div>
                        </div>

                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-2">
                                    <i class="fa-solid fa-wand-magic-sparkles text-blue-500"></i> グラデーションを使用
                                </label>
                                <input type="checkbox" id="useGradient" class="rounded text-blue-600 h-4 w-4">
                            </div>
                            <div id="gradientControls" class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-100 dark:border-slate-700/50 hidden">
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">グラデーション終了色</label>
                                    <div class="flex items-center gap-2">
                                        <input type="color" id="colorGradientEnd" value="#3b82f6" class="h-10 w-12 rounded border-0 cursor-pointer bg-transparent">
                                        <input type="text" id="colorGradientEndText" value="#3b82f6" class="flex-grow px-3 py-1.5 text-sm rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">グラデーション方向</label>
                                    <select id="gradientType" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800">
                                        <option value="linear">斜め (Linear)</option>
                                        <option value="radial">中央放射 (Radial)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-2">
                                <i class="fa-solid fa-shapes text-blue-500"></i> 形状とパターン
                            </h3>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">ドット形状</label>
                                <div class="grid grid-cols-3 sm:grid-cols-6 gap-2" id="dotsStyleOptions">
                                    <button data-dotstyle="square" class="dot-style-btn active p-2 border border-blue-500 rounded-lg text-xs font-medium text-center bg-blue-50 dark:bg-blue-900/30">正方形</button>
                                    <button data-dotstyle="dots" class="dot-style-btn p-2 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-medium text-center">丸ドット</button>
                                    <button data-dotstyle="rounded" class="dot-style-btn p-2 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-medium text-center">角丸</button>
                                    <button data-dotstyle="extra-rounded" class="dot-style-btn p-2 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-medium text-center">大角丸</button>
                                    <button data-dotstyle="classy" class="dot-style-btn p-2 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-medium text-center">クラシック</button>
                                    <button data-dotstyle="classy-rounded" class="dot-style-btn p-2 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-medium text-center">優美</button>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">角の四角枠</label>
                                <div class="grid grid-cols-3 gap-2" id="cornerSquareOptions">
                                    <button data-cornerstyle="square" class="corner-style-btn active p-2 border border-blue-500 rounded-lg text-xs font-medium text-center bg-blue-50 dark:bg-blue-900/30">四角</button>
                                    <button data-cornerstyle="dot" class="corner-style-btn p-2 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-medium text-center">丸</button>
                                    <button data-cornerstyle="extra-rounded" class="corner-style-btn p-2 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-medium text-center">角丸</button>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">エラー訂正レベル</label>
                            <select id="errorCorrectionLevel" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800">
                                <option value="L">L - 低 (7%復元)</option>
                                <option value="M" selected>M - 中 (15%復元)</option>
                                <option value="Q">Q - 高 (25%復元)</option>
                                <option value="H">H - 最高 (30%復元 - ロゴ推奨)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Logo Options -->
                    <div id="logoSection" class="space-y-6 hidden">
                        <div>
                            <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3 flex items-center gap-2">
                                <i class="fa-solid fa-icons text-blue-500"></i> プリセットアイコン
                            </h3>
                            <div class="grid grid-cols-4 sm:grid-cols-6 gap-3" id="presetLogoContainer">
                                <button data-logo="" class="preset-logo-btn active p-3 rounded-xl border border-blue-500 bg-blue-50 dark:bg-blue-900/30 flex flex-col items-center gap-1">
                                    <i class="fa-solid fa-ban text-slate-400 text-xl"></i>
                                    <span class="text-[10px]">なし</span>
                                </button>
                                <button data-logo="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%23000000'><path d='M389.2 48h70.6L305.6 224.2 487 464H345L233.7 318.6 106.5 464H35.8L200.7 275.5 26.8 48H173l100.2 132.5L389.2 48z'/></svg>" class="preset-logo-btn p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-slate-300 flex flex-col items-center gap-1">
                                    <i class="fa-brands fa-x-twitter text-xl"></i>
                                    <span class="text-[10px]">X (Twitter)</span>
                                </button>
                                <button data-logo="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512' fill='%23E4405F'><path d='M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8z'/></svg>" class="preset-logo-btn p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-slate-300 flex flex-col items-center gap-1">
                                    <i class="fa-brands fa-instagram text-pink-500 text-xl"></i>
                                    <span class="text-[10px]">Instagram</span>
                                </button>
                                <button data-logo="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 576 512' fill='%23FF0000'><path d='M549.655 124.083c-6.281-23.65-24.787-42.276-48.284-48.597C458.781 64 288 64 288 64S117.22 64 74.629 75.486c-23.497 6.322-42.003 24.947-48.284 48.597-11.412 42.867-11.412 132.305-11.412 132.305s0 89.438 11.412 132.305c6.281 23.65 24.787 41.5 48.284 47.821C117.22 448 288 448 288 448s170.78 0 213.371-11.486c23.497-6.321 42.003-24.171 48.284-47.821 11.412-42.867 11.412-132.305 11.412-132.305s0-89.438-11.412-132.305zm-317.51 213.508V175.185l142.739 81.206-142.739 81.200z'/></svg>" class="preset-logo-btn p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-slate-300 flex flex-col items-center gap-1">
                                    <i class="fa-brands fa-youtube text-red-500 text-xl"></i>
                                    <span class="text-[10px]">YouTube</span>
                                </button>
                                <button data-logo="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512' fill='%2300B900'><path d='M272.1 215.5H252v-17c0-4.4-3.6-8-8-8h-16c-4.4 0-8 3.6-8 8v17h-20.1c-4.4 0-8 3.6-8 8v16c0 4.4 3.6 8 8 8H212v57c0 4.4 3.6 8 8 8h16c0 4.4 8-3.6 8-8v-57h20.1c4.4 0 8-3.6 8-8v-16c0-4.4-3.6-8-8-8zM224 32C100.3 32 0 120.5 0 229.7c0 98.2 79.8 178.5 186.2 195.1 7.2 1.6 17 4.8 19.5 11 2.2 5.6 1.4 14.4.7 20.1-2.2 18.2-10 70.9-10.4 74.3-.6 4.7 2.2 9.3 6.8 9.3 3.6 0 7.8-2 11.2-4.5 17.5-12.8 98.4-71.1 138-106.1 63.8-56.3 96-121.2 96-198.3C448 120.5 347.7 32 224 32z'/></svg>" class="preset-logo-btn p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-slate-300 flex flex-col items-center gap-1">
                                    <i class="fa-brands fa-line text-green-500 text-xl"></i>
                                    <span class="text-[10px]">LINE</span>
                                </button>
                            </div>
                        </div>

                        <div>
                            <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3 flex items-center gap-2">
                                <i class="fa-solid fa-upload text-blue-500"></i> カスタムロゴ画像をアップロード
                            </h3>
                            <label class="flex flex-col items-center justify-center w-full h-28 border-2 border-slate-300 dark:border-slate-700 border-dashed rounded-xl cursor-pointer bg-slate-50 dark:bg-slate-900/50 hover:bg-slate-100 transition">
                                <i class="fa-solid fa-cloud-arrow-up text-xl text-slate-400 mb-1"></i>
                                <span class="text-xs text-slate-500 font-medium">画像ファイルを選択 (PNG/JPG)</span>
                                <input id="logoFileInput" type="file" accept="image/*" class="hidden" />
                            </label>
                        </div>
                    </div>

                    <!-- Cloud History Section -->
                    <div id="historySection" class="space-y-4 hidden">
                        <div class="flex justify-between items-center">
                            <p class="text-xs text-slate-500">Realtime Databaseに保存された履歴</p>
                        </div>
                        <div id="historyList" class="space-y-2 max-h-80 overflow-y-auto pr-1">
                            <p class="text-sm text-slate-400 text-center py-6">データを読み込み中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Live QR Preview & Actions -->
        <div class="lg:col-span-5 xl:col-span-4 flex flex-col gap-6">
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 sticky top-24 flex flex-col items-center">
                <div class="w-full flex items-center justify-between mb-4">
                    <h2 class="font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                        <i class="fa-solid fa-eye text-blue-500"></i> プレビュー
                    </h2>
                    <span class="text-xs px-2.5 py-1 bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-300 rounded-full font-medium flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> リアルタイム
                    </span>
                </div>

                <!-- Canvas Box -->
                <div class="relative w-full aspect-square bg-slate-50 dark:bg-slate-900/50 rounded-2xl flex items-center justify-center p-6 border border-slate-100 dark:border-slate-700/50 shadow-inner overflow-hidden">
                    <div id="qrcode-container" class="flex items-center justify-center"></div>
                </div>

                <!-- Export Options -->
                <div class="w-full grid grid-cols-2 gap-3 mt-5">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">出力サイズ</label>
                        <select id="exportSize" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
                            <option value="300">300 x 300</option>
                            <option value="600" selected>600 x 600</option>
                            <option value="1200">1200 x 1200</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">形式</label>
                        <select id="exportFormat" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
                            <option value="png">PNG 画像</option>
                            <option value="svg">SVG ベクター</option>
                            <option value="webp">WEBP 画像</option>
                        </select>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="w-full space-y-2 mt-5">
                    <button id="downloadBtn" class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-download"></i> QRコードをダウンロード
                    </button>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="copyImageBtn" class="py-2.5 px-3 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 font-medium text-xs rounded-xl transition flex items-center justify-center gap-1.5">
                            <i class="fa-regular fa-copy"></i> 画像コピー
                        </button>
                        <button id="saveCloudBtn" class="py-2.5 px-3 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 font-medium text-xs rounded-xl transition flex items-center justify-center gap-1.5 text-blue-600 dark:text-blue-400">
                            <i class="fa-solid fa-cloud-arrow-up"></i> クラウド保存
                        </button>
                    </div>
                </div>

                <!-- Toast -->
                <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
                    <i id="toastIcon" class="fa-solid fa-circle-check text-green-400"></i>
                    <span id="toastMsg" class="text-sm font-medium">通知</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase SDK (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { 
            getDatabase, 
            ref, 
            push, 
            onValue, 
            query, 
            limitToLast 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 提供された Firebase Config & Database URL
        const firebaseConfig = {
            apiKey: "AIzaSyB8I6VYP0qbRHJluCMoIpgAwgtw1Iy5XIA",
            authDomain: "qrcode-7a6f4.firebaseapp.com",
            databaseURL: "https://qrcode-7a6f4-default-rtdb.firebaseio.com",
            projectId: "qrcode-7a6f4",
            storageBucket: "qrcode-7a6f4.firebasestorage.app",
            messagingSenderId: "426358794634",
            appId: "1:426358794634:web:5f157eb162c36e961f0073",
            measurementId: "G-SHSTBC3FYV"
        };

        const state = {
            type: 'url',
            data: 'https://example.com',
            dotsColor: '#000000',
            bgColor: '#ffffff',
            isBgTransparent: false,
            useGradient: false,
            gradientEndColor: '#3b82f6',
            gradientType: 'linear',
            dotsStyle: 'square',
            cornerStyle: 'square',
            errorLevel: 'M',
            logoUrl: '',
            logoSize: 0.4,
            logoMargin: 5
        };

        let qrCodeStyling = null;
        let db = null;
        let historyRef = null;

        // Firebase Initialize
        try {
            const app = initializeApp(firebaseConfig);
            try { getAnalytics(app); } catch (e) { console.log('Analytics bypass'); }
            
            db = getDatabase(app);
            historyRef = ref(db, 'qr_history');
            
            const statusEl = document.getElementById('firebaseStatus');
            statusEl.className = "flex items-center gap-1.5 text-xs text-emerald-600 dark:text-emerald-400 font-medium bg-emerald-50 dark:bg-emerald-950/40 px-2.5 py-1 rounded-full border border-emerald-200 dark:border-emerald-800";
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> RTDB 接続完了`;
            
            listenToHistory();
        } catch (e) {
            console.warn("Firebase Init Error:", e);
            const statusEl = document.getElementById('firebaseStatus');
            statusEl.className = "flex items-center gap-1.5 text-xs text-rose-500 font-medium bg-rose-50 dark:bg-rose-950/40 px-2.5 py-1 rounded-full";
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span> 接続エラー`;
        }

        function encodeUtf8(str) {
            if (!str) return '';
            try { return unescape(encodeURIComponent(str)); } catch (e) { return str; }
        }

        function initQRCode() {
            if (typeof QRCodeStyling === 'undefined') {
                setTimeout(initQRCode, 100);
                return;
            }

            qrCodeStyling = new QRCodeStyling({
                width: 280,
                height: 280,
                type: 'canvas',
                data: encodeUtf8(state.data),
                image: state.logoUrl,
                dotsOptions: {
                    color: state.dotsColor,
                    type: state.dotsStyle,
                    gradient: state.useGradient ? {
                        type: state.gradientType,
                        colorStops: [{ offset: 0, color: state.dotsColor }, { offset: 1, color: state.gradientEndColor }]
                    } : null
                },
                backgroundOptions: { color: state.isBgTransparent ? 'transparent' : state.bgColor },
                imageOptions: { crossOrigin: 'anonymous', imageSize: state.logoSize, margin: state.logoMargin },
                cornersSquareOptions: { type: state.cornerStyle, color: state.dotsColor },
                cornersDotOptions: { color: state.dotsColor },
                qrOptions: { errorCorrectionLevel: state.errorLevel }
            });

            const container = document.getElementById('qrcode-container');
            container.innerHTML = '';
            qrCodeStyling.append(container);
        }

        function updateQRCode() {
            if (!qrCodeStyling) return;
            buildDataPayload();

            qrCodeStyling.update({
                data: encodeUtf8(state.data),
                image: state.logoUrl,
                dotsOptions: {
                    color: state.dotsColor,
                    type: state.dotsStyle,
                    gradient: state.useGradient ? {
                        type: state.gradientType,
                        colorStops: [{ offset: 0, color: state.dotsColor }, { offset: 1, color: state.gradientEndColor }]
                    } : null
                },
                backgroundOptions: { color: state.isBgTransparent ? 'transparent' : state.bgColor },
                imageOptions: { imageSize: state.logoSize, margin: state.logoMargin },
                cornersSquareOptions: { type: state.cornerStyle, color: state.dotsColor },
                cornersDotOptions: { color: state.dotsColor },
                qrOptions: { errorCorrectionLevel: state.errorLevel }
            });
        }

        function buildDataPayload() {
            switch(state.type) {
                case 'url':
                    state.data = document.getElementById('inputUrlText').value.trim() || 'https://example.com';
                    break;
                case 'wifi': {
                    const ssid = document.getElementById('wifiSsid').value.trim();
                    const pass = document.getElementById('wifiPassword').value;
                    const type = document.getElementById('wifiType').value;
                    const hidden = document.getElementById('wifiHidden').checked;
                    state.data = ssid ? `WIFI:S:${ssid};T:${type};P:${pass};H:${hidden};;` : 'WIFI:S:MyNetwork;T:WPA;P:password;;';
                    break;
                }
                case 'vcard': {
                    const name = document.getElementById('vcardName').value.trim() || '山田 太郎';
                    const org = document.getElementById('vcardOrg').value.trim();
                    const tel = document.getElementById('vcardTel').value.trim();
                    const email = document.getElementById('vcardEmail').value.trim();
                    const lines = ['BEGIN:VCARD', 'VERSION:3.0', `FN:${name}`];
                    if (org) lines.push(`ORG:${org}`);
                    if (tel) lines.push(`TEL;TYPE=CELL:${tel}`);
                    if (email) lines.push(`EMAIL:${email}`);
                    lines.push('END:VCARD');
                    state.data = lines.join('\r\n');
                    break;
                }
                case 'email': {
                    const to = document.getElementById('emailTo').value.trim();
                    const sub = document.getElementById('emailSubject').value.trim();
                    const body = document.getElementById('emailBody').value.trim();
                    state.data = to ? `mailto:${to}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}` : 'mailto:info@example.com';
                    break;
                }
                case 'phone': {
                    const num = document.getElementById('phoneNum').value.trim() || '09000000000';
                    const isSms = document.getElementById('isSms').checked;
                    const smsBody = document.getElementById('smsBody').value.trim();
                    state.data = isSms ? `smsto:${num}:${smsBody}` : `tel:${num}`;
                    break;
                }
            }
        }

        // Tab Handling
        const tabs = [
            { id: 'tabInput', sec: 'contentSection' },
            { id: 'tabStyle', sec: 'styleSection' },
            { id: 'tabLogo', sec: 'logoSection' },
            { id: 'tabHistory', sec: 'historySection' }
        ];

        tabs.forEach(t => {
            document.getElementById(t.id).addEventListener('click', () => {
                tabs.forEach(x => {
                    document.getElementById(x.id).classList.remove('active');
                    document.getElementById(x.sec).classList.add('hidden');
                });
                document.getElementById(t.id).classList.add('active');
                document.getElementById(t.sec).classList.remove('hidden');
            });
        });

        // Type Buttons
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.type-btn').forEach(b => {
                    b.classList.remove('active', 'border-blue-500', 'bg-blue-50', 'dark:bg-blue-900/30', 'text-blue-600', 'dark:text-blue-400');
                    b.classList.add('border-slate-200', 'dark:border-slate-700', 'text-slate-600', 'dark:text-slate-300');
                });
                btn.classList.add('active', 'border-blue-500', 'bg-blue-50', 'dark:bg-blue-900/30', 'text-blue-600', 'dark:text-blue-400');

                state.type = btn.dataset.type;
                ['formUrl', 'formWifi', 'formVcard', 'formEmail', 'formPhone'].forEach(id => document.getElementById(id).classList.add('hidden'));
                document.getElementById('form' + state.type.charAt(0).toUpperCase() + state.type.slice(1)).classList.remove('hidden');
                updateQRCode();
            });
        });

        // Attach input events
        ['inputUrlText', 'wifiSsid', 'wifiPassword', 'wifiType', 'wifiHidden', 'vcardName', 'vcardOrg', 'vcardTel', 'vcardEmail', 'emailTo', 'emailSubject', 'emailBody', 'phoneNum', 'smsBody'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', updateQRCode);
                el.addEventListener('change', updateQRCode);
            }
        });

        document.getElementById('isSms').addEventListener('change', (e) => {
            document.getElementById('smsMessageArea').classList.toggle('hidden', !e.target.checked);
            updateQRCode();
        });

        // Save to Firebase Realtime Database
        async function saveToCloud() {
            if (!historyRef) {
                showToast('Firebaseが初期化されていません', true);
                return;
            }

            try {
                const payload = {
                    type: state.type,
                    data: state.data,
                    createdAt: new Date().toISOString(),
                    displayText: state.data.substring(0, 40)
                };

                await push(historyRef, payload);
                showToast('Realtime Databaseへ保存しました！');
            } catch (err) {
                console.error(err);
                showToast('保存エラー: 権限を確認してください', true);
            }
        }

        // Firebase Realtime Listener
        function listenToHistory() {
            if (!historyRef) return;
            const recentQuery = query(historyRef, limitToLast(20));

            onValue(recentQuery, (snapshot) => {
                const historyList = document.getElementById('historyList');
                if (!snapshot.exists()) {
                    historyList.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">保存された履歴はありません</p>`;
                    return;
                }

                const dataObj = snapshot.val();
                const items = Object.keys(dataObj).map(key => ({
                    id: key,
                    ...dataObj[key]
                })).reverse();

                historyList.innerHTML = items.map(item => {
                    const date = item.createdAt ? new Date(item.createdAt).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '';
                    return `
                        <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-100 dark:border-slate-700/50">
                            <div class="overflow-hidden mr-2">
                                <span class="text-[10px] uppercase font-bold text-blue-500 bg-blue-50 dark:bg-blue-900/50 px-1.5 py-0.5 rounded mr-1.5">${item.type || 'URL'}</span>
                                <p class="text-xs font-medium truncate inline text-slate-700 dark:text-slate-200">${escapeHtml(item.displayText || item.data || '')}</p>
                                <p class="text-[10px] text-slate-400 mt-0.5">${date}</p>
                            </div>
                            <button data-content="${escapeHtml(item.data || '')}" data-type="${item.type || 'url'}" class="load-btn px-2.5 py-1 text-xs bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 rounded-lg hover:bg-blue-100 font-medium">
                                復元
                            </button>
                        </div>
                    `;
                }).join('');

                document.querySelectorAll('.load-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const content = e.currentTarget.dataset.content;
                        const type = e.currentTarget.dataset.type;

                        if (type === 'url') {
                            document.getElementById('inputUrlText').value = content;
                        }
                        const typeBtn = document.querySelector(`.type-btn[data-type="${type}"]`);
                        if (typeBtn) typeBtn.click();

                        showToast('データを反映しました');
                    });
                });
            });
        }

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Download & Copy Actions
        document.getElementById('downloadBtn').addEventListener('click', async () => {
            const size = parseInt(document.getElementById('exportSize').value, 10);
            const format = document.getElementById('exportFormat').value;
            await qrCodeStyling.download({ name: 'qrcode_' + Date.now(), extension: format });
            showToast('ダウンロードを開始しました');
        });

        document.getElementById('copyImageBtn').addEventListener('click', async () => {
            const canvas = document.querySelector('#qrcode-container canvas');
            if (canvas) {
                canvas.toBlob(async (blob) => {
                    try {
                        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                        showToast('クリップボードにコピーしました！');
                    } catch(e) {
                        showToast('コピーに対応していません', true);
                    }
                });
            }
        });

        document.getElementById('saveCloudBtn').addEventListener('click', saveToCloud);

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        // Dark Mode & Dynamic Init
        document.getElementById('themeToggleBtn').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        window.addEventListener('DOMContentLoaded', () => {
            initQRCode();
        });
    </script>
</body>
</html>
