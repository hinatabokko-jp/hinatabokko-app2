<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI CHAT</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --surface-color: #131b2e;
      --surface-glass: rgba(19, 27, 46, 0.75);
      --primary-gradient: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #3b82f6 100%);
      --accent-purple: #a855f7;
      --accent-pink: #ec4899;
      --accent-blue: #3b82f6;
      --danger-color: #f43f5e;
      --text-color: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(168, 85, 247, 0.3);
      --my-msg-gradient: linear-gradient(135deg, #9333ea 0%, #db2777 100%);
      --medical-msg-gradient: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.15);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      background-color: var(--surface-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 10;
      box-shadow: var(--shadow-sm);
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .header-title {
      font-size: 1.15rem;
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.04em;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: var(--transition);
    }

    .tab-btn:hover {
      background: rgba(168, 85, 247, 0.12);
      color: var(--text-color);
      border-color: var(--border-glow);
    }

    .tab-btn.active {
      background: var(--primary-gradient);
      border-color: transparent;
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.3);
    }

    .btn-clear {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: var(--transition);
    }

    .btn-clear:hover {
      background: rgba(244, 63, 94, 0.22);
      color: #ffffff;
    }

    .space {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
    }

    .space.active {
      display: flex;
    }

    .chat-space {
      background: radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.05), transparent 60%);
    }

    .scope-banner {
      max-width: 860px;
      width: 100%;
      margin: 12px auto 0;
      padding: 0 20px;
    }

    .scope-banner-box {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .scope-banner-box strong {
      color: #93c5fd;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      max-width: 82%;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.25s ease-out;
    }

    .message.user {
      align-self: flex-end;
    }

    .message.ai {
      align-self: flex-start;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius-lg);
      font-size: 0.95rem;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background: var(--my-msg-gradient);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(147, 51, 234, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #medicalSpace .message.user .bubble {
      background: var(--medical-msg-gradient);
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
    }

    .message.ai .bubble {
      background: var(--surface-color);
      color: var(--text-color);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .timestamp {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 5px;
      padding: 0 6px;
      align-self: flex-end;
    }

    .message.ai .timestamp {
      align-self: flex-start;
    }

    footer {
      background-color: var(--surface-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 14px 20px;
      border-top: 1px solid var(--border-color);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.2);
    }

    .footer-inner {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    textarea {
      flex: 1;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      height: 44px;
      max-height: 140px;
      font-family: inherit;
      line-height: 1.4;
      transition: var(--transition);
    }

    textarea:focus, input:focus, select:focus {
      border-color: var(--accent-purple);
      background-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.2);
    }

    .send-btn-style {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 0 20px;
      height: 44px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .send-btn-style:hover:not(:disabled) {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: var(--shadow-lg);
    }

    .send-btn-style:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #settingsSpace {
      overflow-y: auto;
      padding: 24px 20px;
    }

    .settings-card {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .settings-heading {
      font-size: 1rem;
      font-weight: 700;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .input-field, .select-field {
      width: 100%;
      background-color: #0b0f19;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }

    #personaInput {
      min-height: 200px;
      line-height: 1.6;
      resize: vertical;
    }

    .settings-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 6px;
    }

    .status-text {
      font-size: 0.85rem;
      color: #c084fc;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="header-title">AI CHAT</div>
      <div class="tabs">
        <button id="tabChat" class="tab-btn active">💬 おしゃべり</button>
        <button id="tabMedical" class="tab-btn">🩺 医療事務の質問</button>
        <button id="tabSettings" class="tab-btn">⚙️ 固定設定</button>
      </div>
    </div>
    <button id="clearChatBtn" class="btn-clear">会話クリア</button>
  </header>

  <!-- スペース1：おしゃべり用（Firebase Realtime Databaseに保存・固定設定を反映） -->
  <main id="chatSpace" class="space chat-space active">
    <div id="chat-box" class="chat-box"></div>
    <footer>
      <div class="footer-inner">
        <textarea id="chat-input" placeholder="メッセージを入力（Ctrl+Enter または送信）..." rows="1"></textarea>
        <button id="chat-send-btn" class="send-btn-style">送信</button>
      </div>
    </footer>
  </main>

  <!-- スペース2：医療事務の質問用（指定2サイトのみ検索・引用ルールを適用） -->
  <main id="medicalSpace" class="space chat-space">
    <div class="scope-banner">
      <div class="scope-banner-box">
        <strong>参照・引用元制限：</strong>
        <code>https://shirobon.net/</code>（しろぼんネット）および
        <code>https://mavisone.jp/worth.html</code> のみを情報源として回答・引用します。
      </div>
    </div>
    <div id="medical-box" class="chat-box"></div>
    <footer>
      <div class="footer-inner">
        <textarea id="medical-input" placeholder="診療報酬・算定・医療機器・材料などの質問を入力..." rows="1"></textarea>
        <button id="medical-send-btn" class="send-btn-style">質問する</button>
      </div>
    </footer>
  </main>

  <!-- スペース3：固定設定用（Firebase Realtime Database & localStorageに永続保存） -->
  <section id="settingsSpace" class="space">
    <div class="settings-card">
      <div class="settings-heading">固定設定（会話クリアを押しても消えません）</div>

      <div class="input-group" id="userNameGroup" style="display: none;">
        <label for="userNameInput" class="input-label">チャットユーザー名</label>
        <input type="text" id="userNameInput" class="input-field" value="" placeholder="" />
      </div>

      <div class="input-group">
        <label for="apiKeyInput" class="input-label">GEMINI API キー（このブラウザにのみ保存）</label>
        <input type="password" id="apiKeyInput" class="input-field" placeholder="AIza..." autocomplete="off" />
      </div>

      <div class="input-group">
        <label for="modelSelect" class="input-label">モデル</label>
        <select id="modelSelect" class="select-field">
          <option value="gemini-3.8-flash">gemini-3.8-flash</option>
          <option value="gemini-3.6-flash">gemini-3.6-flash</option>
          <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
        </select>
      </div>

      <div class="input-group">
        <label for="personaInput" class="input-label">おしゃべり用の呼び名・口調・ルール（毎回AIに送信されます）</label>
        <textarea id="personaInput" class="input-field"></textarea>
      </div>

      <div class="settings-actions">
        <span id="saveStatus" class="status-text"></span>
        <button id="saveSettingsBtn" class="send-btn-style">設定を保存する</button>
      </div>
    </div>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, push, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // MEMO.htmlと同じFirebaseデータベース設定を入力してください
    const MEMO_FIREBASE_CONFIG = {
      apiKey: "YOUR_MEMO_FIREBASE_API_KEY",
      authDomain: "YOUR_MEMO_FIREBASE_AUTH_DOMAIN",
      databaseURL: "YOUR_MEMO_FIREBASE_DATABASE_URL",
      projectId: "YOUR_MEMO_FIREBASE_PROJECT_ID",
      storageBucket: "YOUR_MEMO_FIREBASE_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MEMO_FIREBASE_MESSAGING_SENDER_ID",
      appId: "YOUR_MEMO_FIREBASE_APP_ID"
    };

    const app = initializeApp(MEMO_FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const STORAGE_KEYS = {
      API_KEY: "ai_chat_api_key_v1",
      MODEL: "ai_chat_model_v1",
      PERSONA: "ai_chat_persona_v1",
      USER_NAME: "ai_chat_user_name_v1"
    };

    // デフォルトユーザー名は null（空欄・非表示）
    const DEFAULT_USER_NAME = null;

    // デフォルト呼び名を「るみ」に設定
    const DEFAULT_PERSONA = [
      "・ユーザーの呼び名：るみ",
      "・関係性と口調：気さくな友人同士のような親しみやすいタメ口",
      "・返答の長さ：2〜3文くらいでテンポよく短めに返す",
      "・ルール：説教や長い解説はせず、まずは共感や相槌を大切にする"
    ].join("\n");

    function buildMedicalSystemInstruction(personaText) {
      return [
        "あなたは医療事務のアシスタントです。",
        "【厳守すべき情報源・引用ルール】",
        "1. 回答の作成・検索・引用は、必ず以下の2つのURLのみを情報源としてください。",
        "   - しろぼんネット: https://shirobon.net/",
        "   - https://mavisone.jp/worth.html",
        "2. 上記2つのURL以外の外部サイトや一般的な記憶・推測から事実を補完・引用しないでください。",
        "3. 上記2つのURLから確認・引用できない事項については、推測せず「指定された参照元（しろぼんネット / https://mavisone.jp/worth.html）からは確認できません」と明記してください。",
        "4. 回答時には、どの参照元（しろぼんネット https://shirobon.net/ または https://mavisone.jp/worth.html）に基づく内容か、引用・参照元を明示してください。",
        personaText ? `【ユーザー設定参考】\n${personaText}` : ""
      ].filter(Boolean).join("\n");
    }

    // DOM参照
    const tabChat = document.getElementById("tabChat");
    const tabMedical = document.getElementById("tabMedical");
    const tabSettings = document.getElementById("tabSettings");

    const chatSpace = document.getElementById("chatSpace");
    const medicalSpace = document.getElementById("medicalSpace");
    const settingsSpace = document.getElementById("settingsSpace");
    const clearChatBtn = document.getElementById("clearChatBtn");

    const userNameGroup = document.getElementById("userNameGroup");
    const userNameInput = document.getElementById("userNameInput");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const modelSelect = document.getElementById("modelSelect");
    const personaInput = document.getElementById("personaInput");
    const saveSettingsBtn = document.getElementById("saveSettingsBtn");
    const saveStatus = document.getElementById("saveStatus");

    const spaces = {
      chat: {
        tab: tabChat,
        el: chatSpace,
        box: document.getElementById("chat-box"),
        input: document.getElementById("chat-input"),
        sendBtn: document.getElementById("chat-send-btn"),
        history: [],
        dbPath: "ai_chat/chat"
      },
      medical: {
        tab: tabMedical,
        el: medicalSpace,
        box: document.getElementById("medical-box"),
        input: document.getElementById("medical-input"),
        sendBtn: document.getElementById("medical-send-btn"),
        history: [],
        dbPath: "ai_chat/medical"
      }
    };

    let activeTab = "chat";
    let currentUser = null;

    function formatTime(dateObj = new Date()) {
      return dateObj.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
    }

    function applyUserNameState(val) {
      const normalized = (val === null || val === undefined || String(val).trim() === "") ? null : String(val).trim();
      userNameInput.value = normalized ?? "";
      userNameGroup.style.display = normalized ? "flex" : "none";
      return normalized;
    }

    function loadSettings() {
      apiKeyInput.value = localStorage.getItem(STORAGE_KEYS.API_KEY) || "";
      modelSelect.value = localStorage.getItem(STORAGE_KEYS.MODEL) || "gemini-3.8-flash";
      const savedPersona = localStorage.getItem(STORAGE_KEYS.PERSONA);
      personaInput.value = (savedPersona !== null && savedPersona.trim() !== "")
        ? savedPersona
        : DEFAULT_PERSONA;

      const savedUserName = localStorage.getItem(STORAGE_KEYS.USER_NAME);
      applyUserNameState(savedUserName !== null ? savedUserName : DEFAULT_USER_NAME);
    }

    async function saveMessageToDb(spaceKey, role, text, timeStr) {
      if (!currentUser) return;
      const target = spaces[spaceKey];
      const msgRef = push(ref(db, target.dbPath));
      await set(msgRef, {
        role,
        text,
        time: timeStr,
        createdAt: Date.now(),
        uid: currentUser.uid
      });
    }

    function renderSpaceMessages(spaceKey, messagesList) {
      const target = spaces[spaceKey];
      target.box.innerHTML = "";
      target.history = [];

      messagesList.forEach((item) => {
        appendMessage(target.box, item.role, item.text, item.time);
        if (item.role === "user") {
          target.history.push({ role: "user", parts: [{ text: item.text }] });
        } else if (item.role === "ai" && !item.text.startsWith("エラー:")) {
          target.history.push({ role: "model", parts: [{ text: item.text }] });
        }
      });
    }

    function subscribeToDatabase() {
      Object.entries(spaces).forEach(([key, cfg]) => {
        const spaceRef = ref(db, cfg.dbPath);
        onValue(spaceRef, (snapshot) => {
          const val = snapshot.val();
          if (!val) {
            renderSpaceMessages(key, []);
            return;
          }
          const list = Object.values(val).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
          renderSpaceMessages(key, list);
        });
      });

      const settingsRef = ref(db, "ai_chat_settings");
      onValue(settingsRef, (snapshot) => {
        const val = snapshot.val();
        if (!val) return;
        if (typeof val.model === "string" && val.model) {
          modelSelect.value = val.model;
          localStorage.setItem(STORAGE_KEYS.MODEL, val.model);
        }
        if (typeof val.persona === "string" && val.persona.trim() !== "") {
          personaInput.value = val.persona;
          localStorage.setItem(STORAGE_KEYS.PERSONA, val.persona);
        }
        const resolvedName = applyUserNameState(val.userName !== undefined ? val.userName : DEFAULT_USER_NAME);
        if (resolvedName === null) {
          localStorage.removeItem(STORAGE_KEYS.USER_NAME);
        } else {
          localStorage.setItem(STORAGE_KEYS.USER_NAME, resolvedName);
        }
      });
    }

    saveSettingsBtn.addEventListener("click", async () => {
      const trimmedKey = apiKeyInput.value.trim();
      const selectedModel = modelSelect.value;
      const trimmedPersona = personaInput.value.trim() || DEFAULT_PERSONA;
      const resolvedUserName = applyUserNameState(userNameInput.value);

      localStorage.setItem(STORAGE_KEYS.API_KEY, trimmedKey);
      localStorage.setItem(STORAGE_KEYS.MODEL, selectedModel);
      localStorage.setItem(STORAGE_KEYS.PERSONA, trimmedPersona);
      if (resolvedUserName === null) {
        localStorage.removeItem(STORAGE_KEYS.USER_NAME);
      } else {
        localStorage.setItem(STORAGE_KEYS.USER_NAME, resolvedUserName);
      }

      if (currentUser) {
        await set(ref(db, "ai_chat_settings"), {
          userName: resolvedUserName,
          model: selectedModel,
          persona: trimmedPersona,
          updatedAt: Date.now()
        });
      }

      saveStatus.textContent = "設定を保存しました";
      setTimeout(() => { saveStatus.textContent = ""; }, 2500);
    });

    function switchTab(target) {
      activeTab = target;
      tabChat.classList.toggle("active", target === "chat");
      tabMedical.classList.toggle("active", target === "medical");
      tabSettings.classList.toggle("active", target === "settings");

      chatSpace.classList.toggle("active", target === "chat");
      medicalSpace.classList.toggle("active", target === "medical");
      settingsSpace.classList.toggle("active", target === "settings");

      clearChatBtn.style.visibility = (target === "chat" || target === "medical") ? "visible" : "hidden";
    }

    tabChat.addEventListener("click", () => switchTab("chat"));
    tabMedical.addEventListener("click", () => switchTab("medical"));
    tabSettings.addEventListener("click", () => switchTab("settings"));

    // 現在表示中のチャットスペースの履歴だけをクリア（設定には一切触れない）
    clearChatBtn.addEventListener("click", async () => {
      const current = spaces[activeTab];
      if (!current) return;
      current.history = [];
      current.box.innerHTML = "";
      if (currentUser) {
        await remove(ref(db, current.dbPath));
      }
    });

    function appendMessage(boxEl, role, text, customTime = null) {
      const wrap = document.createElement("div");
      wrap.className = `message ${role === "user" ? "user" : "ai"}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      const time = document.createElement("div");
      time.className = "timestamp";
      time.textContent = customTime || formatTime();

      wrap.appendChild(bubble);
      wrap.appendChild(time);
      boxEl.appendChild(wrap);
      boxEl.scrollTop = boxEl.scrollHeight;
      return bubble;
    }

    async function sendToSpace(spaceKey) {
      const target = spaces[spaceKey];
      if (!target) return;

      const text = target.input.value.trim();
      const apiKey = apiKeyInput.value.trim();
      const model = modelSelect.value;
      const persona = (personaInput.value.trim() || DEFAULT_PERSONA);

      if (!text) return;
      if (!apiKey) {
        saveStatus.textContent = "先にAPIキーを入力して保存してください";
        switchTab("settings");
        apiKeyInput.focus();
        return;
      }

      const systemInstructionText = spaceKey === "medical"
        ? buildMedicalSystemInstruction(persona)
        : persona;

      target.input.value = "";
      target.sendBtn.disabled = true;

      const userTime = formatTime();
      appendMessage(target.box, "user", text, userTime);
      target.history.push({ role: "user", parts: [{ text }] });
      await saveMessageToDb(spaceKey, "user", text, userTime);

      const aiBubble = appendMessage(target.box, "ai", "…");

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;

        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: {
              parts: [{ text: systemInstructionText }]
            },
            contents: target.history
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error?.message || "APIエラーが発生しました");
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "（返答が空でした）";
        const aiTime = formatTime();
        aiBubble.textContent = reply;
        if (aiBubble.nextElementSibling) {
          aiBubble.nextElementSibling.textContent = aiTime;
        }
        target.history.push({ role: "model", parts: [{ text: reply }] });
        await saveMessageToDb(spaceKey, "ai", reply, aiTime);
      } catch (err) {
        aiBubble.textContent = `エラー: ${err.message}`;
        target.history.pop();
      } finally {
        target.sendBtn.disabled = false;
        target.box.scrollTop = target.box.scrollHeight;
        target.input.focus();
      }
    }

    Object.entries(spaces).forEach(([key, cfg]) => {
      cfg.sendBtn.addEventListener("click", () => sendToSpace(key));
      cfg.input.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
          sendToSpace(key);
        }
      });
    });

    loadSettings();

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        subscribeToDatabase();
      }
    });

    signInAnonymously(auth).catch((err) => {
      console.error("Firebase認証エラー:", err);
    });
  </script>
</body>
</html>
