<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI CHAT</title>

    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background-color:var(--bg-color);color:var(--text-color);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
    .login-overlay{position:fixed;inset:0;background:radial-gradient(circle at top right,rgba(168,85,247,0.14),transparent 55%),radial-gradient(circle at bottom left,rgba(59,130,246,0.12),transparent 55%),var(--bg-color);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
    .login-overlay.active{display:flex}
    .login-card{max-width:420px;width:100%;background-color:var(--surface-color);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:28px 24px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:18px}
    .login-title{font-size:1.25rem;font-weight:800;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;letter-spacing:0.04em}
    .login-subtitle{font-size:0.82rem;color:var(--text-muted);text-align:center;line-height:1.5}
    .login-actions{display:flex;flex-direction:column;gap:10px;padding-top:4px}
    .secondary-btn-style{background:rgba(255,255,255,0.05);color:var(--text-color);border:1px solid var(--border-color);border-radius:var(--radius-md);height:42px;padding:0 16px;font-size:0.88rem;font-weight:600;cursor:pointer;transition:var(--transition)}
    .secondary-btn-style:hover{background:rgba(168,85,247,0.12);border-color:var(--border-glow)}
    .login-error{font-size:0.82rem;color:#fda4af;min-height:18px;line-height:1.4}
    header{background-color:var(--surface-glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 20px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:10;box-shadow:var(--shadow-sm);flex-wrap:wrap}
    .header-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .header-title{font-size:1.15rem;font-weight:800;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:0.04em}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tab-btn{background:rgba(255,255,255,0.05);border:1px solid var(--border-color);color:var(--text-muted);padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.85rem;font-weight:600;transition:var(--transition)}
    .tab-btn:hover{background:rgba(168,85,247,0.12);color:var(--text-color);border-color:var(--border-glow)}
    .tab-btn.active{background:var(--primary-gradient);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(168,85,247,0.3)}
    .btn-clear{background:rgba(244,63,94,0.12);border:1px solid rgba(244,63,94,0.3);color:#fda4af;padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.82rem;font-weight:600;transition:var(--transition)}
    .btn-clear:hover{background:rgba(244,63,94,0.22);color:#fff}
    .btn-logout{background:rgba(255,255,255,0.05);border:1px solid var(--border-color);color:var(--text-muted);padding:7px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.8rem;font-weight:600;transition:var(--transition)}
    .btn-logout:hover{background:rgba(168,85,247,0.12);color:var(--text-color);border-color:var(--border-glow)}
    .space{display:none;flex:1;flex-direction:column;overflow:hidden;width:100%}
    .space.active{display:flex}
    .chat-space{background:radial-gradient(circle at bottom right,rgba(168,85,247,0.05),transparent 60%)}
    .scope-banner{max-width:860px;width:100%;margin:12px auto 0;padding:0 20px}
    .scope-banner-box{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);border-radius:var(--radius-md);padding:10px 14px;font-size:0.8rem;color:#cbd5e1;line-height:1.5}
    .scope-banner-box strong{color:#93c5fd}
    .chat-box{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;max-width:860px;width:100%;margin:0 auto}
    .message{max-width:82%;display:flex;flex-direction:column;animation:fadeIn 0.25s ease-out}
    .message.user{align-self:flex-end}
    .message.ai{align-self:flex-start}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .bubble{padding:12px 16px;border-radius:var(--radius-lg);font-size:0.95rem;line-height:1.6;word-break:break-word;white-space:pre-wrap}
    .message.user .bubble{background:var(--my-msg-gradient);color:#fff;border-bottom-right-radius:4px;box-shadow:0 4px 15px rgba(147,51,234,0.25);border:1px solid rgba(255,255,255,0.1)}
    #medicalSpace .message.user .bubble{background:var(--medical-msg-gradient);box-shadow:0 4px 15px rgba(37,99,235,0.25)}
    .message.ai .bubble{background:var(--surface-color);color:var(--text-color);border-bottom-left-radius:4px;border:1px solid var(--border-color);box-shadow:var(--shadow-sm)}
    .timestamp{font-size:0.7rem;color:var(--text-muted);margin-top:5px;padding:0 6px;align-self:flex-end}
    .message.ai .timestamp{align-self:flex-start}
    footer{background-color:var(--surface-glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px 20px;border-top:1px solid var(--border-color);box-shadow:0 -4px 20px rgba(0,0,0,0.2)}
    .footer-inner{max-width:860px;width:100%;margin:0 auto;display:flex;align-items:flex-end;gap:10px}
    textarea{flex:1;background-color:rgba(255,255,255,0.05);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:10px 16px;color:#fff;font-size:0.95rem;outline:none;resize:none;height:44px;max-height:140px;font-family:inherit;line-height:1.4;transition:var(--transition)}
    textarea:focus,input:focus,select:focus{border-color:var(--accent-purple);background-color:rgba(255,255,255,0.08);box-shadow:0 0 12px rgba(168,85,247,0.2)}
    .send-btn-style{background:var(--primary-gradient);color:#fff;border:none;border-radius:var(--radius-md);padding:0 20px;height:44px;font-weight:700;font-size:0.92rem;cursor:pointer;transition:var(--transition);flex-shrink:0;box-shadow:var(--shadow-sm)}
    .send-btn-style:hover:not(:disabled){opacity:0.95;transform:translateY(-1px);box-shadow:var(--shadow-lg)}
    .send-btn-style:disabled{opacity:0.5;cursor:not-allowed}
    #settingsSpace{overflow-y:auto;padding:24px 20px}
    .settings-card{max-width:680px;width:100%;margin:0 auto;background-color:var(--surface-color);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:18px}

    .input-group{display:flex;flex-direction:column;gap:8px}
    .input-label{font-size:0.78rem;font-weight:700;color:var(--text-muted);letter-spacing:0.04em}

    #personaInput{min-height:200px;line-height:1.6;resize:vertical}
    .settings-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:6px}
    .status-text{font-size:0.85rem;color:#c084fc;font-weight:600}

      <div class="input-group">
        <label for="loginEmail" class="input-label">メールアドレス</label>
        <input type="email" id="loginEmail" class="input-field" placeholder="example@example.com" autocomplete="email" required />
      </div>
      <div class="input-group">
        <label for="loginPassword" class="input-label">パスワード</label>
        <input type="password" id="loginPassword" class="input-field" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <div id="loginError" class="login-error"></div>
      <div class="login-actions">
        <button type="submit" id="signInBtn" class="send-btn-style">ログイン</button>
        <button type="button" id="signUpBtn" class="secondary-btn-style">新規登録</button>
      </div>
    </form>
  </div>
  <header>
    <div class="header-left">
      <div class="header-title">AI CHAT</div>
      <div class="tabs">
        <button id="tabChat" class="tab-btn active">💬 おしゃべり</button>
        <button id="tabMedical" class="tab-btn">🩺 医療事務の質問</button>
        <button id="tabSettings" class="tab-btn">⚙️ 固定設定</button>
      </div>
    </div>
    <div class="header-right">
      <button id="clearChatBtn" class="btn-clear">会話クリア</button>
      <button id="logoutBtn" class="btn-logout">ログアウト</button>
    </div>
  </header>
  <main id="chatSpace" class="space chat-space active">
    <div id="chat-box" class="chat-box"></div>
    <footer>
      <div class="footer-inner">
        <textarea id="chat-input" placeholder="メッセージを入力（Ctrl+Enter または送信）..." rows="1"></textarea>
        <button id="chat-send-btn" class="send-btn-style">送信</button>
      </div>
    </footer>
  </main>
  <main id="medicalSpace" class="space chat-space">
    <div class="scope-banner">
      <div class="scope-banner-box">
        <strong>参照・引用元制限：</strong>
        <code>https://shirobon.net/</code>（しろぼんネット）および
        <code>https://mavisone.jp/worth.html</code> のみを情報源として回答・引用します。
      </div>
    </div>
    <div id="medical-box" class="chat-box"></div>
    <footer>
      <div class="footer-inner">
        <textarea id="medical-input" placeholder="診療報酬・算定・医療機器・材料などの質問を入力..." rows="1"></textarea>
        <button id="medical-send-btn" class="send-btn-style">質問する</button>
      </div>
    </footer>
  </main>
  <section id="settingsSpace" class="space">
    <div class="settings-card">
      <div class="settings-heading">固定設定（会話クリアを押しても消えません）</div>
      <div class="input-group" id="userNameGroup" style="display: none;">
        <label for="userNameInput" class="input-label">チャットユーザー名</label>
        <input type="text" id="userNameInput" class="input-field" value="" placeholder="" />
      </div>
      <div class="input-group">
        <label for="apiKeyInput" class="input-label">GEMINI API キー（このブラウザにのみ保存）</label>
        <input type="password" id="apiKeyInput" class="input-field" placeholder="AIza..." autocomplete="off" />
      </div>
      <div class="input-group">
        <label for="modelSelect" class="input-label">モデル</label>
        <select id="modelSelect" class="select-field">
          <option value="gemini-3.8-flash">gemini-3.8-flash</option>
          <option value="gemini-3.6-flash">gemini-3.6-flash</option>
          <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
        </select>
      </div>
      <div class="input-group">
        <label for="personaInput" class="input-label">おしゃべり用の呼び名・口調・ルール（毎回AIに送信されます）</label>
        <textarea id="personaInput" class="input-field"></textarea>
      </div>
      <div class="settings-actions">
        <span id="saveStatus" class="status-text"></span>
        <button id="saveSettingsBtn" class="send-btn-style">設定を保存する</button>
      </div>
    </div>
  </section>
