<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Chat</title>
  <!-- Tailwind CSS (カレンダー用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0b0f19;
      --surface-color: #131b2e;
      --surface-glass: rgba(19, 27, 46, 0.75);
      --primary-gradient: linear-gradient(135deg, #8B5CF6, #6366F1, #06B6D4);
      --primary-color: #6366F1;
      --primary-hover: #4f46e5;
      --danger-color: #f43f5e;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --chat-bg: #0b0f19;
      --my-msg-gradient: linear-gradient(135deg, #8B5CF6, #6366F1, #06B6D4);
      --other-msg-bg: #1e293b;
      --border-radius-btn: 14px;
      --padding-btn: 12px 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* あいことばロック画面 */
    #lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      gap: 20px;
      padding: 20px;
      backdrop-filter: blur(20px);
    }
    #lock-screen h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }
    
    #user-select {
      background-color: #292930;
      border: 1px solid transparent;
      border-radius: 1rem;
      padding: 16px 20px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      width: 260px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    #user-select:focus {
      border-color: #6366F1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    #user-select option {
      background-color: #292930;
      color: #fff;
      padding: 12px;
    }

    #pass-input {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-btn);
      padding: var(--padding-btn);
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      width: 260px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #pass-input:focus {
      border-color: #6366F1;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }
    .remember-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .remember-container input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6366F1;
      cursor: pointer;
    }
    #pass-btn {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      border-radius: var(--border-radius-btn);
      padding: var(--padding-btn);
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: transform 0.15s, opacity 0.15s;
      width: 260px;
    }
    #pass-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    #pass-btn:active {
      transform: scale(0.98);
    }
    #pass-error {
      color: var(--danger-color);
      font-size: 0.85rem;
      display: none;
    }
    .admin-link-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.2s;
      margin-top: 4px;
    }
    .admin-link-text:hover {
      color: var(--text-color);
    }

    /* 管理画面 */
    #admin-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-color);
      display: none;
      flex-direction: column;
      z-index: 10000;
      padding: 20px;
      overflow-y: auto;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }
    .admin-title {
      font-size: 1.2rem;
      font-weight: 700;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .admin-card {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .user-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    /* トグルスイッチ用スタイル */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: #fff;
      transition: .3s;
      border-radius: 50%;
    }
    .toggle-switch input:checked + .slider {
      background-color: var(--danger-color);
      border-color: var(--danger-color);
    }
    .toggle-switch input:checked + .slider:before {
      transform: translateX(16px);
    }

    /* アプリ本体 */
    #app-content {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .chat-main-area {
      display: flex;
      flex: 1;
      height: calc(100% - 69px);
      overflow: hidden;
    }

    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* ヘッダー */
    header {
      background-color: var(--surface-glass);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-title-container {
      display: flex;
      flex-direction: column;
    }
    .header-title {
      font-size: 1.2rem;
      font-weight: 700;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-badge {
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      font-weight: 500;
    }
    .header-right-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: var(--padding-btn);
      border-radius: var(--border-radius-btn);
      cursor: pointer;
      font-size: 0.8rem;
      transition: background-color 0.2s, color 0.2s;
    }
    .btn-logout:hover {
      background-color: rgba(255,255,255,0.05);
      color: var(--text-color);
    }

    /* チャット表示エリア */
    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.03), transparent 40%);
    }

    /* メッセージバルーン */
    .message {
      max-width: 75%;
      display: flex;
      flex-direction: column;
    }
    .message.sent {
      align-self: flex-end;
    }
    .message.received {
      align-self: flex-start;
    }
    .sender-name {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      padding: 0 4px;
      font-weight: 500;
    }
    .message.sent .sender-name {
      text-align: right;
    }
    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .message.sent .bubble {
      background: var(--my-msg-gradient);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .message.received .bubble {
      background: var(--my-msg-gradient);
      color: #ffffff;
      border-bottom-left-radius: 4px;
    }
    .bubble.stamp-bubble {
      background: transparent !important;
      padding: 6px;
      box-shadow: none !important;
      border: none !important;
    }

    .meta-info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
      padding: 0 4px;
    }
    .message.sent .meta-info {
      justify-content: flex-end;
    }
    .timestamp {
      font-size: 0.65rem;
      color: var(--text-muted);
    }
    .delete-btn, .edit-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      cursor: pointer;
      padding: 0;
      opacity: 0.8;
      transition: opacity 0.2s, color 0.2s;
    }
    .delete-btn:hover, .edit-btn:hover {
      opacity: 1;
      color: var(--text-color);
    }

    .chat-image {
      max-width: 100%;
      max-height: 250px;
      border-radius: 12px;
      margin-bottom: 6px;
      display: block;
      object-fit: contain;
    }
    .chat-stamp {
      max-width: 170px;
      max-height: 170px;
      display: block;
      user-select: none;
      pointer-events: none;
      object-fit: contain;
    }
    .chat-link {
      color: #ffffff;
      text-decoration: underline;
      word-break: break-all;
    }

    /* 入力エリア */
    footer {
      background-color: var(--surface-glass);
      backdrop-filter: blur(12px);
      padding: 14px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    textarea {
      flex: 1;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 10px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      height: 44px;
      max-height: 120px;
      font-family: inherit;
      line-height: 1.4;
    }
    textarea:focus {
      border-color: #6366F1;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.25);
    }
    button.send-btn-style {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      border-radius: var(--border-radius-btn);
      padding: var(--padding-btn);
      height: 44px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }
    button.icon-btn-style, label.icon-btn-style {
      background-color: var(--surface-color);
      color: #818cf8;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-btn);
      width: 44px;
      height: 44px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(5, 7, 12, 0.8);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-container {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      background-color: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.3rem;
      cursor: pointer;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .palette-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .palette-btn {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      height: 40px;
      padding: 0 12px;
      font-size: 1.1rem;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .modal-textarea {
      width: 100%;
      height: 120px;
      background-color: rgba(0, 0, 0, 0.2);
      color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
    }
    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .secondary-btn {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-btn);
      padding: var(--padding-btn);
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* スタンプ・履歴関連スタイル */
    .stamp-nav-btn, .tool-btn {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .tool-btn.active {
      background: #4f46e5;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    .tool-select {
      background-color: var(--surface-color);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    .editor-layout { display: flex; gap: 16px; justify-content: center; align-items: flex-start; }
    .canvas-wrapper { position: relative; width: 250px; height: 250px; border: 2px dashed rgba(255,255,255,0.15); border-radius: 16px; background-color: #0b0f19; }
    .stamp-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 14px; touch-action: none; }
    .ps-layers-panel { display: flex; flex-direction: column; gap: 10px; width: 110px; background-color: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; }
    .ps-layer-item { display: flex; flex-direction: column; align-items: center; padding: 8px; border: 2px solid transparent; border-radius: 8px; cursor: pointer; }
    .ps-layer-item.active { border-color: #6366F1; background-color: rgba(99, 102, 241, 0.15); }
    .ps-layer-preview { width: 60px; height: 60px; border: 1px solid var(--border-color); border-radius: 6px; object-fit: contain; pointer-events: none; }
    .stamp-tools { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; margin-top: 12px; }
    .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; max-height: 350px; overflow-y: auto; }
    .history-card { border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; background-color: rgba(255,255,255,0.02); display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .history-img-wrapper { width: 100%; height: 90px; display: flex; align-items: center; justify-content: center; background-color: #0b0f19; border-radius: 8px; }
    .history-img { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* カレンダーモーダル拡張用スタイル */
    .calendar-cell {
      background-color: rgba(19, 27, 46, 0.4);
      border: 1px solid var(--border-color);
      transition: all 0.15s ease;
      position: relative;
      overflow-y: auto;
    }
    .calendar-cell:hover {
      background-color: rgba(30, 41, 59, 0.6);
      border-color: rgba(139, 92, 246, 0.3);
    }
    .calendar-cell.other-month {
      opacity: 0.35;
      background-color: rgba(11, 15, 25, 0.6);
    }
    .calendar-cell.today {
      background-color: rgba(99, 102, 241, 0.08);
      border: 1.5px solid rgba(99, 102, 241, 0.6);
    }
    .calendar-cell.today .day-number {
      background: var(--primary-gradient);
      color: #fff;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
    }
    .event-pill {
      font-size: 0.72rem;
      padding: 3px 6px;
      border-radius: 6px;
      margin-bottom: 2px;
      cursor: pointer;
      white-space: pre-wrap;
      word-break: break-all;
      transition: transform 0.15s, opacity 0.15s;
      line-height: 1.2;
    }
    .event-pill:hover { opacity: 0.9; }
    .event-card-full {
      font-size: 0.85rem;
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      white-space: pre-wrap;
      word-break: break-all;
      transition: transform 0.15s, opacity 0.15s;
    }
    .event-card-full:hover { opacity: 0.9; }
    .color-blue { background: rgba(59, 130, 246, 0.25); color: #93c5fd; border-left: 3px solid #3b82f6; }
    .color-yellow { background: rgba(234, 179, 8, 0.25); color: #fde047; border-left: 3px solid #eab308; }
    .color-red { background: rgba(244, 63, 94, 0.25); color: #fecdd3; border-left: 3px solid #f43f5e; }
    .color-filter-btn { transition: all 0.2s; opacity: 0.4; border: 1px solid transparent; border-radius: 14px; }
    .color-filter-btn.active { opacity: 1; border-color: rgba(255, 255, 255, 0.4); box-shadow: 0 0 10px rgba(255, 255, 255, 0.15); transform: translateY(-1px); }
    .color-select-btn { transition: all 0.2s; opacity: 0.5; border: 2px solid transparent; }
    .color-select-btn.selected { opacity: 1; border-color: #ffffff; box-shadow: 0 0 12px rgba(255, 255, 255, 0.3); transform: scale(1.05); }
    .view-btn { padding: 6px 14px; font-size: 0.85rem; border-radius: 10px; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
    .view-btn.active { background: rgba(99, 102, 241, 0.2); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); font-weight: 600; }
    .input-field-cal { background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 14px; color: #fff; font-size: 0.95rem; outline: none; transition: all 0.2s; width: 100%; }
    .input-field-cal:focus { border-color: #6366F1; box-shadow: 0 0 12px rgba(99, 102, 241, 0.3); }

/* 追加: input[type="date"]のどこをクリックしてもカレンダーが開きやすくする調整 */
  .input-field-cal::-webkit-calendar-picker-indicator {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }
  .input-field-cal {
    position: relative;
  }
  </style>
</head>
<body>

  <div class="app-container" id="app-container">
    <!-- あいことばロック画面 -->
    <div id="lock-screen">
      <!-- グラデーションを適用したふき出しアイコン -->
      <div style="width: 80px; height: 80px; border-radius: 24px; background: var(--primary-gradient); padding: 2px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(139,92,246,0.3); margin-bottom: 5px;">

      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            resolve(canvas.toDataURL('image/png'));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function getCanvasCoords(e, canvasEl) {
      const rect = canvasEl.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: Math.floor((clientX - rect.left) * (canvasEl.width / rect.width)),
        y: Math.floor((clientY - rect.top) * (canvasEl.height / rect.height))
      };
    }

    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function floodFill(canvas, startX, startY, fillColorHex, opacity) {
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const width = canvas.width;
      const height = canvas.height;

      const targetPos = (startY * width + startX) * 4;
      const targetR = data[targetPos];
      const targetG = data[targetPos + 1];
      const targetB = data[targetPos + 2];
      const targetA = data[targetPos + 3];

      const fillRgb = hexToRgb(fillColorHex);
      const fillA = Math.round(opacity * 255);

      if (targetR === fillRgb.r && targetG === fillRgb.g && targetB === fillRgb.b && targetA === fillA) return;

      const queue = [[startX, startY]];
      const visited = new Uint8Array(width * height);

      while (queue.length > 0) {
        const [x, y] = queue.pop();
        const pos = (y * width + x) * 4;
        const idx = y * width + x;

        if (x < 0 || x >= width || y < 0 || y >= height) continue;
        if (visited[idx]) continue;
        visited[idx] = 1;

        if (Math.abs(data[pos] - targetR) < 30 &&
            Math.abs(data[pos + 1] - targetG) < 30 &&
            Math.abs(data[pos + 2] - targetB) < 30 &&
            Math.abs(data[pos + 3] - targetA) < 30) {
          data[pos] = fillRgb.r;
          data[pos + 1] = fillRgb.g;
          data[pos + 2] = fillRgb.b;
          data[pos + 3] = fillA;

          queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function drawStroke(ctx, p1, p2) {
      const color = stampColorInput.value;
      const baseSize = parseFloat(stampSizeInput.value);
      const opacity = parseFloat(stampOpacityInput.value);
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);

      if (currentTool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.globalAlpha = opacity;
        ctx.strokeStyle = color;
        ctx.lineWidth = baseSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
        return;
      }

      ctx.globalCompositeOperation = 'source-over';

      switch (currentBrushType) {
        case 'calligraphy-brush':
          ctx.globalAlpha = opacity;
          ctx.strokeStyle = color;
          ctx.lineCap = 'round';
          ctx.lineWidth = Math.max(1, baseSize * (1 - Math.min(dist / 20, 0.7)));
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
          break;
        case 'calligraphy-pen':
          ctx.globalAlpha = opacity;
          ctx.fillStyle = color;
          const stepsCallig = Math.max(1, Math.floor(dist));
          for (let i = 0; i <= stepsCallig; i++) {
            const curX = p1.x + (p2.x - p1.x) * (i / stepsCallig);
            const curY = p1.y + (p2.y - p1.y) * (i / stepsCallig);
            ctx.beginPath();
            ctx.ellipse(curX, curY, baseSize, Math.max(1, baseSize / 4), Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        case 'airbrush':
          ctx.globalAlpha = opacity * 0.15;
          ctx.fillStyle = color;
          const airSteps = Math.max(1, Math.floor(dist / 2));
          for (let i = 0; i <= airSteps; i++) {
            const curX = p1.x + (p2.x - p1.x) * (i / airSteps);
            const curY = p1.y + (p2.y - p1.y) * (i / airSteps);
            const numParticles = Math.floor(baseSize * 2);
            for (let p = 0; p < numParticles; p++) {
              const r = Math.random() * baseSize * 1.2;
              const a = Math.random() * Math.PI * 2;
              ctx.fillRect(curX + r * Math.cos(a), curY + r * Math.sin(a), 1, 1);
            }
          }
          break;
        case 'oil':
          ctx.globalAlpha = opacity * 0.7;
          ctx.strokeStyle = color;
          ctx.lineCap = 'butt';
          ctx.lineWidth = baseSize;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
          break;
        case 'crayon':
          ctx.globalAlpha = opacity * 0.6;
          ctx.fillStyle = color;
          const craySteps = Math.max(1, Math.floor(dist));
          for (let i = 0; i <= craySteps; i++) {
            const curX = p1.x + (p2.x - p1.x) * (i / craySteps);
            const curY = p1.y + (p2.y - p1.y) * (i / craySteps);
            for (let j = 0; j < baseSize * 1.5; j++) {
              const rx = (Math.random() - 0.5) * baseSize;
              const ry = (Math.random() - 0.5) * baseSize;
              if (Math.hypot(rx, ry) <= baseSize / 2) {
                ctx.fillRect(curX + rx, curY + ry, 1.5, 1.5);
              }
            }
          }
          break;
        case 'marker':
          ctx.globalAlpha = opacity * 0.4;
          ctx.fillStyle = color;
          const markSteps = Math.max(1, Math.floor(dist));
          for (let i = 0; i <= markSteps; i++) {
            const curX = p1.x + (p2.x - p1.x) * (i / markSteps);
            const curY = p1.y + (p2.y - p1.y) * (i / markSteps);
            ctx.beginPath();
            ctx.arc(curX, curY, baseSize, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        case 'pencil':
          ctx.globalAlpha = opacity * 0.8;
          ctx.fillStyle = color;
          const pSteps = Math.max(1, Math.floor(dist));
          for (let i = 0; i <= pSteps; i++) {
            const curX = p1.x + (p2.x - p1.x) * (i / pSteps);
            const curY = p1.y + (p2.y - p1.y) * (i / pSteps);
            for (let j = 0; j < baseSize; j++) {
              const rx = (Math.random() - 0.5) * (baseSize / 2);
              const ry = (Math.random() - 0.5) * (baseSize / 2);
              ctx.fillRect(curX + rx, curY + ry, 1, 1);
            }
          }
          break;
        case 'watercolor':
          ctx.globalAlpha = opacity * 0.12;
          ctx.fillStyle = color;
          const wcSteps = Math.max(1, Math.floor(dist / 2));
          for (let i = 0; i <= wcSteps; i++) {
            const curX = p1.x + (p2.x - p1.x) * (i / wcSteps);
            const curY = p1.y + (p2.y - p1.y) * (i / wcSteps);
            ctx.beginPath();
            ctx.arc(curX, curY, baseSize * 1.3, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        case 'pen':
        default:
          ctx.globalAlpha = opacity;
          ctx.strokeStyle = color;
          ctx.lineWidth = baseSize;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
          break;
      }
    }

    [canvasA, canvasB].forEach(targetCanvas => {
      let isTargetDrawing = false;
      function startDraw(e) {
        const activeObj = getActiveLayer();
        if (targetCanvas !== activeObj.canvas) return;
        const pos = getCanvasCoords(e, targetCanvas);

        if (currentTool === 'fill') {
          floodFill(targetCanvas, pos.x, pos.y, stampColorInput.value, parseFloat(stampOpacityInput.value));
          updateLayerPreviews();
          return;
        }

        isTargetDrawing = true;
        lastPoint = pos;
        drawStroke(activeObj.ctx, pos, pos);
      }
      function moveDraw(e) {
        if (!isTargetDrawing) return;
        const activeObj = getActiveLayer();
        if (targetCanvas !== activeObj.canvas) return;
        e.preventDefault();
        const pos = getCanvasCoords(e, targetCanvas);
        drawStroke(activeObj.ctx, lastPoint, pos);
        lastPoint = pos;
      }
      function endDraw() {
        if (isTargetDrawing) {
          isTargetDrawing = false;
          lastPoint = null;
          updateLayerPreviews();
        }
      }
      targetCanvas.addEventListener('mousedown', startDraw);
      targetCanvas.addEventListener('mousemove', moveDraw);
      targetCanvas.addEventListener('mouseup', endDraw);
      targetCanvas.addEventListener('mouseleave', endDraw);
      targetCanvas.addEventListener('touchstart', startDraw, { passive: false });
      targetCanvas.addEventListener('touchmove', moveDraw, { passive: false });
      targetCanvas.addEventListener('touchend', endDraw);
    });

      push(messagesRef, { sender: senderName, text: '', fileData: stampDataUrl, fileName: `stamp_${Date.now()}.png`, isStamp: true, timestamp: Date.now() });
      push(stampHistoryRef, { dataUrl: stampDataUrl, creator: senderName, timestamp: Date.now() });
      
      ctxA.clearRect(0, 0, canvasA.width, canvasA.height);
      ctxB.clearRect(0, 0, canvasB.width, canvasB.height);
      updateLayerPreviews();
      stampModalOverlay.classList.remove('active');
    });

    stampUploadInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const dataUrl = await normalizeImageFile(file);
      push(stampHistoryRef, { dataUrl: dataUrl, creator: userSelect.value, timestamp: Date.now() });
      stampUploadInput.value = '';
    });

    onValue(stampHistoryRef, (snapshot) => {
      cachedStampHistory = snapshot.val() || {};
      if (historyModalOverlay.classList.contains('active')) renderStampHistory();
    });

    function renderStampHistory() {
      historyGrid.innerHTML = '';
      const keys = Object.keys(cachedStampHistory);
      if (keys.length === 0) {
        historyGrid.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem; grid-column:1/-1; text-align:center;">履歴はありません</div>';
        return;
      }
      keys.reverse().forEach(key => {
        const item = cachedStampHistory[key];
        const card = document.createElement('div');
        card.className = 'history-card';
        card.innerHTML = `
          <div class="history-img-wrapper"><img src="${item.dataUrl}" class="history-img"></div>
          <div style="display:flex; gap:6px; width:100%;">
            <button class="stamp-nav-btn send-hist" data-key="${key}" style="flex:1; padding:6px; font-size:0.75rem;">送信</button>
            <button class="stamp-nav-btn del-hist" data-key="${key}" style="flex:1; padding:6px; font-size:0.75rem; background:rgba(244,63,94,0.2); color:#fda4af;">削除</button>
          </div>
        `;
        card.querySelector('.send-hist').addEventListener('click', () => {
          push(messagesRef, { sender: userSelect.value, text: '', fileData: item.dataUrl, fileName: `stamp_${Date.now()}.png`, isStamp: true, timestamp: Date.now() });
          historyModalOverlay.classList.remove('active');
        });
        card.querySelector('.del-hist').addEventListener('click', () => {
          if (confirm('削除しますか？')) remove(ref(db, `stamp_history/${key}`));
        });
        historyGrid.appendChild(card);
      });
    }

    goToHistoryBtn.addEventListener('click', () => { stampModalOverlay.classList.remove('active'); renderStampHistory(); historyModalOverlay.classList.add('active'); });
    backToStampDrawBtn.addEventListener('click', () => { historyModalOverlay.classList.remove('active'); stampModalOverlay.classList.add('active'); });
    historyModalCloseX.addEventListener('click', () => historyModalOverlay.classList.remove('active'));

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      push(messagesRef, { sender: userSelect.value, text: text, timestamp: Date.now() });
      messageInput.value = '';
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const isImage = file.type.startsWith('image/');
      const fileData = isImage ? await normalizeImageFile(file) : await new Promise(r => {
        const fr = new FileReader(); fr.onload = (evt) => r(evt.target.result); fr.readAsDataURL(file);
      });
      push(messagesRef, { sender: userSelect.value, text: '', fileData: fileData, fileName: file.name, isImage: isImage, timestamp: Date.now() });
      fileInput.value = '';
    });

    function deleteMessage(key) { if (confirm('削除しますか？')) remove(ref(db, `messages/${key}`)); }
    function editMessage(key, currentText) {
      editingMessageKey = key;
      modalTextInput.value = currentText || '';
      commentModalOverlay.classList.add('active');
    }

    function renderFormattedText(container, text) {
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      let lastIndex = 0, match;
      while ((match = urlRegex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          container.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
        }
        const link = document.createElement('a');
        link.href = match[0];
        link.textContent = match[0];
        link.className = 'chat-link';
        link.target = '_blank';
        container.appendChild(link);
        lastIndex = urlRegex.lastIndex;
      }
      if (lastIndex < text.length) {
        container.appendChild(document.createTextNode(text.substring(lastIndex)));
      }
    }

    function scrollToBottom() {
      requestAnimationFrame(() => { chatBox.scrollTop = chatBox.scrollHeight; });
    }

    function renderMessages() {
      chatBox.innerHTML = '';
      const activeUser = userSelect.value;
      Object.keys(cachedMessages).forEach(key => {
        const msg = cachedMessages[key];
        const isSent = msg.sender === activeUser;
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;
        
        const senderName = document.createElement('div');
        senderName.className = 'sender-name';
        senderName.textContent = msg.sender;

        const bubble = document.createElement('div');
        bubble.className = `bubble ${msg.isStamp ? 'stamp-bubble' : ''}`;

        if (msg.fileData) {
          const img = document.createElement('img');
          img.src = msg.fileData;
          img.className = msg.isStamp ? 'chat-stamp' : 'chat-image';
          bubble.appendChild(img);
        }
        if (msg.text) {
          const tn = document.createElement('div');
          renderFormattedText(tn, msg.text);
          bubble.appendChild(tn);
        }

        const metaInfo = document.createElement('div');
        metaInfo.className = 'meta-info';
        const timestamp = document.createElement('span');
        timestamp.className = 'timestamp';
        const d = new Date(msg.timestamp);
        timestamp.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        metaInfo.appendChild(timestamp);

        if (msg.text) {
          const editBtn = document.createElement('button');
          editBtn.className = 'edit-btn'; editBtn.textContent = '編集';
          editBtn.addEventListener('click', () => editMessage(key, msg.text));
          metaInfo.appendChild(editBtn);
        }

        if (msg.fileData) {
          const dlBtn = document.createElement('button');
          dlBtn.className = 'delete-btn'; dlBtn.textContent = 'ダウンロード';
          dlBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = msg.fileData;
            a.download = msg.fileName || 'download';
            a.click();
          });
          metaInfo.appendChild(dlBtn);
        }

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn'; delBtn.textContent = '削除';
        delBtn.addEventListener('click', () => deleteMessage(key));
        metaInfo.appendChild(delBtn);

        msgDiv.appendChild(senderName);
        msgDiv.appendChild(bubble);
        msgDiv.appendChild(metaInfo);
        chatBox.appendChild(msgDiv);
      });
      scrollToBottom();
    }

    onValue(messagesRef, (snapshot) => {
      cachedMessages = snapshot.val() || {};
      renderMessages();
    });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (!e.isComposing && e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // --- カレンダー機能のロジック（Firebase同期対応） ---
    let calCurrentDate = new Date();
    let calSelectedView = 'month';
    let calendarEvents = [];
    let calActiveColors = ['color-blue', 'color-yellow', 'color-red'];

    const calendarModalOverlay = document.getElementById('calendar-modal-overlay');
    const calendarModalOpenBtn = document.getElementById('calendar-modal-open-btn');
    const calendarModalCloseBtn = document.getElementById('calendar-modal-close-btn');

    const calCalendarGrid = document.getElementById('cal-calendarGrid');
    const calCurrentDateDisplay = document.getElementById('cal-currentDateDisplay');
    const calPrevBtn = document.getElementById('cal-prevBtn');
    const calNextBtn = document.getElementById('cal-nextBtn');
    const calTodayBtn = document.getElementById('cal-todayBtn');
    const calAddEventBtn = document.getElementById('cal-addEventBtn');
    const calUpcomingEventsList = document.getElementById('cal-upcomingEventsList');
    const calClearFilterBtn = document.getElementById('cal-clearFilterBtn');

    const calEventModal = document.getElementById('cal-eventModal');
    const calModalTitle = document.getElementById('cal-modalTitle');
    const calCloseModalBtn = document.getElementById('cal-closeModalBtn');
    const calCancelModalBtn = document.getElementById('cal-cancelModalBtn');
    const calEventForm = document.getElementById('cal-eventForm');
    const calDeleteEventBtn = document.getElementById('cal-deleteEventBtn');

    const calEventIdInput = document.getElementById('cal-eventId');
    const calEventDateInput = document.getElementById('cal-eventDate');
    const calEventColorInput = document.getElementById('cal-eventColor');
    const calEventDescriptionInput = document.getElementById('cal-eventDescription');

    calendarModalOpenBtn.addEventListener('click', () => {
      // 修正：カレンダーモーダルを開いたとき、常に「今日の日付（現在の日にち）」を基準として表示する
      calCurrentDate = new Date();
      calendarModalOverlay.classList.add('active');
      renderCalendarApp();
    });
    calendarModalCloseBtn.addEventListener('click', () => calendarModalOverlay.classList.remove('active'));
    calendarModalOverlay.addEventListener('click', (e) => {
      if (e.target === calendarModalOverlay) calendarModalOverlay.classList.remove('active');
    });

    // Firebaseからのカレンダー予定のリアルタイム同期
    onValue(calendarEventsRef, (snapshot) => {
      const data = snapshot.val() || {};
      calendarEvents = Object.keys(data).map(k => ({ id: k, ...data[k] }));
      if (calendarModalOverlay.classList.contains('active')) {
        renderCalendarApp();
      }
    });

    function isJapaneseHoliday(dateObj) {
      const y = dateObj.getFullYear();
      const m = dateObj.getMonth() + 1;
      const d = dateObj.getDate();
      const pad = (n) => String(n).padStart(2, '0');
      const dateStr = `${y}-${pad(m)}-${pad(d)}`;

      function getHolidays(year) {
        let holidays = {};
        holidays[`${year}-01-01`] = "元日";
        holidays[`${year}-02-11`] = "建国記念の日";
        holidays[`${year}-02-23`] = "天皇誕生日";
        holidays[`${year}-04-29`] = "昭和の日";
        holidays[`${year}-05-03`] = "憲法記念日";
        holidays[`${year}-05-04`] = "みどりの日";
        holidays[`${year}-05-05`] = "こどもの日";
        holidays[`${year}-08-11`] = "山の日";
        holidays[`${year}-11-03`] = "文化の日";
        holidays[`${year}-11-23`] = "勤労感謝の日";

        let vernalDay = Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
        let autumnDay = Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
        holidays[`${year}-03-${pad(vernalDay)}`] = "春分の日";
        holidays[`${year}-09-${pad(autumnDay)}`] = "秋分の日";

        let jan1 = new Date(year, 0, 1).getDay();
        let adultDay = 1 + (1 - jan1 + 7) % 7 + 7;
        holidays[`${year}-01-${pad(adultDay)}`] = "成人の日";

        let jul1 = new Date(year, 6, 1).getDay();
        let marineDay = 1 + (1 - jul1 + 7) % 7 + 14;
        holidays[`${year}-07-${pad(marineDay)}`] = "海の日";

        let sep1 = new Date(year, 8, 1).getDay();
        let respectDay = 1 + (1 - sep1 + 7) % 7 + 14;
        holidays[`${year}-09-${pad(respectDay)}`] = "敬老の日";

        let oct1 = new Date(year, 9, 1).getDay();
        let sportsDay = 1 + (1 - oct1 + 7) % 7 + 7;
        holidays[`${year}-10-${pad(sportsDay)}`] = "スポーツの日";

        let baseDates = Object.keys(holidays).sort();
        let addedSubstitutes = {};
        baseDates.forEach(dateStr => {
          let dt = new Date(dateStr);
          if (dt.getDay() === 0) {
            let subDt = new Date(dt);
            subDt.setDate(subDt.getDate() + 1);
            while (holidays[`${subDt.getFullYear()}-${pad(subDt.getMonth()+1)}-${pad(subDt.getDate())}`]) {
              subDt.setDate(subDt.getDate() + 1);
            }
            let subStr = `${subDt.getFullYear()}-${pad(subDt.getMonth()+1)}-${pad(subDt.getDate())}`;
            addedSubstitutes[subStr] = "振替休日";
          }
        });
        Object.assign(holidays, addedSubstitutes);
        return holidays;
      }

      const currentYearHolidays = getHolidays(y);
      return !!currentYearHolidays[dateStr];
    }

    // カレンダー操作用イベントリスナー
    calPrevBtn.addEventListener('click', () => {
      if (calSelectedView === 'month') calCurrentDate.setMonth(calCurrentDate.getMonth() - 1);
      else if (calSelectedView === 'week') calCurrentDate.setDate(calCurrentDate.getDate() - 7);
      else calCurrentDate.setDate(calCurrentDate.getDate() - 1);
      renderCalendarApp();
    });

    calNextBtn.addEventListener('click', () => {
      if (calSelectedView === 'month') calCurrentDate.setMonth(calCurrentDate.getMonth() + 1);
      else if (calSelectedView === 'week') calCurrentDate.setDate(calCurrentDate.getDate() + 7);
      else calCurrentDate.setDate(calCurrentDate.getDate() + 1);
      renderCalendarApp();
    });

    calTodayBtn.addEventListener('click', () => {
      calCurrentDate = new Date();
      renderCalendarApp();
    });

    calendarModalOverlay.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        calendarModalOverlay.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        calSelectedView = e.target.dataset.view;
        renderCalendarApp();
      });
    });

    document.querySelectorAll('#cal-colorFiltersContainer .color-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const color = btn.dataset.color;
        if (calActiveColors.includes(color)) {
          if (calActiveColors.length > 1) {
            calActiveColors = calActiveColors.filter(c => c !== color);
            btn.classList.remove('active');
          } else {
            calActiveColors = ['color-blue', 'color-yellow', 'color-red'];
            document.querySelectorAll('#cal-colorFiltersContainer .color-filter-btn').forEach(b => b.classList.add('active'));
          }
        } else {
          calActiveColors.push(color);
          btn.classList.add('active');
        }
        renderCalendarApp();
      });
    });

    calClearFilterBtn.addEventListener('click', () => {
      calActiveColors = ['color-blue', 'color-yellow', 'color-red'];
      document.querySelectorAll('#cal-colorFiltersContainer .color-filter-btn').forEach(b => b.classList.add('active'));
      renderCalendarApp();
    });

    document.querySelectorAll('#cal-colorSelectContainer .color-select-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#cal-colorSelectContainer .color-select-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        calEventColorInput.value = btn.dataset.color;
      });
    });

    calAddEventBtn.addEventListener('click', () => openCalModal());
    calCloseModalBtn.addEventListener('click', closeCalModal);
    calCancelModalBtn.addEventListener('click', closeCalModal);
    calEventModal.addEventListener('click', (e) => {
      if (e.target === calEventModal) closeCalModal();
    });

    calEventForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = calEventIdInput.value;
      const newEvent = {
        date: calEventDateInput.value,
        color: calEventColorInput.value,
        description: calEventDescriptionInput.value.trim()
      };

      if (id) {
        await update(ref(db, `calendar_events/${id}`), newEvent);
      } else {
        await push(calendarEventsRef, newEvent);
      }
      closeCalModal();
      renderCalendarApp();
    });

    calDeleteEventBtn.addEventListener('click', async () => {
      const id = calEventIdInput.value;
      if (!id) return;
      if (confirm('この予定が削除されます。よろしいですか？')) {
        await remove(ref(db, `calendar_events/${id}`));
        closeCalModal();
        renderCalendarApp();
      }
    });

    function renderCalendarApp() {
      renderCalHeaderDate();
      renderCalCalendarGrid();
      renderCalUpcomingEvents();
    }

    function renderCalHeaderDate() {
      const year = calCurrentDate.getFullYear();
      const month = calCurrentDate.getMonth() + 1;
      const day = calCurrentDate.getDate();

      if (calSelectedView === 'month') {
        calCurrentDateDisplay.textContent = `${year}年 ${month}月`;
      } else if (calSelectedView === 'week') {
        const startOfWeek = new Date(calCurrentDate);
        startOfWeek.setDate(calCurrentDate.getDate() - calCurrentDate.getDay());
        const endOfWeek = new Date(startOfWeek);
        endOfWeek.setDate(startOfWeek.getDate() + 6);
        calCurrentDateDisplay.textContent = `${startOfWeek.getFullYear()}年 ${startOfWeek.getMonth() + 1}月${startOfWeek.getDate()}日 ～ ${endOfWeek.getMonth() + 1}月${endOfWeek.getDate()}日`;
      } else {
        calCurrentDateDisplay.textContent = `${year}年 ${month}月 ${day}日`;
      }
    }

    function renderCalCalendarGrid() {
      calCalendarGrid.innerHTML = '';
      if (calSelectedView === 'month') {
        renderCalMonthView();
      } else if (calSelectedView === 'week') {
        renderCalWeekView();
      } else {
        renderCalDayView();
      }
    }

    function renderCalMonthView() {
      calCalendarGrid.className = "grid grid-cols-7 flex-1 overflow-y-auto";
      const year = calCurrentDate.getFullYear();
      const month = calCurrentDate.getMonth();

      // 修正：現在表示している日付（calCurrentDate）が含まれる週の最初の日（日曜日）を起点にして42マス分を生成する
      const currentDateCopy = new Date(calCurrentDate.getFullYear(), calCurrentDate.getMonth(), calCurrentDate.getDate());
      const startDayOfWeek = currentDateCopy.getDay();
      
      // calCurrentDateが含まれる週の日曜日を算出
      const startDate = new Date(currentDateCopy);
      startDate.setDate(currentDateCopy.getDate() - startDayOfWeek);

      const today = new Date();
      const totalCells = 42; // 6週間分 (7日 × 6行 = 42マス)

      for (let i = 0; i < totalCells; i++) {
        const cellDate = new Date(startDate);
        cellDate.setDate(startDate.getDate() + i);

        const isOtherMonth = cellDate.getMonth() !== month;
        const isToday = cellDate.toDateString() === today.toDateString();

        calCalendarGrid.appendChild(createCalDayCell(cellDate, isOtherMonth, isToday));
      }
    }

    function createCalDayCell(dateObj, isOtherMonth = false, isToday = false) {
      const cell = document.createElement('div');
      if (calSelectedView === 'month') {
        cell.className = `calendar-cell p-1.5 flex flex-col gap-1 min-h-[135px] h-[135px] ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}`;
      } else {
        cell.className = `calendar-cell p-3 flex flex-col gap-2 min-h-[150px] h-auto flex-1 ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}`;
      }

      const dateStr = formatDate(dateObj);
      const dayOfWeek = dateObj.getDay();
      const isSundayOrHoliday = (dayOfWeek === 0) || isJapaneseHoliday(dateObj);

      const dayHeader = document.createElement('div');
      dayHeader.className = "flex items-center justify-between px-1 mb-0.5 shrink-0";
      
      const dayNumSpan = document.createElement('span');
      dayNumSpan.className = `day-number text-xs sm:text-sm font-bold ${isSundayOrHoliday ? 'text-rose-400' : 'text-slate-200'}`;
      dayNumSpan.textContent = dateObj.getDate();

      dayHeader.appendChild(dayNumSpan);
      cell.appendChild(dayHeader);

      cell.addEventListener('click', (e) => {
        if (e.target === cell || e.target === dayHeader || e.target === dayNumSpan) {
          openCalModal(null, dateStr);
        }
      });

      const dayEvents = calendarEvents.filter(evt => calActiveColors.includes(evt.color) && evt.date === dateStr);
      dayEvents.forEach(evt => {
        const elem = document.createElement('div');
        elem.className = calSelectedView === 'month' ? `event-pill ${evt.color}` : `event-card-full ${evt.color}`;
        elem.textContent = evt.description;
        elem.addEventListener('click', (e) => {
          e.stopPropagation();
          openCalModal(evt);
        });
        cell.appendChild(elem);
      });

      return cell;
    }

    function renderCalWeekView() {
      calCalendarGrid.className = "grid grid-cols-7 flex-1 overflow-y-auto";
      const startOfWeek = new Date(calCurrentDate);
      startOfWeek.setDate(calCurrentDate.getDate() - calCurrentDate.getDay());
      const today = new Date();

      for (let i = 0; i < 7; i++) {
        const cellDate = new Date(startOfWeek);
        cellDate.setDate(startOfWeek.getDate() + i);
        const isToday = cellDate.toDateString() === today.toDateString();
        calCalendarGrid.appendChild(createCalDayCell(cellDate, false, isToday));
      }
    }

    function renderCalDayView() {
      calCalendarGrid.className = "grid grid-cols-1 flex-1 overflow-y-auto p-2";
      const today = new Date();
      const isToday = calCurrentDate.toDateString() === today.toDateString();
      const cell = createCalDayCell(calCurrentDate, false, isToday);
      cell.classList.add('min-h-[350px]', 'h-auto', 'p-4');
      calCalendarGrid.appendChild(cell);
    }

    function renderCalUpcomingEvents() {
      calUpcomingEventsList.innerHTML = '';
      const sortedEvents = [...calendarEvents]
        .filter(e => calActiveColors.includes(e.color))
        .sort((a, b) => new Date(a.date) - new Date(b.date));

      if (sortedEvents.length === 0) {
        calUpcomingEventsList.innerHTML = '<div class="text-[11px] text-slate-500 text-center py-4">予定はありません</div>';
        return;
      }

      sortedEvents.slice(0, 5).forEach(evt => {
        const card = document.createElement('div');
        card.className = `glass-card p-2 cursor-pointer hover:border-indigo-500/50 transition ${evt.color}`;
        card.innerHTML = `
          <div class="text-[11px] font-bold text-slate-100 mb-0.5 flex items-center gap-1">
            <i class="fa-regular fa-calendar"></i> ${evt.date}
          </div>
          <div class="text-[10px] text-slate-300 truncate whitespace-pre-wrap">${evt.description}</div>
        `;
        card.addEventListener('click', () => openCalModal(evt));
        calUpcomingEventsList.appendChild(card);
      });
    }

    function openCalModal(eventToEdit = null, defaultDateStr = null) {
      if (eventToEdit) {
        calModalTitle.textContent = "予定の編集";
        calEventIdInput.value = eventToEdit.id;
        calEventDateInput.value = eventToEdit.date;
        setCalModalSelectedColor(eventToEdit.color);
        calEventDescriptionInput.value = eventToEdit.description || '';
        calDeleteEventBtn.classList.remove('hidden');
      } else {
        calModalTitle.textContent = "予定の新規追加";
        calEventForm.reset();
        calEventIdInput.value = '';
        calEventDateInput.value = defaultDateStr || formatDate(calCurrentDate);
        setCalModalSelectedColor('color-blue');
        calDeleteEventBtn.classList.add('hidden');
      }
      calEventModal.classList.add('active');
    }

    function setCalModalSelectedColor(colorClass) {
      calEventColorInput.value = colorClass;
      document.querySelectorAll('#cal-colorSelectContainer .color-select-btn').forEach(btn => {
        if (btn.dataset.color === colorClass) {
          btn.classList.add('selected');
        } else {
          btn.classList.remove('selected');
        }
      });
    }

    function closeCalModal() {
      calEventModal.classList.remove('active');
    }

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    if (localStorage.getItem('family_chat_unlocked') === 'true' || sessionStorage.getItem('family_chat_unlocked') === 'true') {
      const savedUser = localStorage.getItem(userStorageKey);
      if (savedUser) {
        userSelect.value = savedUser;
      }
      unlockApp();
    }
  </script>
</body>
</html>
