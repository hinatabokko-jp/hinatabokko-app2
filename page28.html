<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>family chat</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --surface-color: #131b2e;
      --surface-glass: rgba(19, 27, 46, 0.75);
      --primary-gradient: linear-gradient(135deg, #8B5CF6, #6366F1, #06B6D4);
      --primary-color: #6366F1;
      --primary-hover: #4f46e5;
      --danger-color: #f43f5e;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --chat-bg: #0b0f19;
      --my-msg-gradient: linear-gradient(135deg, #8B5CF6, #6366F1, #06B6D4);
      --other-msg-bg: #1e293b;
      --border-radius-btn: 14px;
      --padding-btn: 12px 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* あいことばロック画面 */
    #lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      gap: 20px;
      padding: 20px;
      backdrop-filter: blur(20px);
    }
    #lock-screen h2 {
      font-size: 1.3rem;
      font-weight: 600;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #pass-input {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-btn);
      padding: var(--padding-btn);
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      width: 260px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #pass-input:focus {
      border-color: #6366F1;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }
    .remember-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .remember-container input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6366F1;
      cursor: pointer;
    }
    #pass-btn {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      border-radius: var(--border-radius-btn);
      padding: var(--padding-btn);
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: transform 0.15s, opacity 0.15s;
    }
    #pass-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    #pass-btn:active {
      transform: scale(0.98);
    }
    #pass-error {
      color: var(--danger-color);
      font-size: 0.85rem;
      display: none;
    }

    /* アプリ本体 */
    #app-content {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .chat-main-area {
      display: flex;
      flex: 1;
      height: calc(100% - 69px);
      overflow: hidden;
    }

    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* ヘッダー */
    header {
      background-color: var(--surface-glass);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-title-container {
      display: flex;
      flex-direction: column;
    }
    .header-title {
      font-size: 1.2rem;
      font-weight: 700;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-badge {
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      font-weight: 500;
    }
    .header-subtitle {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.2;
    }
    .header-right-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-select-container {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .user-select-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    select {
      background-color: var(--surface-color);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    select:focus {
      border-color: #6366F1;
    }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: var(--padding-btn);
      border-radius: var(--border-radius-btn);
      cursor: pointer;
      font-size: 0.8rem;
      transition: background-color 0.2s, color 0.2s;
    }
    .btn-logout:hover {
      background-color: rgba(255,255,255,0.05);
      color: var(--text-color);
    }

    /* チャット表示エリア */
    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.03), transparent 40%);
    }

    /* メッセージバルーン */
    .message {
      max-width: 75%;
      display: flex;
      flex-direction: column;
    }
    .message.sent {
      align-self: flex-end;
    }
    .message.received {
      align-self: flex-start;
    }
    .sender-name {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      padding: 0 4px;
      font-weight: 500;
    }
    .message.sent .sender-name {
      text-align: right;
    }
    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .message.sent .bubble {
      background: var(--my-msg-gradient);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .message.received .bubble {
      background-color: var(--other-msg-bg);
      color: var(--text-color);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }
    
    /* スタンプ用の吹き出しスタイル（背景・枠線・パディングを排除）[cite: 1] */
    .bubble.stamp-bubble {
      background: transparent !important;
      padding: 6px;
      box-shadow: none !important;
      border: none !important;
    }

    .meta-info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
      padding: 0 4px;
    }
    .message.sent .meta-info {
      justify-content: flex-end;
    }
    .timestamp {
      font-size: 0.65rem;
      color: var(--text-muted);
    }
    .delete-btn, .edit-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      cursor: pointer;
      padding: 0;
      opacity: 0.8;
      transition: opacity 0.2s, color 0.2s;
    }
    .delete-btn:hover, .edit-btn:hover {
      opacity: 1;
      color: var(--text-color);
    }

    /* メディア・ファイル関連スタイル */
    .chat-image {
      max-width: 100%;
      max-height: 250px;
      border-radius: 12px;
      margin-bottom: 6px;
      display: block;
      object-fit: contain;
    }
    /* LINEスタンプ風に表示させる画像・スタンプのスタイル[cite: 1] */
    .chat-stamp {
      max-width: 170px;
      max-height: 170px;
      display: block;
      user-select: none;
      pointer-events: none;
      object-fit: contain;
      image-orientation: none;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
    }
    .chat-link {
      color: #38bdf8;
      text-decoration: underline;
      word-break: break-all;
    }
    .message.received .chat-link {
      color: #818cf8;
    }
    .file-attachment {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: rgba(0, 0, 0, 0.25);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 6px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .file-name {
      font-size: 0.85rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
    }

    /* 入力エリア */
    footer {
      background-color: var(--surface-glass);
      backdrop-filter: blur(12px);
      padding: 14px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    textarea {
      flex: 1;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 10px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      height: 44px;
      max-height: 120px;
      font-family: inherit;
      line-height: 1.4;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus {
      border-color: #6366F1;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.25);
    }
    button.send-btn-style {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      border-radius: var(--border-radius-btn);
      padding: var(--padding-btn);
      height: 44px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      transition: opacity 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button.send-btn-style:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    button.send-btn-style:active {
      transform: scale(0.97);
    }
    button.icon-btn-style, label.icon-btn-style {
      background-color: var(--surface-color);
      color: #818cf8;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-btn);
      width: 44px;
      height: 44px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
    }
    button.icon-btn-style:hover, label.icon-btn-style:hover {
      background-color: rgba(99, 102, 241, 0.1);
      border-color: rgba(99, 102, 241, 0.3);
      transform: translateY(-1px);
    }
    button.icon-btn-style:active, label.icon-btn-style:active {
      transform: scale(0.95);
    }

    /* モーダル表示スタイル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(5, 7, 12, 0.8);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-container {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      background-color: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: color 0.2s;
    }
    .modal-close-btn:hover {
      color: #fff;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .palette-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .palette-btn {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      height: 40px;
      padding: 0 12px;
      font-size: 1.1rem;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s, border-color 0.2s;
    }
    .palette-btn:hover {
      background-color: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.4);
      transform: scale(1.03);
    }
    .kaimoji-btn {
      font-size: 0.85rem;
    }
    .modal-textarea {
      width: 100%;
      height: 120px;
      background-color: rgba(0, 0, 0, 0.2);
      color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      line-height: 1.4;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .modal-textarea:focus {
      border-color: #6366F1;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.25);
    }
    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      background-color: rgba(255, 255, 255, 0.02);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .modal-footer-right {
      display: flex;
      gap: 10px;
    }
    .secondary-btn {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-btn);
      padding: var(--padding-btn);
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .secondary-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* 手描きスタンプ関連スタイル */
    .stamp-nav-btn {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      transition: opacity 0.2s, transform 0.1s;
    }
    .stamp-nav-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .editor-layout {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: flex-start;
    }
    .canvas-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      border: 2px dashed rgba(255,255,255,0.15);
      border-radius: 16px;
      background-color: #0b0f19;
      background-image: linear-gradient(45deg, #131b2e 25%, transparent 25%), linear-gradient(-45deg, #131b2e 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #131b2e 75%), linear-gradient(-45deg, transparent 75%, #131b2e 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      flex-shrink: 0;
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.5);
    }
    .stamp-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      touch-action: none;
    }
    .ps-layers-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 110px;
      background-color: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
    }
    .ps-layer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: grab;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .ps-layer-item.active {
      border-color: #6366F1;
      background-color: rgba(99, 102, 241, 0.15);
    }
    .ps-layer-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: bold;
    }
    .ps-layer-item.active .ps-layer-title {
      color: #818cf8;
    }
    .ps-layer-preview {
      width: 60px;
      height: 60px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: #0b0f19;
      object-fit: contain;
      pointer-events: none;
    }
    .stamp-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-top: 12px;
    }
    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tool-btn {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .tool-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
    .tool-btn.active {
      border-color: #6366F1;
      color: #818cf8;
      background-color: rgba(99, 102, 241, 0.15);
    }
    select.tool-select {
      background-color: var(--surface-color);
      color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.8rem;
      outline: none;
    }
    .history-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      max-height: 350px;
      overflow-y: auto;
      padding: 4px;
    }
    .history-card {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .history-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
    }
    .history-img-wrapper {
      width: 100%;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b0f19;
      border-radius: 8px;
    }
    .history-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .history-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .history-action-btn {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background-color 0.2s;
    }
    .history-action-btn.send { background: var(--primary-gradient); border: none; color: #fff; font-weight: bold; }
    .history-action-btn.del { background-color: rgba(244, 63, 94, 0.15); border-color: rgba(244, 63, 94, 0.3); color: #fda4af; }
    .history-action-btn.del:hover { background-color: rgba(244, 63, 94, 0.25); }
  </style>
</head>
<body>

  <div class="app-container" id="app-container">
    <!-- あいことばロック画面 -->

    async function handleAuth() {

    // 画像のEXIF回転補正用関数（iOS端末の向き誤判定を防止・PNG透過を維持）
    function normalizeImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            resolve(canvas.toDataURL('image/png'));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // チャット・スタンプ関連変数・ロジック
    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');

    const layerItem1 = document.getElementById('layer-item-1');

    const historyModalOverlay = document.getElementById('history-modal-overlay');
    const historyModalCloseX = document.getElementById('history-modal-close-x');
    const backToStampDrawBtn = document.getElementById('back-to-stamp-draw-btn');

    const canvasA = document.getElementById('layer-bottom');

    function getLayerObj(id) {
      if (id === 1) return { canvas: canvasA, ctx: ctxA };
      return { canvas: canvasB, ctx: ctxB };

    function getActiveLayer() {

    function updateLayerDOMOrder() {
      if (activeLayerId === 1) {
        canvasA.style.zIndex = 10;
        canvasB.style.zIndex = 5;
      } else {
        canvasA.style.zIndex = 5;
        canvasB.style.zIndex = 10;

      layersPanelContainer.innerHTML = '';

      });

      layerItem1.classList.toggle('active', activeLayerId === 1);
      layerItem2.classList.toggle('active', activeLayerId === 2);
    }

    function setActiveLayer(id) {
      activeLayerId = id;
      updateLayerDOMOrder();
    }

    layerItem1.addEventListener('click', () => setActiveLayer(1));
    layerItem2.addEventListener('click', () => setActiveLayer(2));

    let draggedLayerId = null;
    [layerItem1, layerItem2].forEach(item => {
      item.addEventListener('dragstart', () => {
        draggedLayerId = parseInt(item.getAttribute('data-layer'));
        item.classList.add('dragging');
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        draggedLayerId = null;
      });
      item.addEventListener('dragover', (e) => e.preventDefault());
      item.addEventListener('drop', (e) => {
        e.preventDefault();
        const targetLayerId = parseInt(item.getAttribute('data-layer'));
        if (draggedLayerId && draggedLayerId !== targetLayerId) {
          const indexA = layerOrder.indexOf(draggedLayerId);
          const indexB = layerOrder.indexOf(targetLayerId);
          if (indexA !== -1 && indexB !== -1) {
            layerOrder[indexA] = targetLayerId;
            layerOrder[indexB] = draggedLayerId;
            updateLayerDOMOrder();
          }
        }
      });
    });

    function updateLayerPreviews() {
      psPreview1.src = canvasA.toDataURL();
      psPreview2.src = canvasB.toDataURL();
    }

    const emojis = ['✨', '👑', '💘', '❤', '🔥', '😊', '😍', '👏', '🎉', '🙌', '🌟', '👍', '💐', '🥰', '💯'];
    const kaimojis = ['( ﾟДﾟ)', '( *´艸｀)', '( ;∀;)', '(^^)ﾉｼ'];

    function insertAtCursor(field, text) {
      const startPos = field.selectionStart;
      const endPos = field.selectionEnd;
      field.value = field.value.substring(0, startPos) + text + field.value.substring(endPos);

    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function floodFill(canvas, startX, startY, fillColorHex, opacity) {
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const width = canvas.width;
      const height = canvas.height;

      const targetPos = (startY * width + startX) * 4;
      const targetR = data[targetPos];
      const targetG = data[targetPos + 1];
      const targetB = data[targetPos + 2];
      const targetA = data[targetPos + 3];

      const fillRgb = hexToRgb(fillColorHex);
      const fillA = Math.round(opacity * 255);

      if (targetR === fillRgb.r && targetG === fillRgb.g && targetB === fillRgb.b && targetA === fillA) return;

      const queue = [[startX, startY]];
      const visited = new Uint8Array(width * height);

      while (queue.length > 0) {
        const [x, y] = queue.pop();
        const pos = (y * width + x) * 4;
        const idx = y * width + x;

        if (x < 0 || x >= width || y < 0 || y >= height) continue;
        if (visited[idx]) continue;
        visited[idx] = 1;

        if (Math.abs(data[pos] - targetR) < 30 &&
            Math.abs(data[pos + 1] - targetG) < 30 &&
            Math.abs(data[pos + 2] - targetB) < 30 &&
            Math.abs(data[pos + 3] - targetA) < 30) {
          data[pos] = fillRgb.r;
          data[pos + 1] = fillRgb.g;
          data[pos + 2] = fillRgb.b;
          data[pos + 3] = fillA;

          queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function saveState() {
      if (historyStack.length >= 10) historyStack.shift();
      historyStack.push({
        l1: ctxA.getImageData(0, 0, canvasA.width, canvasA.height),
        l2: ctxB.getImageData(0, 0, canvasB.width, canvasB.height),
        order: [...layerOrder]
      });
    }

    toolUndo.addEventListener('click', () => {
      if (historyStack.length > 0) {
        const prevState = historyStack.pop();
        ctxA.putImageData(prevState.l1, 0, 0);
        ctxB.putImageData(prevState.l2, 0, 0);
        layerOrder = [...prevState.order];
        updateLayerDOMOrder();
        updateLayerPreviews();
      }
    });

    toolClear.addEventListener('click', () => {
      saveState();
      const { ctx, canvas } = getActiveLayer();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      updateLayerPreviews();
    });

    function getCanvasCoords(e, canvasEl) {
      const rect = canvasEl.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: Math.floor((clientX - rect.left) * (canvasEl.width / rect.width)),
        y: Math.floor((clientY - rect.top) * (canvasEl.height / rect.height))
      };
    }

    function drawBrushStroke(ctx, p1, p2) {
      const baseSize = parseFloat(stampSizeInput.value);
      const color = stampColorInput.value;
      const opacity = parseFloat(stampOpacityInput.value);

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';

      if (currentBrushType === 'airbrush') {
        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const steps = Math.max(1, Math.floor(dist / 2));
        ctx.fillStyle = color;
        for (let i = 0; i < steps; i++) {
          const rx = p1.x + (p2.x - p1.x) * (i / steps);
          const ry = p1.y + (p2.y - p1.y) * (i / steps);
          const numParticles = Math.floor(baseSize * 1.5);
          for (let j = 0; j < numParticles; j++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * baseSize;
            ctx.globalAlpha = opacity * 0.12;
            ctx.fillRect(rx + Math.cos(angle) * radius, ry + Math.sin(angle) * radius, 1.5, 1.5);
          }
        }
      } else if (currentBrushType === 'crayon') {
        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const steps = Math.max(1, Math.floor(dist));
        ctx.fillStyle = color;
        for (let i = 0; i < steps; i++) {
          const rx = p1.x + (p2.x - p1.x) * (i / steps);
          const ry = p1.y + (p2.y - p1.y) * (i / steps);
          for (let j = 0; j < Math.floor(baseSize * 2); j++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * (baseSize / 2);
            ctx.globalAlpha = opacity * 0.35;
            ctx.fillRect(rx + Math.cos(angle) * radius, ry + Math.sin(angle) * radius, 1.5, 1.5);
          }
        }
      } else if (currentBrushType === 'watercolor') {
        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalAlpha = opacity * 0.15;
        ctx.lineWidth = baseSize * 1.5;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      } else if (currentBrushType === 'calligraphy-brush' || currentBrushType === 'calligraphy-pen') {
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.globalAlpha = opacity;
        const isBrush = currentBrushType === 'calligraphy-brush';
        const angleOffset = isBrush ? Math.PI / 4 : -Math.PI / 4;
        const w = baseSize * 0.8;
        ctx.beginPath();
        ctx.moveTo(p1.x - Math.cos(angleOffset) * w, p1.y - Math.sin(angleOffset) * w);
        ctx.lineTo(p1.x + Math.cos(angleOffset) * w, p1.y + Math.sin(angleOffset) * w);
        ctx.lineTo(p2.x + Math.cos(angleOffset) * w, p2.y + Math.sin(angleOffset) * w);
        ctx.lineTo(p2.x - Math.cos(angleOffset) * w, p2.y - Math.sin(angleOffset) * w);
        ctx.closePath();
        ctx.fill();
      } else if (currentBrushType === 'marker') {
        ctx.strokeStyle = color;
        ctx.lineCap = 'square';
        ctx.lineJoin = 'miter';
        ctx.globalAlpha = opacity * 0.6;
        ctx.lineWidth = baseSize * 1.2;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      } else if (currentBrushType === 'pencil') {
        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalAlpha = opacity * 0.7;
        ctx.lineWidth = Math.max(1, baseSize * 0.4);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      } else if (currentBrushType === 'oil') {
        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalAlpha = opacity * 0.9;
        ctx.lineWidth = baseSize;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      } else {
        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalAlpha = opacity;
        ctx.lineWidth = baseSize;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    [canvasA, canvasB].forEach(targetCanvas => {
      let isTargetDrawing = false;

      function startDraw(e) {
        const activeObj = getActiveLayer();
        if (targetCanvas !== activeObj.canvas) return;
        const pos = getCanvasCoords(e, targetCanvas);
        saveState();

        if (currentTool === 'fill') {
          floodFill(targetCanvas, pos.x, pos.y, stampColorInput.value, parseFloat(stampOpacityInput.value));
          updateLayerPreviews();
          return;
        }

        isTargetDrawing = true;
        lastPoint = pos;

        if (currentTool === 'eraser') {
          const ctx = activeObj.ctx;
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
        } else {
          drawBrushStroke(activeObj.ctx, pos, pos);
        }
      }

      function moveDraw(e) {
        if (!isTargetDrawing || currentTool === 'fill') return;
        const activeObj = getActiveLayer();
        if (targetCanvas !== activeObj.canvas) return;
        e.preventDefault();
        const pos = getCanvasCoords(e, targetCanvas);
        const ctx = activeObj.ctx;

        if (currentTool === 'eraser') {
          const baseSize = parseFloat(stampSizeInput.value);
          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.globalCompositeOperation = 'destination-out';
          ctx.lineWidth = baseSize * 1.5;
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
          ctx.restore();
        } else {
          drawBrushStroke(ctx, lastPoint, pos);
        }
        lastPoint = pos;
      }

      function endDraw() {
        if (isTargetDrawing) {
          getActiveLayer().ctx.closePath();
          isTargetDrawing = false;
          lastPoint = null;
          updateLayerPreviews();
        }
      }

      targetCanvas.addEventListener('mousedown', startDraw);
      targetCanvas.addEventListener('mousemove', moveDraw);
      targetCanvas.addEventListener('mouseup', endDraw);
      targetCanvas.addEventListener('mouseleave', endDraw);
      targetCanvas.addEventListener('touchstart', startDraw, { passive: false });
      targetCanvas.addEventListener('touchmove', moveDraw, { passive: false });
      targetCanvas.addEventListener('touchend', endDraw);
    });

    // 手描きスタンプ作成・エクスポート時の透過処理（Canvas）[cite: 1]
    stampSubmitBtn.addEventListener('click', () => {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 250; exportCanvas.height = 250;
      const expCtx = exportCanvas.getContext('2d');
      
      // 各レイヤーの描画内容を透過を維持したまま結合[cite: 1]
      layerOrder.forEach(id => expCtx.drawImage(getLayerObj(id).canvas, 0, 0));
      
      // PNG形式としてDataURLに変換（背景が透明な状態を保持）[cite: 1]
      const stampDataUrl = exportCanvas.toDataURL('image/png');
      const senderName = userSelect.value;
      
      // データベースにスタンプとして送信・保存[cite: 1]
      push(messagesRef, { sender: senderName, text: '', fileData: stampDataUrl, fileName: `stamp_${Date.now()}.png`, isStamp: true, timestamp: Date.now() });
      push(stampHistoryRef, { dataUrl: stampDataUrl, creator: senderName, timestamp: Date.now() });
      
      ctxA.clearRect(0, 0, canvasA.width, canvasA.height);
      ctxB.clearRect(0, 0, canvasB.width, canvasB.height);
      historyStack = [];
      updateLayerPreviews();
      stampModalOverlay.classList.remove('active');
    });

    stampUploadInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const dataUrl = await normalizeImageFile(file);
      const senderName = userSelect.value;
      push(stampHistoryRef, { dataUrl: dataUrl, creator: senderName, timestamp: Date.now() });
      stampUploadInput.value = '';
    });

    onValue(stampHistoryRef, (snapshot) => {
      cachedStampHistory = snapshot.val() || {};
      if (historyModalOverlay.classList.contains('active')) renderStampHistory();
    });

    function renderStampHistory() {
      historyGrid.innerHTML = '';
      const keys = Object.keys(cachedStampHistory);
      if (keys.length === 0) {
        historyGrid.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem; grid-column:1/-1; text-align:center;">履歴はありません</div>';
        return;
      }
      keys.reverse().forEach(key => {
        const item = cachedStampHistory[key];
        const card = document.createElement('div');
        card.className = 'history-card';
        card.innerHTML = `
          <div class="history-img-wrapper"><img src="${item.dataUrl}" class="history-img"></div>
          <div class="history-actions">
            <button class="history-action-btn send" data-key="${key}">💬 送信</button>
            <button class="history-action-btn del" data-key="${key}">🗑 削除</button>
          </div>
        `;
        card.querySelector('.send').addEventListener('click', () => {
          const senderName = userSelect.value;
          push(messagesRef, { sender: senderName, text: '', fileData: item.dataUrl, fileName: `stamp_${Date.now()}.png`, isStamp: true, timestamp: Date.now() });
          historyModalOverlay.classList.remove('active');
        });
        card.querySelector('.del').addEventListener('click', () => {
          if (confirm('削除しますか？')) remove(ref(db, `stamp_history/${key}`));
        });
        historyGrid.appendChild(card);
      });
    }

    goToHistoryBtn.addEventListener('click', () => { stampModalOverlay.classList.remove('active'); renderStampHistory(); historyModalOverlay.classList.add('active'); });
    backToStampDrawBtn.addEventListener('click', () => { historyModalOverlay.classList.remove('active'); stampModalOverlay.classList.add('active'); });
    historyModalCloseX.addEventListener('click', () => historyModalOverlay.classList.remove('active'));

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      const senderName = userSelect.value;
      push(messagesRef, { sender: senderName, text: text, timestamp: Date.now() });
      messageInput.value = '';
      messageInput.style.height = '44px';
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const isImage = file.type.startsWith('image/');
      let fileData = '';

      if (isImage) {
        fileData = await normalizeImageFile(file);
      } else {
        fileData = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (evt) => resolve(evt.target.result);
          reader.readAsDataURL(file);
        });
      }

      const senderName = userSelect.value;
      push(messagesRef, { 
        sender: senderName, 
        text: '', 
        fileData: fileData, 
        fileName: file.name, 
        fileType: file.type, 
        isImage: isImage, 
        timestamp: Date.now() 
      });
      fileInput.value = '';
    });

    function deleteMessage(key) {
      if (confirm('削除しますか？')) remove(ref(db, `messages/${key}`));
    }

    function editMessage(key, currentText) {
      editingMessageKey = key;
      modalTextInput.value = currentText || '';
      commentModalOverlay.classList.add('active');
      setTimeout(() => modalTextInput.focus(), 50);
    }

    function renderFormattedText(container, text) {
      const urlRegex = /(https?:\/\/[a-zA-Z0-9\-\._~:\/\?#\[\]@!\$&'\(\)\*\+,;=]+\.html)/g;
      let lastIndex = 0, match;
      while ((match = urlRegex.exec(text)) !== null) {
        if (match.index > lastIndex) container.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
        const link = document.createElement('a');
        link.href = match[0]; link.textContent = match[0]; link.className = 'chat-link'; link.target = '_blank';
        container.appendChild(link);
        lastIndex = urlRegex.lastIndex;
      }
      if (lastIndex < text.length) container.appendChild(document.createTextNode(text.substring(lastIndex)));
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }

    // JavaScript（スタンプ送受信時のHTML描画処理）[cite: 1]
    function renderMessages() {
      chatBox.innerHTML = '';
      const activeUser = userSelect.value;

      Object.keys(cachedMessages).forEach(key => {
        const msg = cachedMessages[key];
        const isSent = msg.sender === activeUser;
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;
        
        const senderName = document.createElement('div');
        senderName.className = 'sender-name';
        senderName.textContent = msg.sender;

        // isStampが有効な場合は stamp-bubble クラスを付与[cite: 1]
        const bubble = document.createElement('div');
        bubble.className = `bubble ${msg.isStamp ? 'stamp-bubble' : ''}`;

        if (msg.fileData) {
          if (msg.isStamp) {
            // 透過PNG（スタンプ）として<img>タグを生成[cite: 1]
            const img = document.createElement('img'); 
            img.src = msg.fileData; 
            img.className = 'chat-stamp';
            bubble.appendChild(img);
          } else if (msg.isImage) {
            const img = document.createElement('img'); img.src = msg.fileData; img.className = 'chat-image';
            bubble.appendChild(img);
          } else {
            const fa = document.createElement('div'); fa.className = 'file-attachment';
            fa.innerHTML = `📄 <span class="file-name">${msg.fileName}</span>`;
            bubble.appendChild(fa);
          }
        }
        if (msg.text) {
          const tn = document.createElement('div');
          renderFormattedText(tn, msg.text);
          bubble.appendChild(tn);
        }

        const metaInfo = document.createElement('div');
        metaInfo.className = 'meta-info';
        const timestamp = document.createElement('span');
        timestamp.className = 'timestamp';
        const d = new Date(msg.timestamp);
        timestamp.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        metaInfo.appendChild(timestamp);

        if (msg.fileData) {
          const dlBtn = document.createElement('button');
          dlBtn.className = 'delete-btn'; dlBtn.textContent = 'ダウンロード';
          dlBtn.addEventListener('click', () => {
            const a = document.createElement('a'); a.href = msg.fileData; a.download = msg.fileName || 'download'; a.click();
          });
          metaInfo.appendChild(dlBtn);
        }
        
        if (msg.text) {
          const editBtn = document.createElement('button');
          editBtn.className = 'edit-btn';
          editBtn.textContent = '編集';
          editBtn.addEventListener('click', () => editMessage(key, msg.text));
          metaInfo.appendChild(editBtn);
        }

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '削除';
        delBtn.addEventListener('click', () => deleteMessage(key));
        metaInfo.appendChild(delBtn);

        msgDiv.appendChild(senderName);
        msgDiv.appendChild(bubble);
        msgDiv.appendChild(metaInfo);
        chatBox.appendChild(msgDiv);
      });

      scrollToBottom();
    }

    function initChat() {
      userSelect.addEventListener('change', () => {
        renderMessages();
      });

      onValue(messagesRef, (snapshot) => {
        cachedMessages = snapshot.val() || {};
        renderMessages();
      });

      sendBtn.addEventListener('click', sendMessage);
      messageInput.addEventListener('keydown', (e) => {
        if (!e.isComposing && e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
      messageInput.addEventListener('input', () => {
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
      });
    }

    initChat();

    if (localStorage.getItem('family_chat_unlocked') === 'true' || sessionStorage.getItem('family_chat_unlocked') === 'true') {
      unlockApp();
    }
  </script>
</body>
</html>
