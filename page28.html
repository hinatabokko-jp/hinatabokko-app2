<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>family chat</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --surface-color: #131b2e;
      --surface-glass: rgba(19, 27, 46, 0.75);
      --primary-gradient: linear-gradient(135deg, #8B5CF6, #6366F1, #06B6D4);
      --primary-color: #6366F1;
      --primary-hover: #4f46e5;
      --danger-color: #f43f5e;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --chat-bg: #0b0f19;
      --my-msg-gradient: linear-gradient(135deg, #8B5CF6, #6366F1, #06B6D4);
      --other-msg-bg: #1e293b;
      --border-radius-btn: 14px;
      --padding-btn: 12px 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* あいことばロック画面 */
    #lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      gap: 20px;
      padding: 20px;
      backdrop-filter: blur(20px);
    }
    #lock-screen h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }
    .lock-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 10px;
    }
    #pass-input {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-btn);
      padding: var(--padding-btn);
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      width: 260px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #pass-input:focus {
      border-color: #6366F1;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }
    .remember-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .remember-container input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6366F1;
      cursor: pointer;
    }
    #pass-btn {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      border-radius: var(--border-radius-btn);
      padding: var(--padding-btn);
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: transform 0.15s, opacity 0.15s;
      width: 260px;
    }
    #pass-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    #pass-btn:active {
      transform: scale(0.98);
    }
    #pass-error {
      color: var(--danger-color);
      font-size: 0.85rem;
      display: none;
    }
    .admin-link-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.2s;
      margin-top: 4px;
    }
    .admin-link-text:hover {
      color: var(--text-color);
    }

    /* 管理画面 */
    #admin-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-color);
      display: none;
      flex-direction: column;
      z-index: 10000;
      padding: 20px;
      overflow-y: auto;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }
    .admin-title {
      font-size: 1.2rem;
      font-weight: 700;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .admin-card {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .user-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    /* トグルスイッチ用スタイル */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: #fff;
      transition: .3s;
      border-radius: 50%;
    }
    .toggle-switch input:checked + .slider {
      background-color: var(--danger-color);
      border-color: var(--danger-color);
    }
    .toggle-switch input:checked + .slider:before {
      transform: translateX(16px);
    }

    /* アプリ本体 */
    #app-content {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .chat-main-area {
      display: flex;
      flex: 1;
      height: calc(100% - 69px);
      overflow: hidden;
    }

    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* ヘッダー */
    header {
      background-color: var(--surface-glass);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-title-container {
      display: flex;
      flex-direction: column;
    }
    .header-title {
      font-size: 1.2rem;
      font-weight: 700;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-badge {
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      font-weight: 500;
    }
    .header-right-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-select-container {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .user-select-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    select {
      background-color: var(--surface-color);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    select:focus {
      border-color: #6366F1;
    }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: var(--padding-btn);
      border-radius: var(--border-radius-btn);
      cursor: pointer;
      font-size: 0.8rem;
      transition: background-color 0.2s, color 0.2s;
    }
    .btn-logout:hover {
      background-color: rgba(255,255,255,0.05);
      color: var(--text-color);
    }

    /* チャット表示エリア */
    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.03), transparent 40%);
    }

    /* メッセージバルーン */
    .message {
      max-width: 75%;
      display: flex;
      flex-direction: column;
    }
    .message.sent {
      align-self: flex-end;
    }
    .message.received {
      align-self: flex-start;
    }
    .sender-name {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      padding: 0 4px;
      font-weight: 500;
    }
    .message.sent .sender-name {
      text-align: right;
    }
    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .message.sent .bubble {
      background: var(--my-msg-gradient);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .message.received .bubble {
      background: var(--my-msg-gradient);
      color: #ffffff;
      border-bottom-left-radius: 4px;
    }
    .bubble.stamp-bubble {
      background: transparent !important;
      padding: 6px;
      box-shadow: none !important;
      border: none !important;
    }

    .meta-info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
      padding: 0 4px;
    }
    .message.sent .meta-info {
      justify-content: flex-end;
    }
    .timestamp {
      font-size: 0.65rem;
      color: var(--text-muted);
    }
    .delete-btn, .edit-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      cursor: pointer;
      padding: 0;
      opacity: 0.8;
      transition: opacity 0.2s, color 0.2s;
    }
    .delete-btn:hover, .edit-btn:hover {
      opacity: 1;
      color: var(--text-color);
    }

    .chat-image {
      max-width: 100%;
      max-height: 250px;
      border-radius: 12px;
      margin-bottom: 6px;
      display: block;
      object-fit: contain;
    }
    .chat-stamp {
      max-width: 170px;
      max-height: 170px;
      display: block;
      user-select: none;
      pointer-events: none;
      object-fit: contain;
    }
    .chat-link {
      color: #ffffff;
      text-decoration: underline;
      word-break: break-all;
    }

    /* 入力エリア */
    footer {
      background-color: var(--surface-glass);
      backdrop-filter: blur(12px);
      padding: 14px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    textarea {
      flex: 1;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 10px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      height: 44px;
      max-height: 120px;
      font-family: inherit;
      line-height: 1.4;
    }
    textarea:focus {
      border-color: #6366F1;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.25);
    }
    button.send-btn-style {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      border-radius: var(--border-radius-btn);
      padding: var(--padding-btn);
      height: 44px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }
    button.icon-btn-style, label.icon-btn-style {
      background-color: var(--surface-color);
      color: #818cf8;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-btn);
      width: 44px;
      height: 44px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(5, 7, 12, 0.8);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-container {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      background-color: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.3rem;
      cursor: pointer;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .palette-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .palette-btn {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      height: 40px;
      padding: 0 12px;
      font-size: 1.1rem;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .modal-textarea {
      width: 100%;
      height: 120px;
      background-color: rgba(0, 0, 0, 0.2);
      color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
    }
    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .secondary-btn {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-btn);
      padding: var(--padding-btn);
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* スタンプ・履歴関連スタイル */
    .stamp-nav-btn, .tool-btn {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .tool-btn.active {
      background: #4f46e5;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    .tool-select {
      background-color: var(--surface-color);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    .editor-layout { display: flex; gap: 16px; justify-content: center; align-items: flex-start; }
    .canvas-wrapper { position: relative; width: 250px; height: 250px; border: 2px dashed rgba(255,255,255,0.15); border-radius: 16px; background-color: #0b0f19; }
    .stamp-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 14px; touch-action: none; }
    .ps-layers-panel { display: flex; flex-direction: column; gap: 10px; width: 110px; background-color: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; }
    .ps-layer-item { display: flex; flex-direction: column; align-items: center; padding: 8px; border: 2px solid transparent; border-radius: 8px; cursor: pointer; }
    .ps-layer-item.active { border-color: #6366F1; background-color: rgba(99, 102, 241, 0.15); }
    .ps-layer-preview { width: 60px; height: 60px; border: 1px solid var(--border-color); border-radius: 6px; object-fit: contain; pointer-events: none; }
    .stamp-tools { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; margin-top: 12px; }
    .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; max-height: 350px; overflow-y: auto; }
    .history-card { border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; background-color: rgba(255,255,255,0.02); display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .history-img-wrapper { width: 100%; height: 90px; display: flex; align-items: center; justify-content: center; background-color: #0b0f19; border-radius: 8px; }
    .history-img { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <div class="app-container" id="app-container">
    <!-- あいことばロック画面 -->
    <div id="lock-screen">
      <!-- グラデーションを適用したふき出しアイコン -->
      <div style="width: 80px; height: 80px; border-radius: 24px; background: var(--primary-gradient); padding: 2px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(139,92,246,0.3); margin-bottom: 5px;">
        <div style="width: 100%; height: 100%; background: #131b2e; border-radius: 22px; display: flex; align-items: center; justify-content: center;">
          <svg style="width: 40px; height: 40px;" fill="none" stroke="url(#primary-grad)" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#8B5CF6" />
                <stop offset="50%" stop-color="#6366F1" />
                <stop offset="100%" stop-color="#06B6D4" />
              </linearGradient>
            </defs>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
          </svg>
        </div>
      </div>

      <h2 style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Family Chat</h2>
      <div class="lock-subtitle">家族同士で連絡をとりあうためのアプリです</div>

      <input type="password" id="pass-input" placeholder="結婚記念日 数字４桁" autocomplete="off">
      <label class="remember-container">
        <input type="checkbox" id="remember-me-checkbox">
        次回から自動でログインする
      </label>
      <button id="pass-btn" class="send-btn-style">入室する</button>
      <button id="admin-link-btn" class="admin-link-text">管理画面へ</button>
      <div id="pass-error">あいことばが違います</div>
    </div>

    <!-- 管理画面 -->
    <div id="admin-screen">
      <div class="admin-header">
        <div class="admin-title">管理パネル（ファミリーチャット）</div>
        <button id="admin-close-btn" class="secondary-btn">閉じる / 戻る</button>
      </div>
      <div class="admin-card">
        <div style="font-weight:600; margin-bottom:10px; font-size:0.95rem;">ルーム全体の設定</div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:0.85rem; color:var(--text-muted);">新規入室の制限（ルームロック）</span>
          <label class="toggle-switch">
            <input type="checkbox" id="roomLockToggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <div class="admin-card">
        <div style="font-weight:600; margin-bottom:10px; font-size:0.95rem;">アクセスユーザー一覧 (<span id="userCountBadge">0名</span>)</div>
        <div id="adminUserList"></div>
      </div>
    </div>

    <!-- 管理者ログインモーダル -->
    <div id="admin-auth-modal" class="modal-overlay">
      <div class="modal-container" style="max-width:360px;">
        <div class="modal-header">
          <div class="modal-title">管理者認証</div>
          <button id="admin-auth-close" class="modal-close-btn">✕</button>
        </div>
        <div class="modal-body" style="gap:12px;">
          <div>
            <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:4px;">管理ID</div>
            <input type="text" id="adminIdInput" class="modal-textarea" style="height:44px;" placeholder="">
          </div>
          <div>
            <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:4px;">マスターパスワード</div>
            <input type="password" id="adminPassInput" class="modal-textarea" style="height:44px;" placeholder="">
          </div>

  <!-- Firebase SDK (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCfHE4gy8EFE3TxHQkw4jtiuMD9D3BrX6M",
      authDomain: "family-chat-2-bca6e.firebaseapp.com",
      projectId: "family-chat-2-bca6e",
      storageBucket: "family-chat-2-bca6e.firebasestorage.app",
      messagingSenderId: "542935840264",
      appId: "1:542935840264:web:055d64fbf310b537f403bd",
      measurementId: "G-FGVQ3784EN",
      databaseURL: "https://family-chat-2-bca6e-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');
    const stampHistoryRef = ref(db, 'stamp_history');
    const passcodeRef = ref(db, 'settings/passcode');
    const roomConfigRef = ref(db, 'settings/roomConfig');
    const usersRef = ref(db, 'users');

    const lockScreen = document.getElementById('lock-screen');
    const appContent = document.getElementById('app-content');
    const adminScreen = document.getElementById('admin-screen');
    const passInput = document.getElementById('pass-input');
    const passBtn = document.getElementById('pass-btn');
    const passError = document.getElementById('pass-error');
    const rememberMeCheckbox = document.getElementById('remember-me-checkbox');
    const userSelect = document.getElementById('user-select');
    const adminLinkBtn = document.getElementById('admin-link-btn');

    const adminAuthModal = document.getElementById('admin-auth-modal');
    const adminAuthClose = document.getElementById('admin-auth-close');
    const adminAuthSubmit = document.getElementById('admin-auth-submit');
    const adminCloseBtn = document.getElementById('admin-close-btn');
    const adminIdInput = document.getElementById('adminIdInput');
    const adminPassInput = document.getElementById('adminPassInput');
    const authErrorMessage = document.getElementById('authErrorMessage');
    const roomLockToggle = document.getElementById('roomLockToggle');

    // デバイス固有UIDの管理
    let deviceUID = localStorage.getItem('family_chat_device_uid');
    if (!deviceUID) {
      deviceUID = 'uid_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
      localStorage.setItem('family_chat_device_uid', deviceUID);
    }
    const userStorageKey = 'family_chat_selected_user_' + deviceUID;

    let registeredUsersList = [];
    let roomLockedState = false;

    // ユーザー情報・設定のリアルタイム同期
    onValue(usersRef, (snapshot) => {
      const data = snapshot.val() || {};
      registeredUsersList = Object.keys(data).map(k => ({ id: k, ...data[k] }));
      renderAdminUserList();
    });

    onValue(roomConfigRef, (snapshot) => {
      const data = snapshot.val() || {};
      roomLockedState = !!data.roomLocked;
      roomLockToggle.checked = roomLockedState;
    });

    // 管理画面への導線
    adminLinkBtn.addEventListener('click', () => {
      adminAuthModal.classList.add('active');
      adminIdInput.value = '';
      adminPassInput.value = '';
      authErrorMessage.style.display = 'none';
    });
    adminAuthClose.addEventListener('click', () => adminAuthModal.classList.remove('active'));
    adminCloseBtn.addEventListener('click', () => {
      adminScreen.style.display = 'none';
      lockScreen.style.display = 'flex';
    });

    // 管理者認証処理
    adminAuthSubmit.addEventListener('click', () => {
      const id = adminIdInput.value.trim();
      const pass = adminPassInput.value.trim();
      if (id === 'master' && pass === '0813') {
        adminAuthModal.classList.remove('active');
        lockScreen.style.display = 'none';
        adminScreen.style.display = 'flex';
      } else {
        authErrorMessage.style.display = 'block';
      }
    });

    // ルームロック切り替え
    roomLockToggle.addEventListener('change', async () => {
      await set(roomConfigRef, { roomLocked: roomLockToggle.checked });
    });

    // 各ユーザーのアクセス制限トグル操作
    window.toggleUserAccess = async function(userId, isDenied) {
      await update(ref(db, `users/${userId}`), { accessDenied: isDenied });
    };

    window.promptDeleteUser = async function(userId, nickname) {
      if (confirm(`「${nickname}」のデータを削除しますか？`)) {
        await remove(ref(db, `users/${userId}`));
      }
    };

    function renderAdminUserList() {
      const list = document.getElementById('adminUserList');
      document.getElementById('userCountBadge').textContent = `${registeredUsersList.length}名`;
      if (registeredUsersList.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:16px;">ユーザーデータがありません</div>';
        return;
      }
      list.innerHTML = '';
      registeredUsersList.forEach(user => {
        const item = document.createElement('div');
        item.className = 'user-list-item';
        item.innerHTML = `
          <div>
            <div style="font-weight:600; font-size:0.9rem;">${user.nickname} <span style="font-size:0.75rem; color:var(--text-muted);">(${user.selectedRole || ''})</span></div>
            <div style="font-size:0.75rem; color:var(--text-muted); font-family:monospace;">UID: ${user.userId || user.id}</div>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <div style="display:flex; align-items:center; gap:8px; font-size:0.75rem; color:var(--text-muted);">
              <span>アクセス拒否</span>
              <label class="toggle-switch">
                <input type="checkbox" ${user.accessDenied ? 'checked' : ''} onchange="toggleUserAccess('${user.id}', this.checked)">
                <span class="slider"></span>
              </label>
            </div>
            <button onclick="promptDeleteUser('${user.id}', '${user.nickname}')" style="background:rgba(244,63,94,0.15); color:#fda4af; border:none; padding:6px 10px; border-radius:8px; font-size:0.75rem; cursor:pointer;">削除</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    const changeUserBtn = document.getElementById('changeUserBtn');
    changeUserBtn.addEventListener('click', () => {
      sessionStorage.removeItem('family_chat_unlocked');
      localStorage.removeItem('family_chat_unlocked');
      lockScreen.style.display = 'flex';
      appContent.style.display = 'none';
      passInput.value = '';
    });

    async function handleAuth() {
      const inputPass = passInput.value;
      if (!inputPass) {
        passError.textContent = 'あいことばを入力してください';
        passError.style.display = 'block';
        return;
      }

      try {
        const snap = await get(passcodeRef);
        const correctPass = snap.exists() ? snap.val() : '0218';

        if (inputPass === correctPass) {
          // UIDベースのアクセス拒否チェック
          const foundUser = registeredUsersList.find(u => u.userId === deviceUID || u.id === deviceUID);
          if (foundUser && foundUser.accessDenied) {
            passError.textContent = '現在はアクセスが制限されています';
            passError.style.display = 'block';
            return;
          }

          // ルームロック（新規入室制限）チェック
          if (roomLockedState && !foundUser) {
            passError.textContent = '現在新規入室が制限されています（ルームロック中）';
            passError.style.display = 'block';
            return;
          }

          if (rememberMeCheckbox.checked) {
            localStorage.setItem('family_chat_unlocked', 'true');
          } else {
            sessionStorage.setItem('family_chat_unlocked', 'true');
          }
          await registerCurrentDeviceUser();
          unlockApp();
        } else {
          passError.textContent = 'あいことばが違います';
          passError.style.display = 'block';
        }
      } catch (e) {
        passError.textContent = '認証に失敗しました';
        passError.style.display = 'block';
      }
    }

    async function registerCurrentDeviceUser() {
      const currentRole = userSelect.value;
      const userRef = ref(db, `users/${deviceUID}`);
      await update(userRef, {
        userId: deviceUID,
        nickname: currentRole,
        selectedRole: currentRole,
        userAgent: navigator.userAgent,
        lastLoginAt: Date.now(),
        accessDenied: false
      });
    }

    function unlockApp() {
      lockScreen.style.display = 'none';
      appContent.style.display = 'flex';

      const savedUser = localStorage.getItem(userStorageKey);
      if (savedUser && (savedUser === 'おかあさん' || savedUser === 'おとうさん' || savedUser === 'むすめ')) {
        userSelect.value = savedUser;
      }

      renderMessages();
      scrollToBottom();
    }

    passBtn.addEventListener('click', handleAuth);
    passInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleAuth();
    });

    // 画像の補正処理
    function normalizeImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            resolve(canvas.toDataURL('image/png'));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const fileInput = document.getElementById('file-input');

    const modalOpenBtn = document.getElementById('modal-open-btn');
    const footerStampOpenBtn = document.getElementById('footer-stamp-open-btn');
    const footerStampHistoryOpenBtn = document.getElementById('footer-stamp-history-open-btn');
    const commentModalOverlay = document.getElementById('comment-modal-overlay');
    const modalCloseX = document.getElementById('modal-close-x');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const modalSubmitBtn = document.getElementById('modal-submit-btn');
    const modalClearBtn = document.getElementById('modal-clear-btn');
    const modalTextInput = document.getElementById('modal-text-input');
    const emojiPalette = document.getElementById('emoji-palette');
    const kaimojiPalette = document.getElementById('kaimoji-palette');

    const stampModalOverlay = document.getElementById('stamp-modal-overlay');
    const goToStampBtn = document.getElementById('go-to-stamp-btn');
    const stampModalCloseX = document.getElementById('stamp-modal-close-x');
    const stampCancelBtn = document.getElementById('stamp-cancel-btn');
    const backToCommentBtn = document.getElementById('back-to-comment-btn');
    const goToHistoryBtn = document.getElementById('go-to-history-btn');
    const stampSubmitBtn = document.getElementById('stamp-submit-btn');

    const layerItem1 = document.getElementById('layer-item-1');
    const layerItem2 = document.getElementById('layer-item-2');
    const psPreview1 = document.getElementById('ps-preview-1');
    const psPreview2 = document.getElementById('ps-preview-2');

    const historyModalOverlay = document.getElementById('history-modal-overlay');
    const historyModalCloseX = document.getElementById('history-modal-close-x');
    const backToStampDrawBtn = document.getElementById('back-to-stamp-draw-btn');
    const historyGrid = document.getElementById('history-grid');
    const stampUploadInput = document.getElementById('stamp-upload-input');

    const canvasA = document.getElementById('layer-bottom');
    const canvasB = document.getElementById('layer-top');
    const ctxA = canvasA.getContext('2d', { willReadFrequently: true });
    const ctxB = canvasB.getContext('2d', { willReadFrequently: true });

    let activeLayerId = 2;
    let layerOrder = [1, 2];

    const stampColorInput = document.getElementById('stamp-color');
    const stampOpacityInput = document.getElementById('stamp-opacity');
    const stampSizeInput = document.getElementById('stamp-size');
    const brushSelect = document.getElementById('brush-select');
    const toolFill = document.getElementById('tool-fill');
    const toolEraser = document.getElementById('tool-eraser');
    const toolUndo = document.getElementById('tool-undo');
    const toolClear = document.getElementById('tool-clear');

    let cachedMessages = {};
    let cachedStampHistory = {};
    let currentTool = 'pen';
    let currentBrushType = 'pen';
    let lastPoint = null;
    let editingMessageKey = null;

    function getLayerObj(id) {
      if (id === 1) return { canvas: canvasA, ctx: ctxA };
      return { canvas: canvasB, ctx: ctxB };
    }

    function getActiveLayer() { return getLayerObj(activeLayerId); }

    function updateLayerDOMOrder() {
      if (activeLayerId === 1) {
        canvasA.style.zIndex = 10; canvasB.style.zIndex = 5;
      } else {
        canvasA.style.zIndex = 5; canvasB.style.zIndex = 10;
      }
      layerItem1.classList.toggle('active', activeLayerId === 1);
      layerItem2.classList.toggle('active', activeLayerId === 2);
    }

    layerItem1.addEventListener('click', () => { activeLayerId = 1; updateLayerDOMOrder(); });
    layerItem2.addEventListener('click', () => { activeLayerId = 2; updateLayerDOMOrder(); });

    function updateLayerPreviews() {
      psPreview1.src = canvasA.toDataURL();
      psPreview2.src = canvasB.toDataURL();
    }

    const emojis = ['✨', '👑', '💘', '❤', '🔥', '😊', '😍', '👏', '🎉', '🙌', '🌟', '👍', '💐', '🥰', '💯'];
    const kaimojis = ['( ﾟДﾟ)', '( *´艸｀)', '( ;∀;)', '(^^)ﾉｼ'];

    emojis.forEach(emoji => {
      const btn = document.createElement('button');
      btn.className = 'palette-btn'; btn.textContent = emoji; btn.type = 'button';
      btn.addEventListener('click', () => insertAtCursor(modalTextInput, emoji));
      emojiPalette.appendChild(btn);
    });

    kaimojis.forEach(kaimoji => {
      const btn = document.createElement('button');
      btn.className = 'palette-btn'; btn.textContent = kaimoji; btn.type = 'button';
      btn.addEventListener('click', () => insertAtCursor(modalTextInput, kaimoji));
      kaimojiPalette.appendChild(btn);
    });

    function insertAtCursor(field, text) {
      const startPos = field.selectionStart;
      const endPos = field.selectionEnd;
      field.value = field.value.substring(0, startPos) + text + field.value.substring(endPos);
      field.focus();
      field.setSelectionRange(startPos + text.length, startPos + text.length);
    }

    modalOpenBtn.addEventListener('click', () => {
      editingMessageKey = null;
      modalTextInput.value = messageInput.value;
      commentModalOverlay.classList.add('active');
    });
    const closeModal = () => { commentModalOverlay.classList.remove('active'); editingMessageKey = null; };
    modalCloseX.addEventListener('click', closeModal);
    modalCloseBtn.addEventListener('click', closeModal);
    modalClearBtn.addEventListener('click', () => { modalTextInput.value = ''; modalTextInput.focus(); });

    modalSubmitBtn.addEventListener('click', () => {
      const text = modalTextInput.value.trim();
      const senderName = userSelect.value;
      if (text) {
        if (editingMessageKey) {
          update(ref(db, `messages/${editingMessageKey}`), { text: text });
          editingMessageKey = null;
        } else {
          push(messagesRef, { sender: senderName, text: text, timestamp: Date.now() });
        }
        modalTextInput.value = '';
        messageInput.value = '';
      }
      closeModal();
    });

      stampModalOverlay.classList.add('active');
      updateLayerPreviews();

      renderStampHistory();
      historyModalOverlay.classList.add('active');

    goToStampBtn.addEventListener('click', () => { closeModal(); stampModalOverlay.classList.add('active'); updateLayerPreviews(); });

    stampModalCloseX.addEventListener('click', () => stampModalOverlay.classList.remove('active'));
    stampCancelBtn.addEventListener('click', () => stampModalOverlay.classList.remove('active'));

    toolFill.addEventListener('click', () => { 
      currentTool = 'fill';

      currentTool = 'eraser'; 
      toolEraser.classList.add('active'); 
      toolFill.classList.remove('active'); 
    });

    brushSelect.addEventListener('change', () => {
      currentTool = 'pen';
      currentBrushType = brushSelect.value;
      toolFill.classList.remove('active');
      toolEraser.classList.remove('active');
    });

    toolClear.addEventListener('click', () => {
      const { ctx, canvas } = getActiveLayer();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      updateLayerPreviews();
    });

    function getCanvasCoords(e, canvasEl) {
      const rect = canvasEl.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: Math.floor((clientX - rect.left) * (canvasEl.width / rect.width)),
        y: Math.floor((clientY - rect.top) * (canvasEl.height / rect.height))
      };
    }

    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function floodFill(canvas, startX, startY, fillColorHex, opacity) {
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const width = canvas.width;
      const height = canvas.height;

      const targetPos = (startY * width + startX) * 4;
      const targetR = data[targetPos];
      const targetG = data[targetPos + 1];
      const targetB = data[targetPos + 2];
      const targetA = data[targetPos + 3];

      const fillRgb = hexToRgb(fillColorHex);
      const fillA = Math.round(opacity * 255);

      if (targetR === fillRgb.r && targetG === fillRgb.g && targetB === fillRgb.b && targetA === fillA) return;

      const queue = [[startX, startY]];
      const visited = new Uint8Array(width * height);

      while (queue.length > 0) {
        const [x, y] = queue.pop();
        const pos = (y * width + x) * 4;
        const idx = y * width + x;

        if (x < 0 || x >= width || y < 0 || y >= height) continue;
        if (visited[idx]) continue;
        visited[idx] = 1;

        if (Math.abs(data[pos] - targetR) < 30 &&
            Math.abs(data[pos + 1] - targetG) < 30 &&
            Math.abs(data[pos + 2] - targetB) < 30 &&
            Math.abs(data[pos + 3] - targetA) < 30) {
          data[pos] = fillRgb.r;
          data[pos + 1] = fillRgb.g;
          data[pos + 2] = fillRgb.b;
          data[pos + 3] = fillA;

          queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function drawStroke(ctx, p1, p2) {
      const color = stampColorInput.value;
      const baseSize = parseFloat(stampSizeInput.value);
      const opacity = parseFloat(stampOpacityInput.value);
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);

      if (currentTool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.globalAlpha = opacity;
        ctx.strokeStyle = color;
        ctx.lineWidth = baseSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
        return;
      }

      ctx.globalCompositeOperation = 'source-over';

      switch (currentBrushType) {
        case 'calligraphy-brush':
          ctx.globalAlpha = opacity;
          ctx.strokeStyle = color;
          ctx.lineCap = 'round';
          ctx.lineWidth = Math.max(1, baseSize * (1 - Math.min(dist / 20, 0.7)));
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
          break;

        case 'calligraphy-pen':
          ctx.globalAlpha = opacity;
          ctx.fillStyle = color;
          const stepsCallig = Math.max(1, Math.floor(dist));
          for (let i = 0; i <= stepsCallig; i++) {
            const curX = p1.x + (p2.x - p1.x) * (i / stepsCallig);
            const curY = p1.y + (p2.y - p1.y) * (i / stepsCallig);
            ctx.beginPath();
            ctx.ellipse(curX, curY, baseSize, Math.max(1, baseSize / 4), Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
          }
          break;

        case 'airbrush':
          ctx.globalAlpha = opacity * 0.15;
          ctx.fillStyle = color;
          const airSteps = Math.max(1, Math.floor(dist / 2));
          for (let i = 0; i <= airSteps; i++) {
            const curX = p1.x + (p2.x - p1.x) * (i / airSteps);
            const curY = p1.y + (p2.y - p1.y) * (i / airSteps);
            const numParticles = Math.floor(baseSize * 2);
            for (let p = 0; p < numParticles; p++) {
              const r = Math.random() * baseSize * 1.2;
              const a = Math.random() * Math.PI * 2;
              ctx.fillRect(curX + r * Math.cos(a), curY + r * Math.sin(a), 1, 1);
            }
          }
          break;

        case 'oil':
          ctx.globalAlpha = opacity * 0.7;
          ctx.strokeStyle = color;
          ctx.lineCap = 'butt';
          ctx.lineWidth = baseSize;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
          break;

        case 'crayon':
          ctx.globalAlpha = opacity * 0.6;
          ctx.fillStyle = color;
          const craySteps = Math.max(1, Math.floor(dist));
          for (let i = 0; i <= craySteps; i++) {
            const curX = p1.x + (p2.x - p1.x) * (i / craySteps);
            const curY = p1.y + (p2.y - p1.y) * (i / craySteps);
            for (let j = 0; j < baseSize * 1.5; j++) {
              const rx = (Math.random() - 0.5) * baseSize;
              const ry = (Math.random() - 0.5) * baseSize;
              if (Math.hypot(rx, ry) <= baseSize / 2) {
                ctx.fillRect(curX + rx, curY + ry, 1.5, 1.5);
              }
            }
          }
          break;

        case 'marker':
          ctx.globalAlpha = opacity * 0.4;
          ctx.fillStyle = color;
          const markSteps = Math.max(1, Math.floor(dist));
          for (let i = 0; i <= markSteps; i++) {
            const curX = p1.x + (p2.x - p1.x) * (i / markSteps);
            const curY = p1.y + (p2.y - p1.y) * (i / markSteps);
            ctx.beginPath();
            ctx.arc(curX, curY, baseSize, 0, Math.PI * 2);
            ctx.fill();
          }
          break;

        case 'pencil':
          ctx.globalAlpha = opacity * 0.8;
          ctx.fillStyle = color;
          const pSteps = Math.max(1, Math.floor(dist));
          for (let i = 0; i <= pSteps; i++) {
            const curX = p1.x + (p2.x - p1.x) * (i / pSteps);
            const curY = p1.y + (p2.y - p1.y) * (i / pSteps);
            for (let j = 0; j < baseSize; j++) {
              const rx = (Math.random() - 0.5) * (baseSize / 2);
              const ry = (Math.random() - 0.5) * (baseSize / 2);
              ctx.fillRect(curX + rx, curY + ry, 1, 1);
            }
          }
          break;

        case 'watercolor':
          ctx.globalAlpha = opacity * 0.12;
          ctx.fillStyle = color;
          const wcSteps = Math.max(1, Math.floor(dist / 2));
          for (let i = 0; i <= wcSteps; i++) {
            const curX = p1.x + (p2.x - p1.x) * (i / wcSteps);
            const curY = p1.y + (p2.y - p1.y) * (i / wcSteps);
            ctx.beginPath();
            ctx.arc(curX, curY, baseSize * 1.3, 0, Math.PI * 2);
            ctx.fill();
          }
          break;

        case 'pen':
        default:
          ctx.globalAlpha = opacity;
          ctx.strokeStyle = color;
          ctx.lineWidth = baseSize;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
          break;
      }
    }

    [canvasA, canvasB].forEach(targetCanvas => {
      let isTargetDrawing = false;
      function startDraw(e) {
        const activeObj = getActiveLayer();
        if (targetCanvas !== activeObj.canvas) return;
        const pos = getCanvasCoords(e, targetCanvas);

        if (currentTool === 'fill') {
          floodFill(targetCanvas, pos.x, pos.y, stampColorInput.value, parseFloat(stampOpacityInput.value));
          updateLayerPreviews();
          return;
        }

        isTargetDrawing = true;
        lastPoint = pos;
        drawStroke(activeObj.ctx, pos, pos);
      }
      function moveDraw(e) {
        if (!isTargetDrawing) return;
        const activeObj = getActiveLayer();
        if (targetCanvas !== activeObj.canvas) return;
        e.preventDefault();
        const pos = getCanvasCoords(e, targetCanvas);
        drawStroke(activeObj.ctx, lastPoint, pos);
        lastPoint = pos;
      }
      function endDraw() {
        if (isTargetDrawing) {
          isTargetDrawing = false;
          lastPoint = null;
          updateLayerPreviews();
        }
      }
      targetCanvas.addEventListener('mousedown', startDraw);
      targetCanvas.addEventListener('mousemove', moveDraw);
      targetCanvas.addEventListener('mouseup', endDraw);
      targetCanvas.addEventListener('mouseleave', endDraw);
      targetCanvas.addEventListener('touchstart', startDraw, { passive: false });
      targetCanvas.addEventListener('touchmove', moveDraw, { passive: false });
      targetCanvas.addEventListener('touchend', endDraw);
    });

    stampSubmitBtn.addEventListener('click', () => {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 250; exportCanvas.height = 250;
      const expCtx = exportCanvas.getContext('2d');
      layerOrder.forEach(id => expCtx.drawImage(getLayerObj(id).canvas, 0, 0));
      
      const stampDataUrl = exportCanvas.toDataURL('image/png');
      const senderName = userSelect.value;
      
      push(messagesRef, { sender: senderName, text: '', fileData: stampDataUrl, fileName: `stamp_${Date.now()}.png`, isStamp: true, timestamp: Date.now() });
      push(stampHistoryRef, { dataUrl: stampDataUrl, creator: senderName, timestamp: Date.now() });
      
      ctxA.clearRect(0, 0, canvasA.width, canvasA.height);
      ctxB.clearRect(0, 0, canvasB.width, canvasB.height);
      updateLayerPreviews();
      stampModalOverlay.classList.remove('active');
    });

    stampUploadInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const dataUrl = await normalizeImageFile(file);
      push(stampHistoryRef, { dataUrl: dataUrl, creator: userSelect.value, timestamp: Date.now() });
      stampUploadInput.value = '';
    });

    onValue(stampHistoryRef, (snapshot) => {
      cachedStampHistory = snapshot.val() || {};
      if (historyModalOverlay.classList.contains('active')) renderStampHistory();
    });

    function renderStampHistory() {
      historyGrid.innerHTML = '';
      const keys = Object.keys(cachedStampHistory);
      if (keys.length === 0) {
        historyGrid.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem; grid-column:1/-1; text-align:center;">履歴はありません</div>';
        return;
      }
      keys.reverse().forEach(key => {
        const item = cachedStampHistory[key];
        const card = document.createElement('div');
        card.className = 'history-card';
        card.innerHTML = `
          <div class="history-img-wrapper"><img src="${item.dataUrl}" class="history-img"></div>
          <div style="display:flex; gap:6px; width:100%;">
            <button class="stamp-nav-btn send-hist" data-key="${key}" style="flex:1; padding:6px; font-size:0.75rem;">送信</button>
            <button class="stamp-nav-btn del-hist" data-key="${key}" style="flex:1; padding:6px; font-size:0.75rem; background:rgba(244,63,94,0.2); color:#fda4af;">削除</button>
          </div>
        `;
        card.querySelector('.send-hist').addEventListener('click', () => {
          push(messagesRef, { sender: userSelect.value, text: '', fileData: item.dataUrl, fileName: `stamp_${Date.now()}.png`, isStamp: true, timestamp: Date.now() });
          historyModalOverlay.classList.remove('active');
        });
        card.querySelector('.del-hist').addEventListener('click', () => {
          if (confirm('削除しますか？')) remove(ref(db, `stamp_history/${key}`));
        });
        historyGrid.appendChild(card);
      });
    }

    goToHistoryBtn.addEventListener('click', () => { stampModalOverlay.classList.remove('active'); renderStampHistory(); historyModalOverlay.classList.add('active'); });
    backToStampDrawBtn.addEventListener('click', () => { historyModalOverlay.classList.remove('active'); stampModalOverlay.classList.add('active'); });
    historyModalCloseX.addEventListener('click', () => historyModalOverlay.classList.remove('active'));

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      push(messagesRef, { sender: userSelect.value, text: text, timestamp: Date.now() });
      messageInput.value = '';
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const isImage = file.type.startsWith('image/');
      const fileData = isImage ? await normalizeImageFile(file) : await new Promise(r => {
        const fr = new FileReader(); fr.onload = (evt) => r(evt.target.result); fr.readAsDataURL(file);
      });
      push(messagesRef, { sender: userSelect.value, text: '', fileData: fileData, fileName: file.name, isImage: isImage, timestamp: Date.now() });
      fileInput.value = '';
    });

    function deleteMessage(key) { if (confirm('削除しますか？')) remove(ref(db, `messages/${key}`)); }
    function editMessage(key, currentText) {
      editingMessageKey = key;
      modalTextInput.value = currentText || '';
      commentModalOverlay.classList.add('active');
    }

    function renderFormattedText(container, text) {
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      let lastIndex = 0, match;
      while ((match = urlRegex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          container.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
        }
        const link = document.createElement('a');
        link.href = match[0];
        link.textContent = match[0];
        link.className = 'chat-link';
        link.target = '_blank';
        container.appendChild(link);
        lastIndex = urlRegex.lastIndex;
      }
      if (lastIndex < text.length) {
        container.appendChild(document.createTextNode(text.substring(lastIndex)));
      }
    }

    function scrollToBottom() {
      requestAnimationFrame(() => { chatBox.scrollTop = chatBox.scrollHeight; });
    }

    function renderMessages() {
      chatBox.innerHTML = '';
      const activeUser = userSelect.value;
      Object.keys(cachedMessages).forEach(key => {
        const msg = cachedMessages[key];
        const isSent = msg.sender === activeUser;
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;
        
        const senderName = document.createElement('div');
        senderName.className = 'sender-name';
        senderName.textContent = msg.sender;

        const bubble = document.createElement('div');
        bubble.className = `bubble ${msg.isStamp ? 'stamp-bubble' : ''}`;

        if (msg.fileData) {
          const img = document.createElement('img');
          img.src = msg.fileData;
          img.className = msg.isStamp ? 'chat-stamp' : 'chat-image';
          bubble.appendChild(img);
        }
        if (msg.text) {
          const tn = document.createElement('div');
          renderFormattedText(tn, msg.text);
          bubble.appendChild(tn);
        }

        const metaInfo = document.createElement('div');
        metaInfo.className = 'meta-info';
        const timestamp = document.createElement('span');
        timestamp.className = 'timestamp';
        const d = new Date(msg.timestamp);
        timestamp.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        metaInfo.appendChild(timestamp);

        if (msg.text) {
          const editBtn = document.createElement('button');
          editBtn.className = 'edit-btn'; editBtn.textContent = '編集';
          editBtn.addEventListener('click', () => editMessage(key, msg.text));
          metaInfo.appendChild(editBtn);
        }

        // ▼ 画像やファイルなどのデータ（msg.fileData）がある場合にダウンロードボタンを追加
        if (msg.fileData) {
          const dlBtn = document.createElement('button');
          dlBtn.className = 'delete-btn'; dlBtn.textContent = 'ダウンロード';
          dlBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = msg.fileData;
            a.download = msg.fileName || 'download';
            a.click();
          });
          metaInfo.appendChild(dlBtn);
        }

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn'; delBtn.textContent = '削除';
        delBtn.addEventListener('click', () => deleteMessage(key));
        metaInfo.appendChild(delBtn);

        msgDiv.appendChild(senderName);
        msgDiv.appendChild(bubble);
        msgDiv.appendChild(metaInfo);
        chatBox.appendChild(msgDiv);
      });
      scrollToBottom();
    }

    userSelect.addEventListener('change', () => {
      localStorage.setItem(userStorageKey, userSelect.value);
      renderMessages();
    });

    onValue(messagesRef, (snapshot) => {
      cachedMessages = snapshot.val() || {};
      renderMessages();
    });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (!e.isComposing && e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // 起動時の自動ログイン判定処理（修正版キー名に対応）
    if (localStorage.getItem('family_chat_unlocked') === 'true' || sessionStorage.getItem('family_chat_unlocked') === 'true') {
      unlockApp();
    }
  </script>
</body>
</html>
