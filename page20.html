<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirDrop Lite - WebRTC File Transfer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
        .pulse-ring {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(14, 165, 233, 0); }
            100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-sky-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-sky-500/20">
                    <i class="fa-solid font-bold fa-bolt"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wide">AirDrop Lite</h1>
                    <p class="text-xs text-slate-400">P2P クロスプラットフォーム共有</p>
                </div>
            </div>

            <!-- Connection Status -->
            <div id="statusBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-medium">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="statusText">サーバー接続中...</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 grid gap-6 md:grid-cols-12">

        <!-- Left Column: My ID & QR Code / Join Connection (5 cols) -->
        <section class="md:col-span-5 space-y-6">
            
            <!-- My Device Info Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl relative overflow-hidden">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-mobile-screen text-sky-400"></i> この端末のID
                    </h2>
                    <button id="refreshIdBtn" title="IDを更新" class="text-slate-400 hover:text-white text-xs transition">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>

                <div class="flex items-center gap-2 bg-slate-950/70 border border-slate-800 rounded-xl p-3 mb-4">
                    <span id="myPeerId" class="font-mono text-sm font-bold text-sky-300 truncate flex-1">生成中...</span>
                    <button id="copyIdBtn" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition border border-slate-700 active:scale-95">
                        <i class="fa-regular fa-copy"></i> コピー
                    </button>
                </div>

                <!-- QR Code Display Area -->
                <div class="flex flex-col items-center justify-center p-4 bg-slate-950/40 rounded-xl border border-slate-800/80">
                    <div id="qrcode" class="p-3 bg-white rounded-xl shadow-md"></div>
                    <p class="text-xs text-slate-400 mt-3 text-center">
                        <i class="fa-solid fa-camera mr-1"></i> iPhoneのカメラで読み取ると自動接続できます
                    </p>
                </div>
            </div>

            <!-- Manual Connect Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-link text-sky-400"></i> 相手の端末に接続
                </h2>
                <div class="space-y-3">
                    <div>
                        <input type="text" id="targetPeerId" placeholder="相手のPeer IDを入力" 
                            class="w-full bg-slate-950 border border-slate-800 focus:border-sky-500 rounded-xl px-4 py-2.5 text-sm outline-none transition placeholder-slate-600 font-mono">
                    </div>
                    <button id="connectBtn" class="w-full bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-medium py-2.5 rounded-xl transition shadow-lg shadow-sky-600/20 text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> 接続を開始する
                    </button>
                </div>
            </div>

        </section>

        <!-- Right Column: Active Connection & Transfer UI (7 cols) -->
        <section class="md:col-span-7 space-y-6">

            <!-- Connection Control / Peer Details -->
            <div id="activePeerCard" class="hidden bg-slate-900 border border-sky-500/30 rounded-2xl p-5 shadow-xl">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-3 h-3 rounded-full bg-emerald-400 animate-ping"></div>
                        <div>
                            <span class="text-xs text-slate-400 block">接続中の端末</span>
                            <span id="remotePeerIdDisplay" class="font-mono text-sm font-bold text-emerald-400">---</span>
                        </div>
                    </div>
                    <button id="disconnectBtn" class="text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 px-3 py-1.5 rounded-lg transition">
                        切断する
                    </button>
                </div>
            </div>

            <!-- Drag & Drop Zone -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-share-nodes text-sky-400"></i> ファイル送信
                </h2>

                <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-sky-500/60 bg-slate-950/50 hover:bg-slate-950 rounded-xl p-8 text-center transition cursor-pointer group flex flex-col items-center justify-center min-h-[200px]">
                    <input type="file" id="fileInput" class="hidden" multiple>
                    <div class="w-16 h-16 rounded-full bg-slate-800 group-hover:bg-sky-500/10 group-hover:scale-110 flex items-center justify-center text-slate-400 group-hover:text-sky-400 transition duration-300 mb-3">
                        <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
                    </div>
                    <p class="text-sm font-medium text-slate-200">
                        ここにファイルをドラッグ＆ドロップ
                    </p>
                    <p class="text-xs text-slate-500 mt-1">またはクリックしてファイルを選択</p>
                </div>

                <!-- Progress Indicator (Hidden by default) -->
                <div id="transferProgressContainer" class="hidden mt-4 bg-slate-950 border border-slate-800 rounded-xl p-4">
                    <div class="flex items-center justify-between text-xs text-slate-300 mb-2">
                        <span id="transferFileName" class="truncate font-medium max-w-[200px]">filename.ext</span>
                        <span id="transferSpeed" class="font-mono text-slate-400">0 KB/s</span>
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden mb-1">
                        <div id="transferProgressBar" class="bg-gradient-to-r from-sky-500 to-indigo-500 h-2 rounded-full transition-all duration-150" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between text-[11px] text-slate-500 font-mono">
                        <span id="transferPercentage">0%</span>
                        <span id="transferStatusText">送信中...</span>
                    </div>
                </div>
            </div>

            <!-- Received Files List -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-inbox text-sky-400"></i> 受信したファイル
                </h2>

                <div id="receivedFilesList" class="space-y-3 max-h-[300px] overflow-y-auto pr-1">
                    <!-- Empty State -->
                    <div id="emptyReceivedState" class="text-center py-8 text-slate-600 text-xs">
                        まだ受信したファイルはありません
                    </div>
                </div>
            </div>

        </section>
    </main>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-xs w-full pointer-events-none"></div>

    <script>
        // State Management
        let peer = null;
        let activeConn = null;
        let myId = null;

        // Receiving File Chunk Logic
        let incomingFileInfo = null;
        let incomingChunks = [];
        let receivedSize = 0;

        // Sending File Chunk Logic
        const CHUNK_SIZE = 16 * 1024; // 16KB per WebRTC data chunk for stability

        // DOM Elements
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const myPeerIdEl = document.getElementById('myPeerId');
        const qrcodeEl = document.getElementById('qrcode');
        const copyIdBtn = document.getElementById('copyIdBtn');
        const refreshIdBtn = document.getElementById('refreshIdBtn');
        const targetPeerIdInput = document.getElementById('targetPeerId');
        const connectBtn = document.getElementById('connectBtn');
        const activePeerCard = document.getElementById('activePeerCard');
        const remotePeerIdDisplay = document.getElementById('remotePeerIdDisplay');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        const transferProgressContainer = document.getElementById('transferProgressContainer');
        const transferFileName = document.getElementById('transferFileName');
        const transferSpeed = document.getElementById('transferSpeed');
        const transferProgressBar = document.getElementById('transferProgressBar');
        const transferPercentage = document.getElementById('transferPercentage');
        const transferStatusText = document.getElementById('transferStatusText');
        const receivedFilesList = document.getElementById('receivedFilesList');
        const emptyReceivedState = document.getElementById('emptyReceivedState');

        window.addEventListener('load', () => {
            initPeer();
            setupEventListeners();
            checkUrlParameters();
        });

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center justify-between p-3.5 rounded-xl shadow-xl text-xs font-medium border transition-all duration-300 transform translate-y-2 opacity-0 ${
                type === 'error' ? 'bg-rose-950/90 border-rose-800 text-rose-200' :
                type === 'success' ? 'bg-emerald-950/90 border-emerald-800 text-emerald-200' :
                'bg-slate-800/90 border-slate-700 text-slate-200'
            }`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Initialize PeerJS Connection
        function initPeer() {
            updateStatus('connecting', 'サーバー接続中...');
            
            // Random short ID for better UX
            const randomId = Math.random().toString(36).substring(2, 8);
            
            peer = new Peer(randomId, {
                debug: 1
            });

            peer.on('open', (id) => {
                myId = id;
                myPeerIdEl.textContent = id;
                updateStatus('ready', '待機中 (接続準備完了)');
                generateQRCode(id);
            });

            peer.on('connection', (conn) => {
                handleConnection(conn);
            });

            peer.on('error', (err) => {
                console.error("PeerJS Error:", err);
                if (err.type === 'peer-not-found') {
                    showToast('指定されたIDが見つかりませんでした', 'error');
                } else {
                    showToast('通信エラーが発生しました: ' + err.type, 'error');
                }
                updateStatus('ready', '待機中');
            });

            peer.on('disconnected', () => {
                updateStatus('error', '切断されました');
            });
        }

        function updateStatus(type, text) {
            statusText.textContent = text;
            statusBadge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium border ';
            
            if (type === 'connecting') {
                statusBadge.className += 'bg-amber-500/10 border-amber-500/20 text-amber-400';
            } else if (type === 'ready') {
                statusBadge.className += 'bg-sky-500/10 border-sky-500/20 text-sky-400';
            } else if (type === 'connected') {
                statusBadge.className += 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400';
            } else {
                statusBadge.className += 'bg-rose-500/10 border-rose-500/20 text-rose-400';
            }
        }

        function generateQRCode(peerId) {
            qrcodeEl.innerHTML = "";
            const connectUrl = `${window.location.origin}${window.location.pathname}?join=${peerId}`;
            new QRCode(qrcodeEl, {
                text: connectUrl,
                width: 128,
                height: 128,
                colorDark: "#0284c7",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        function checkUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const joinId = urlParams.get('join');
            if (joinId) {
                targetPeerIdInput.value = joinId;
                // Wait briefly for peer open before connecting
                const checkInterval = setInterval(() => {
                    if (peer && !peer.disconnected && myId) {
                        clearInterval(checkInterval);
                        connectToPeer(joinId);
                    }
                }, 300);
            }
        }

        function connectToPeer(targetId) {
            if (!targetId) {
                showToast('IDを入力してください', 'error');
                return;
            }
            if (targetId === myId) {
                showToast('自分自身には接続できません', 'error');
                return;
            }

            updateStatus('connecting', '接続中...');
            const conn = peer.connect(targetId, { reliable: true });
            handleConnection(conn);
        }

        function handleConnection(conn) {
            if (activeConn) {
                activeConn.close();
            }

            activeConn = conn;

            activeConn.on('open', () => {
                updateStatus('connected', '接続済み');
                remotePeerIdDisplay.textContent = activeConn.peer;
                activePeerCard.classList.remove('hidden');
                showToast(`${activeConn.peer} と接続しました！`, 'success');
            });

            activeConn.on('data', (data) => {
                handleIncomingData(data);
            });

            activeConn.on('close', () => {
                showToast('接続が切断されました', 'info');
                activeConn = null;
                activePeerCard.classList.add('hidden');
                updateStatus('ready', '待機中');
            });

            activeConn.on('error', (err) => {
                showToast('接続エラー: ' + err, 'error');
            });
        }

        function handleIncomingData(data) {
            // Header Object
            if (data.type === 'file-header') {
                incomingFileInfo = data;
                incomingChunks = [];
                receivedSize = 0;
                
                transferProgressContainer.classList.remove('hidden');
                transferFileName.textContent = data.name;
                transferStatusText.textContent = '受信中...';
                updateProgress(0, 0);
            } 
            // Chunk ArrayBuffer
            else if (data.type === 'file-chunk') {
                incomingChunks.push(data.chunk);
                receivedSize += data.chunk.byteLength;

                const progress = (receivedSize / incomingFileInfo.size) * 100;
                updateProgress(progress, receivedSize);

                if (receivedSize >= incomingFileInfo.size) {
                    // File receive complete
                    const blob = new Blob(incomingChunks, { type: incomingFileInfo.fileType });
                    addReceivedFile(incomingFileInfo.name, blob, incomingFileInfo.size);
                    
                    showToast(`${incomingFileInfo.name} を受信しました`, 'success');
                    transferStatusText.textContent = '受信完了';
                    setTimeout(() => {
                        transferProgressContainer.classList.add('hidden');
                    }, 2000);
                    
                    incomingFileInfo = null;
                    incomingChunks = [];
                }
            }
        }

        async function sendFiles(files) {
            if (!activeConn || !activeConn.open) {
                showToast('まず相手の端末に接続してください', 'error');
                return;
            }

            for (let file of files) {
                transferProgressContainer.classList.remove('hidden');
                transferFileName.textContent = file.name;
                transferStatusText.textContent = '送信準備中...';
                
                // 1. Send Header
                activeConn.send({
                    type: 'file-header',
                    name: file.name,
                    size: file.size,
                    fileType: file.type
                });

                // 2. Read and Chunk File
                let offset = 0;
                const startTime = Date.now();

                transferStatusText.textContent = '送信中...';

                while (offset < file.size) {
                    const slice = file.slice(offset, offset + CHUNK_SIZE);
                    const buffer = await slice.arrayBuffer();

                    activeConn.send({
                        type: 'file-chunk',
                        chunk: buffer
                    });

                    offset += buffer.byteLength;
                    const progress = (offset / file.size) * 100;
                    updateProgress(progress, offset, startTime);

                    // Slight pause to prevent WebRTC queue overflow
                    if (offset % (CHUNK_SIZE * 10) === 0) {
                        await new Promise(r => setTimeout(r, 10));
                    }
                }

                showToast(`${file.name} の送信が完了しました`, 'success');
                transferStatusText.textContent = '送信完了';
                setTimeout(() => {
                    transferProgressContainer.classList.add('hidden');
                }, 2000);
            }
        }

        function updateProgress(percent, bytesProcessed) {
            transferProgressBar.style.width = `${percent.toFixed(1)}%`;
            transferPercentage.textContent = `${percent.toFixed(0)}%`;
        }

        function addReceivedFile(name, blob, size) {
            emptyReceivedState.classList.add('hidden');

            const fileUrl = URL.createObjectURL(blob);
            const isImage = blob.type.startsWith('image/');

            const item = document.createElement('div');
            item.className = 'flex items-center justify-between p-3 bg-slate-950/60 border border-slate-800 rounded-xl hover:border-slate-700 transition';

            item.innerHTML = `
                <div class="flex items-center gap-3 overflow-hidden mr-2">
                    <div class="w-10 h-10 rounded-lg bg-slate-800 flex items-center justify-center shrink-0 text-sky-400">
                        ${isImage ? `<img src="${fileUrl}" class="w-full h-full object-cover rounded-lg">` : '<i class="fa-solid fa-file"></i>'}
                    </div>
                    <div class="truncate">
                        <p class="text-xs font-medium text-slate-200 truncate">${escapeHtml(name)}</p>
                        <p class="text-[10px] text-slate-500">${formatBytes(size)}</p>
                    </div>
                </div>
                <a href="${fileUrl}" download="${escapeHtml(name)}" class="shrink-0 px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-download"></i> 保存
                </a>
            `;

            receivedFilesList.prepend(item);
        }

        function setupEventListeners() {
            // Copy ID Button
            copyIdBtn.addEventListener('click', () => {
                if (!myId) return;
                const tempInput = document.createElement('input');
                tempInput.value = myId;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showToast('IDをコピーしました', 'success');
            });

            // Refresh ID
            refreshIdBtn.addEventListener('click', () => {
                if (peer) peer.destroy();
                initPeer();
            });

            // Manual Connect
            connectBtn.addEventListener('click', () => {
                const targetId = targetPeerIdInput.value.trim();
                connectToPeer(targetId);
            });

            // Disconnect
            disconnectBtn.addEventListener('click', () => {
                if (activeConn) {
                    activeConn.close();
                }
            });

            // Drag and Drop
            dropZone.addEventListener('click', () => fileInput.click());

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('border-sky-500', 'bg-sky-500/10');
            });

            ['dragleave', 'dragend'].forEach(type => {
                dropZone.addEventListener(type, () => {
                    dropZone.classList.remove('border-sky-500', 'bg-sky-500/10');
                });
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-sky-500', 'bg-sky-500/10');
                if (e.dataTransfer.files.length > 0) {
                    sendFiles(e.dataTransfer.files);
                }
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    sendFiles(e.target.files);
                }
            });
        }

        // Utilities
        function formatBytes(bytes, decimals = 1) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            })[m]);
        }
    </script>
</body>
</html>
