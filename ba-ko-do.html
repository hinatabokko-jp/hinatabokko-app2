<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バーコード生成ツール</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --text: #e0e0e0;
    --accent: #4dabf7;
    --border: #333;
  }
  body {
    font-family: sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 16px;
  }
  .box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 6px;
  }
  input[type="text"], select {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    background: #2a2a2a;
    color: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 1.05rem;
    margin-bottom: 14px;
  }
  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .barcode-display {
    background: #ffffff;
    border-radius: 8px;
    padding: 20px 12px;
    text-align: center;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #barcodeCanvas {
    max-width: 100%;
    height: auto;
  }
  .error-msg {
    color: #ff6b6b;
    font-size: 0.9rem;
    display: none;
  }
  button {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    width: 100%;
    margin-top: 12px;
  }
  button:disabled {
    background: #444;
    color: #888;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="container">
  <h1>バーコード生成ツール</h1>

  <div class="box">
    <label for="codeInput">バーコードにする数字・文字列</label>
    <input type="text" id="codeInput" placeholder="例: 4987123456789" value="0104987123456789" autofocus>

    <label for="formatSelect">バーコード規格</label>
    <select id="formatSelect">
      <option value="CODE128" selected>CODE128（汎用・医療材料のGS1テスト向け）</option>
      <option value="EAN13">JAN / EAN-13（13桁の数字）</option>
      <option value="EAN8">JAN / EAN-8（8桁の数字）</option>
      <option value="ITF">ITF（物流・梱包用・偶数桁の数字）</option>
      <option value="CODE39">CODE39（英数字・記号）</option>
    </select>
  </div>

  <div class="box">
    <label>生成されたバーコード（読み取り可能）</label>
    <div class="barcode-display">
      <canvas id="barcodeCanvas"></canvas>
      <div id="errorMsg" class="error-msg">入力形式が選択した規格に合っていません</div>
    </div>
    <button id="downloadBtn">PNG画像として保存</button>
  </div>
</div>

<script>
const codeInput = document.getElementById('codeInput');
const formatSelect = document.getElementById('formatSelect');
const canvas = document.getElementById('barcodeCanvas');
const errorMsg = document.getElementById('errorMsg');
const downloadBtn = document.getElementById('downloadBtn');

function generateBarcode() {
  const val = codeInput.value.trim();
  const format = formatSelect.value;

  if (!val) {
    canvas.style.display = 'none';
    errorMsg.style.display = 'block';
    errorMsg.textContent = '数字または文字列を入力してください';
    downloadBtn.disabled = true;
    return;
  }

  try {
    JsBarcode(canvas, val, {
      format: format,
      lineColor: "#000000",
      background: "#ffffff",
      width: 2,
      height: 80,
      displayValue: true,
      fontSize: 16,
      margin: 10
    });
    canvas.style.display = 'block';
    errorMsg.style.display = 'none';
    downloadBtn.disabled = false;
  } catch (e) {
    canvas.style.display = 'none';
    errorMsg.style.display = 'block';
    errorMsg.textContent = `選択した規格（${format}）の桁数や文字ルールに合っていません`;
    downloadBtn.disabled = true;
  }
}

// 入力や規格変更時にリアルタイム更新
codeInput.addEventListener('input', generateBarcode);
formatSelect.addEventListener('change', generateBarcode);

// 画像ダウンロード処理
downloadBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  const val = codeInput.value.trim() || 'barcode';
  link.download = `barcode_${val}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

// 初回表示
generateBarcode();
</script>
</body>
</html>
