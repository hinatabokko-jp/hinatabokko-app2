<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>TODAY'S MENU | MY RECIPE BOOK</title>
<style>
:root{
  --bg:#111214;--panel:#191a1e;--panel2:#202126;--line:#34353b;
  --text:#eee9e1;--muted:#9a958d;--accent:#c7a77b;--accent2:#e0c49a;
  --radius:15px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;letter-spacing:.015em}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;position:sticky;top:0;background:rgba(17,18,20,.94);backdrop-filter:blur(14px);z-index:5}
.brand{font-family:Georgia,serif;letter-spacing:.16em;font-size:16px}.brand small{display:block;font:9px Inter,sans-serif;color:var(--muted);letter-spacing:.25em;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:9px;font-size:12px}
.btn.primary{background:var(--accent);color:#171512;border-color:var(--accent);font-weight:700}
main{max-width:1500px;margin:auto;padding:30px 4vw 70px}
.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--accent);text-transform:uppercase}
h1,h2,h3,p{margin-top:0}
.pagehead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}
.pagehead h1{font:clamp(30px,4vw,48px)/1.05 Georgia,serif;font-weight:400;margin:8px 0}
.pagehead p{color:var(--muted);font-size:12px;margin:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.search{flex:1;min-width:190px;position:relative}
.search input{width:100%;background:#151619;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:12px 13px 12px 38px;outline:none}
input:focus,select:focus{border-color:var(--accent)!important;box-shadow:0 0 0 2px #c7a77b20}
.search:before{content:"⌕";position:absolute;left:13px;top:7px;font-size:22px;color:var(--muted)}
select{color-scheme:dark}
.filters{display:flex;gap:7px;overflow:auto;padding-bottom:8px;margin-bottom:24px}
.chip{white-space:nowrap;border:1px solid var(--line);border-radius:30px;background:transparent;color:var(--muted);padding:7px 12px;font-size:11px}
.chip.active{background:#3a3329;border-color:#806b4e;color:var(--accent2)}
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.recipe-card{border:1px solid var(--line);background:var(--panel);border-radius:13px;overflow:hidden;min-width:0}
.card-image{height:150px;background:linear-gradient(135deg,#292a2e,#1c1d21);display:flex;align-items:center;justify-content:center;color:#71695e;overflow:hidden}
.card-image img{width:100%;height:100%;object-fit:cover}
.card-image .no-photo{font:italic 27px Georgia,serif;letter-spacing:.08em;color:#827766}
.card-body{padding:15px}
.card-meta{font-size:9px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.card-title{font:22px/1.3 Georgia,"Noto Serif JP",serif;margin:0 0 8px;overflow-wrap:anywhere}
.card-note{font-size:11px;line-height:1.7;color:var(--muted);min-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:14px}
.star{color:var(--accent);font-size:16px}
.empty{border:1px dashed #45434a;border-radius:14px;padding:55px 20px;text-align:center;color:var(--muted);grid-column:1/-1}
.empty strong{display:block;color:var(--text);font:24px Georgia,serif;margin-bottom:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#e0c49a;color:#171512;padding:11px 17px;border-radius:30px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1}

@media(max-width:760px){
  .topbar{height:58px;padding:0 17px}
  main{padding:24px 16px 50px}
  .pagehead{align-items:start;flex-direction:column;margin-bottom:18px}
  .pagehead h1{font-size:35px}
  .toolbar{gap:8px}
  .recipe-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card-image{height:118px}
  .card-body{padding:11px}
  .card-title{font-size:17px}
  .card-note{font-size:10px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">MY RECIPE BOOK<small>DINNER MENU CATALOG</small></div>
  </header>
  <main>
    <section id="listView">
      <div class="pagehead">
        <div>
          <div class="eyebrow">What would you like for dinner?</div>
          <h1>Menu</h1>
          <p id="countText">LOADING MENU...</p>
        </div>
      </div>
      <div class="toolbar">
        <div class="search"><input id="searchInput" placeholder="料理名・メモから検索"></div>
        <button class="btn" id="favoritesOnly">☆ お気に入り</button>
        <select class="btn" id="sortSelect" aria-label="並び順">
          <option value="updated">更新順</option>
          <option value="created">登録順</option>
          <option value="name">料理名順</option>
        </select>
      </div>
      <div class="filters" id="categoryFilters"></div>
      <div class="recipe-grid" id="recipeGrid"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(() => {
'use strict';

// 元のデータベースと共通の設定
const FIREBASE_CONFIG_B64 = 'eyJhcGlLZXkiOiJBSXphU3lDUGtaeG5NaDc5RDFPeEl4WVpiQmJMTEJpMndseWFhOFkiLCJhdXRoRG9tYWluIjoibWVtby0zMjk3OS5maXJlYmFzZWFwcC5jb20iLCJkYXRhYmFzZVVSTCI6Imh0dHBzOi8vbWVtby0zMjk3OS1kZWZhdWx0LXJ0ZGIuZmlyZWJhc2Vpby5jb20iLCJwcm9qZWN0SWQiOiJtZW1vLTMyOTc5Iiwic3RvcmFnZUJ1Y2tldCI6Im1lbW8tMzI5NzkuZmlyZWJhc2VzdG9yYWdlLmFwcCIsIm1lc3NhZ2luZ1NlbmRlcklkIjoiNzk4NDU3OTAwODU3IiwiYXBwSWQiOiIxOjc5ODQ1NzkwMDg1Nzp3ZWI6OGI1YWMyODEyYWVlOGMzYzg0MDJlOCIsIm1lYXN1cmVtZW50SWQiOiJHLTdaRkpGVFRITlcifQ==';
const firebaseConfig = JSON.parse(decodeURIComponent(escape(atob(FIREBASE_CONFIG_B64))));
const CATEGORIES = ['肉料理','魚料理','野菜料理','副菜','汁物・スープ','ご飯・麺類','パン','お菓子・デザート','その他'];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let db, auth, recipes = [];
let activeCategory = 'すべて', favoritesMode = false;

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function categoryOptions() {
  $('categoryFilters').innerHTML = ['すべて', ...CATEGORIES]
    .map(c => `<button class="chip ${c === 'すべて' ? 'active' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`)
    .join('');
}

function card(r) {
  const img = r.photo ? `<img src="${r.photo}" alt="${esc(r.name)}">` : `<div class="no-photo">MENU</div>`;
  const noteText = (r.memo || r.body || '').replace(/\s+/g, ' ').slice(0, 75);
  return `
    <article class="recipe-card">
      <div class="card-image">${img}</div>
      <div class="card-body">
        <div class="card-meta">${esc(r.category || 'その他')}</div>
        <h3 class="card-title">${esc(r.name)}</h3>
        <div class="card-note">${esc(noteText)}</div>
        <div class="card-foot">
          <span>${r.time ? esc(r.time + ' MIN') : ''} ${r.servings ? ' · ' + esc(r.servings) : ''}</span>
          <span class="star">${r.favorite ? '★' : ''}</span>
        </div>
      </div>
    </article>`;
}

function renderList() {
  const q = $('searchInput').value.trim().toLocaleLowerCase();
  const arr = recipes.filter(r =>
    (activeCategory === 'すべて' || r.category === activeCategory) &&
    (!favoritesMode || r.favorite) &&
    (!q || [r.name, r.memo, r.category].join(' ').toLocaleLowerCase().includes(q))
  );

  const sort = $('sortSelect').value;
  arr.sort((a, b) =>
    sort === 'name' ? a.name.localeCompare(b.name, 'ja') :
    sort === 'created' ? (b.created || 0) - (a.created || 0) :
    (b.updated || 0) - (a.updated || 0)
  );

  $('countText').textContent = `${recipes.length} DISHES AVAILABLE`;
  $('recipeGrid').innerHTML = arr.length
    ? arr.map(card).join('')
    : `<div class="empty"><strong>${recipes.length ? 'No dishes found' : 'Menu is empty.'}</strong>${recipes.length ? '条件に合う料理が見つかりませんでした。' : 'まだ料理が登録されていません。'}</div>`;
}

async function refresh() {
  const snap = await db.ref('recipes').once('value');
  const data = snap.val() || {};
  recipes = Object.entries(data).map(([id, r]) => ({ ...r, id }));
  renderList();
}

$('searchInput').oninput = renderList;
$('sortSelect').onchange = renderList;
$('favoritesOnly').onclick = () => {
  favoritesMode = !favoritesMode;
  $('favoritesOnly').classList.toggle('primary', favoritesMode);
  renderList();
};
$('categoryFilters').onclick = e => {
  const b = e.target.closest('[data-cat]');
  if (!b) return;
  activeCategory = b.dataset.cat;
  document.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x.dataset.cat === activeCategory));
  renderList();
};

(async () => {
  try {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.database();
    await auth.signInAnonymously();
    categoryOptions();
    await refresh();
  } catch (e) {
    console.error('Firebase initialization error:', e);
    $('countText').textContent = 'CONNECTION ERROR';
    toast('メニューの読み込みに失敗しました');
  }
})();
})();
</script>
</body>
</html>
