<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>MENU</title>
<style>
:root{
  --bg:#111214;--panel:#191a1e;--panel2:#202126;--line:#34353b;
  --text:#eee9e1;--muted:#9a958d;--accent:#c7a77b;--accent2:#e0c49a;
  --radius:15px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;letter-spacing:.015em;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;flex-shrink:0;background:rgba(17,18,20,.94);backdrop-filter:blur(14px);z-index:5}
.brand{font-family:Georgia,serif;letter-spacing:.16em;font-size:16px}.brand small{display:block;font:9px Inter,sans-serif;color:var(--muted);letter-spacing:.25em;margin-top:4px}
.top-actions{display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:9px;font-size:12px;display:inline-flex;align-items:center;gap:6px;position:relative;transition:.15s}
.btn:hover:not(:disabled){border-color:#806b4e}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#171512;border-color:var(--accent);font-weight:700}
.btn.primary:hover:not(:disabled){background:var(--accent2);border-color:var(--accent2)}
.badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent2);color:#171512;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;border:2px solid var(--bg)}
.badge.show{display:inline-flex}

.workspace{flex:1;min-height:0;display:flex;flex-direction:row;max-width:1600px;width:100%;margin:0 auto;overflow:hidden}
.menu-pane{flex:2;min-width:0;min-height:0;display:flex;flex-direction:column;padding:20px 24px 24px 4vw;overflow:hidden}
.menu-scroll{flex:1;min-height:0;overflow-y:auto;padding-right:4px;padding-bottom:24px}

.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--accent);text-transform:uppercase}
h1,h2,h3,p{margin-top:0}
.pagehead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:16px;flex-shrink:0}
.pagehead h1{font:clamp(28px,3.6vw,44px)/1.05 Georgia,serif;font-weight:400;margin:6px 0}
.pagehead p{color:var(--muted);font-size:12px;margin:0}
.sub-caption{color:var(--muted);font-size:11px;margin-top:4px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;flex-shrink:0}
.search{flex:1;min-width:170px;position:relative}
.search input{width:100%;background:#151619;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:11px 13px 11px 38px;outline:none}
input:focus,select:focus{border-color:var(--accent)!important;box-shadow:0 0 0 2px #c7a77b20}
.search:before{content:"⌕";position:absolute;left:13px;top:6px;font-size:22px;color:var(--muted)}
select{color-scheme:dark}
.filters{display:flex;gap:7px;overflow:auto;padding-bottom:8px;margin-bottom:14px;flex-shrink:0}
.chip{white-space:nowrap;border:1px solid var(--line);border-radius:30px;background:transparent;color:var(--muted);padding:7px 12px;font-size:11px;transition:.15s}
.chip:hover{border-color:#696258;color:var(--text)}
.chip.active{background:#3a3329;border-color:#806b4e;color:var(--accent2)}

.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.recipe-card{border:1px solid var(--line);background:var(--panel);border-radius:13px;overflow:hidden;min-width:0;position:relative;cursor:pointer;transition:.16s;display:flex;flex-direction:column}
.recipe-card:hover{border-color:#806b4e;transform:translateY(-1px)}
.recipe-card:active{transform:scale(.98)}
.card-badge{position:absolute;top:10px;right:10px;background:var(--accent);color:#171512;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.45)}
.card-image{height:142px;background:linear-gradient(135deg,#292a2e,#1c1d21);display:flex;align-items:center;justify-content:center;color:#71695e;overflow:hidden;flex-shrink:0}
.card-image img{width:100%;height:100%;object-fit:cover}
.card-image .no-photo{font:italic 27px Georgia,serif;letter-spacing:.08em;color:#827766}
.card-body{padding:14px;flex:1;display:flex;flex-direction:column;justify-content:center}
.card-title{font:20px/1.3 Georgia,"Noto Serif JP",serif;margin:0;overflow-wrap:anywhere}

.tray-pane{flex:1;min-width:130px;max-width:420px;height:100%;min-height:0;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.tray-head{padding:16px 18px;border-bottom:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.tray-head h2{font:18px/1.25 Georgia,"Noto Serif JP",serif;margin:0;color:var(--accent2)}
.tray-head p{font-size:11px;color:var(--muted);margin:3px 0 0}
.link-btn{background:none;border:none;color:var(--muted);font-size:11px;text-decoration:underline;padding:4px}
.link-btn:hover{color:var(--accent2)}
.tray-items{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.tray-empty{height:100%;min-height:140px;border:1px dashed #45434a;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted)}
.tray-empty strong{font:15px Georgia,"Noto Serif JP",serif;color:var(--text);display:block;margin-bottom:6px}
.tray-empty span{font-size:11px;line-height:1.6}
.tray-row{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.tray-item-info{display:flex;align-items:center;gap:10px;min-width:0}
.tray-thumb{width:44px;height:44px;border-radius:8px;background:#151619;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;font:italic 11px Georgia,serif;color:var(--muted)}
.tray-thumb img{width:100%;height:100%;object-fit:cover}
.tray-name{font:14px/1.3 Georgia,"Noto Serif JP",serif;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qty-box{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.qty-btn:hover{border-color:#806b4e;color:var(--accent2)}
.qty-num{min-width:20px;text-align:center;font-weight:700;font-size:13px;color:var(--accent2)}

.tray-foot{padding:14px 16px;border-top:1px solid var(--line);background:#151619;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.tray-summary{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:0 2px}
.tray-summary strong{color:var(--text);font-size:16px;font-family:Georgia,serif;margin:0 3px}
.order-submit{width:100%;padding:13px 16px;border-radius:11px;font-size:13px;justify-content:center}

.empty{border:1px dashed #45434a;border-radius:14px;padding:55px 20px;text-align:center;color:var(--muted);grid-column:1/-1}
.empty strong{display:block;color:var(--text);font:24px Georgia,serif;margin-bottom:8px}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal-backdrop.open{display:flex}
.modal-card{width:100%;max-width:440px;background:var(--panel);border:1px solid #57524a;border-radius:var(--radius);overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.65)}
.modal-card.wide{max-width:680px;max-height:88dvh;display:flex;flex-direction:column}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-head h3{font:20px/1.3 Georgia,"Noto Serif JP",serif;margin:0}
.icon-close{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.icon-close:hover{color:var(--text);border-color:#806b4e}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);background:#151619;display:flex;gap:10px;justify-content:flex-end}
.modal-item-preview{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.modal-item-preview img,.modal-item-preview .no-photo-sm{width:76px;height:76px;border-radius:12px;object-fit:cover;background:#151619;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font:italic 14px Georgia,serif;color:var(--muted)}
.qty-picker{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:#151619}
.qty-picker .qty-btn{width:38px;height:38px;font-size:18px}
.qty-picker .qty-num{font-size:20px;min-width:32px}

.order-ticket{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:14px;margin-bottom:12px}
.order-ticket-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line);font-size:12px}
.status-pill{padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.08em;background:#3a3329;color:var(--accent2);border:1px solid #806b4e}
.status-pill.done{background:transparent;color:var(--muted);border-color:var(--line)}
.ticket-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}
.ticket-row strong{color:var(--accent2);font-family:Georgia,serif}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#e0c49a;color:#171512;padding:11px 17px;border-radius:30px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1}

@media(max-width:760px){
  .topbar{height:58px;padding:0 14px}
  .brand{font-size:14px}
  .btn{padding:8px 10px;font-size:11px}
  .menu-pane{padding:16px 10px 16px 14px}
  .pagehead{align-items:start;flex-direction:column;margin-bottom:12px;gap:6px}
  .pagehead h1{font-size:30px}
  .toolbar{gap:8px;margin-bottom:10px}
  .filters{margin-bottom:10px}
  .recipe-grid{grid-template-columns:repeat(1,minmax(0,1fr));gap:10px}
  .card-image{height:112px}
  .card-body{padding:11px}
  .card-title{font-size:16px}
  .tray-pane{max-width:none}
  .tray-head{padding:12px 10px}
  .tray-head h2{font-size:14px}
  .tray-items{padding:10px 8px}
  .tray-row{padding:8px;flex-direction:column;align-items:stretch}
  .tray-thumb{width:36px;height:36px}
  .tray-name{font-size:12px}
  .qty-box{justify-content:flex-end}
  .qty-btn{width:24px;height:24px;font-size:13px}
  .tray-foot{padding:10px 8px}
  .order-submit{padding:11px 10px;font-size:12px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">MY RECIPE BOOK<small>DINNER MENU CATALOG</small></div>
    <div class="top-actions">
      <button class="btn" id="soundToggle" type="button" title="呼び出しベル音のオン/オフ">
        <span id="soundIcon">🔔</span>
        <span id="soundLabel">ベルON</span>
      </button>
      <button class="btn" id="kitchenBtn" type="button">
        <span>📋</span>
        <span>注文履歴</span>
        <span class="badge" id="orderBadge">0</span>
      </button>
    </div>
  </header>

  <div class="workspace">
    <main class="menu-pane">
      <section id="listView" style="display:flex;flex-direction:column;min-height:0;height:100%;">
        <div class="pagehead">
          <div>
            <div class="eyebrow">What would you like for dinner?</div>
            <h1>Menu</h1>
            <p id="countText">LOADING MENU...</p>
            <div class="sub-caption">料理をタップしてトレーに入れられます</div>
          </div>
        </div>
        <div class="toolbar">
          <div class="search"><input id="searchInput" placeholder="料理名・メモから検索"></div>
          <button class="btn" id="favoritesOnly" type="button">☆ お気に入り</button>
          <select class="btn" id="sortSelect" aria-label="並び順">
            <option value="updated">更新順</option>
            <option value="created">登録順</option>
            <option value="name">料理名順</option>
          </select>
        </div>
        <div class="filters" id="categoryFilters"></div>
        <div class="menu-scroll">
          <div class="recipe-grid" id="recipeGrid"></div>
        </div>
      </section>
    </main>

    <aside class="tray-pane" aria-label="ご注文トレー">
      <div class="tray-head">
        <div>
          <h2>ご注文トレー</h2>
          <p>決まったら注文ボタンを押してね</p>
        </div>
        <button class="link-btn" id="clearTrayBtn" type="button" style="display:none;">全部消す</button>
      </div>

      <div class="tray-items" id="trayItems">
        <div class="tray-empty" id="trayEmpty">
          <strong>まだ何も入っていません</strong>
          <span>左の料理をタッチして<br>選んでね</span>
        </div>
      </div>

      <div class="tray-foot">
        <div class="tray-summary">
          <span>えらんだ数</span>
          <span><strong id="trayCount">0</strong>品</span>
        </div>
        <button class="btn primary order-submit" id="submitOrderBtn" type="button" disabled>
          <span>🛎️</span>
          <span>注文する</span>
        </button>
      </div>
    </aside>
  </div>
</div>

<!-- 数量選択モーダル -->
<div class="modal-backdrop" id="itemModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle">料理を追加</h3>
      <button class="icon-close" id="closeItemModal" type="button" aria-label="閉じる">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-item-preview">
        <div id="modalThumb"></div>
        <div>
          <div class="card-title" id="modalName" style="margin-bottom:0;">料理名</div>
        </div>
      </div>
      <div class="qty-picker">
        <span style="font-size:13px;font-weight:700;">数量</span>
        <div class="qty-box">
          <button class="qty-btn" id="modalMinus" type="button" aria-label="減らす">−</button>
          <span class="qty-num" id="modalQty">1</span>
          <button class="qty-btn" id="modalPlus" type="button" aria-label="増やす">＋</button>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="cancelItemModal" type="button">もどる</button>
      <button class="btn primary" id="confirmAddModal" type="button">トレーに入れる</button>
    </div>
  </div>
</div>

<!-- 注文完了モーダル -->
<div class="modal-backdrop" id="successModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-head">
      <h3>ご注文を承りました</h3>
      <button class="icon-close" id="closeSuccessModal" type="button" aria-label="閉じる">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:14px;">
        注文を記録しました。できあがりまでお待ちください。
      </p>
      <div class="order-ticket" style="margin-bottom:0;">
        <div class="order-ticket-head">
          <span style="color:var(--accent2);font-weight:700;">ご注文控え</span>
          <span id="receiptTime" style="color:var(--muted);"></span>
        </div>
        <div id="receiptRows"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn primary" id="okSuccessModal" type="button" style="width:100%;justify-content:center;">メニューにもどる</button>
    </div>
  </div>
</div>

<!-- 注文履歴・確認モーダル -->
<div class="modal-backdrop" id="ordersModal" role="dialog" aria-modal="true">
  <div class="modal-card wide">
    <div class="modal-head">
      <h3>本日の注文一覧</h3>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn" id="clearOrdersBtn" type="button">履歴クリア</button>
        <button class="icon-close" id="closeOrdersModal" type="button" aria-label="閉じる">✕</button>
      </div>
    </div>
    <div class="modal-body" id="ordersModalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(() => {
'use strict';

// 元のデータベースと共通の設定（難読化済み）
const FIREBASE_CONFIG_B64 = 'eyJhcGlLZXkiOiJBSXphU3lDUGtaeG5NaDc5RDFPeEl4WVpiQmJMTEJpMndseWFhOFkiLCJhdXRoRG9tYWluIjoibWVtby0zMjk3OS5maXJlYmFzZWFwcC5jb20iLCJkYXRhYmFzZVVSTCI6Imh0dHBzOi8vbWVtby0zMjk3OS1kZWZhdWx0LXJ0ZGIuZmlyZWJhc2Vpby5jb20iLCJwcm9qZWN0SWQiOiJtZW1vLTMyOTc5Iiwic3RvcmFnZUJ1Y2tldCI6Im1lbW8tMzI5NzkuZmlyZWJhc2VzdG9yYWdlLmFwcCIsIm1lc3NhZ2luZ1NlbmRlcklkIjoiNzk4NDU3OTAwODU3IiwiYXBwSWQiOiIxOjc5ODQ1NzkwMDg1Nzp3ZWI6OGI1YWMyODEyYWVlOGMzYzg0MDJlOCIsIm1lYXN1cmVtZW50SWQiOiJHLTdaRkpGVFRITlcifQ==';
const firebaseConfig = JSON.parse(decodeURIComponent(escape(atob(FIREBASE_CONFIG_B64))));
const CATEGORIES = ['肉料理','魚料理','野菜料理','副菜','汁物・スープ','ご飯・麺類','パン','お菓子・デザート','その他'];
const STORAGE_KEYS = {
  SOUND: 'recipe_book_sound_v1'
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let db, auth, recipes = [];
let activeCategory = 'すべて', favoritesMode = false;
let tray = [];
let orders = [];
let selectedRecipe = null;
let modalQty = 1;
let soundEnabled = true;
let ordersRef = null;

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function loadLocalState() {
  try {
    const savedSound = localStorage.getItem(STORAGE_KEYS.SOUND);
    soundEnabled = savedSound !== null ? JSON.parse(savedSound) : true;
  } catch (e) {
    soundEnabled = true;
  }
  updateSoundUI();
  updateOrderBadge();
}

function updateSoundUI() {
  $('soundIcon').textContent = soundEnabled ? '🔔' : '🔕';
  $('soundLabel').textContent = soundEnabled ? 'ベルON' : 'ベルOFF';
}

function playChime() {
  if (!soundEnabled) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;
    [1046.5, 2093.0].forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(idx === 0 ? 0.25 : 0.1, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 1.25);
    });
  } catch (e) {}
}

function updateOrderBadge() {
  const pending = orders.filter(o => o.status !== 'done').length;
  const badge = $('orderBadge');
  badge.textContent = pending;
  badge.classList.toggle('show', pending > 0);
}

function categoryOptions() {
  $('categoryFilters').innerHTML = ['すべて', ...CATEGORIES]
    .map(c => `<button class="chip ${c === 'すべて' ? 'active' : ''}" type="button" data-cat="${esc(c)}">${esc(c)}</button>`)
    .join('');
}

function card(r) {
  const img = r.photo ? `<img src="${r.photo}" alt="${esc(r.name)}">` : `<div class="no-photo">MENU</div>`;
  const inTray = tray.filter(t => t.id === r.id).reduce((s, t) => s + t.qty, 0);
  return `
    <article class="recipe-card" data-id="${esc(r.id)}">
      ${inTray > 0 ? `<div class="card-badge">トレーに ${inTray}</div>` : ''}
      <div class="card-image">${img}</div>
      <div class="card-body">
        <h3 class="card-title">${esc(r.name)}</h3>
      </div>
    </article>`;
}

function renderList() {
  const q = $('searchInput').value.trim().toLocaleLowerCase();
  const arr = recipes.filter(r =>
    (activeCategory === 'すべて' || r.category === activeCategory) &&
    (!favoritesMode || r.favorite) &&
    (!q || [r.name, r.memo, r.category].join(' ').toLocaleLowerCase().includes(q))
  );

  const sort = $('sortSelect').value;
  arr.sort((a, b) =>
    sort === 'name' ? a.name.localeCompare(b.name, 'ja') :
    sort === 'created' ? (b.created || 0) - (a.created || 0) :
    (b.updated || 0) - (a.updated || 0)
  );

  $('countText').textContent = `${recipes.length} DISHES AVAILABLE`;
  $('recipeGrid').innerHTML = arr.length
    ? arr.map(card).join('')
    : `<div class="empty"><strong>${recipes.length ? 'No dishes found' : 'Menu is empty.'}</strong>${recipes.length ? '条件に合う料理が見つかりませんでした。' : 'まだ料理が登録されていません。'}</div>`;
}

function openItemModal(id) {
  const item = recipes.find(r => r.id === id);
  if (!item) return;
  selectedRecipe = item;
  modalQty = 1;
  $('modalQty').textContent = modalQty;
  $('modalName').textContent = item.name;
  $('modalThumb').innerHTML = item.photo
    ? `<img src="${item.photo}" alt="${esc(item.name)}">`
    : `<div class="no-photo-sm">MENU</div>`;
  $('itemModal').classList.add('open');
}

function closeItemModal() {
  $('itemModal').classList.remove('open');
  selectedRecipe = null;
}

function addSelectedToTray() {
  if (!selectedRecipe) return;
  const existing = tray.find(t => t.id === selectedRecipe.id);
  if (existing) {
    existing.qty += modalQty;
  } else {
    tray.push({
      id: selectedRecipe.id,
      name: selectedRecipe.name,
      category: selectedRecipe.category || 'その他',
      photo: selectedRecipe.photo || '',
      qty: modalQty
    });
  }
  toast(`「${selectedRecipe.name}」をトレーに入れました`);
  closeItemModal();
  renderTray();
  renderList();
}

function renderTray() {
  const container = $('trayItems');
  const emptyEl = $('trayEmpty');
  const totalQty = tray.reduce((s, t) => s + t.qty, 0);

  $('trayCount').textContent = totalQty;
  $('submitOrderBtn').disabled = totalQty === 0;
  $('clearTrayBtn').style.display = totalQty > 0 ? 'inline-block' : 'none';

  container.querySelectorAll('.tray-row').forEach(el => el.remove());
  emptyEl.style.display = totalQty === 0 ? 'flex' : 'none';

  if (totalQty === 0) return;

  const html = tray.map(item => `
    <div class="tray-row" data-tray-id="${esc(item.id)}">
      <div class="tray-item-info">
        <div class="tray-thumb">${item.photo ? `<img src="${item.photo}" alt="${esc(item.name)}">` : 'MENU'}</div>
        <div style="min-width:0;">
          <div class="tray-name">${esc(item.name)}</div>
        </div>
      </div>
      <div class="qty-box">
        <button class="qty-btn" type="button" data-delta="-1" aria-label="減らす">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" type="button" data-delta="1" aria-label="増やす">＋</button>
      </div>
    </div>
  `).join('');

  container.insertAdjacentHTML('beforeend', html);
}

async function submitOrder() {
  if (tray.length === 0 || !ordersRef) return;
  const now = new Date();
  const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  const stamp = `${now.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric' })} ${timeStr}`;
  const orderId = 'ORD-' + Date.now();

  const order = {
    id: orderId,
    createdAt: now.getTime(),
    timestamp: stamp,
    status: 'pending',
    items: tray.map(t => ({ id: t.id, name: t.name, category: t.category, qty: t.qty }))
  };

  try {
    await ordersRef.child(orderId).set(order);
    playChime();

    $('receiptTime').textContent = `${timeStr} 受付`;
    $('receiptRows').innerHTML = order.items.map(i => `
      <div class="ticket-row">
        <span>${esc(i.name)}</span>
        <strong>× ${i.qty}</strong>
      </div>
    `).join('');

    tray = [];
    renderTray();
    renderList();
    $('successModal').classList.add('open');
  } catch (e) {
    console.error('Order submit error:', e);
    toast('注文の送信に失敗しました');
  }
}

function renderOrdersModal() {
  const body = $('ordersModalBody');
  if (!orders.length) {
    body.innerHTML = `<div class="empty" style="border-style:dashed;"><strong>注文履歴はありません</strong>まだ注文が入っていません。</div>`;
    return;
  }
  body.innerHTML = orders.map(o => {
    const done = o.status === 'done';
    return `
      <div class="order-ticket" data-order-id="${esc(o.id)}">
        <div class="order-ticket-head">
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="status-pill ${done ? 'done' : ''}">${done ? '完了' : '受付中'}</span>
            <span>${esc(o.timestamp)}</span>
          </div>
          <div style="display:flex;gap:6px;">
            ${!done ? `<button class="btn primary" type="button" data-action="done" style="padding:6px 10px;font-size:11px;">完了にする</button>` : ''}
            <button class="btn" type="button" data-action="delete" style="padding:6px 10px;font-size:11px;">削除</button>
          </div>
        </div>
        ${(o.items || []).map(i => `
          <div class="ticket-row">
            <span>${esc(i.name)}</span>
            <strong>× ${i.qty}</strong>
          </div>
        `).join('')}
      </div>`;
  }).join('');
}

function subscribeOrders() {
  ordersRef = db.ref('orders');
  ordersRef.on('value', snap => {
    const data = snap.val() || {};
    orders = Object.entries(data)
      .map(([id, o]) => ({ ...o, id }))
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    updateOrderBadge();
    if ($('ordersModal').classList.contains('open')) {
      renderOrdersModal();
    }
  }, err => {
    console.error('Orders sync error:', err);
  });
}

async function refresh() {
  const snap = await db.ref('recipes').once('value');
  const data = snap.val() || {};
  recipes = Object.entries(data).map(([id, r]) => ({ ...r, id }));
  renderList();
}

$('searchInput').oninput = renderList;
$('sortSelect').onchange = renderList;
$('favoritesOnly').onclick = () => {
  favoritesMode = !favoritesMode;
  $('favoritesOnly').classList.toggle('primary', favoritesMode);
  renderList();
};
$('categoryFilters').onclick = e => {
  const b = e.target.closest('[data-cat]');
  if (!b) return;
  activeCategory = b.dataset.cat;
  document.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x.dataset.cat === activeCategory));
  renderList();
};

$('recipeGrid').onclick = e => {
  const cardEl = e.target.closest('.recipe-card');
  if (!cardEl) return;
  openItemModal(cardEl.dataset.id);
};

$('modalMinus').onclick = () => {
  modalQty = Math.max(1, modalQty - 1);
  $('modalQty').textContent = modalQty;
};
$('modalPlus').onclick = () => {
  modalQty = Math.min(20, modalQty + 1);
  $('modalQty').textContent = modalQty;
};
$('closeItemModal').onclick = closeItemModal;
$('cancelItemModal').onclick = closeItemModal;
$('confirmAddModal').onclick = addSelectedToTray;

$('trayItems').onclick = e => {
  const btn = e.target.closest('[data-delta]');
  const row = e.target.closest('[data-tray-id]');
  if (!btn || !row) return;
  const delta = Number(btn.dataset.delta);
  const idx = tray.findIndex(t => t.id === row.dataset.trayId);
  if (idx === -1) return;
  tray[idx].qty += delta;
  if (tray[idx].qty <= 0) tray.splice(idx, 1);
  renderTray();
  renderList();
};

$('clearTrayBtn').onclick = () => {
  tray = [];
  renderTray();
  renderList();
  toast('トレーを空にしました');
};

$('submitOrderBtn').onclick = submitOrder;
$('closeSuccessModal').onclick = () => $('successModal').classList.remove('open');
$('okSuccessModal').onclick = () => $('successModal').classList.remove('open');

$('soundToggle').onclick = () => {
  soundEnabled = !soundEnabled;
  try { localStorage.setItem(STORAGE_KEYS.SOUND, JSON.stringify(soundEnabled)); } catch (e) {}
  updateSoundUI();
  if (soundEnabled) playChime();
  toast(soundEnabled ? '🔔 呼び出しベルをONにしました' : '🔕 呼び出しベルをOFFにしました');
};

$('kitchenBtn').onclick = () => {
  renderOrdersModal();
  $('ordersModal').classList.add('open');
};
$('closeOrdersModal').onclick = () => $('ordersModal').classList.remove('open');
$('clearOrdersBtn').onclick = async () => {
  if (!ordersRef) return;
  try {
    await ordersRef.remove();
    toast('注文履歴をクリアしました');
  } catch (e) {
    console.error('Clear orders error:', e);
    toast('履歴のクリアに失敗しました');
  }
};
$('ordersModalBody').onclick = async e => {
  const btn = e.target.closest('[data-action]');
  const ticket = e.target.closest('[data-order-id]');
  if (!btn || !ticket || !ordersRef) return;
  const id = ticket.dataset.orderId;
  try {
    if (btn.dataset.action === 'done') {
      await ordersRef.child(id).update({ status: 'done' });
    } else if (btn.dataset.action === 'delete') {
      await ordersRef.child(id).remove();
    }
  } catch (err) {
    console.error('Order update error:', err);
    toast('更新に失敗しました');
  }
};

(async () => {
  loadLocalState();
  renderTray();
  try {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.database();
    await auth.signInAnonymously();
    categoryOptions();
    subscribeOrders();
    await refresh();
  } catch (e) {
    console.error('Firebase initialization error:', e);
    $('countText').textContent = 'CONNECTION ERROR';
    toast('メニューの読み込みに失敗しました');
  }
})();
})();
</script>
</body>
</html>
