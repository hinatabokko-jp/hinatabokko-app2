<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>family chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    /* パスワードロック画面 */
    #lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      gap: 16px;
      padding: 20px;
    }
    #lock-screen h2 {
      font-size: 1.2rem;
      color: #00bcd4;
    }
    #pass-input {
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px 16px;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      width: 200px;
    }
    #pass-btn {
      background-color: #00bcd4;
      color: #121212;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #pass-error {
      color: #ff5252;
      font-size: 0.85rem;
      display: none;
    }

    /* メインコンテンツ */
    #app-content {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* ヘッダー */
    header {
      background-color: #1e1e1e;
      padding: 10px 16px;
      border-bottom: 1px solid #2d2d2d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-title-container {
      display: flex;
      flex-direction: column;
    }
    .header-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #00bcd4;
      line-height: 1.2;
    }
    .header-subtitle {
      font-size: 0.65rem;
      color: #aaa;
      margin-top: 2px;
      line-height: 1.2;
    }
    .user-select-container {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .user-select-label {
      font-size: 0.8rem;
      color: #aaa;
    }
    select {
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    /* ハンバーガーボタン & サイドバーUI */
    .hamburger-btn {
      background: none;
      border: none;
      color: #00bcd4;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    .hamburger-btn:active {
      background-color: rgba(0, 188, 212, 0.1);
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background-color: #1e1e1e;
      z-index: 1001;
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }
    .sidebar.open {
      transform: translateX(260px);
    }
    .sidebar-header {
      padding: 16px;
      background-color: #252525;
      border-bottom: 1px solid #333;
      font-weight: bold;
      color: #00bcd4;
      font-size: 1rem;
    }
    .sidebar-menu {
      list-style: none;
      padding: 10px 0;
      margin: 0;
      overflow-y: auto;
    }
    .sidebar-menu li a {
      display: block;
      padding: 12px 20px;
      color: #e0e0e0;
      text-decoration: none;
      font-size: 0.95rem;
      border-left: 4px solid transparent;
      transition: background 0.2s;
    }
    .sidebar-menu li a:hover,
    .sidebar-menu li a:active {
      background-color: #2a2a2a;
    }
    .sidebar-menu li a.sidebar-link.current {
      background-color: #2a2a2a;
      color: #00bcd4;
      border-left-color: #00bcd4;
      font-weight: bold;
    }

    /* チャット表示エリア */
    #chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* メッセージバルーン */
    .message {
      max-width: 75%;
      display: flex;
      flex-direction: column;
    }
    .message.sent {
      align-self: flex-end;
    }
    .message.received {
      align-self: flex-start;
    }
    .sender-name {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 3px;
      padding: 0 4px;
    }
    .message.sent .sender-name {
      text-align: right;
    }
    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap; /* 改行を反省・保持するために追加 */
    }
    .message.sent .bubble {
      background-color: #00796b;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .message.received .bubble {
      background-color: #2a2a2a;
      color: #e0e0e0;
      border-bottom-left-radius: 2px;
    }
    .meta-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
      padding: 0 4px;
    }
    .message.sent .meta-info {
      justify-content: flex-end;
    }
    .timestamp {
      font-size: 0.65rem;
      color: #666;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #ff5252;
      font-size: 0.7rem;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      opacity: 0.8;
    }
    .delete-btn:hover {
      opacity: 1;
    }

    /* 入力エリア */
    footer {
      background-color: #1e1e1e;
      padding: 12px 16px;
      border-top: 1px solid #2d2d2d;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    textarea {
      flex: 1;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 18px;
      padding: 8px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      height: 40px;
      max-height: 120px;
      font-family: inherit;
      line-height: 1.4;
    }
    textarea:focus {
      border-color: #00bcd4;
    }
    button.send-btn-style {
      background-color: #00bcd4;
      color: #121212;
      border: none;
      border-radius: 20px;
      padding: 0 18px;
      height: 40px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
      flex-shrink: 0;
    }
    button.send-btn-style:active {
      background-color: #008ba3;
    }
  </style>
</head>
<body>

  <!-- サイドバー＆オーバーレイ -->
  <div id="overlay" class="overlay"></div>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">メニュー</div>
    <ul class="sidebar-menu">
      <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app/">漢字テスト</a></li>
      <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app/page2">計算トレーニング</a></li>
      <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app/page3">理科トレーニング</a></li>
      <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app/page5">社会科トレーニング</a></li>
      <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app/page4">百人一首</a></li>
      <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app2/page26.html">おかあさん</a></li>
      <li><a href="#" class="sidebar-link current">family chat</a></li>
    </ul>
  </aside>

  <!-- ロック画面 -->
  <div id="lock-screen">
    <h2>パスワードを入力してください</h2>
    <input type="password" id="pass-input" placeholder="パスワード" autocomplete="off">
    <button id="pass-btn" class="send-btn-style">解除</button>
    <div id="pass-error">パスワードが違います</div>
  </div>

  <!-- アプリ本体 -->
  <div id="app-content">
    <header>
      <div class="header-left">
        <button id="hamburger-btn" class="hamburger-btn" aria-label="メニューを開く">☰</button>
        <div class="header-title-container">
          <div class="header-title">family chat</div>
          <div class="header-subtitle">完全に暗号化されているわけではないので、あくまで 連絡用として使いましょう。</div>
        </div>
      </div>
      <div class="user-select-container">
        <span class="user-select-label">私は:</span>
        <select id="user-select">
          <option value="おかあさん">おかあさん</option>
          <option value="むすめ">むすめ</option>
        </select>
      </div>
    </header>

    <main id="chat-box"></main>

    <footer>
      <textarea id="message-input" placeholder="メッセージを入力... (Shift+Enterで改行)" rows="1"></textarea>
      <button id="send-btn" class="send-btn-style">送信</button>
    </footer>
  </div>

  <!-- Firebase SDK (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // パスワードの設定
    const SECRET_PASSWORD = "1234";

    // 7日間のミリ秒数
    const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

    // Firebase 設定情報
    const firebaseConfig = {
      apiKey: "AIzaSyCR0rsl3c8LdY2t0F95qZXrr3fr_iMFg74",
      authDomain: "family-chat-3e0d6.firebaseapp.com",
      databaseURL: "https://family-chat-3e0d6-default-rtdb.firebaseio.com/",
      projectId: "family-chat-3e0d6",
      storageBucket: "family-chat-3e0d6.firebasestorage.app",
      messagingSenderId: "929536387295",
      appId: "1:929536387295:web:84d62b03ef370f19f7a16a",
      measurementId: "G-CT2HGLK75T"
    };

    // Firebase初期化
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');

    // DOM要素
    const lockScreen = document.getElementById('lock-screen');
    const appContent = document.getElementById('app-content');
    const passInput = document.getElementById('pass-input');
    const passBtn = document.getElementById('pass-btn');
    const passError = document.getElementById('pass-error');

    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const userSelect = document.getElementById('user-select');

    const hamburgerBtn = document.getElementById('hamburger-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    let cachedMessages = {};

    // ハンバーガーメニューの開閉機能
    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    }

    hamburgerBtn.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', closeSidebar);

    // パスワード認証処理
    function checkPassword() {
      if (passInput.value === SECRET_PASSWORD) {
        localStorage.setItem('family_chat_auth', 'true');
        unlockApp();
      } else {
        passError.style.display = 'block';
      }
    }

    function unlockApp() {
      lockScreen.style.display = 'none';
      appContent.style.display = 'flex';
      initChat();
    }

    // 自動ログインチェック
    if (localStorage.getItem('family_chat_auth') === 'true') {
      unlockApp();
    }

    passBtn.addEventListener('click', checkPassword);
    passInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    // メッセージ送信処理
    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      const sender = userSelect.value;
      push(messagesRef, {
        sender: sender,
        text: text,
        timestamp: Date.now()
      });

      messageInput.value = '';
      messageInput.style.height = '40px';
    }

    // メッセージの削除
    function deleteMessage(key) {
      if (confirm('このメッセージを削除しますか？')) {
        const targetRef = ref(db, `messages/${key}`);
        remove(targetRef);
      }
    }

    // 画面への描画
    function renderMessages() {
      chatBox.innerHTML = '';
      const currentUser = userSelect.value;

      Object.keys(cachedMessages).forEach((key) => {
        const msg = cachedMessages[key];
        const isSent = msg.sender === currentUser;

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;

        const senderName = document.createElement('div');
        senderName.className = 'sender-name';
        senderName.textContent = msg.sender;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = msg.text;

        const metaInfo = document.createElement('div');
        metaInfo.className = 'meta-info';

        const timestamp = document.createElement('span');
        timestamp.className = 'timestamp';
        const date = new Date(msg.timestamp);
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        timestamp.textContent = `${hours}:${minutes}`;

        metaInfo.appendChild(timestamp);

        if (isSent) {
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-btn';
          deleteBtn.textContent = '削除';
          deleteBtn.addEventListener('click', () => deleteMessage(key));
          metaInfo.appendChild(deleteBtn);
        }

        msgDiv.appendChild(senderName);
        msgDiv.appendChild(bubble);
        msgDiv.appendChild(metaInfo);

        chatBox.appendChild(msgDiv);
      });

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // チャット初期化
    function initChat() {
      // ユーザー復元
      const savedUser = localStorage.getItem('family_chat_user');
      if (savedUser) userSelect.value = savedUser;

      userSelect.addEventListener('change', () => {
        localStorage.setItem('family_chat_user', userSelect.value);
        renderMessages();
      });

      // メッセージデータ監視＆自動削除処理
      onValue(messagesRef, (snapshot) => {
        const data = snapshot.val() || {};
        cachedMessages = data;
        
        // 7日以上前のデータクリーンアップ
        cleanOldMessages(data);
        
        renderMessages();
      });

      // 7日経過したメッセージをFirebaseから削除する関数
      function cleanOldMessages(data) {
        const now = Date.now();
        Object.keys(data).forEach((key) => {
          const msg = data[key];
          if (msg.timestamp && (now - msg.timestamp > SEVEN_DAYS_MS)) {
            remove(ref(db, `messages/${key}`));
          }
        });
      }

      sendBtn.addEventListener('click', sendMessage);

      // Enterで送信、Shift+Enterで改行
      messageInput.addEventListener('keydown', (e) => {
        if (e.isComposing || e.keyCode === 229) {
          return;
        }

        if (e.key === 'Enter') {
          if (e.shiftKey) {
            return; // Shift+Enterは改行
          } else {
            e.preventDefault();
            sendMessage();
          }
        }
      });

      // テキスト入力に合わせてtextareaの高さを自動調節
      messageInput.addEventListener('input', () => {
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
      });
    }
  </script>
</body>
</html>
