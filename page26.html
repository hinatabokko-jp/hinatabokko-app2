<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>family chat</title>
  <style>
    :root {
      --bg-color: #121212;
      --surface-color: #1e1e1e;
      --primary-color: #00bcd4;
      --primary-hover: #008ba3;
      --danger-color: #cf6679;
      --text-color: #e0e0e0;
      --text-muted: #aaa;
      --border-color: #2d2d2d;
      --chat-bg: #121212;
      --my-msg-bg: #00796b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* あいことばロック画面 */
    #lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      gap: 16px;
      padding: 20px;
    }
    #lock-screen h2 {
      font-size: 1.2rem;
      color: var(--primary-color);
    }
    #pass-input {
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px 16px;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      width: 220px;
    }
    .remember-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-color);
      cursor: pointer;
      user-select: none;
    }
    .remember-container input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary-color);
      cursor: pointer;
    }
    #pass-btn {
      background-color: var(--primary-color);
      color: #121212;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #pass-error {
      color: #ff5252;
      font-size: 0.85rem;
      display: none;
    }

    /* アプリ本体 */
    #app-content {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .chat-main-area {
      display: flex;
      flex: 1;
      height: calc(100% - 61px);
      overflow: hidden;
    }

    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* ヘッダー */
    header {
      background-color: var(--surface-color);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-title-container {
      display: flex;
      flex-direction: column;
    }
    .header-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-color);
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 12px;
      background-color: #1b5e20;
      color: #81c784;
    }
    .header-subtitle {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.2;
    }
    .header-right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .user-select-container {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .user-select-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    select {
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-logout:hover {
      background-color: rgba(255,255,255,0.1);
    }

    /* ハンバーガーボタン & サイドバーUI */
    .hamburger-btn {
      background: none;
      border: none;
      color: var(--primary-color);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background-color: var(--surface-color);
      z-index: 1001;
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }
    .sidebar.open {
      transform: translateX(260px);
    }
    .sidebar-header {
      padding: 16px;
      background-color: #252525;
      border-bottom: 1px solid #333;
      font-weight: bold;
      color: var(--primary-color);
      font-size: 1rem;
    }
    .sidebar-menu {
      list-style: none;
      padding: 10px 0;
      margin: 0;
      overflow-y: auto;
    }
    .sidebar-menu li a {
      display: block;
      padding: 12px 20px;
      color: var(--text-color);
      text-decoration: none;
      font-size: 0.95rem;
      border-left: 4px solid transparent;
      transition: background 0.2s;
    }
    .sidebar-menu li a:hover,
    .sidebar-menu li a:active {
      background-color: #2a2a2a;
    }
    .sidebar-menu li a.sidebar-link.current {
      background-color: #2a2a2a;
      color: var(--primary-color);
      border-left-color: var(--primary-color);
      font-weight: bold;
    }

    /* チャット表示エリア */
    #chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* メッセージバルーン */
    .message {
      max-width: 75%;
      display: flex;
      flex-direction: column;
    }
    .message.sent {
      align-self: flex-end;
    }
    .message.received {
      align-self: flex-start;
    }
    .sender-name {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 3px;
      padding: 0 4px;
    }
    .message.sent .sender-name {
      text-align: right;
    }
    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .message.sent .bubble {
      background-color: var(--my-msg-bg);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .message.received .bubble {
      background-color: #2a2a2a;
      color: var(--text-color);
      border-bottom-left-radius: 2px;
    }
    .bubble.stamp-bubble {
      background-color: transparent !important;
      padding: 4px;
    }

    .meta-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
      padding: 0 4px;
    }
    .message.sent .meta-info {
      justify-content: flex-end;
    }
    .timestamp {
      font-size: 0.65rem;
      color: #666;
    }
    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      opacity: 0.8;
    }
    .delete-btn:hover {
      opacity: 1;
      color: #fff;
    }

    /* メディア・ファイル関連スタイル */
    .chat-image {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      margin-bottom: 6px;
      display: block;
      object-fit: contain;
      image-orientation: none;
    }
    .chat-stamp {
      max-width: 180px;
      max-height: 180px;
      display: block;
      user-select: none;
      pointer-events: none;
      object-fit: contain;
      image-orientation: none;
    }
    .chat-link {
      color: #80deea;
      text-decoration: underline;
      word-break: break-all;
    }
    .message.received .chat-link {
      color: var(--primary-color);
    }
    .file-attachment {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(0, 0, 0, 0.2);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .file-name {
      font-size: 0.85rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
    }

    /* 入力エリア */
    footer {
      background-color: var(--surface-color);
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    textarea {
      flex: 1;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 18px;
      padding: 8px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      height: 40px;
      max-height: 120px;
      font-family: inherit;
      line-height: 1.4;
    }
    textarea:focus {
      border-color: var(--primary-color);
    }
    button.send-btn-style {
      background-color: var(--primary-color);
      color: #121212;
      border: none;
      border-radius: 20px;
      padding: 0 18px;
      height: 40px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
      flex-shrink: 0;
    }
    button.send-btn-style:active {
      background-color: var(--primary-hover);
    }
    button.icon-btn-style, label.icon-btn-style {
      background-color: #2a2a2a;
      color: var(--primary-color);
      border: 1px solid #444;
      border-radius: 20px;
      width: 40px;
      height: 40px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.2s, border-color 0.2s;
    }
    button.icon-btn-style:active, label.icon-btn-style:active {
      background-color: #3a3a3a;
      border-color: var(--primary-color);
    }

    /* モーダル表示スタイル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-container {
      background-color: var(--surface-color);
      border: 1px solid #333;
      border-radius: 12px;
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }
    .modal-header {
      padding: 14px 16px;
      background-color: #252525;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--primary-color);
    }
    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .modal-close-btn:hover {
      color: #fff;
    }
    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-color);
      margin-bottom: 4px;
    }
    .palette-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .palette-btn {
      background-color: #2a2a2a;
      border: 1px solid #333;
      border-radius: 8px;
      height: 38px;
      padding: 0 10px;
      font-size: 1.1rem;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .palette-btn:hover {
      background-color: #3a3a3a;
      transform: scale(1.03);
    }
    .kaimoji-btn {
      font-size: 0.85rem;
    }
    .modal-textarea {
      width: 100%;
      height: 120px;
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      line-height: 1.4;
      font-family: inherit;
    }
    .modal-textarea:focus {
      border-color: var(--primary-color);
    }
    .modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      background-color: var(--surface-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .modal-footer-right {
      display: flex;
      gap: 8px;
    }
    .secondary-btn {
      background-color: #2a2a2a;
      color: var(--text-color);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .secondary-btn:hover {
      background-color: #3a3a3a;
    }

    /* 手描き・アニメーションスタンプ関連スタイル */
    .stamp-nav-btn {
      background-color: var(--primary-color);
      color: #121212;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .editor-layout {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: flex-start;
    }
    .canvas-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      border: 2px dashed #444;
      border-radius: 12px;
      background-color: #1a1a1a;
      background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      flex-shrink: 0;
    }
    .stamp-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      touch-action: none;
    }
    .ps-layers-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100px;
      background-color: #181818;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px;
      max-height: 250px;
      overflow-y: auto;
    }
    .ps-layer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px;
      background-color: #262626;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .ps-layer-item.active {
      border-color: var(--primary-color);
      background-color: #2a383b;
    }
    .ps-layer-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: bold;
    }
    .ps-layer-item.active .ps-layer-title {
      color: var(--primary-color);
    }
    .ps-layer-preview {
      width: 60px;
      height: 60px;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: #111;
      object-fit: contain;
      pointer-events: none;
    }
    .stamp-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      margin-top: 8px;
    }
    .tool-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tool-btn {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .tool-btn.active {
      border-color: var(--primary-color);
      color: var(--primary-color);
      background-color: #333;
    }
    select.tool-select {
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.8rem;
      outline: none;
    }
    .history-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      max-height: 350px;
      overflow-y: auto;
      padding: 4px;
    }
    .history-card {
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px;
      background-color: #2a2a2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .history-img-wrapper {
      width: 100%;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1a1a1a;
      border-radius: 6px;
    }
    .history-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .history-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }
    .history-action-btn {
      background-color: #333;
      color: var(--text-color);
      border: 1px solid #444;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .history-action-btn.send { background-color: #00796b; border-color: #008ba3; color: #fff; }
    .history-action-btn.del { background-color: #8c2a2a; border-color: #a83232; color: #fff; }
  </style>
</head>
<body>

  <div class="app-container" id="app-container">
    <!-- サイドバー＆オーバーレイ -->
    <div id="overlay" class="overlay"></div>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">メニュー</div>
      <ul class="sidebar-menu">
        <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app/">漢字テスト</a></li>
        <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app/page2">計算トレーニング</a></li>
        <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app2/page22.html">AirChat Group</a></li>
        <li><a href="#" class="sidebar-link current">FamilyChat おかあさん</a></li>
        <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app2/page28.html">FamilyChat おとうさん</a></li>
        <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app2/page29.html">pngをスタンプ化</a></li>
        <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app2/page4.html">UI用語</a></li>
        <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app2/page23.html">QRcode</a></li>
      </ul>
    </aside>

    <!-- あいことばロック画面 -->
    <div id="lock-screen">
      <h2>あいことばを入力してください</h2>
      <input type="password" id="pass-input" placeholder="あいことば" autocomplete="off">
      <label class="remember-container">
        <input type="checkbox" id="remember-me-checkbox">
        次回から自動でログインする
      </label>
      <button id="pass-btn" class="send-btn-style">入室する</button>
      <div id="pass-error">あいことばが違います</div>
    </div>

    <!-- アプリ本体 -->
    <div id="app-content">
      <header>
        <div class="header-left">
          <button id="hamburger-btn" class="hamburger-btn" aria-label="メニューを開く">☰</button>
          <div class="header-title-container">
            <div class="header-title">
              family chat
              <span id="statusBadge" class="status-badge">ファミリー</span>
            </div>
          </div>
        </div>
        <div class="header-right-actions">
          <div class="user-select-container" id="userSelectContainer">
            <span class="user-select-label">私は:</span>

    function drawAnimeStroke(ctx, p1, p2) {
      const baseSize = parseFloat(animeSizeInput.value);

      if (currentAnimeTool === 'eraser') {

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
        ctx.restore();
        return;
      }

      ctx.globalCompositeOperation = 'source-over';
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);

      switch (currentAnimeBrushType) {
        case 'calligraphy-brush':
          ctx.strokeStyle = color;
          ctx.lineCap = 'round';
          ctx.lineWidth = Math.max(1, baseSize * (1 - Math.min(dist / 20, 0.7)));
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
          break;
        case 'pen':
        default:
          ctx.strokeStyle = color;
          ctx.lineWidth = baseSize;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);

    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function floodFill(canvas, startX, startY, fillColorHex, opacity) {
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const width = canvas.width;
      const height = canvas.height;

      const targetPos = (startY * width + startX) * 4;
      const targetR = data[targetPos];
      const targetG = data[targetPos + 1];
      const targetB = data[targetPos + 2];
      const targetA = data[targetPos + 3];

      const fillRgb = hexToRgb(fillColorHex);
      const fillA = Math.round(opacity * 255);

      if (targetR === fillRgb.r && targetG === fillRgb.g && targetB === fillRgb.b && targetA === fillA) return;

      const queue = [[startX, startY]];
      const visited = new Uint8Array(width * height);

      while (queue.length > 0) {
        const [x, y] = queue.pop();
        const pos = (y * width + x) * 4;
        const idx = y * width + x;

        if (x < 0 || x >= width || y < 0 || y >= height) continue;
        if (visited[idx]) continue;
        visited[idx] = 1;

        if (Math.abs(data[pos] - targetR) < 30 &&
            Math.abs(data[pos + 1] - targetG) < 30 &&
            Math.abs(data[pos + 2] - targetB) < 30 &&
            Math.abs(data[pos + 3] - targetA) < 30) {
          data[pos] = fillRgb.r;
          data[pos + 1] = fillRgb.g;
          data[pos + 2] = fillRgb.b;
          data[pos + 3] = fillA;

          queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function getCanvasCoords(e, canvasEl) {
      const rect = canvasEl.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: Math.floor((clientX - rect.left) * (canvasEl.width / rect.width)),
        y: Math.floor((clientY - rect.top) * (canvasEl.height / rect.height))
      };
    }

    function drawStroke(ctx, p1, p2) {
      const baseSize = parseFloat(stampSizeInput.value);
      const opacity = parseFloat(stampOpacityInput.value);
      const color = stampColorInput.value;

      ctx.save();
      if (currentTool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.globalAlpha = opacity;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = baseSize * 1.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
        ctx.restore();
        return;
      }

      ctx.globalCompositeOperation = 'source-over';
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);

      switch (currentBrushType) {
        case 'calligraphy-brush':
          ctx.globalAlpha = opacity;
          ctx.strokeStyle = color;
          ctx.lineCap = 'round';
          ctx.lineWidth = Math.max(1, baseSize * (1 - Math.min(dist / 20, 0.7)));
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
          break;
        case 'pen':
        default:
          ctx.globalAlpha = opacity;
          ctx.strokeStyle = color;
          ctx.lineWidth = baseSize;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
          break;
      }
      ctx.restore();
    }

    [canvasA, canvasB].forEach(targetCanvas => {
      let isTargetDrawing = false;

      function startDraw(e) {
        const activeObj = getActiveLayer();
        if (targetCanvas !== activeObj.canvas) return;
        const pos = getCanvasCoords(e, targetCanvas);
        saveState();

        if (currentTool === 'fill') {
          floodFill(targetCanvas, pos.x, pos.y, stampColorInput.value, parseFloat(stampOpacityInput.value));
          updateLayerPreviews();
          return;
        }

        isTargetDrawing = true;
        lastPoint = pos;
        drawStroke(activeObj.ctx, pos, pos);
      }

      function moveDraw(e) {
        if (!isTargetDrawing || currentTool === 'fill') return;
        const activeObj = getActiveLayer();
        if (targetCanvas !== activeObj.canvas) return;
        e.preventDefault();
        const pos = getCanvasCoords(e, targetCanvas);
        drawStroke(activeObj.ctx, lastPoint, pos);
        lastPoint = pos;
      }

      function endDraw() {
        if (isTargetDrawing) {
          isTargetDrawing = false;
          lastPoint = null;
          updateLayerPreviews();
        }
      }

      targetCanvas.addEventListener('mousedown', startDraw);
      targetCanvas.addEventListener('mousemove', moveDraw);
      targetCanvas.addEventListener('mouseup', endDraw);
      targetCanvas.addEventListener('mouseleave', endDraw);
      targetCanvas.addEventListener('touchstart', startDraw, { passive: false });
      targetCanvas.addEventListener('touchmove', moveDraw, { passive: false });
      targetCanvas.addEventListener('touchend', endDraw);
    });

    onValue(stampHistoryRef, (snapshot) => {
