<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>family chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    /* パスワードロック画面 */
    #lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      gap: 16px;
      padding: 20px;
    }
    #lock-screen h2 {
      font-size: 1.2rem;
      color: #00bcd4;
    }
    #pass-input {
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px 16px;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      width: 200px;
    }
    #pass-btn {
      background-color: #00bcd4;
      color: #121212;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #pass-error {
      color: #ff5252;
      font-size: 0.85rem;
      display: none;
    }

    /* メインコンテンツ */
    #app-content {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* ヘッダー */
    header {
      background-color: #1e1e1e;
      padding: 10px 16px;
      border-bottom: 1px solid #2d2d2d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-title-container {
      display: flex;
      flex-direction: column;
    }
    .header-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #00bcd4;
      line-height: 1.2;
    }
    .header-subtitle {
      font-size: 0.65rem;
      color: #aaa;
      margin-top: 2px;
      line-height: 1.2;
    }
    .user-select-container {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .user-select-label {
      font-size: 0.8rem;
      color: #aaa;
    }
    select {
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    /* ハンバーガーボタン & サイドバーUI */
    .hamburger-btn {
      background: none;
      border: none;
      color: #00bcd4;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    .hamburger-btn:active {
      background-color: rgba(0, 188, 212, 0.1);
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background-color: #1e1e1e;
      z-index: 1001;
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }
    .sidebar.open {
      transform: translateX(260px);
    }
    .sidebar-header {
      padding: 16px;
      background-color: #252525;
      border-bottom: 1px solid #333;
      font-weight: bold;
      color: #00bcd4;
      font-size: 1rem;
    }
    .sidebar-menu {
      list-style: none;
      padding: 10px 0;
      margin: 0;
      overflow-y: auto;
    }
    .sidebar-menu li a {
      display: block;
      padding: 12px 20px;
      color: #e0e0e0;
      text-decoration: none;
      font-size: 0.95rem;
      border-left: 4px solid transparent;
      transition: background 0.2s;
    }
    .sidebar-menu li a:hover,
    .sidebar-menu li a:active {
      background-color: #2a2a2a;
    }
    .sidebar-menu li a.sidebar-link.current {
      background-color: #2a2a2a;
      color: #00bcd4;
      border-left-color: #00bcd4;
      font-weight: bold;
    }

    /* チャット表示エリア */
    #chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* メッセージバルーン */
    .message {
      max-width: 75%;
      display: flex;
      flex-direction: column;
    }
    .message.sent {
      align-self: flex-end;
    }
    .message.received {
      align-self: flex-start;
    }
    .sender-name {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 3px;
      padding: 0 4px;
    }
    .message.sent .sender-name {
      text-align: right;
    }
    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .message.sent .bubble {
      background-color: #00796b;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .message.received .bubble {
      background-color: #2a2a2a;
      color: #e0e0e0;
      border-bottom-left-radius: 2px;
    }
    /* 手描きスタンプ用 */
    .bubble.stamp-bubble {
      background-color: transparent !important;
      padding: 4px;
    }

    .meta-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
      padding: 0 4px;
    }
    .message.sent .meta-info {
      justify-content: flex-end;
    }
    .timestamp {
      font-size: 0.65rem;
      color: #666;
    }
    /* 小さい文字ボタン（削除・ダウンロード共通） */
    .delete-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 0.7rem;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      opacity: 0.8;
    }
    .delete-btn:hover {
      opacity: 1;
    }

    /* メディア・ファイル関連スタイル */
    .chat-image {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      margin-bottom: 6px;
      display: block;
      object-fit: cover;
    }
    .chat-stamp {
      max-width: 180px;
      max-height: 180px;
      display: block;
      user-select: none;
      pointer-events: none;
    }
    .chat-link {
      color: #80deea;
      text-decoration: underline;
      word-break: break-all;
    }
    .message.received .chat-link {
      color: #00bcd4;
    }
    .file-attachment {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(0, 0, 0, 0.2);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .file-name {
      font-size: 0.85rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
    }

    /* 入力エリア */
    footer {
      background-color: #1e1e1e;
      padding: 12px 16px;
      border-top: 1px solid #2d2d2d;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    textarea {
      flex: 1;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 18px;
      padding: 8px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      height: 40px;
      max-height: 120px;
      font-family: inherit;
      line-height: 1.4;
    }
    textarea:focus {
      border-color: #00bcd4;
    }
    button.send-btn-style {
      background-color: #00bcd4;
      color: #121212;
      border: none;
      border-radius: 20px;
      padding: 0 18px;
      height: 40px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
      flex-shrink: 0;
    }
    button.send-btn-style:active {
      background-color: #008ba3;
    }
    button.icon-btn-style, label.icon-btn-style {
      background-color: #2a2a2a;
      color: #00bcd4;
      border: 1px solid #444;
      border-radius: 20px;
      width: 40px;
      height: 40px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.2s, border-color 0.2s;
    }
    button.icon-btn-style:active, label.icon-btn-style:active {
      background-color: #3a3a3a;
      border-color: #00bcd4;
    }

    /* モーダル表示スタイル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-container {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }
    .modal-header {
      padding: 14px 16px;
      background-color: #252525;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: #00bcd4;
    }
    .modal-close-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .modal-close-btn:hover {
      color: #fff;
    }
    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #e0e0e0;
      margin-bottom: 4px;
    }
    .palette-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .palette-btn {
      background-color: #2a2a2a;
      border: 1px solid #333;
      border-radius: 8px;
      height: 38px;
      padding: 0 10px;
      font-size: 1.1rem;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .palette-btn:hover {
      background-color: #3a3a3a;
      transform: scale(1.03);
    }
    .palette-btn:active {
      transform: scale(0.97);
    }
    .kaimoji-btn {
      font-size: 0.85rem;
    }
    .modal-textarea {
      width: 100%;
      height: 120px;
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      line-height: 1.4;
      font-family: inherit;
    }
    .modal-textarea:focus {
      border-color: #00bcd4;
    }
    .modal-footer {
      padding: 12px 16px;
      border-top: 1px solid #2d2d2d;
      background-color: #1e1e1e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .modal-footer-right {
      display: flex;
      gap: 8px;
    }
    .secondary-btn {
      background-color: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .secondary-btn:hover {
      background-color: #3a3a3a;
    }

    /* 手描きスタンプ関連スタイル */
    .stamp-nav-btn {
      background-color: #00bcd4;
      color: #121212;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* エディタ主要レイアウト（キャンバス + Photoshop風レイヤーパネル） */
    .editor-layout {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: flex-start;
    }

    .canvas-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      border: 2px dashed #444;
      border-radius: 12px;
      background-color: #1a1a1a;
      /* 透過チェック背景 */
      background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      flex-shrink: 0;
    }
    .stamp-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      touch-action: none;
    }
    #layer1 { z-index: 1; pointer-events: none; } /* 最下層 (透過) */
    #layer2 { z-index: 2; } /* 中層 */
    #layer3 { z-index: 3; } /* 最上層 */

    /* Photoshop風 視覚的レイヤーパネル */
    .ps-layers-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100px;
      background-color: #181818;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px;
    }
    .ps-layer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px;
      background-color: #262626;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .ps-layer-item:hover {
      background-color: #333;
    }
    .ps-layer-item.active {
      border-color: #00bcd4;
      background-color: #2a383b;
    }
    .ps-layer-title {
      font-size: 0.7rem;
      color: #aaa;
      margin-bottom: 4px;
      font-weight: bold;
    }
    .ps-layer-item.active .ps-layer-title {
      color: #00bcd4;
    }
    .ps-layer-preview {
      width: 60px;
      height: 60px;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: #111;
      background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
      background-size: 10px 10px;
      object-fit: contain;
    }

    .stamp-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      margin-top: 8px;
    }
    .tool-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tool-btn {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .tool-btn.active {
      border-color: #00bcd4;
      color: #00bcd4;
      background-color: #333;
    }

    /* スタンプ履歴グリッド & アイテムカード */
    .history-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      max-height: 350px;
      overflow-y: auto;
      padding: 4px;
    }
    .history-card {
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px;
      background-color: #2a2a2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .history-img-wrapper {
      width: 100%;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1a1a1a;
      border-radius: 6px;
      background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
      background-size: 10px 10px;
    }
    .history-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .history-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }
    .history-action-btn {
      background-color: #333;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .history-action-btn:hover {
      background-color: #444;
      color: #fff;
    }
    .history-action-btn.send {
      background-color: #00796b;
      border-color: #008ba3;
      color: #fff;
    }
    .history-action-btn.del {
      background-color: #8c2a2a;
      border-color: #a83232;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- サイドバー＆オーバーレイ -->
  <div id="overlay" class="overlay"></div>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">メニュー</div>
    <ul class="sidebar-menu">
      <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app/">漢字テスト</a></li>
      <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app/page2">計算トレーニング</a></li>
      <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app/page3">理科トレーニング</a></li>
      <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app/page5">社会科トレーニング</a></li>
      <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app/page4">百人一首</a></li>
      <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app2/page21.html">AirChat 1on1</a></li>
      <li><a href="#" class="sidebar-link current">おかあさん</a></li>
    </ul>
  </aside>

  <!-- ロック画面 -->
  <div id="lock-screen">
    <h2>パスワードを入力してください</h2>
    <input type="password" id="pass-input" placeholder="パスワード" autocomplete="off">
    <button id="pass-btn" class="send-btn-style">解除</button>
    <div id="pass-error">パスワードが違います</div>
  </div>

  <!-- アプリ本体 -->
  <div id="app-content">
    <header>
      <div class="header-left">
        <button id="hamburger-btn" class="hamburger-btn" aria-label="メニューを開く">☰</button>
        <div class="header-title-container">
          <div class="header-title">family chat</div>
          <div class="header-subtitle">完全に暗号化されているわけではないので、あくまで 連絡用として使いましょう。</div>
        </div>
      </div>
      <div class="user-select-container">
        <span class="user-select-label">私は:</span>
        <select id="user-select">
          <option value="おかあさん">おかあさん</option>
          <option value="むすめ">むすめ</option>
        </select>
      </div>
    </header>

    <main id="chat-box"></main>

    <footer>
      <label for="file-input" class="icon-btn-style" title="ファイルを添付">📎</label>
      <input type="file" id="file-input" style="display: none;">
      <textarea id="message-input" placeholder="メッセージを入力..." rows="1"></textarea>
      <button id="modal-open-btn" class="icon-btn-style" title="絵文字・改行作成">✨</button>
      <button id="send-btn" class="send-btn-style">送信</button>
    </footer>
  </div>

  <!-- コメント作成モーダル -->
  <div id="comment-modal-overlay" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-title">改行・絵文字コメント作成</div>
        <button id="modal-close-x" class="modal-close-btn">✕</button>
      </div>
      <div class="modal-body">
        <div>
          <div class="section-title">ワンタップ絵文字</div>
          <div class="palette-grid" id="emoji-palette"></div>
        </div>
        <div>
          <div class="section-title">顔文字</div>
          <div class="palette-grid" id="kaimoji-palette"></div>
        </div>
        <div>
          <div class="section-title">コメント編集</div>

  <!-- Firebase SDK (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // パスワードの設定
    const SECRET_PASSWORD = "1234";

    // 7日間のミリ秒数
    const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

    // Firebase 設定情報
    const firebaseConfig = {
      apiKey: "AIzaSyCR0rsl3c8LdY2t0F95qZXrr3fr_iMFg74",
      authDomain: "family-chat-3e0d6.firebaseapp.com",
      databaseURL: "https://family-chat-3e0d6-default-rtdb.firebaseio.com/",
      projectId: "family-chat-3e0d6",
      storageBucket: "family-chat-3e0d6.firebasestorage.app",
      messagingSenderId: "929536387295",
      appId: "1:929536387295:web:84d62b03ef370f19f7a16a",
      measurementId: "G-CT2HGLK75T"
    };

    // Firebase初期化
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');
    const stampHistoryRef = ref(db, 'stamp_history');

    // DOM要素
    const lockScreen = document.getElementById('lock-screen');
    const appContent = document.getElementById('app-content');
    const passInput = document.getElementById('pass-input');
    const passBtn = document.getElementById('pass-btn');
    const passError = document.getElementById('pass-error');

    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const userSelect = document.getElementById('user-select');
    const fileInput = document.getElementById('file-input');

    const hamburgerBtn = document.getElementById('hamburger-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    // モーダル関連DOM要素
    const modalOpenBtn = document.getElementById('modal-open-btn');
    const commentModalOverlay = document.getElementById('comment-modal-overlay');
    const modalCloseX = document.getElementById('modal-close-x');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const modalSubmitBtn = document.getElementById('modal-submit-btn');
    const modalClearBtn = document.getElementById('modal-clear-btn');
    const modalTextInput = document.getElementById('modal-text-input');
    const emojiPalette = document.getElementById('emoji-palette');
    const kaimojiPalette = document.getElementById('kaimoji-palette');

    // 手描きスタンプモーダル関連DOM要素
    const stampModalOverlay = document.getElementById('stamp-modal-overlay');
    const goToStampBtn = document.getElementById('go-to-stamp-btn');
    const stampModalCloseX = document.getElementById('stamp-modal-close-x');
    const stampCancelBtn = document.getElementById('stamp-cancel-btn');
    const backToCommentBtn = document.getElementById('back-to-comment-btn');
    const goToHistoryBtn = document.getElementById('go-to-history-btn');
    const stampSubmitBtn = document.getElementById('stamp-submit-btn');

    // Photoshop風 レイヤー選択要素
    const layerBtn2 = document.getElementById('layer-btn-2');
    const layerBtn3 = document.getElementById('layer-btn-3');
    const psPreview2 = document.getElementById('ps-preview-2');
    const psPreview3 = document.getElementById('ps-preview-3');

    // 履歴モーダル関連DOM要素
    const historyModalOverlay = document.getElementById('history-modal-overlay');
    const historyModalCloseX = document.getElementById('history-modal-close-x');
    const backToStampDrawBtn = document.getElementById('back-to-stamp-draw-btn');
    const historyGrid = document.getElementById('history-grid');
    const stampUploadInput = document.getElementById('stamp-upload-input');

    // キャンバス関連要素
    const layer2 = document.getElementById('layer2'); // 中層
    const layer3 = document.getElementById('layer3'); // 最上層
    const ctx2 = layer2.getContext('2d');
    const ctx3 = layer3.getContext('2d');

    const stampColorInput = document.getElementById('stamp-color');
    const stampSizeInput = document.getElementById('stamp-size');
    const toolPen = document.getElementById('tool-pen');
    const toolBrush = document.getElementById('tool-brush');
    const toolFill = document.getElementById('tool-fill');
    const toolEraser = document.getElementById('tool-eraser');
    const toolUndo = document.getElementById('tool-undo');
    const toolClear = document.getElementById('tool-clear');

    let cachedMessages = {};
    let cachedStampHistory = {};
    let isDrawing = false;
    let currentTool = 'pen'; // 'pen', 'brush', 'fill', 'eraser'
    let activeLayerId = 3; // 3 or 2
    let historyStack = [];

    // アクティブなキャンバス層の取得
    function getActiveLayer() {
      return activeLayerId === 2 ? { canvas: layer2, ctx: ctx2 } : { canvas: layer3, ctx: ctx3 };
    }

    // レイヤー切替関数
    function setActiveLayer(layerId) {
      activeLayerId = layerId;
      if (layerId === 3) {
        layerBtn3.classList.add('active');
        layerBtn2.classList.remove('active');
      } else {
        layerBtn2.classList.add('active');
        layerBtn3.classList.remove('active');
      }
    }

    layerBtn3.addEventListener('click', () => setActiveLayer(3));
    layerBtn2.addEventListener('click', () => setActiveLayer(2));

    // Photoshop風 レイヤープレビュー更新
    function updateLayerPreviews() {
      psPreview3.src = layer3.toDataURL();
      psPreview2.src = layer2.toDataURL();
    }

    // 絵文字・顔文字リスト
    const emojis = ['✨', '👑', '💘', '❤', '🔥', '😊', '😍', '👏', '🎉', '🙌', '🌟', '👍', '💐', '🥰', '💯'];
    const kaimojis = ['( ﾟДﾟ)', '( *´艸｀)', '( ;∀;)', '(^^)ﾉｼ'];

    // カーソル位置に文字列を挿入
    function insertAtCursor(field, text) {
      const startPos = field.selectionStart;
      const endPos = field.selectionEnd;
      field.value = field.value.substring(0, startPos) + text + field.value.substring(endPos, field.value.length);
      field.focus();
      field.setSelectionRange(startPos + text.length, startPos + text.length);
    }

    // モーダル内パレットの動的生成
    emojis.forEach(emoji => {
      const btn = document.createElement('button');
      btn.className = 'palette-btn';
      btn.textContent = emoji;
      btn.type = 'button';
      btn.addEventListener('click', () => insertAtCursor(modalTextInput, emoji));
      emojiPalette.appendChild(btn);
    });

    kaimojis.forEach(kaimoji => {
      const btn = document.createElement('button');
      btn.className = 'palette-btn kaimoji-btn';
      btn.textContent = kaimoji;
      btn.type = 'button';
      btn.addEventListener('click', () => insertAtCursor(modalTextInput, kaimoji));
      kaimojiPalette.appendChild(btn);
    });

    // モーダル開閉処理
    function openModal() {
      modalTextInput.value = messageInput.value;
      commentModalOverlay.classList.add('active');
      setTimeout(() => modalTextInput.focus(), 50);
    }

    function closeModal() {
      commentModalOverlay.classList.remove('active');
    }

    modalOpenBtn.addEventListener('click', openModal);
    modalCloseX.addEventListener('click', closeModal);
    modalCloseBtn.addEventListener('click', closeModal);

    modalClearBtn.addEventListener('click', () => {
      modalTextInput.value = '';
      modalTextInput.focus();
    });

    modalSubmitBtn.addEventListener('click', () => {
      const text = modalTextInput.value.trim();
      if (text) {
        const sender = userSelect.value;
        push(messagesRef, {
          sender: sender,
          text: text,
          timestamp: Date.now()
        });
        modalTextInput.value = '';
        messageInput.value = '';
        messageInput.style.height = '40px';
      }
      closeModal();
    });

    /* --- 手描きスタンプ 描画＆ツール処理 --- */
    goToStampBtn.addEventListener('click', () => {
      closeModal();
      stampModalOverlay.classList.add('active');
      saveState();
      updateLayerPreviews();
    });

    backToCommentBtn.addEventListener('click', () => {
      stampModalOverlay.classList.remove('active');
      commentModalOverlay.classList.add('active');
    });

    stampModalCloseX.addEventListener('click', () => stampModalOverlay.classList.remove('active'));
    stampCancelBtn.addEventListener('click', () => stampModalOverlay.classList.remove('active'));

    // ツール切り替え
    function setActiveTool(tool) {
      currentTool = tool;
      toolPen.classList.toggle('active', tool === 'pen');
      toolBrush.classList.toggle('active', tool === 'brush');
      toolFill.classList.toggle('active', tool === 'fill');
      toolEraser.classList.toggle('active', tool === 'eraser');
    }

    toolPen.addEventListener('click', () => setActiveTool('pen'));
    toolBrush.addEventListener('click', () => setActiveTool('brush'));
    toolFill.addEventListener('click', () => setActiveTool('fill'));
    toolEraser.addEventListener('click', () => setActiveTool('eraser'));

    function saveState() {
      if (historyStack.length >= 10) historyStack.shift();
      const layerData = {
        l2: ctx2.getImageData(0, 0, layer2.width, layer2.height),
        l3: ctx3.getImageData(0, 0, layer3.width, layer3.height)
      };
      historyStack.push(layerData);
    }

    toolUndo.addEventListener('click', () => {
      if (historyStack.length > 0) {
        const prevState = historyStack.pop();
        ctx2.putImageData(prevState.l2, 0, 0);
        ctx3.putImageData(prevState.l3, 0, 0);
        updateLayerPreviews();
      }
    });

    toolClear.addEventListener('click', () => {
      saveState();
      const { ctx, canvas } = getActiveLayer();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      updateLayerPreviews();
    });

    // 座標取得
    function getCanvasCoords(e) {
      const rect = layer3.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: Math.floor((clientX - rect.left) * (layer3.width / rect.width)),
        y: Math.floor((clientY - rect.top) * (layer3.height / rect.height))
      };
    }

    // 塗りつぶし（Flood Fill）
    function floodFill(startX, startY, fillColorHex) {
      const { canvas, ctx } = getActiveLayer();
      const width = canvas.width;
      const height = canvas.height;
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      const r = parseInt(fillColorHex.slice(1, 3), 16);
      const g = parseInt(fillColorHex.slice(3, 5), 16);
      const b = parseInt(fillColorHex.slice(5, 7), 16);
      const a = 255;

      const startPos = (startY * width + startX) * 4;
      const startR = data[startPos];
      const startG = data[startPos + 1];
      const startB = data[startPos + 2];
      const startA = data[startPos + 3];

      if (startR === r && startG === g && startB === b && startA === a) return;

      function matchStartColor(pos) {
        return data[pos] === startR &&
               data[pos + 1] === startG &&
               data[pos + 2] === startB &&
               data[pos + 3] === startA;
      }

      function colorPixel(pos) {
        data[pos] = r;
        data[pos + 1] = g;
        data[pos + 2] = b;
        data[pos + 3] = a;
      }

      const pixelStack = [[startX, startY]];

      while (pixelStack.length) {
        const newPos = pixelStack.pop();
        const x = newPos[0];
        let y = newPos[1];
        let pixelPos = (y * width + x) * 4;

        while (y >= 0 && matchStartColor(pixelPos)) {
          y--;
          pixelPos -= width * 4;
        }
        pixelPos += width * 4;
        y++;

        let reachLeft = false;
        let reachRight = false;

        while (y < height && matchStartColor(pixelPos)) {
          colorPixel(pixelPos);

          if (x > 0) {
            if (matchStartColor(pixelPos - 4)) {
              if (!reachLeft) {
                pixelStack.push([x - 1, y]);
                reachLeft = true;
              }
            } else if (reachLeft) {
              reachLeft = false;
            }
          }

          if (x < width - 1) {
            if (matchStartColor(pixelPos + 4)) {
              if (!reachRight) {
                pixelStack.push([x + 1, y]);
                reachRight = true;
              }
            } else if (reachRight) {
              reachRight = false;
            }
          }

          y++;
          pixelPos += width * 4;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      updateLayerPreviews();
    }

    // 描画開始
    function startDrawing(e) {
      const pos = getCanvasCoords(e);
      saveState();

      if (currentTool === 'fill') {
        floodFill(pos.x, pos.y, stampColorInput.value);
        return;
      }

      isDrawing = true;
      const { ctx } = getActiveLayer();
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing || currentTool === 'fill') return;
      e.preventDefault();
      const pos = getCanvasCoords(e);
      const { ctx } = getActiveLayer();

      ctx.lineWidth = stampSizeInput.value;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (currentTool === 'pen') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = stampColorInput.value;
        ctx.shadowBlur = 0;
      } else if (currentTool === 'brush') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = stampColorInput.value;
        ctx.shadowColor = stampColorInput.value;
        ctx.shadowBlur = parseInt(stampSizeInput.value, 10);
      } else if (currentTool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.shadowBlur = 0;
      }

      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (isDrawing) {
        const { ctx } = getActiveLayer();
        ctx.closePath();
        ctx.shadowBlur = 0;
        isDrawing = false;
        updateLayerPreviews();
      }
    }

    layer3.addEventListener('mousedown', startDrawing);
    layer3.addEventListener('mousemove', draw);
    layer3.addEventListener('mouseup', stopDrawing);
    layer3.addEventListener('mouseleave', stopDrawing);

    layer3.addEventListener('touchstart', startDrawing, { passive: false });
    layer3.addEventListener('touchmove', draw, { passive: false });
    layer3.addEventListener('touchend', stopDrawing);

    // 完成・送信
    stampSubmitBtn.addEventListener('click', () => {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 250;
      exportCanvas.height = 250;
      const expCtx = exportCanvas.getContext('2d');

      expCtx.drawImage(layer2, 0, 0);
      expCtx.drawImage(layer3, 0, 0);

      const stampDataUrl = exportCanvas.toDataURL('image/png');

      const sender = userSelect.value;
      push(messagesRef, {
        sender: sender,
        text: '',
        fileData: stampDataUrl,
        fileName: `stamp_${Date.now()}.png`,
        isStamp: true,
        timestamp: Date.now()
      });

      saveStampToFirebaseHistory(stampDataUrl);

      ctx2.clearRect(0, 0, layer2.width, layer2.height);
      ctx3.clearRect(0, 0, layer3.width, layer3.height);
      historyStack = [];
      updateLayerPreviews();
      stampModalOverlay.classList.remove('active');
    });

    /* --- スタンプ履歴処理 (Firebase連動) --- */
    function saveStampToFirebaseHistory(dataUrl) {
      push(stampHistoryRef, {
        dataUrl: dataUrl,
        creator: userSelect.value,
        timestamp: Date.now()
      });
    }

    // 既存のPNG画像ファイルを履歴に追加登録する処理
    stampUploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 10 * 1024 * 1024) {
        alert('ファイルサイズは10MB以下にしてください。');
        stampUploadInput.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = function(event) {
        const dataUrl = event.target.result;
        saveStampToFirebaseHistory(dataUrl);
        stampUploadInput.value = '';
      };
      reader.readAsDataURL(file);
    });

    // Firebaseのスタンプ履歴データを監視
    onValue(stampHistoryRef, (snapshot) => {
      cachedStampHistory = snapshot.val() || {};
      if (historyModalOverlay.classList.contains('active')) {
        renderStampHistory();
      }
    });

    function renderStampHistory() {
      historyGrid.innerHTML = '';
      const keys = Object.keys(cachedStampHistory);

      if (keys.length === 0) {
        historyGrid.innerHTML = '<div style="color:#aaa; font-size:0.85rem; grid-column:1/-1; text-align:center;">履歴はありません</div>';
        return;
      }

      keys.reverse().forEach((key) => {
        const item = cachedStampHistory[key];
        const card = document.createElement('div');
        card.className = 'history-card';

        const imgWrapper = document.createElement('div');
        imgWrapper.className = 'history-img-wrapper';

        const img = document.createElement('img');
        img.src = item.dataUrl;
        img.className = 'history-img';
        imgWrapper.appendChild(img);

        const actions = document.createElement('div');
        actions.className = 'history-actions';

        // 再びスタンプとして送る
        const sendBtn = document.createElement('button');
        sendBtn.className = 'history-action-btn send';
        sendBtn.innerHTML = '💬 スタンプ送信';
        sendBtn.addEventListener('click', () => {
          const sender = userSelect.value;
          push(messagesRef, {
            sender: sender,
            text: '',
            fileData: item.dataUrl,
            fileName: `stamp_${Date.now()}.png`,
            isStamp: true,
            timestamp: Date.now()
          });
          historyModalOverlay.classList.remove('active');
        });

        // ダウンロード
        const downloadBtn = document.createElement('button');
        downloadBtn.className = 'history-action-btn';
        downloadBtn.innerHTML = '⬇ ダウンロード';
        downloadBtn.addEventListener('click', () => {
          const a = document.createElement('a');
          a.href = item.dataUrl;
          a.download = `stamp_${Date.now()}.png`;
          a.click();
        });

        // 削除
        const delBtn = document.createElement('button');
        delBtn.className = 'history-action-btn del';
        delBtn.innerHTML = '🗑 削除';
        delBtn.addEventListener('click', () => {
          if (confirm('共有スタンプ履歴からこのスタンプを削除しますか？')) {
            remove(ref(db, `stamp_history/${key}`));
          }
        });

        actions.appendChild(sendBtn);
        actions.appendChild(downloadBtn);
        actions.appendChild(delBtn);

        card.appendChild(imgWrapper);
        card.appendChild(actions);
        historyGrid.appendChild(card);
      });
    }

    goToHistoryBtn.addEventListener('click', () => {
      stampModalOverlay.classList.remove('active');
      renderStampHistory();
      historyModalOverlay.classList.add('active');
    });

    backToStampDrawBtn.addEventListener('click', () => {
      historyModalOverlay.classList.remove('active');
      stampModalOverlay.classList.add('active');
    });

    historyModalCloseX.addEventListener('click', () => historyModalOverlay.classList.remove('active'));

    // ハンバーガーメニューの開閉機能
    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    }

    hamburgerBtn.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', closeSidebar);

    // パスワード認証処理
    function checkPassword() {
      if (passInput.value === SECRET_PASSWORD) {
        localStorage.setItem('family_chat_auth', 'true');
        unlockApp();
      } else {
        passError.style.display = 'block';
      }
    }

    function unlockApp() {
      lockScreen.style.display = 'none';
      appContent.style.display = 'flex';
      initChat();
    }

    if (localStorage.getItem('family_chat_auth') === 'true') {
      unlockApp();
    }

    passBtn.addEventListener('click', checkPassword);
    passInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    // メッセージ送信処理
    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      const sender = userSelect.value;
      push(messagesRef, {
        sender: sender,
        text: text,
        timestamp: Date.now()
      });

      messageInput.value = '';
      messageInput.style.height = '40px';
    }

    // ファイル送信処理
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 10 * 1024 * 1024) {
        alert('ファイルサイズは10MB以下にしてください。');
        fileInput.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = function(event) {
        const fileData = event.target.result;
        const sender = userSelect.value;
        const isImage = file.type.startsWith('image/');

        push(messagesRef, {
          sender: sender,
          text: '',
          fileData: fileData,
          fileName: file.name,
          fileType: file.type,
          isImage: isImage,
          timestamp: Date.now()
        });

        fileInput.value = '';
      };
      reader.readAsDataURL(file);
    });

    // メッセージの削除
    function deleteMessage(key) {
      if (confirm('このメッセージを削除しますか？')) {
        const targetRef = ref(db, `messages/${key}`);
        remove(targetRef);
      }
    }

    // テキスト内のURL判定とHTMLリンク化
    function renderFormattedText(container, text) {
      const urlRegex = /(https?:\/\/[a-zA-Z0-9\-\._~:\/\?#\[\]@!\$&'\(\)\*\+,;=]+\.html)/g;
      let lastIndex = 0;
      let match;

      while ((match = urlRegex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          container.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
        }

        const link = document.createElement('a');
        link.href = match[0];
        link.textContent = match[0];
        link.className = 'chat-link';
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        container.appendChild(link);

        lastIndex = urlRegex.lastIndex;
      }

      if (lastIndex < text.length) {
        container.appendChild(document.createTextNode(text.substring(lastIndex)));
      }
    }

    // 画面への描画
    function renderMessages() {
      chatBox.innerHTML = '';
      const currentUser = userSelect.value;

      Object.keys(cachedMessages).forEach((key) => {
        const msg = cachedMessages[key];
        const isSent = msg.sender === currentUser;

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;

        const senderName = document.createElement('div');
        senderName.className = 'sender-name';
        senderName.textContent = msg.sender;

        const bubble = document.createElement('div');
        bubble.className = `bubble ${msg.isStamp ? 'stamp-bubble' : ''}`;

        if (msg.fileData) {
          if (msg.isStamp) {
            const stampImg = document.createElement('img');
            stampImg.src = msg.fileData;
            stampImg.className = 'chat-stamp';
            stampImg.alt = '手描きスタンプ';
            bubble.appendChild(stampImg);
          } else if (msg.isImage) {
            const img = document.createElement('img');
            img.src = msg.fileData;
            img.className = 'chat-image';
            img.alt = msg.fileName || '画像';
            bubble.appendChild(img);
          } else {
            const fileAttachment = document.createElement('div');
            fileAttachment.className = 'file-attachment';
            fileAttachment.innerHTML = `📄 <span class="file-name">${msg.fileName}</span>`;
            bubble.appendChild(fileAttachment);
          }
        }

        if (msg.text) {
          const textNode = document.createElement('div');
          renderFormattedText(textNode, msg.text);
          bubble.appendChild(textNode);
        }

        const metaInfo = document.createElement('div');
        metaInfo.className = 'meta-info';

        const timestamp = document.createElement('span');
        timestamp.className = 'timestamp';
        const date = new Date(msg.timestamp);
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        timestamp.textContent = `${hours}:${minutes}`;

        metaInfo.appendChild(timestamp);

        // ファイルデータがある場合、小文字のダウンロードボタンを表示
        if (msg.fileData) {
          const downloadBtn = document.createElement('button');
          downloadBtn.className = 'delete-btn';
          downloadBtn.textContent = 'ダウンロード';
          downloadBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = msg.fileData;
            a.download = msg.fileName || `download_${Date.now()}.${msg.isStamp ? 'png' : 'bin'}`;
            a.click();
          });
          metaInfo.appendChild(downloadBtn);
        }

        // 送信者のメッセージのみ「削除」ボタンを表示
        if (isSent) {
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-btn';
          deleteBtn.textContent = '削除';
          deleteBtn.addEventListener('click', () => deleteMessage(key));
          metaInfo.appendChild(deleteBtn);
        }

        msgDiv.appendChild(senderName);
        msgDiv.appendChild(bubble);
        msgDiv.appendChild(metaInfo);

        chatBox.appendChild(msgDiv);
      });

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // チャット初期化
    function initChat() {
      const savedUser = localStorage.getItem('family_chat_user');
      if (savedUser) userSelect.value = savedUser;

      userSelect.addEventListener('change', () => {
        localStorage.setItem('family_chat_user', userSelect.value);
        renderMessages();
      });

      onValue(messagesRef, (snapshot) => {
        const data = snapshot.val() || {};
        cachedMessages = data;
        cleanOldMessages(data);
        renderMessages();
      });

      function cleanOldMessages(data) {
        const now = Date.now();
        Object.keys(data).forEach((key) => {
          const msg = data[key];
          if (msg.timestamp && (now - msg.timestamp > SEVEN_DAYS_MS)) {
            remove(ref(db, `messages/${key}`));
          }
        });
      }

      sendBtn.addEventListener('click', sendMessage);

      messageInput.addEventListener('keydown', (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Enter') {
          if (!e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        }
      });

      messageInput.addEventListener('input', () => {
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
      });
    }
  </script>
</body>
</html>
