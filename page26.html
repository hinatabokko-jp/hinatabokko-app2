<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>family chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* パスワードロック画面 */
    #lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      gap: 16px;
      padding: 20px;
    }
    #lock-screen h2 {
      font-size: 1.2rem;
      color: #00bcd4;
    }
    #pass-input {
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px 16px;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      width: 200px;
    }
    #pass-btn {
      background-color: #00bcd4;
      color: #121212;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #pass-error {
      color: #ff5252;
      font-size: 0.85rem;
      display: none;
    }

    /* メインコンテンツ（ロック解除前は非表示） */
    #app-content {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* ヘッダー */
    header {
      background-color: #1e1e1e;
      padding: 12px 16px;
      border-bottom: 1px solid #2d2d2d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #00bcd4;
    }
    .user-select-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .user-select-label {
      font-size: 0.85rem;
      color: #aaa;
    }
    select {
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    /* チャット表示エリア */
    #chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* メッセージバルーン */
    .message {
      max-width: 75%;
      display: flex;
      flex-direction: column;
    }
    .message.sent {
      align-self: flex-end;
    }
    .message.received {
      align-self: flex-start;
    }
    .sender-name {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 3px;
      padding: 0 4px;
    }
    .message.sent .sender-name {
      text-align: right;
    }
    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .message.sent .bubble {
      background-color: #00796b;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .message.received .bubble {
      background-color: #2a2a2a;
      color: #e0e0e0;
      border-bottom-left-radius: 2px;
    }
    .timestamp {
      font-size: 0.65rem;
      color: #666;
      margin-top: 3px;
      padding: 0 4px;
    }
    .message.sent .timestamp {
      text-align: right;
    }

    /* 入力エリア */
    footer {
      background-color: #1e1e1e;
      padding: 12px 16px;
      border-top: 1px solid #2d2d2d;
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 20px;
      padding: 10px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #00bcd4;
    }
    button {
      background-color: #00bcd4;
      color: #121212;
      border: none;
      border-radius: 20px;
      padding: 0 18px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:active {
      background-color: #008ba3;
    }
  </style>
</head>
<body>

  <!-- ロック画面 -->
  <div id="lock-screen">
    <h2>パスワードを入力してください</h2>
    <input type="password" id="pass-input" placeholder="パスワード" autocomplete="off">
    <button id="pass-btn">解除</button>
    <div id="pass-error">パスワードが違います</div>
  </div>

  <!-- アプリ本体 -->
  <div id="app-content">
    <header>
      <div class="header-title">family chat</div>
      <div class="user-select-container">
        <span class="user-select-label">私は:</span>
        <select id="user-select">
          <option value="おかあさん">おかあさん</option>
          <option value="むすめ">むすめ</option>
        </select>
      </div>
    </header>

    <main id="chat-box"></main>

    <footer>
      <input type="text" id="message-input" placeholder="メッセージを入力..." autocomplete="off">
      <button id="send-btn">送信</button>
    </footer>
  </div>

  <!-- Firebase SDK (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ★ パスワードの設定（お好みの数字や文字列に変更可能）
    const SECRET_PASSWORD = "1234";

    // 7日間のミリ秒数 (7日 × 24時間 × 60分 × 60秒 × 1000ミリ秒)
    const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

    // Firebase 設定情報
    const firebaseConfig = {
      apiKey: "AIzaSyCR0rsl3c8LdY2t0F95qZXrr3fr_iMFg74",
      authDomain: "family-chat-3e0d6.firebaseapp.com",
      databaseURL: "https://family-chat-3e0d6-default-rtdb.firebaseio.com",
      projectId: "family-chat-3e0d6",
      storageBucket: "family-chat-3e0d6.firebasestorage.app",
      messagingSenderId: "929536387295",
      appId: "1:929536387295:web:84d62b03ef370f19f7a16a",
      measurementId: "G-CT2HGLK75T"
    };

    // Firebase初期化
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');

    // DOM要素
    const lockScreen = document.getElementById('lock-screen');
    const appContent = document.getElementById('app-content');
    const passInput = document.getElementById('pass-input');
    const passBtn = document.getElementById('pass-btn');
    const passError = document.getElementById('pass-error');

    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const userSelect = document.getElementById('user-select');

    // パスワード認証処理
    function checkPassword() {
      if (passInput.value === SECRET_PASSWORD) {
        localStorage.setItem('family_chat_auth', 'true');
        unlockApp();
      } else {
        passError.style.display = 'block';
      }
    }

    function unlockApp() {
      lockScreen.style.display = 'none';
      appContent.style.display = 'flex';
      initChat();
    }

    // 自動ログインチェック
    if (localStorage.getItem('family_chat_auth') === 'true') {
      unlockApp();
    }

    passBtn.addEventListener('click', checkPassword);
    passInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    // チャット初期化
    function initChat() {
      // ユーザー復元
      const savedUser = localStorage.getItem('family_chat_user');
      if (savedUser) userSelect.value = savedUser;

      userSelect.addEventListener('change', () => {
        localStorage.setItem('family_chat_user', userSelect.value);
        renderMessages();
      });

      // メッセージデータ監視＆自動削除処理
      let cachedMessages = {};

      onValue(messagesRef, (snapshot) => {
        const data = snapshot.val() || {};
        cachedMessages = data;
        
        // 7日以上前のデータクリーンアップ
        cleanOldMessages(data);
        
        renderMessages();
      });

      // 7日経過したメッセージをFirebaseから削除する関数
      function cleanOldMessages(data) {
        const now = Date.now();
        Object.keys(data).forEach((key) => {
          const msg = data[key];
          if (msg.timestamp && (now - msg.timestamp > SEVEN_DAYS_MS)) {
            // 7日超えのデータをFirebaseから削除
            const itemRef = ref(db, `messages/${key}`);
            remove(itemRef);
          }
        });
      }

      // 描画関数
      function renderMessages() {
        chatBox.innerHTML = '';
        const currentUser = userSelect.value;

        Object.values(cachedMessages).forEach((data) => {
          const isMe = (data.sender === currentUser);

          const msgEl = document.createElement('div');
          msgEl.classList.add('message', isMe ? 'sent' : 'received');

          msgEl.innerHTML = `
            <div class="sender-name">${escapeHtml(data.sender)}</div>
            <div class="bubble">${escapeHtml(data.text)}</div>
            <div class="timestamp">${escapeHtml(data.time)}</div>
          `;

          chatBox.appendChild(msgEl);
        });

        chatBox.scrollTop = chatBox.scrollHeight;
      }

      // 送信処理
      function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        const currentUser = userSelect.value;
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

        push(messagesRef, {
          sender: currentUser,
          text: text,
          time: timeStr,
          timestamp: Date.now()
        });

        messageInput.value = '';
      }

      sendBtn.addEventListener('click', sendMessage);
      messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
      });
    }

    // エスケープ処理
    function escapeHtml(str) {
      return str ? str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : '';
    }
  </script>
</body>
</html>
