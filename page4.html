<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI terminology & Interactive Demo</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            900: '#312e81',
                        },
                        darkbg: '#0B0F17',
                        cardbg: '#161F30',
                        cardborder: '#2A374E'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Hiragino Sans', 'BIZ UDPGothic', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #0B0F17;
            color: #f1f5f9;
            overflow-x: hidden;
            font-family: 'Inter', 'Hiragino Sans', 'BIZ UDPGothic', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0B0F17;
        }

        ::-webkit-scrollbar-thumb {
            background: #2A374E;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4f46e5;
        }

        .glass {
            background: rgba(22, 31, 48, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        .toast-enter {
            animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .toast-exit {
            animation: fadeOut 0.3s ease forwards;
        }

        @keyframes pulseGlow {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.8;
            }
        }

        .skeleton-anim {
            animation: pulseGlow 1.5s infinite ease-in-out;
        }

        .tooltip-arrow::after {
            content: " ";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #312e81 transparent transparent transparent;
        }

        /* Wheel-style Time Picker */
        .time-wheel {
            height: 132px;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }

        .time-wheel::-webkit-scrollbar {
            display: none;
        }

        .time-wheel-item {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #64748b;
            transition: all 0.15s ease;
            cursor: pointer;
            user-select: none;
        }

        .time-wheel-item.selected {
            color: #818cf8;
            font-size: 20px;
        }

        .time-wheel-highlight {
            position: absolute;
            left: 0;
            right: 0;
            top: 44px;
            height: 44px;
            border-top: 1px solid rgba(99, 102, 241, 0.5);
            border-bottom: 1px solid rgba(99, 102, 241, 0.5);
            background: rgba(99, 102, 241, 0.08);
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>

<body class="bg-darkbg text-slate-100 min-h-screen antialiased pb-16 selection:bg-brand-500 selection:text-white">

    <!-- Top Header -->
    <header class="sticky top-0 z-30 glass border-b border-cardborder/60 px-4 lg:px-8 py-4 mb-6 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-4">

            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-gradient-to-tr from-brand-600 to-indigo-400 rounded-xl shadow-lg shadow-brand-500/20 text-white shrink-0">
                    <i data-lucide="layout-template" class="w-6 h-6"></i>
                </div>

                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-white flex items-center gap-2">
                        UI 用語辞典 & 実演プレイグラウンド
                    </h1>

                    <p class="text-xs text-slate-400">
                        Googleサイト対応版 / アプリ開発で使える画面用語の動作デモ
                    </p>
                </div>
            </div>

            <!-- Search -->
            <div class="relative w-full sm:w-64">
                <i data-lucide="search"
                   class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="用語・説明文で検索..."
                    class="w-full bg-slate-900/90 border border-cardborder rounded-xl pl-9 pr-4 py-2 text-xs text-slate-200 focus:outline-none focus:border-brand-500 transition-colors">
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-7xl mx-auto px-4 lg:px-8 space-y-6">

        <!-- Category Tabs -->
        <div
            class="flex items-center gap-2 overflow-x-auto pb-2 border-b border-cardborder/40"
            id="categoryTabs">

            <button
                data-category="all"
                class="cat-btn active px-4 py-2 rounded-xl text-xs font-semibold transition-all bg-brand-600 text-white shadow-md shadow-brand-600/30 shrink-0">
                すべて表示
            </button>

            <button
                data-category="interactive"
                class="cat-btn px-4 py-2 rounded-xl text-xs font-medium transition-all bg-cardbg text-slate-400 hover:text-slate-200 border border-cardborder shrink-0">
                操作・切り替え系
            </button>

            <button
                data-category="overlay"
                class="cat-btn px-4 py-2 rounded-xl text-xs font-medium transition-all bg-cardbg text-slate-400 hover:text-slate-200 border border-cardborder shrink-0">
                オーバーレイ・通知系
            </button>

            <button
                data-category="layout"
                class="cat-btn px-4 py-2 rounded-xl text-xs font-medium transition-all bg-cardbg text-slate-400 hover:text-slate-200 border border-cardborder shrink-0">
                レイアウト・ナビ系
            </button>
        </div>

        <!-- Terms -->
        <div
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"
            id="termsGrid">
        </div>

        <!-- Empty -->
        <div id="emptyState" class="hidden text-center py-16">
            <i data-lucide="search-x"
               class="w-12 h-12 text-slate-600 mx-auto mb-3"></i>

            <p class="text-slate-400 text-xs">
                一致する用語が見つかりませんでした。
            </p>
        </div>
    </main>

    <!-- Toast -->
    <div
        id="toastContainer"
        class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4">
    </div>

    <!-- Modal -->
    <div
        id="modalOverlay"
        class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity duration-200">

        <div
            id="modalCard"
            class="bg-cardbg border border-cardborder rounded-2xl p-6 max-w-md w-full shadow-2xl relative transform transition-all duration-200 scale-95 opacity-0">

            <button
                onclick="window.closeModal()"
                aria-label="閉じる"
                class="absolute top-4 right-4 p-1.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">

                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Bottom Sheet -->
    <div
        id="bottomSheetOverlay"
        class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 hidden transition-opacity duration-200">

        <div
            id="bottomSheetCard"
            class="fixed bottom-0 left-0 right-0 bg-cardbg border-t border-cardborder rounded-t-3xl p-6 shadow-2xl transform translate-y-full transition-transform duration-300 ease-out max-w-2xl mx-auto">

            <div
                class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto mb-6 cursor-pointer"
                onclick="window.closeBottomSheet()">
            </div>

            <div id="bottomSheetBody"></div>
        </div>
    </div>

    <!-- Drawer -->
    <div
        id="drawerOverlay"
        class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 hidden transition-opacity duration-200">

        <div
            id="drawerCard"
            class="fixed top-0 bottom-0 left-0 w-72 sm:w-80 bg-cardbg border-r border-cardborder p-6 shadow-2xl transform -translate-x-full transition-transform duration-300 ease-out flex flex-col">

            <div class="flex items-center justify-between pb-4 border-b border-cardborder mb-6">

                <h3 class="font-bold text-base text-white">
                    ドロワーメニュー
                </h3>

                <button
                    onclick="window.closeDrawer()"
                    class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white">

                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div id="drawerBody" class="flex-1 space-y-3"></div>
        </div>
    </div>

    <script>
        /* =========================================================
           State
        ========================================================= */

        window.demoState = {};


        /* =========================================================
           Terminology Data
        ========================================================= */

        const termsData = [

            /* -----------------------------------------------------
               Interactive Controls
            ----------------------------------------------------- */

            {
                id: 'toggle',
                term: 'トグル (Toggle / Switch)',
                category: 'interactive',
                catLabel: '操作・切り替え系',
                icon: 'toggle-right',
                definition: 'ON/OFFの状態をワンタップで切り替えるスイッチ形式のボタンです。設定変更などでよく使われます。',
                example: '「通知の有効化切り替えはトグルスイッチにしてください」',
                demoType: 'inline',

                renderDemo: (cardId) => `
                    <div class="flex items-center justify-between p-3 rounded-xl bg-slate-900/80 border border-cardborder">

                        <span class="text-xs text-slate-300 font-medium">
                            Push通知を送信
                        </span>

                        <button
                            id="demo-toggle-${cardId}"
                            onclick="window.handleToggle('${cardId}')"
                            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors bg-slate-700 focus:outline-none">

                            <span
                                id="demo-toggle-dot-${cardId}"
                                class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-1">
                            </span>
                        </button>
                    </div>
                `
            },


            {
                id: 'accordion',
                term: 'アコーディオン (Accordion)',
                category: 'interactive',
                catLabel: '操作・切り替え系',
                icon: 'chevron-down',
                definition: 'タップすると畳まれていた領域が上下に展開し、詳細内容を表示するパーツです。FAQなどで多用されます。',
                example: '「FAQの回答部分はアコーディオン形式にして初期は閉じておいてください」',
                demoType: 'inline',

                renderDemo: (cardId) => `
                    <div class="rounded-xl border border-cardborder bg-slate-900/80 overflow-hidden">

                        <button
                            onclick="window.handleAccordion('${cardId}')"
                            class="w-full flex items-center justify-between p-3 text-left hover:bg-slate-800/50 transition-colors">

                            <span class="text-xs font-medium text-slate-300">
                                Q. 解約手続きはどこで行えますか？
                            </span>

                            <i
                                id="acc-icon-${cardId}"
                                data-lucide="chevron-down"
                                class="w-4 h-4 text-slate-400 transition-transform duration-200">
                            </i>
                        </button>

                        <div
                            id="acc-body-${cardId}"
                            class="hidden p-3 border-t border-cardborder/60 text-xs text-slate-400 bg-slate-950/60 leading-relaxed">

                            マイページの「契約・アカウント設定」から、いつでもワンタップで解約可能です。
                        </div>
                    </div>
                `
            },


            {
                id: 'tabs',
                term: 'タブ (Tabs)',
                category: 'interactive',
                catLabel: '操作・切り替え系',
                icon: 'folder-git-2',
                definition: '別ページへ移動せず、同一画面内で表示領域を切り替えるインデックス形式の見出しです。',
                example: '「マイページ内は『購入履歴』『お気に入り』のタブ切替にしたいです」',
                demoType: 'inline',

                renderDemo: (cardId) => `
                    <div class="space-y-2">

                        <div class="flex border-b border-cardborder text-xs">

                            <button
                                onclick="window.handleTab('${cardId}', 'tab1')"
                                id="tab-btn-1-${cardId}"
                                class="py-1.5 px-3 border-b-2 border-brand-500 text-brand-400 font-semibold">
                                注文履歴
                            </button>

                            <button
                                onclick="window.handleTab('${cardId}', 'tab2')"
                                id="tab-btn-2-${cardId}"
                                class="py-1.5 px-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 font-semibold">
                                お気に入り
                            </button>
                        </div>

                        <div
                            id="tab-content-${cardId}"
                            class="p-2.5 text-xs text-slate-300 bg-slate-900/60 rounded-xl border border-cardborder/40">

                            📦 最近注文した商品リストがここに表示されます。
                        </div>
                    </div>
                `
            },


            {
                id: 'dropdown',
                term: 'ドロップダウン / セレクトボックス',
                category: 'interactive',
                catLabel: '操作・切り替え系',
                icon: 'list-filter',
                definition: 'クリックすると複数の選択項目が下にリスト状に広がり、1つを選択させるメニューです。',
                example: '「配送地域の選択はドロップダウン形式でお願いします」',
                demoType: 'inline',

                renderDemo: (cardId) => `
                    <div class="relative">

                        <select
                            onchange="window.triggerToast('選択しました: ' + this.value, 'info')"
                            class="w-full bg-slate-900/90 border border-cardborder rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500 appearance-none cursor-pointer">

                            <option value="東京都">東京都</option>
                            <option value="大阪府">大阪府</option>
                            <option value="愛知県">愛知県</option>
                            <option value="福岡県">福岡県</option>
                        </select>

                        <i
                            data-lucide="chevron-down"
                            class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
                        </i>
                    </div>
                `
            },


            {
                id: 'segmented',
                term: 'セグメントコントロール (Segmented Control)',
                category: 'interactive',
                catLabel: '操作・切り替え系',
                icon: 'layout-grid',
                definition: '2〜4個の少数の選択肢を横並びで並べ、直感的に1つをハイライト選択させるボタン群です。',
                example: '「グラフの期間指定を『日 / 週 / 月』のセグメントコントロールにしてください」',
                demoType: 'inline',

                renderDemo: (cardId) => `
                    <div class="p-1 bg-slate-900/90 rounded-xl border border-cardborder flex gap-1">

                        <button
                            id="seg-1-${cardId}"
                            onclick="window.handleSegment('${cardId}', 1)"
                            class="flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all bg-brand-600 text-white shadow-sm flex items-center justify-center gap-1">

                            <i data-lucide="list" class="w-3.5 h-3.5"></i>
                            リスト
                        </button>

                        <button
                            id="seg-2-${cardId}"
                            onclick="window.handleSegment('${cardId}', 2)"
                            class="flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1">

                            <i data-lucide="grid" class="w-3.5 h-3.5"></i>
                            グリッド
                        </button>
                    </div>
                `
            },


            {
                id: 'stepper',
                term: 'ステッパー (Stepper)',
                category: 'interactive',
                catLabel: '操作・切り替え系',
                icon: 'plus-circle',
                definition: '「＋」「ー」のボタンを使って数量などの数値を段階的に変更する操作パーツです。',
                example: '「カートの購入数量調整はステッパー形式にしてください」',
                demoType: 'inline',

                renderDemo: (cardId) => `
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-900/80 border border-cardborder">

                        <span class="text-xs text-slate-300 font-medium">
                            数量設定
                        </span>

                        <div class="flex items-center gap-3 bg-slate-950 p-1 rounded-lg border border-cardborder/60">

                            <button
                                onclick="window.handleStepper('${cardId}', -1)"
                                class="w-6 h-6 rounded bg-slate-800 text-slate-200 hover:bg-slate-700 flex items-center justify-center font-bold text-xs">
                                -
                            </button>

                            <span
                                id="stepper-val-${cardId}"
                                class="text-xs font-bold w-4 text-center">
                                1
                            </span>

                            <button
                                onclick="window.handleStepper('${cardId}', 1)"
                                class="w-6 h-6 rounded bg-slate-800 text-slate-200 hover:bg-slate-700 flex items-center justify-center font-bold text-xs">
                                +
                            </button>

                        </div>
                    </div>
                `
            },


            {
                id: 'tooltip',
                term: 'ツールチップ (Tooltip)',
                category: 'interactive',
                catLabel: '操作・切り替え系',
                icon: 'message-square-plus',
                definition: 'アイコンやボタンにホバー（またはタップ）した際、小さな吹き出しで補足ガイドを出す機能です。',
                example: '「『?』アイコンにカーソルを合わせたら注釈のツールチップを出してください」',
                demoType: 'inline',

                renderDemo: (cardId) => `
                    <div class="flex items-center justify-center py-2 relative group">

                        <button
                            class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800 border border-cardborder text-xs text-slate-300 hover:text-white">

                            <i data-lucide="help-circle" class="w-4 h-4 text-brand-400"></i>
                            マウスを乗せる (Hover)
                        </button>

                        <div class="absolute bottom-full mb-2 hidden group-hover:block z-20">

                            <div class="bg-brand-900 border border-brand-500/60 text-brand-100 text-[11px] px-3 py-1.5 rounded-lg shadow-xl whitespace-nowrap tooltip-arrow">

                                💡 補足説明: ここに操作手順などを記述できます

                            </div>
                        </div>
                    </div>
                `
            },


            /* =====================================================
               NEW: Wheel-style Time Picker
            ===================================================== */

            {
                id: 'wheel-time-picker',
                term: 'ホイール式タイムピッカー (Wheel-style Time Picker)',
                category: 'interactive',
                catLabel: '操作・切り替え系',
                icon: 'clock-3',
                definition: '「時」と「分」を上下にスクロールして選択する、ホイール式の時刻入力UIです。スマートフォンなどで直感的に時刻を選択できます。',
                example: '「時刻選択はWheel-styleのTime Pickerで、時と分を上下にスクロールして選べるようにしてください」',
                demoType: 'inline',

                renderDemo: (cardId) => {

                    const createWheelItems = (max, selected) => {
                        let html = '';

                        // 上下に余白を作るためのダミー
                        html += '<div class="time-wheel-item"></div>';
                        html += '<div class="time-wheel-item"></div>';

                        for (let i = 0; i <= max; i++) {
                            const value = String(i).padStart(2, '0');

                            html += `
                                <div
                                    class="time-wheel-item ${i === selected ? 'selected' : ''}"
                                    data-value="${value}">
                                    ${value}
                                </div>
                            `;
                        }

                        html += '<div class="time-wheel-item"></div>';
                        html += '<div class="time-wheel-item"></div>';

                        return html;
                    };

                    return `
                        <div class="p-3 rounded-xl bg-slate-900/80 border border-cardborder">

                            <div class="text-[11px] text-slate-400 mb-3 text-center">
                                上下にスクロールして時刻を選択
                            </div>

                            <div class="flex items-center justify-center gap-3">

                                <!-- Hour Wheel -->
                                <div class="relative w-20">

                                    <div
                                        id="hour-wheel-${cardId}"
                                        class="time-wheel rounded-xl border border-cardborder bg-slate-950">

                                        ${createWheelItems(23, 12)}

                                        <div class="time-wheel-highlight"></div>
                                    </div>

                                </div>

                                <span class="text-xl font-bold text-slate-400">
                                    :
                                </span>

                                <!-- Minute Wheel -->
                                <div class="relative w-20">

                                    <div
                                        id="minute-wheel-${cardId}"
                                        class="time-wheel rounded-xl border border-cardborder bg-slate-950">

                                        ${createWheelItems(59, 30)}

                                        <div class="time-wheel-highlight"></div>
                                    </div>

                                </div>

                            </div>

                            <div
                                id="wheel-result-${cardId}"
                                class="mt-3 text-center text-xs text-brand-400 font-semibold">
                                選択中: 12:30
                            </div>

                        </div>
                    `;
                }
            },


            /* =====================================================
               NEW: HHMM Direct Time Input
            ===================================================== */

            {
                id: 'hhmm-time-input',
                term: '4桁数字による時刻直接入力 (HHMM Direct Input)',
                category: 'interactive',
                catLabel: '操作・切り替え系',
                icon: 'keyboard',
                definition: '時刻ピッカーを使わず、HHMM形式の4桁数字を直接入力して時刻として認識する入力方式です。例えば「0730」と入力すると「07:30」として処理します。',
                example: '「時刻入力はTime Pickerではなく、HHMM形式の4桁数字によるダイレクト入力にしてください」',
                demoType: 'inline',

                renderDemo: (cardId) => `
                    <div class="p-3 rounded-xl bg-slate-900/80 border border-cardborder">

                        <label class="block text-[11px] text-slate-400 mb-2">
                            HHMM形式で入力
                        </label>

        /* =========================================================
           Render Term Cards
        ========================================================= */

        function renderTerms(filterCat = 'all', searchQuery = '') {

            const grid = document.getElementById('termsGrid');
            const emptyState = document.getElementById('emptyState');

            grid.innerHTML = '';

            const query = searchQuery.toLowerCase().trim();

            const filtered = termsData.filter(item => {

                const matchesCat =
                    filterCat === 'all' ||
                    item.category === filterCat;

                const matchesSearch =
                    item.term.toLowerCase().includes(query) ||
                    item.definition.toLowerCase().includes(query) ||
                    item.example.toLowerCase().includes(query);

                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            filtered.forEach(item => {

                const card = document.createElement('div');

                card.className =
                    'glass rounded-2xl p-5 flex flex-col justify-between hover:border-brand-500/50 transition-all duration-300 group';

                let demoContent = '';

                if (item.demoType === 'inline') {

                    demoContent = item.renderDemo(item.id);

                } else if (item.demoType === 'action') {

                    const btnClass =
                        item.btnColor ||
                        'bg-brand-600 hover:bg-brand-500 text-white';

                    demoContent = `
                        <button
                            onclick="window.executeAction('${item.id}')"
                            class="w-full py-2.5 px-4 rounded-xl font-semibold text-xs shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2 ${btnClass}">

                            <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>

                            <span>
                                ${item.actionText}
                            </span>

                        </button>
                    `;
                }

                card.innerHTML = `
                    <div>

                        <div class="flex items-start justify-between gap-2 mb-3">

                            <div class="flex items-center gap-2.5">

                                <div class="p-2 rounded-xl bg-slate-800/90 text-brand-400 group-hover:bg-brand-600 group-hover:text-white transition-colors shrink-0">

                                    <i data-lucide="${item.icon}" class="w-5 h-5"></i>

                                </div>

                                <h2 class="font-bold text-sm text-white group-hover:text-brand-400 transition-colors">
                                    ${item.term}
                                </h2>

                            </div>

                        </div>

                        <span class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-slate-800 text-slate-400 mb-3 border border-cardborder/50">
                            ${item.catLabel}
                        </span>

                        <p class="text-xs text-slate-300 leading-relaxed mb-4">
                            ${item.definition}
                        </p>

                        <div class="mb-5 p-3 rounded-xl bg-slate-900/90 border border-cardborder/60">

                            <div class="text-[10px] font-bold uppercase tracking-wider text-brand-400 mb-1 flex items-center gap-1">

                                <i data-lucide="message-square" class="w-3 h-3"></i>

                                開発指示の伝え方フレーズ例

                            </div>

                            <p class="text-xs text-slate-300 italic">
                                ${item.example}
                            </p>

                        </div>

                    </div>

                    <div class="pt-3 border-t border-cardborder/50">

                        <div class="text-[10px] font-semibold text-slate-400 mb-2 flex items-center justify-between">

                            <span>
                                インタラクティブ体験デモ
                            </span>

                            <span class="text-[9px] text-emerald-400 flex items-center gap-1">
                                ● 動作確認可
                            </span>

                        </div>

                        ${demoContent}

                    </div>
                `;

                grid.appendChild(card);
            });

            if (window.lucide) {
                window.lucide.createIcons();
            }

            // Initialize wheel pickers after rendering
            initializeWheelPickers();
        }


        /* =========================================================
           Action Dispatcher
        ========================================================= */

        window.executeAction = function(id) {

            const item = termsData.find(t => t.id === id);

            if (item && item.onAction) {
                item.onAction();
            }
        };


        /* =========================================================
           Toggle
        ========================================================= */

        window.handleToggle = function(id) {

            window.demoState[id] =
                !window.demoState[id];

            const btn =
                document.getElementById(`demo-toggle-${id}`);

            const dot =
                document.getElementById(`demo-toggle-dot-${id}`);

            if (window.demoState[id]) {

                btn.classList.replace(
                    'bg-slate-700',
                    'bg-brand-600'
                );

                dot.classList.replace(
                    'translate-x-1',
                    'translate-x-6'
                );

                window.triggerToast(
                    '設定を「有効 (ON)」にしました',
                    'success'
                );

            } else {

                btn.classList.replace(
                    'bg-brand-600',
                    'bg-slate-700'
                );

                dot.classList.replace(
                    'translate-x-6',
                    'translate-x-1'
                );

                window.triggerToast(
                    '設定を「無効 (OFF)」にしました',
                    'info'
                );
            }
        };


        /* =========================================================
           Accordion
        ========================================================= */

        window.handleAccordion = function(id) {

            const body =
                document.getElementById(`acc-body-${id}`);

            const icon =
                document.getElementById(`acc-icon-${id}`);

            if (body.classList.contains('hidden')) {

                body.classList.remove('hidden');

                icon.style.transform =
                    'rotate(180deg)';

            } else {

                body.classList.add('hidden');

                icon.style.transform =
                    'rotate(0deg)';
            }
        };


        /* =========================================================
           Tabs
        ========================================================= */

        window.handleTab = function(cardId, tabKey) {

            const btn1 =
                document.getElementById(`tab-btn-1-${cardId}`);

            const btn2 =
                document.getElementById(`tab-btn-2-${cardId}`);

            const content =
                document.getElementById(`tab-content-${cardId}`);

            if (tabKey === 'tab1') {

                btn1.className =
                    'py-1.5 px-3 border-b-2 border-brand-500 text-brand-400 font-semibold';

                btn2.className =
                    'py-1.5 px-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 font-semibold';

                content.innerHTML =
                    '📦 最近注文した商品リストがここに表示されます。';

            } else {

                btn2.className =
                    'py-1.5 px-3 border-b-2 border-brand-500 text-brand-400 font-semibold';

                btn1.className =
                    'py-1.5 px-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 font-semibold';

                content.innerHTML =
                    '❤️ 「お気に入り」に保存したアイテム一覧です。';
            }
        };


        /* =========================================================
           Segmented Control
        ========================================================= */

        window.handleSegment = function(cardId, option) {

            const btn1 =
                document.getElementById(`seg-1-${cardId}`);

            const btn2 =
                document.getElementById(`seg-2-${cardId}`);

            if (option === 1) {

                btn1.className =
                    'flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all bg-brand-600 text-white shadow-sm flex items-center justify-center gap-1';

                btn2.className =
                    'flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1';

                window.triggerToast(
                    '「リスト表示」に変更しました',
                    'info'
                );

            } else {

                btn2.className =
                    'flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all bg-brand-600 text-white shadow-sm flex items-center justify-center gap-1';

                btn1.className =
                    'flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1';

                window.triggerToast(
                    '「グリッド表示」に変更しました',
                    'info'
                );
            }
        };


        /* =========================================================
           Stepper
        ========================================================= */

        window.handleStepper = function(cardId, delta) {

            const el =
                document.getElementById(`stepper-val-${cardId}`);

            let val =
                parseInt(el.innerText) + delta;

            if (val < 1) {
                val = 1;
            }

            el.innerText = val;
        };


        /* =========================================================
           Hamburger
        ========================================================= */

        window.handleHamburger = function(cardId) {

            const icon =
                document.getElementById(`ham-icon-${cardId}`);

            window.demoState[cardId] =
                !window.demoState[cardId];

            if (window.demoState[cardId]) {

                icon.setAttribute(
                    'data-lucide',
                    'x'
                );

                window.triggerToast(
                    'ハンバーガーメニューを開きました',
                    'info'
                );

            } else {

                icon.setAttribute(
                    'data-lucide',
                    'menu'
                );

                window.triggerToast(
                    'ハンバーガーメニューを閉じました',
                    'info'
                );
            }

            if (window.lucide) {
                window.lucide.createIcons();
            }
        };


        /* =========================================================
           Wheel-style Time Picker
        ========================================================= */

        function initializeWheelPickers() {

            document.querySelectorAll('.time-wheel').forEach(wheel => {

                const items =
                    Array.from(
                        wheel.querySelectorAll('.time-wheel-item[data-value]')
                    );

                if (!items.length) {
                    return;
                }

                const initialIndex =
                    items.findIndex(
                        item => item.classList.contains('selected')
                    );

                const index =
                    initialIndex >= 0
                        ? initialIndex
                        : 0;

                wheel.scrollTop =
                    index * 44;

                updateWheelSelection(wheel);

                if (!wheel.dataset.initialized) {

                    wheel.addEventListener(
                        'scroll',
                        () => {

                            clearTimeout(
                                wheel._scrollTimer
                            );

                            wheel._scrollTimer =
                                setTimeout(() => {

                                    snapWheelToCenter(wheel);

                                }, 80);
                        },
                        { passive: true }
                    );

                    wheel.dataset.initialized = 'true';
                }
            });
        }


        function snapWheelToCenter(wheel) {

            const index =
                Math.round(
                    wheel.scrollTop / 44
                );

            wheel.scrollTo({
                top: index * 44,
                behavior: 'smooth'
            });

            updateWheelSelection(wheel);

            const cardId =
                wheel.id.replace(
                    'hour-wheel-',
                    ''
                ).replace(
                    'minute-wheel-',
                    ''
                );

            updateWheelTimeResult(cardId);
        }


        function updateWheelSelection(wheel) {

            const items =
                Array.from(
                    wheel.querySelectorAll('.time-wheel-item[data-value]')
                );

            const index =
                Math.round(
                    wheel.scrollTop / 44
                );

            items.forEach((item, i) => {

                item.classList.toggle(
                    'selected',
                    i === index
                );
            });
        }


        function getWheelValue(id) {

            const wheel =
                document.getElementById(id);

            if (!wheel) {
                return '00';
            }

            const items =
                Array.from(
                    wheel.querySelectorAll('.time-wheel-item[data-value]')
                );

            const index =
                Math.round(
                    wheel.scrollTop / 44
                );

            return items[index]
                ? items[index].dataset.value
                : '00';
        }


        function updateWheelTimeResult(cardId) {

            const hour =
                getWheelValue(`hour-wheel-${cardId}`);

            const minute =
                getWheelValue(`minute-wheel-${cardId}`);

            const result =
                document.getElementById(
                    `wheel-result-${cardId}`
                );

            if (result) {
                result.textContent =
                    `選択中: ${hour}:${minute}`;
            }
        }


        /* =========================================================
           HHMM Direct Input
        ========================================================= */

        window.handleHHMMInput = function(cardId) {

            const input =
                document.getElementById(
                    `hhmm-input-${cardId}`
                );

            const result =
                document.getElementById(
                    `hhmm-result-${cardId}`
                );

            input.value =
                input.value
                    .replace(/\D/g, '')
                    .slice(0, 4);

            const value =
                input.value;

            if (value.length < 4) {

                result.textContent =
                    '4桁の数字を入力してください';

                result.className =
                    'mt-3 text-center text-xs text-slate-400';

                return;
            }

            const hour =
                parseInt(
                    value.slice(0, 2),
                    10
                );

            const minute =
                parseInt(
                    value.slice(2, 4),
                    10
                );

            if (
                Number.isNaN(hour) ||
                Number.isNaN(minute) ||
                hour > 23 ||
                minute > 59
            ) {

                result.textContent =
                    '⚠️ 正しい時刻を入力してください（00:00〜23:59）';

                result.className =
                    'mt-3 text-center text-xs text-rose-400 font-semibold';

                return;
            }

            const formatted =
                `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;

            result.textContent =
                `認識した時刻: ${formatted}`;

            result.className =
                'mt-3 text-center text-xs text-emerald-400 font-semibold';
        };


        window.confirmHHMM = function(cardId) {

            const input =
                document.getElementById(
                    `hhmm-input-${cardId}`
                );

            const result =
                document.getElementById(
                    `hhmm-result-${cardId}`
                );

            const value =
                input.value;

            if (!/^\d{4}$/.test(value)) {

                result.textContent =
                    '⚠️ 4桁の数字で入力してください';

                result.className =
                    'mt-3 text-center text-xs text-rose-400 font-semibold';

                return;
            }

            const hour =
                parseInt(
                    value.slice(0, 2),
                    10
                );

            const minute =
                parseInt(
                    value.slice(2, 4),
                    10
                );

            if (
                hour > 23 ||
                minute > 59
            ) {

                result.textContent =
                    '⚠️ 無効な時刻です（00:00〜23:59）';

                result.className =
                    'mt-3 text-center text-xs text-rose-400 font-semibold';

                return;
            }

            const formatted =
                `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;

            result.textContent =
                `✓ ${formatted} として認識しました`;

            result.className =
                'mt-3 text-center text-xs text-emerald-400 font-semibold';

            window.triggerToast(
                `時刻 ${formatted} を入力しました`,
                'success'
            );
        };


        /* =========================================================
           Toast System
        ========================================================= */

        window.triggerToast = function(message, type = 'info') {

            const container =
                document.getElementById(
                    'toastContainer'
                );

            const toast =
                document.createElement('div');

            let iconName = 'info';
            let iconColor = 'text-sky-400';
            let borderColor = 'border-sky-500/30';

            if (type === 'success') {

                iconName = 'check-circle';
                iconColor = 'text-emerald-400';
                borderColor = 'border-emerald-500/30';

            } else if (type === 'error') {

                iconName = 'alert-circle';
                iconColor = 'text-rose-400';
                borderColor = 'border-rose-500/30';
            }

            toast.className =
                `toast-enter pointer-events-auto bg-slate-900/95 border ${borderColor} text-slate-100 px-4 py-3 rounded-xl shadow-2xl backdrop-blur-md flex items-center gap-3 w-full`;

            toast.innerHTML = `
                <i data-lucide="${iconName}" class="w-5 h-5 ${iconColor} shrink-0"></i>

                <span class="text-xs font-medium">
                    ${message}
                </span>
            `;

            container.appendChild(toast);

            if (window.lucide) {
                window.lucide.createIcons();
            }

            setTimeout(() => {

                toast.classList.replace(
                    'toast-enter',
                    'toast-exit'
                );

                setTimeout(
                    () => toast.remove(),
                    300
                );

            }, 2500);
        };


        /* =========================================================
           Snackbar
        ========================================================= */

        window.triggerSnackbar =
            function(message, actionLabel, onActionClick) {

                const container =
                    document.getElementById(
                        'toastContainer'
                    );

                const snackbar =
                    document.createElement('div');

                snackbar.className =
                    'toast-enter pointer-events-auto bg-slate-900 border border-slate-700 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between gap-4 w-full';

                const actionId =
                    'snack-act-' +
                    Math.random()
                        .toString(36)
                        .substr(2, 9);

                snackbar.innerHTML = `
                    <span class="text-xs text-slate-200 font-medium">
                        ${message}
                    </span>

                    <button
                        id="${actionId}"
                        class="text-xs font-bold text-brand-400 hover:text-brand-300 underline shrink-0">
                        ${actionLabel}
                    </button>
                `;

                container.appendChild(snackbar);

                document.getElementById(
                    actionId
                ).onclick = () => {

                    onActionClick();

                    snackbar.classList.replace(
                        'toast-enter',
                        'toast-exit'
                    );

                    setTimeout(
                        () => snackbar.remove(),
                        300
                    );
                };

                setTimeout(() => {

                    if (snackbar.parentNode) {

                        snackbar.classList.replace(
                            'toast-enter',
                            'toast-exit'
                        );

                        setTimeout(
                            () => snackbar.remove(),
                            300
                        );
                    }

                }, 4000);
            };


        /* =========================================================
           Modal
        ========================================================= */

        window.openModal = function(htmlContent) {

            const overlay =
                document.getElementById(
                    'modalOverlay'
                );

            const card =
                document.getElementById(
                    'modalCard'
                );

            const content =
                document.getElementById(
                    'modalContent'
                );

            content.innerHTML =
                htmlContent;

            overlay.classList.remove(
                'hidden'
            );

            setTimeout(() => {

                card.classList.remove(
                    'scale-95',
                    'opacity-0'
                );

                card.classList.add(
                    'scale-100',
                    'opacity-100'
                );

            }, 10);

            if (window.lucide) {
                window.lucide.createIcons();
            }
        };


        window.closeModal = function() {

            const overlay =
                document.getElementById(
                    'modalOverlay'
                );

            const card =
                document.getElementById(
                    'modalCard'
                );

            card.classList.remove(
                'scale-100',
                'opacity-100'
            );

            card.classList.add(
                'scale-95',
                'opacity-0'
            );

            setTimeout(() => {

                overlay.classList.add(
                    'hidden'
                );

            }, 200);
        };


        /* =========================================================
           Bottom Sheet
        ========================================================= */

        window.openBottomSheet =
            function(htmlContent) {

                const overlay =
                    document.getElementById(
                        'bottomSheetOverlay'
                    );

                const card =
                    document.getElementById(
                        'bottomSheetCard'
                    );

                const body =
                    document.getElementById(
                        'bottomSheetBody'
                    );

                body.innerHTML =
                    htmlContent;

                overlay.classList.remove(
                    'hidden'
                );

                setTimeout(() => {

                    card.classList.remove(
                        'translate-y-full'
                    );

                    card.classList.add(
                        'translate-y-0'
                    );

                }, 10);

                if (window.lucide) {
                    window.lucide.createIcons();
                }
            };


        window.closeBottomSheet =
            function() {

                const overlay =
                    document.getElementById(
                        'bottomSheetOverlay'
                    );

                const card =
                    document.getElementById(
                        'bottomSheetCard'
                    );

                card.classList.remove(
                    'translate-y-0'
                );

                card.classList.add(
                    'translate-y-full'
                );

                setTimeout(() => {

                    overlay.classList.add(
                        'hidden'
                    );

                }, 200);
            };


        /* =========================================================
           Drawer
        ========================================================= */

        window.openDrawer =
            function(htmlContent) {

                const overlay =
                    document.getElementById(
                        'drawerOverlay'
                    );

                const card =
                    document.getElementById(
                        'drawerCard'
                    );

                const body =
                    document.getElementById(
                        'drawerBody'
                    );

                body.innerHTML =
                    htmlContent;

                overlay.classList.remove(
                    'hidden'
                );

                setTimeout(() => {

                    card.classList.remove(
                        '-translate-x-full'
                    );

                    card.classList.add(
                        'translate-x-0'
                    );

                }, 10);

                if (window.lucide) {
                    window.lucide.createIcons();
                }
            };


        window.closeDrawer =
            function() {

                const overlay =
                    document.getElementById(
                        'drawerOverlay'
                    );

                const card =
                    document.getElementById(
                        'drawerCard'
                    );

                card.classList.remove(
                    'translate-x-0'
                );

                card.classList.add(
                    '-translate-x-full'
                );

                setTimeout(() => {

                    overlay.classList.add(
                        'hidden'
                    );

                }, 200);
            };


        /* =========================================================
           DOM Ready
        ========================================================= */

        document.addEventListener(
            'DOMContentLoaded',
            () => {

                renderTerms();


                /* Modal backdrop */

                document
                    .getElementById('modalOverlay')
                    .addEventListener(
                        'click',
                        (e) => {

                            if (
                                e.target ===
                                document.getElementById(
                                    'modalOverlay'
                                )
                            ) {
                                window.closeModal();
                            }
                        }
                    );


                /* Bottom Sheet backdrop */

                document
                    .getElementById(
                        'bottomSheetOverlay'
                    )
                    .addEventListener(
                        'click',
                        (e) => {

                            if (
                                e.target ===
                                document.getElementById(
                                    'bottomSheetOverlay'
                                )
                            ) {
                                window.closeBottomSheet();
                            }
                        }
                    );


                /* Drawer backdrop */

                document
                    .getElementById(
                        'drawerOverlay'
                    )
                    .addEventListener(
                        'click',
                        (e) => {

                            if (
                                e.target ===
                                document.getElementById(
                                    'drawerOverlay'
                                )
                            ) {
                                window.closeDrawer();
                            }
                        }
                    );


                /* ESC */

                document.addEventListener(
                    'keydown',
                    (e) => {

                        if (e.key === 'Escape') {

                            window.closeModal();
                            window.closeBottomSheet();
                            window.closeDrawer();
                        }
                    }
                );


                /* Search */

                const searchInput =
                    document.getElementById(
                        'searchInput'
                    );

                searchInput.addEventListener(
                    'input',
                    (e) => {

                        const activeBtn =
                            document.querySelector(
                                '.cat-btn.active'
                            );

                        const activeCat =
                            activeBtn
                                ? activeBtn.dataset.category
                                : 'all';

                        renderTerms(
                            activeCat,
                            e.target.value
                        );
                    }
                );


                /* Category Tabs */

                const tabs =
                    document.querySelectorAll(
                        '.cat-btn'
                    );

                tabs.forEach(tab => {

                    tab.addEventListener(
                        'click',
                        () => {

                            tabs.forEach(t => {

                                t.className =
                                    'cat-btn px-4 py-2 rounded-xl text-xs font-medium transition-all bg-cardbg text-slate-400 hover:text-slate-200 border border-cardborder shrink-0';
                            });

                            tab.className =
                                'cat-btn active px-4 py-2 rounded-xl text-xs font-semibold transition-all bg-brand-600 text-white shadow-md shadow-brand-600/30 shrink-0';

                            renderTerms(
                                tab.dataset.category,
                                searchInput.value
                            );
                        }
                    );
                });

            }
        );

    </script>
</body>
