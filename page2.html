    <script>
        function dateApp() {
            const todayObj = new Date();
            const currentYear = todayObj.getFullYear();

            return {
                currentTab: 'span', // 初期タブ: 'span'(2日間の差), 'addsub'(日付加減算)

                toast: {
                    show: false,
                    message: ''
                },

                // 共通: 4桁数字を MMDD 日付オブジェクトに変換
                parseMMDD(rawVal, year = currentYear) {
                    if (!rawVal) return null;
                    let str = rawVal.toString().replace(/\D/g, '');
                    if (str.length < 4) return null;

                    let mm = parseInt(str.slice(0, 2), 10);
                    let dd = parseInt(str.slice(2, 4), 10);

                    if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return null;

                    const dateObj = new Date(year, mm - 1, dd);
                    // 存在しない日付チェック (例: 2月31日等)
                    if (dateObj.getFullYear() !== year || dateObj.getMonth() !== (mm - 1) || dateObj.getDate() !== dd) {
                        return null;
                    }
                    return dateObj;
                },

                // 共通: 表示用フォーマット (YYYY年MM月DD日 (曜日))
                formatDisplayDate(rawVal, year = currentYear) {
                    const d = this.parseMMDD(rawVal, year);
                    if (!d) return '';
                    const days = ['日', '月', '火', '水', '木', '金', '土'];
                    const mm = (d.getMonth() + 1).toString().padStart(2, '0');
                    const dd = d.getDate().toString().padStart(2, '0');
                    const dayStr = days[d.getDay()];
                    return `${d.getFullYear()}年${mm}月${dd}日 (${dayStr})`;
                },

                // 共通: コピー機能
                copyText(text) {
                    if (!text) return;
                    if (navigator.clipboard && window.isSecureContext) {
                        navigator.clipboard.writeText(text).then(() => {
                            this.showToast('コピーしました');
                        }).catch(() => {
                            this.fallbackCopy(text);
                        });
                    } else {
                        this.fallbackCopy(text);
                    }
                },

                fallbackCopy(text) {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.left = '-999999px';
                    textarea.style.top = '-999999px';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    try {
                        document.execCommand('copy');
                        this.showToast('コピーしました');
                    } catch (err) {
                        console.error('Copy failed', err);
                    }
                    document.body.removeChild(textarea);
                },

                showToast(msg) {
                    this.toast.message = msg;
                    this.toast.show = true;
                    setTimeout(() => {
                        this.toast.show = false;
                    }, 2000);
                },

                // --------------------------------------------------
                // 1. 2日間の期間計算 (Span Calculator)
                // --------------------------------------------------
                span: {
                    startRaw: '',
                    startYear: currentYear,
                    endRaw: '',
                    endYear: currentYear,
                    includeEndDay: true, // 初日算入・両端入れ
                    clear() {
                        this.startRaw = '';
                        this.endRaw = '';
                        this.startYear = currentYear;
                        this.endYear = currentYear;
                        this.includeEndDay = true;
                    }
                },
                get spanResult() {
                    const startD = this.parseMMDD(this.span.startRaw, this.span.startYear);
                    const endD = this.parseMMDD(this.span.endRaw, this.span.endYear);

                    if (!startD || !endD) {
                        return { valid: false, text: '開始日と終了日を数字4桁で入力してください' };
                    }

                    let diffMs = endD.getTime() - startD.getTime();
                    let diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));

                    if (diffDays < 0) {
                        return { valid: false, text: '終了日は開始日以降の日付を指定してください' };
                    }

                    const actualDays = this.span.includeEndDay ? diffDays + 1 : diffDays;
                    const weeks = Math.floor(actualDays / 7);
                    const remDays = actualDays % 7;

                    return {
                        valid: true,
                        days: actualDays,
                        rawDiffDays: diffDays,
                        weeks: weeks,
                        remDays: remDays,
                        text: `${actualDays} 日間 (${weeks}週間と${remDays}日)`
                    };
                },

                // --------------------------------------------------
                // 2. 日付加減算 (Add / Subtract Days)
                // --------------------------------------------------
                addsub: {
                    baseRaw: '',
                    baseYear: currentYear,
                    op: 'add', // 'add' or 'sub'
                    daysNum: 30,
                    clear() {
                        this.baseRaw = '';
                        this.baseYear = currentYear;
                        this.op = 'add';
                        this.daysNum = 30;
                    }
                },
                get addsubResult() {
                    const baseD = this.parseMMDD(this.addsub.baseRaw, this.addsub.baseYear);

                    if (!baseD) {
                        return { valid: false, text: '基準日を数字4桁で入力してください' };
                    }

                    const num = parseInt(this.addsub.daysNum, 10) || 0;
                    const resultD = new Date(baseD.getTime());

                    if (this.addsub.op === 'add') {
                        resultD.setDate(resultD.getDate() + num);
                    } else {
                        resultD.setDate(resultD.getDate() - num);
                    }

                    const days = ['日', '月', '火', '水', '木', '金', '土'];
                    const mm = (resultD.getMonth() + 1).toString().padStart(2, '0');
                    const dd = resultD.getDate().toString().padStart(2, '0');
                    const dayStr = days[resultD.getDay()];

                    const resultDateStr = `${resultD.getFullYear()}年${mm}月${dd}日 (${dayStr})`;

                    return {
                        valid: true,
                        resultDateStr: resultDateStr,
                        opText: this.addsub.op === 'add' ? `${num}日後` : `${num}日前`
                    };
                }
            };
        }
    </script>
</head>

        <!-- ==================================================== -->

        <div x-show="currentTab === 'span'" x-transition:enter="transition ease-out duration-150">
            <section class="bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 overflow-hidden">
                <div class="bg-slate-950/90 text-slate-200 px-5 py-2.5 flex justify-between items-center border-b border-slate-800">

                    <span class="text-[11px] text-slate-400 font-mono">期間計算</span>

                        </div>
                        <div class="relative">

                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" x-model="span.includeEndDay" class="sr-only peer">
                            <div class="w-11 h-6 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                        </label>
                    </div>

                    <!-- Result -->
                    <div class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950/30 rounded-2xl p-4 sm:p-5 text-white shadow-2xl border border-slate-800 relative overflow-hidden mt-2">
                        <div class="flex items-center justify-between border-b border-slate-800/80 pb-2.5">
                            <span class="bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 text-xs font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">計算結果</span>

                                <button @click="copyText(`期間: ${spanResult.text}`)" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition shadow flex items-center gap-1">

                                </button>
                            </template>
                        </div>

                        <template x-if="!spanResult.valid">

                                    <span class="text-5xl sm:text-6xl font-black font-mono tracking-tight text-indigo-400" x-text="spanResult.days"></span>
                                    <span class="text-xl font-bold text-slate-300">日間</span>
                                </div>
                                <div class="text-right font-mono text-sm font-bold text-indigo-300">
                                    <div x-text="`${spanResult.weeks}週間 + ${spanResult.remDays}日`"></div>
                                </div>
                            </div>
                        </template>

                        <div class="text-[11px] text-slate-400 border-t border-slate-800/80 pt-2 flex justify-between items-center">
                            <span x-text="span.includeEndDay ? '※ 初日（開始日）を1日目としてカウント' : '※ 差分日数のみカウント'"></span>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- ==================================================== -->
        <!-- 2. 日付加減算 (基準日 ± 〇日) -->
        <!-- ==================================================== -->
        <div x-show="currentTab === 'addsub'" x-transition:enter="transition ease-out duration-150">
            <section class="bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 overflow-hidden">
                <div class="bg-slate-950/90 text-slate-200 px-5 py-2.5 flex justify-between items-center border-b border-slate-800">
                    <span class="text-xs sm:text-sm font-bold flex items-center gap-2">
                        <i class="fa-solid fa-bolt text-teal-400"></i> 数字4桁を入力 (例: 0501)
                    </span>
                    <span class="text-[11px] text-slate-400 font-mono">日付加減算</span>
                </div>

                <div class="p-4 sm:p-5 space-y-4">
                    <!-- Base Date -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider">1. 基準日 (MMDD)</label>
                            <span class="text-xs font-mono font-bold text-teal-400" x-text="formatDisplayDate(addsub.baseRaw, addsub.baseYear) ? '認識: ' + formatDisplayDate(addsub.baseRaw, addsub.baseYear) : ''"></span>
                        </div>
                        <div class="relative">
                            <input type="number" inputmode="numeric" pattern="[0-9]*" x-model="addsub.baseRaw" placeholder="0501"
                                   class="w-full bg-slate-950 font-bold text-white border border-slate-700 rounded-xl pl-4 pr-10 py-2.5 text-2xl font-mono focus:outline-none focus:border-teal-500 transition shadow-inner placeholder-slate-700 tracking-wider">
                            <button x-show="addsub.baseRaw" @click="addsub.baseRaw = ''" class="absolute right-3 top-3.5 text-slate-500 hover:text-slate-300">
                                <i class="fa-solid fa-circle-xmark text-lg"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Operation and Days -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">2. 加算 / 減算</label>
                            <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                                <button @click="addsub.op = 'add'" :class="addsub.op === 'add' ? 'bg-teal-600 text-white font-bold shadow' : 'text-slate-400 hover:text-slate-200'" class="w-1/2 py-2 rounded-lg text-xs transition">＋ 日後</button>
                                <button @click="addsub.op = 'sub'" :class="addsub.op === 'sub' ? 'bg-teal-600 text-white font-bold shadow' : 'text-slate-400 hover:text-slate-200'" class="w-1/2 py-2 rounded-lg text-xs transition">－ 日前</button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">3. 日数</label>
                            <div class="relative">
                                <input type="number" inputmode="numeric" x-model="addsub.daysNum" placeholder="30"
                                       class="w-full bg-slate-950 font-bold text-white border border-slate-700 rounded-xl pl-4 pr-10 py-2 text-xl font-mono focus:outline-none focus:border-teal-500 transition shadow-inner placeholder-slate-700">
                                <span class="absolute right-3 top-2.5 text-slate-500 font-bold text-sm">日</span>
                            </div>
                        </div>
                    </div>

                    <!-- Result -->
                    <div class="bg-gradient-to-br from-slate-950 via-slate-900 to-teal-950/30 rounded-2xl p-4 sm:p-5 text-white shadow-2xl border border-slate-800 relative overflow-hidden mt-2">
                        <div class="flex items-center justify-between border-b border-slate-800/80 pb-2.5">
                            <span class="bg-teal-600/30 border border-teal-500/40 text-teal-300 text-xs font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">計算結果</span>
                            <template x-if="addsubResult.valid">
                                <button @click="copyText(`結果: ${addsubResult.resultDateStr} (${addsubResult.opText})`)" class="bg-teal-600 hover:bg-teal-500 active:scale-95 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition shadow flex items-center gap-1">
                                    <i class="fa-regular fa-copy"></i> 日付をコピー
                                </button>
                            </template>
                        </div>

                        <template x-if="!addsubResult.valid">
                            <div class="text-slate-500 text-sm font-bold py-4 text-center" x-text="addsubResult.text"></div>
                        </template>

                        <template x-if="addsubResult.valid">
                            <div class="py-3">
                                <div class="text-xs text-teal-400 font-bold mb-1" x-text="`計算: ${addsubResult.opText}`"></div>
                                <div class="text-2xl sm:text-4xl font-black font-mono tracking-tight text-white" x-text="addsubResult.resultDateStr"></div>
                            </div>
                        </template>

                        <div class="text-[11px] text-slate-400 border-t border-slate-800/80 pt-2 flex justify-between items-center">
                            <span>指定された日数を正確に計算します</span>
                        </div>
                    </div>
                </div>
            </section>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-500 py-3 border-t border-slate-900 text-center text-xs">
        日にち計算 統合アプリケーション
    </footer>

    <script>
        // ハンバーガーメニューの開閉制御
        document.addEventListener("DOMContentLoaded", function() {
            const hamburgerBtn = document.getElementById("hamburgerBtn");
            const sidebar = document.getElementById("sidebar");
            const sidebarOverlay = document.getElementById("sidebarOverlay");
            const sidebarCloseBtn = document.getElementById("sidebarCloseBtn");

            function toggleSidebar() {
                const isActive = sidebar.classList.contains("active");
                if (isActive) {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            }

            function openSidebar() {
                sidebar.classList.add("active");
                sidebarOverlay.classList.add("active");
            }

            function closeSidebar() {
                sidebar.classList.remove("active");
                sidebarOverlay.classList.remove("active");
            }

            if (hamburgerBtn) hamburgerBtn.addEventListener("click", toggleSidebar);
            if (sidebarOverlay) sidebarOverlay.addEventListener("click", closeSidebar);
            if (sidebarCloseBtn) sidebarCloseBtn.addEventListener("click", closeSidebar);
        });

        // PWA Dynamic Manifest Injection
        (function() {
            const manifestData = {
                name: "日にち計算ツール",
                short_name: "日数計算",
                start_url: "./",
                display: "standalone",
                background_color: "#0b0f19",
                theme_color: "#0f172a",
                icons: [
                    {
                        src: "icon-kuroneko.png",
                        sizes: "192x192",
                        type: "image/png"
                    },
                    {
                        src: "icon-kuroneko.png",
                        sizes: "512x512",
                        type: "image/png"
                    }
                ]
            };
            const stringManifest = JSON.stringify(manifestData);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestUrl = URL.createObjectURL(blob);
            const manifestElem = document.getElementById('pwaManifest');
            if (manifestElem) {
                manifestElem.setAttribute('href', manifestUrl);
            }
        })();

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'date-calc-v1';
                    self.addEventListener('install', (e) => {
                        self.skipWaiting();
                    });
                    self.addEventListener('activate', (e) => {
                        e.waitUntil(clients.claim());
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(
                            fetch(e.request).catch(() => caches.match(e.request))
                        );
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).then(() => {
                    console.log('Service Worker Registered');
                }).catch(err => {
                    console.error('Service Worker registration failed:', err);
                });
            });
        }
    </script>

</body>
</html>
