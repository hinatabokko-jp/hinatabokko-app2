<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おみこし 10月28日 - リアルタイム出欠管理</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                            hover: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-dark-bg text-slate-100 min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-slate-950">

    <!-- Authentication Lock Screen -->
    <div id="authLockScreen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
        <div class="bg-dark-card border border-dark-border rounded-2xl w-full max-w-md p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute -right-12 -top-12 w-36 h-36 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-amber-500/20 border border-amber-500/30 text-amber-400 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-inner">
                    <i data-lucide="lock" class="w-7 h-7"></i>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">おみこし 10月28日</h1>
                <p class="text-slate-400 text-xs sm:text-sm mt-1.5">出欠ボードを表示するには、合言葉（パスコード）を入力してください。</p>
            </div>

            <form id="passcodeForm" class="space-y-4">
                <div>
                    <label for="passcodeInput" class="block text-xs font-semibold text-slate-300 mb-1.5">合言葉 <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="key-round" class="w-4 h-4"></i>
                        </span>
                        <input type="password" id="passcodeInput" required placeholder="合言葉を入力してください" class="w-full bg-slate-900 border border-dark-border focus:border-amber-500 focus:ring-1 focus:ring-amber-500 rounded-xl pl-10 pr-4 py-3 text-slate-100 placeholder-slate-500 text-sm outline-none transition-all">
                    </div>
                </div>
                <div id="passcodeError" class="text-rose-400 text-xs hidden flex items-center gap-1">
                    <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> 合言葉が正しくありません。
                </div>
                <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-amber-500/20 transition-all text-sm flex items-center justify-center gap-2">
                    <span>入室して出欠を見る</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-dark-border/60 text-center">
                <p class="text-[11px] text-slate-500">
                    ※ 初期合言葉: <code class="bg-slate-900 px-1.5 py-0.5 rounded text-amber-300 font-mono">omikoshi1028</code>
                </p>
            </div>
        </div>
    </div>

    <!-- Main Application Container (Hidden until authenticated) -->
    <div id="app" class="flex-1 flex flex-col min-h-screen relative overflow-x-hidden hidden">

        <!-- Top Navigation Bar -->
        <header class="bg-dark-card/80 backdrop-blur-md border-b border-dark-border sticky top-0 z-30 px-4 py-3 sm:px-6">
            <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-amber-500/20 text-amber-400 rounded-xl border border-amber-500/30">
                        <i data-lucide="flame" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight tracking-tight text-white flex items-center gap-2">
                            おみこし 10月28日
                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1 animate-pulse"></span>
                                リアルタイム同期中
                            </span>
                        </h1>
                        <p class="text-xs text-slate-400">開催日: 2026年10月28日</p>
                    </div>
                </div>

                <!-- Action Header Buttons -->
                <div class="flex items-center gap-2">
                    <button id="exportCsvBtn" class="flex items-center gap-1.5 px-3 py-1.5 text-xs sm:text-sm bg-dark-border hover:bg-slate-700 text-slate-200 font-medium rounded-lg border border-slate-600/50 transition-all">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">CSV出力</span>
                    </button>
                    <button id="logoutBtn" title="合言葉ロックに戻る" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-dark-border rounded-lg transition-colors">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-6">

            <!-- Attendance Stats Counter Cards -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
                <div class="bg-dark-card border border-dark-border rounded-xl p-4 flex flex-col justify-between shadow-sm">
                    <span class="text-xs text-slate-400 font-medium">回答総数</span>
                    <div class="flex items-baseline justify-between mt-2">
                        <span class="text-2xl sm:text-3xl font-extrabold text-white" id="statTotal">0</span>
                        <span class="text-xs text-slate-500">人</span>
                    </div>
                </div>
                <div class="bg-emerald-950/20 border border-emerald-800/40 rounded-xl p-4 flex flex-col justify-between shadow-sm">
                    <span class="text-xs text-emerald-400 font-medium flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>出席
                    </span>
                    <div class="flex items-baseline justify-between mt-2">
                        <span class="text-2xl sm:text-3xl font-extrabold text-emerald-400" id="statAttend">0</span>
                        <span class="text-xs text-emerald-600/80" id="statAttendPercent">0%</span>
                    </div>
                </div>
                <div class="bg-rose-950/20 border border-rose-800/40 rounded-xl p-4 flex flex-col justify-between shadow-sm">
                    <span class="text-xs text-rose-400 font-medium flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-rose-500"></span>欠席
                    </span>
                    <div class="flex items-baseline justify-between mt-2">
                        <span class="text-2xl sm:text-3xl font-extrabold text-rose-400" id="statAbsent">0</span>
                        <span class="text-xs text-rose-600/80" id="statAbsentPercent">0%</span>
                    </div>
                </div>
                <div class="bg-amber-950/20 border border-amber-800/40 rounded-xl p-4 flex flex-col justify-between shadow-sm">
                    <span class="text-xs text-amber-400 font-medium flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-amber-500"></span>保留
                    </span>
                    <div class="flex items-baseline justify-between mt-2">
                        <span class="text-2xl sm:text-3xl font-extrabold text-amber-400" id="statMaybe">0</span>
                        <span class="text-xs text-amber-600/80" id="statMaybePercent">0%</span>
                    </div>
                </div>
            </div>

            <!-- Registration Form Section -->
            <div class="bg-dark-card border border-dark-border rounded-2xl p-5 sm:p-6 shadow-xl relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-amber-500/5 rounded-full blur-2xl pointer-events-none"></div>
                <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i data-lucide="edit-3" class="w-5 h-5 text-amber-400"></i>
                    あなたの出欠を登録・変更する
                </h3>

                <form id="attendanceForm" class="space-y-4">
                    <input type="hidden" id="editMemberId" value="">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="memberName" class="block text-xs font-semibold text-slate-300 mb-1.5">お名前 / ニックネーム <span class="text-rose-500">*</span></label>
                            <input type="text" id="memberName" required placeholder="例: 山田 太郎" class="w-full bg-slate-900/90 border border-dark-border focus:border-amber-500 focus:ring-1 focus:ring-amber-500 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 text-sm outline-none transition-all">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1.5">出欠ステータス <span class="text-rose-500">*</span></label>
                            <div class="grid grid-cols-3 gap-2">
                                <label class="cursor-pointer">
                                    <input type="radio" name="status" value="出席" checked class="peer sr-only">
                                    <div class="px-3 py-2 text-center rounded-xl border border-dark-border text-slate-400 text-sm font-medium peer-checked:bg-emerald-500/20 peer-checked:border-emerald-500 peer-checked:text-emerald-300 hover:bg-slate-800 transition-all flex items-center justify-center gap-1.5">
                                        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
                                        出席
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="status" value="欠席" class="peer sr-only">
                                    <div class="px-3 py-2 text-center rounded-xl border border-dark-border text-slate-400 text-sm font-medium peer-checked:bg-rose-500/20 peer-checked:border-rose-500 peer-checked:text-rose-300 hover:bg-slate-800 transition-all flex items-center justify-center gap-1.5">
                                        <i data-lucide="x-circle" class="w-4 h-4 text-rose-400"></i>
                                        欠席
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="status" value="保留" class="peer sr-only">
                                    <div class="px-3 py-2 text-center rounded-xl border border-dark-border text-slate-400 text-sm font-medium peer-checked:bg-amber-500/20 peer-checked:border-amber-500 peer-checked:text-amber-300 hover:bg-slate-800 transition-all flex items-center justify-center gap-1.5">
                                        <i data-lucide="help-circle" class="w-4 h-4 text-amber-400"></i>
                                        保留
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="memberComment" class="block text-xs font-semibold text-slate-300 mb-1.5">コメント・備考（任意）</label>
                        <input type="text" id="memberComment" placeholder="例: 遅れて参加します / 法被のサイズはLです等" class="w-full bg-slate-900/90 border border-dark-border focus:border-amber-500 focus:ring-1 focus:ring-amber-500 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 text-sm outline-none transition-all">
                    </div>

                    <div class="flex items-center justify-end gap-3 pt-2">
                        <button type="button" id="cancelEditBtn" class="hidden px-4 py-2 text-sm text-slate-400 hover:text-white transition-colors">
                            キャンセル
                        </button>
                        <button type="submit" id="submitAttendanceBtn" class="px-6 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-amber-500/20 transition-all text-sm flex items-center gap-2">
                            <i data-lucide="send" class="w-4 h-4"></i>
                            出欠を送信する
                        </button>
                    </div>
                </form>
            </div>

            <!-- Attendance List Section -->
            <div class="bg-dark-card border border-dark-border rounded-2xl p-5 sm:p-6 shadow-xl">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <h3 class="text-lg font-bold text-white flex items-center gap-2">
                        <i data-lucide="users" class="w-5 h-5 text-amber-400"></i>
                        参加者一覧
                    </h3>
                    <div class="flex items-center bg-slate-900 p-1 rounded-xl border border-dark-border text-xs">
                        <button class="filter-tab active px-3 py-1.5 rounded-lg font-medium text-slate-950 bg-amber-500 transition-all" data-filter="all">すべて</button>
                        <button class="filter-tab px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition-all" data-filter="出席">出席</button>
                        <button class="filter-tab px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition-all" data-filter="欠席">欠席</button>
                        <button class="filter-tab px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition-all" data-filter="保留">保留</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="memberListContainer">
                    <div class="col-span-full text-center py-10 text-slate-500 text-sm">
                        読み込み中...
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Firebase Module Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Configuration & State
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'omikoshi-1028-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { apiKey: "demo", authDomain: "demo.firebaseapp.com", projectId: "demo-project" };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let activeFilter = 'all';
        let memberData = [];
        let unsubscribeMembers = null;

        const CORRECT_PASSCODE = "omikoshi1028"; // 合言葉

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const bgClass = type === 'success' ? 'bg-emerald-600 text-white' : 
                            type === 'error' ? 'bg-rose-600 text-white' : 
                            'bg-slate-800 text-slate-100 border border-slate-700';

            toast.className = `px-4 py-3 rounded-xl shadow-xl ${bgClass} text-sm font-medium flex items-center gap-2 transform transition-all duration-300 translate-y-5 opacity-0 pointer-events-auto`;
            toast.innerHTML = `<span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-5', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Authentication Init
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth Exception:", err);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                if (sessionStorage.getItem('omikoshi_auth') === 'true') {
                    unlockApp();
                }
            }
        });

        // Passcode Submission
        document.getElementById('passcodeForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const inputVal = document.getElementById('passcodeInput').value.trim();
            const errorEl = document.getElementById('passcodeError');

            if (inputVal === CORRECT_PASSCODE) {
                errorEl.classList.add('hidden');
                sessionStorage.setItem('omikoshi_auth', 'true');
                unlockApp();
                showToast("認証成功！おみこし出欠ボードへようこそ", "success");
            } else {
                errorEl.classList.remove('hidden');
            }
        });

        function unlockApp() {
            document.getElementById('authLockScreen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            subscribeAttendance();
            lucide.createIcons();
        }

        // Logout / Relock
        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem('omikoshi_auth');
            document.getElementById('passcodeInput').value = '';
            document.getElementById('app').classList.add('hidden');
            document.getElementById('authLockScreen').classList.remove('hidden');
            showToast("合言葉ロック画面に戻りました", "info");
        });

        // Firestore Realtime Subscription for Fixed Event "omikoshi_1028"
        function subscribeAttendance() {
            if (unsubscribeMembers) unsubscribeMembers();

            const membersRef = collection(db, 'artifacts', appId, 'public', 'data', 'omikoshi_1028_attendance');
            
            unsubscribeMembers = onSnapshot(membersRef, (snapshot) => {
                memberData = [];
                snapshot.forEach(docSnap => {
                    memberData.push({ id: docSnap.id, ...docSnap.data() });
                });

                memberData.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
                renderAttendanceStats();
                renderMemberList();
            }, (error) => {
                console.error("Snapshot error:", error);
            });
        }

        function renderAttendanceStats() {
            const total = memberData.length;
            const attend = memberData.filter(m => m.status === '出席').length;
            const absent = memberData.filter(m => m.status === '欠席').length;
            const maybe = memberData.filter(m => m.status === '保留').length;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statAttend').textContent = attend;
            document.getElementById('statAbsent').textContent = absent;
            document.getElementById('statMaybe').textContent = maybe;

            document.getElementById('statAttendPercent').textContent = total > 0 ? `${Math.round((attend / total) * 100)}%` : '0%';
            document.getElementById('statAbsentPercent').textContent = total > 0 ? `${Math.round((absent / total) * 100)}%` : '0%';
            document.getElementById('statMaybePercent').textContent = total > 0 ? `${Math.round((maybe / total) * 100)}%` : '0%';
        }

        function renderMemberList() {
            const container = document.getElementById('memberListContainer');
            
            const filtered = activeFilter === 'all' 
                ? memberData 
                : memberData.filter(m => m.status === activeFilter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-10 text-slate-500 text-sm">
                        ${activeFilter === 'all' ? 'まだ登録がありません。上のフォームから最初の出欠を登録してみましょう！' : `'${activeFilter}' の該当者がいません。`}
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const isOwner = currentUser && item.userId === currentUser.uid;
                
                let badgeClass = '';
                let badgeIcon = '';
                if (item.status === '出席') {
                    badgeClass = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                    badgeIcon = 'check-circle-2';
                } else if (item.status === '欠席') {
                    badgeClass = 'bg-rose-500/10 text-rose-400 border-rose-500/20';
                    badgeIcon = 'x-circle';
                } else {
                    badgeClass = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                    badgeIcon = 'help-circle';
                }

                const updatedTime = item.updatedAt ? new Date(item.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

                return `
                    <div class="bg-slate-900/60 border border-dark-border/80 rounded-xl p-4 flex flex-col justify-between hover:border-slate-700 transition-all shadow-sm">
                        <div class="flex items-start justify-between gap-2">
                            <div class="flex items-center gap-2.5 min-w-0">
                                <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-xs text-amber-400">
                                    ${escapeHtml(item.name.substring(0, 1))}
                                </div>
                                <div class="min-w-0">
                                    <div class="font-semibold text-slate-200 text-sm truncate flex items-center gap-1.5">
                                        ${escapeHtml(item.name)}
                                        ${isOwner ? '<span class="text-[10px] bg-amber-500/20 text-amber-300 px-1.5 py-0.2 rounded font-normal">あなた</span>' : ''}
                                    </div>
                                    <div class="text-[11px] text-slate-500">${updatedTime} 更新</div>
                                </div>
                            </div>
                            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-semibold border ${badgeClass}">
                                <i data-lucide="${badgeIcon}" class="w-3.5 h-3.5"></i>
                                ${item.status}
                            </span>
                        </div>
                        
                        ${item.comment ? `<p class="text-xs text-slate-300 mt-3 pt-2 border-t border-slate-800/60 bg-slate-950/40 p-2 rounded-lg italic">"${escapeHtml(item.comment)}"</p>` : ''}

                        ${isOwner ? `
                            <div class="flex justify-end gap-2 mt-3 pt-2 border-t border-slate-800/40">
                                <button onclick="window.editMember('${item.id}', '${escapeHtml(item.name)}', '${item.status}', '${escapeHtml(item.comment || '')}')" class="text-xs text-amber-400 hover:text-amber-300 px-2.5 py-1 rounded hover:bg-amber-500/10 transition-colors font-medium">編集</button>
                                <button onclick="window.deleteMember('${item.id}')" class="text-xs text-rose-400 hover:text-rose-300 px-2.5 py-1 rounded hover:bg-rose-500/10 transition-colors font-medium">削除</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (m) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        // Form Submit: Attendance
        document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) {
                showToast("認証セッションが無効です", "error");
                return;
            }

            const name = document.getElementById('memberName').value.trim();
            const status = document.querySelector('input[name="status"]:checked').value;
            const comment = document.getElementById('memberComment').value.trim();
            const editId = document.getElementById('editMemberId').value;

            if (!name) return;

            try {
                const membersRef = collection(db, 'artifacts', appId, 'public', 'data', 'omikoshi_1028_attendance');
                
                if (editId) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'omikoshi_1028_attendance', editId);
                    await updateDoc(docRef, {
                        name,
                        status,
                        comment,
                        updatedAt: Date.now()
                    });
                    showToast("出欠情報を更新しました", "success");
                } else {
                    await addDoc(membersRef, {
                        userId: currentUser.uid,
                        name,
                        status,
                        comment,
                        updatedAt: Date.now()
                    });
                    showToast("出欠を登録しました！", "success");
                }

                resetForm();
            } catch (err) {
                console.error("Save Error:", err);
                showToast("保存に失敗しました", "error");
            }
        });

        window.editMember = function(id, name, status, comment) {
            document.getElementById('editMemberId').value = id;
            document.getElementById('memberName').value = name;
            document.getElementById('memberComment').value = comment;
            
            const radio = document.querySelector(`input[name="status"][value="${status}"]`);
            if (radio) radio.checked = true;

            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('submitAttendanceBtn').innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> 変更を更新する`;
            lucide.createIcons();
            document.getElementById('attendanceForm').scrollIntoView({ behavior: 'smooth' });
        };

        window.deleteMember = async function(id) {
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'omikoshi_1028_attendance', id);
                await deleteDoc(docRef);
                showToast("出欠情報を削除しました", "info");
                resetForm();
            } catch (err) {
                console.error("Delete Error:", err);
                showToast("削除に失敗しました", "error");
            }
        };

        function resetForm() {
            document.getElementById('editMemberId').value = '';
            document.getElementById('memberName').value = '';
            document.getElementById('memberComment').value = '';
            document.querySelector('input[name="status"][value="出席"]').checked = true;
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('submitAttendanceBtn').innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> 出欠を送信する`;
            lucide.createIcons();
        }

        document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

        // Filter Tabs
        document.querySelectorAll('.filter-tab').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-tab').forEach(t => {
                    t.classList.remove('active', 'bg-amber-500', 'text-slate-950');
                    t.classList.add('text-slate-400');
                });
                e.target.classList.add('active', 'bg-amber-500', 'text-slate-950');
                e.target.classList.remove('text-slate-400');
                
                activeFilter = e.target.dataset.filter;
                renderMemberList();
            });
        });

        // CSV Export
        document.getElementById('exportCsvBtn').addEventListener('click', () => {
            if (memberData.length === 0) {
                showToast("出力するデータがありません", "error");
                return;
            }

            let csvContent = "\uFEFFお名前,出欠ステータス,コメント,更新日時\n";
            memberData.forEach(item => {
                const timeStr = item.updatedAt ? new Date(item.updatedAt).toLocaleString('ja-JP') : '';
                const row = [
                    `"${(item.name || '').replace(/"/g, '""')}"`,
                    `"${(item.status || '').replace(/"/g, '""')}"`,
                    `"${(item.comment || '').replace(/"/g, '""')}"`,
                    `"${timeStr}"`
                ].join(',');
                csvContent += row + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `おみこし_10月28日_出欠一覧.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast("CSVファイルをダウンロードしました", "success");
        });

        window.addEventListener('DOMContentLoaded', () => {
            initAuth();
            lucide.createIcons();
        });
    </script>
</body>
</html>
