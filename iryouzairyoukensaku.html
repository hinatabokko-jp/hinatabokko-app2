<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医療材料バーコード検索</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
  :root {
    --bg: #121212; --card: #1e1e1e; --text: #e0e0e0;
    --accent: #4dabf7; --border: #333;
  }
  body {
    font-family: sans-serif; background: var(--bg); color: var(--text);
    margin: 0; padding: 16px; line-height: 1.5;
  }
  h1 { font-size: 1.2rem; margin: 0 0 12px; }
  .box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; margin-bottom: 14px;
  }
  button {
    background: var(--accent); color: #000; border: none;
    padding: 10px 16px; border-radius: 6px; font-weight: bold;
    font-size: 1rem; cursor: pointer; width: 100%; margin-top: 8px;
  }
  button.secondary { background: #444; color: #fff; }
  input[type="file"], input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 8px;
    background: #2a2a2a; color: #fff; border: 1px solid var(--border);
    border-radius: 4px; margin-top: 6px;
  }
  #reader { width: 100%; border-radius: 8px; overflow: hidden; }
  .result-row {
    border-bottom: 1px solid var(--border); padding: 6px 0;
    display: flex; justify-content: space-between; gap: 12px;
  }
  .result-label { color: #999; font-size: 0.85rem; flex-shrink: 0; }
  .result-val { font-weight: bold; text-align: right; word-break: break-all; }
  .status { font-size: 0.85rem; color: #aaa; margin-top: 6px; }
</style>
</head>
<body>

<h1>医療材料バーコード検索</h1>

<div class="box">
  <label>① マスタCSVを選択（B列＝コード）</label>
  <input type="file" id="csvFile" accept=".csv">
  <div id="dbStatus" class="status">データ未読み込み</div>
</div>

<div class="box">
  <div id="reader"></div>
  <button id="startBtn">カメラでスキャン開始</button>
  <button id="stopBtn" class="secondary" style="display:none;">カメラ停止</button>
  
  <div style="margin-top:12px;">
    <label>手動入力 / 読み取り結果（B列検索）</label>
    <input type="text" id="searchInput" placeholder="コードを入力またはスキャン">
  </div>
</div>

<div id="resultArea" class="box" style="display:none;"></div>

<script>
let headers = [];
let rows = [];
let html5QrCode = null;

window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('med_material_db');
  if (saved) {
    const parsed = JSON.parse(saved);
    headers = parsed.headers;
    rows = parsed.rows;
    document.getElementById('dbStatus').textContent = `保存済みデータ: ${rows.length} 件`;
  }
});

// CSV読み込み（文字化け防止のためShift-JIS/CP932を優先デコード）
document.getElementById('csvFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (ev) => {
    const buffer = ev.target.result;
    let text = "";
    try {
      // 日本のExcel等で出力されるShift-JISを優先的に正しくデコード
      text = new TextDecoder('shift-jis').decode(buffer);
    } catch (err) {
      text = new TextDecoder('utf-8').decode(buffer);
    }
    parseCSV(text);
  };
  reader.readAsArrayBuffer(file);
});

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
  if (lines.length < 2) return;

  const splitLine = (line) => line.split(',').map(cell => cell.replace(/^"|"$/g, '').trim());
  headers = splitLine(lines[0]);
  rows = lines.slice(1).map(splitLine);

  localStorage.setItem('med_material_db', JSON.stringify({ headers, rows }));
  document.getElementById('dbStatus').textContent = `読み込み完了: ${rows.length} 件（端末に保存しました）`;
}

function searchByColB(scannedCode) {
  const cleanCode = scannedCode.trim();
  document.getElementById('searchInput').value = cleanCode;
  if (!cleanCode || rows.length === 0) return;

  const hit = rows.find(row => {
    const colB = (row[1] || '').trim();
    if (!colB) return false;
    return cleanCode === colB || cleanCode.includes(colB) || colB.includes(cleanCode);
  });

  const resultArea = document.getElementById('resultArea');
  resultArea.style.display = 'block';

  if (!hit) {
    resultArea.innerHTML = `<div style="color:#ff6b6b;">該当データなし: ${cleanCode}</div>`;
    return;
  }

  let html = `<div style="color:#51cf66; font-weight:bold; margin-bottom:8px;">検索ヒット</div>`;
  headers.forEach((h, i) => {
    html += `
      <div class="result-row">
        <span class="result-label">${h || `列${i+1}`}</span>
        <span class="result-val">${hit[i] || '-'}</span>
      </div>`;
  });
  resultArea.innerHTML = html;
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchByColB(e.target.value);
});

document.getElementById('startBtn').addEventListener('click', () => {
  // HTTPS環境またはlocalhost以外での警告
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    alert("注意: スマホのカメラ機能は通常HTTPS環境（またはGitHub Pages等の公開環境）が必要です。動かない場合はローカルサーバー等をご利用ください。");
  }

  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 260, height: 140 } },
    (decodedText) => {
      searchByColB(decodedText);
      if (navigator.vibrate) navigator.vibrate(100);
      stopCamera();
    }
  ).then(() => {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'block';
  }).catch(err => {
    alert("カメラを起動できませんでした: " + err + "\n\n※スマホのブラウザ設定でカメラ権限が許可されているか、HTTPS環境で開いているかご確認ください。");
  });
});

function stopCamera() {
  if (html5QrCode) {
    html5QrCode.stop().then(() => {
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';
    }).catch(err => {
      console.error(err);
    });
  }
}
document.getElementById('stopBtn').addEventListener('click', stopCamera);
</script>
</body>
</html>
