<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医療材料バーコード検索</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
  :root {
    --bg: #121212; --card: #1e1e1e; --text: #e0e0e0;
    --accent: #4dabf7; --border: #333; --success: #51cf66;
  }
  body {
    font-family: sans-serif; background: var(--bg); color: var(--text);
    margin: 0; padding: 16px; line-height: 1.5;
  }
  h1 { font-size: 1.2rem; margin: 0 0 12px; color: var(--accent); }
  .box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; margin-bottom: 14px;
  }
  button {
    background: var(--accent); color: #000; border: none;
    padding: 10px 16px; border-radius: 6px; font-weight: bold;
    font-size: 1rem; cursor: pointer; width: 100%; margin-top: 8px;
  }
  button.secondary { background: #444; color: #fff; }
  input[type="file"], input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 10px;
    background: #2a2a2a; color: #fff; border: 1px solid var(--border);
    border-radius: 6px; margin-top: 6px; font-size: 1rem;
  }
  #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
  .result-card {
    background: #252525; border: 1px solid #444; border-radius: 6px;
    padding: 10px; margin-top: 10px;
  }
  .result-row {
    border-bottom: 1px solid #333; padding: 8px 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .result-row:last-child { border-bottom: none; }
  .result-label { color: #aaa; font-size: 0.8rem; }
  .result-val { font-weight: bold; font-size: 1rem; word-break: break-all; color: #fff; }
  .status { font-size: 0.85rem; color: #aaa; margin-top: 6px; }
  
  /* 金額や商品名などを強調表示 */
  .highlight-val { color: var(--success); font-size: 1.15rem; }
  .name-val { color: #ffd43b; font-size: 1.1rem; }
</style>
</head>
<body>

<h1>医療材料バーコード検索</h1>

<!-- 1. CSVデータ読み込み -->
<div class="box">
  <label><strong>① マスタCSVを選択</strong>（B列＝商品コード）</label>
  <input type="file" id="csvFile" accept=".csv">
  <div id="dbStatus" class="status">データ未読み込み（CSVを選択してください）</div>
</div>

<!-- 2. カメラ＆手動検索 -->
<div class="box">
  <div id="reader"></div>
  <button id="startBtn">カメラでスキャン開始</button>
  <button id="stopBtn" class="secondary" style="display:none;">カメラ停止</button>
  
  <div style="margin-top:14px;">
    <label><strong>手動入力 / 読み取り結果（B列検索）</strong></label>
    <input type="text" id="searchInput" placeholder="コードを入力またはスキャン">
  </div>
</div>

<!-- 3. 検索結果表示 -->
<div id="resultArea" class="box" style="display:none;"></div>

<script>
let headers = [];
let rows = [];
let html5QrCode = null;

// 保存済みデータの復元
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('med_material_db_v3');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      headers = parsed.headers;
      rows = parsed.rows;
      document.getElementById('dbStatus').textContent = `保存済みデータ: ${rows.length} 件（全項目反映済み）`;
    } catch(e) {
      console.error(e);
    }
  }
});

// CSV読み込み（文字化け完全防止）
document.getElementById('csvFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (ev) => {
    const buffer = ev.target.result;
    let text = "";
    try {
      text = new TextDecoder('utf-8', { fatal: true }).decode(buffer);
    } catch (err) {
      try {
        text = new TextDecoder('shift-jis').decode(buffer);
      } catch (err2) {
        text = new TextDecoder('cp932').decode(buffer);
      }
    }
    parseCSV(text);
  };
  reader.readAsArrayBuffer(file);
});

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
  if (lines.length < 2) {
    alert("CSVのデータ行が少なすぎるか、形式が正しくありません。");
    return;
  }

  // カンマ区切り＆ダブルクォーテーションを考慮した厳密なパース
  const parseLine = (line) => {
    const result = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        inQuotes = !inQuotes;
      } else if (c === ',' && !inQuotes) {
        result.push(cur.trim().replace(/^"|"$/g, ''));
        cur = '';
      } else {
        cur += c;
      }
    }
    result.push(cur.trim().replace(/^"|"$/g, ''));
    return result;
  };

  headers = parseLine(lines[0]);
  rows = lines.slice(1).map(parseLine);

  localStorage.setItem('med_material_db_v3', JSON.stringify({ headers, rows }));
  document.getElementById('dbStatus').textContent = `読み込み成功: ${rows.length} 件（全項目を保存しました）`;
  alert(`CSVの読み込みが完了しました (${rows.length}件)`);
}

// B列（インデックス1）での検索処理
function searchByColB(scannedCode) {
  const cleanCode = scannedCode.trim();
  document.getElementById('searchInput').value = cleanCode;
  if (!cleanCode || rows.length === 0) return;

  // バーコードの付加情報（GS1等）が含まれていてもB列のコードに部分一致すればヒットさせる
  const hit = rows.find(row => {
    const colB = (row[1] || '').trim();
    if (!colB) return false;
    return cleanCode === colB || cleanCode.includes(colB) || colB.includes(cleanCode);
  });

  const resultArea = document.getElementById('resultArea');
  resultArea.style.display = 'block';

  if (!hit) {
    resultArea.innerHTML = `<div style="color:#ff6b6b; font-weight:bold;">該当データなし</div><div style="font-size:0.85rem; color:#aaa; margin-top:4px;">コード: ${cleanCode}</div>`;
    return;
  }

  // CSVに含まれるすべての項目（headers）を順番に展開して表示
  let html = `<div style="color:var(--success); font-weight:bold; margin-bottom:8px; font-size:1.05rem;">✔ 該当材料が見つえました</div>`;
  html += `<div class="result-card">`;
  
  headers.forEach((h, i) => {
    const val = hit[i] !== undefined && hit[i] !== '' ? hit[i] : '-';
    
    // 項目名に応じたデザイン調整（金額、商品名など）
    let valClass = '';
    const headerName = h.replace(/\n/g, '');
    if (headerName.includes('金額') || headerName.includes('価格')) {
      valClass = 'highlight-val';
    } else if (headerName.includes('商品名')) {
      valClass = 'name-val';
    }

    html += `
      <div class="result-row">
        <span class="result-label">${h.replace(/\n/g, ' ｜ ')}</span>
        <span class="result-val ${valClass}">${val}</span>
      </div>`;
  });
  
  html += `</div>`;
  resultArea.innerHTML = html;
}

// 手動入力時のリアルタイム検索
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchByColB(e.target.value);
});

// カメラ起動処理
document.getElementById('startBtn').addEventListener('click', () => {
  if (rows.length === 0) {
    alert("先に「① マスタCSV」を読み込んでください。");
    return;
  }

  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 280, height: 140 } },
    (decodedText) => {
      searchByColB(decodedText);
      if (navigator.vibrate) navigator.vibrate(100);
      stopCamera();
    }
  ).then(() => {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'block';
  }).catch(err => {
    alert("カメラを起動できませんでした: " + err + "\n\n※ブラウザのカメラ権限が許可されているか、HTTPS環境かご確認ください。");
  });
});

function stopCamera() {
  if (html5QrCode) {
    html5QrCode.stop().then(() => {
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';
    }).catch(err => {
      console.error(err);
    });
  }
}
document.getElementById('stopBtn').addEventListener('click', stopCamera);
</script>
</body>
</html>
