<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダイレクトメモ & チェックリスト</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#121212',
                        cardbg: '#1e1e1e',
                        bordercolor: '#333333',
                        primary: '#00bcd4',
                        'primary-hover': '#008ba3',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Noto Sans JP -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #121212;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        /* ハンバーガー・サイドバー用スタイル */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: -260px;
            width: 260px;
            height: 100%;
            background-color: #1e1e1e;
            z-index: 1001;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }
        .sidebar.open {
            transform: translateX(260px);
        }
        .sidebar-header {
            padding: 16px;
            background-color: #252525;
            border-bottom: 1px solid #333;
            font-weight: bold;
            color: #00bcd4;
            font-size: 1rem;
        }
        .sidebar-menu {
            list-style: none;
            padding: 10px 0;
            margin: 0;
            overflow-y: auto;
        }
        .sidebar-menu li a {
            display: block;
            padding: 12px 20px;
            color: #e0e0e0;
            text-decoration: none;
            font-size: 0.95rem;
            border-left: 4px solid transparent;
            transition: background 0.2s;
        }
        .sidebar-menu li a:hover {
            background-color: #2a2a2a;
        }
        /* ドラッグ中のスタイル */
        .dragging {
            opacity: 0.4;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#121212] text-[#e0e0e0] select-none">

    <!-- あいことばロック画面 -->
    <div id="lock-screen" class="fixed inset-0 bg-[#121212] flex flex-col justify-center items-center z-[9999] gap-4 p-5">
        <h2 class="text-lg font-bold text-[#00bcd4]">あいことばを入力してください</h2>
        <input type="password" id="pass-input" placeholder="あいことば" autocomplete="off" class="bg-[#2a2a2a] border border-[#444] rounded-lg px-4 py-2.5 text-white text-base text-center outline-none w-[220px] focus:border-[#00bcd4]">
        <label class="flex items-center gap-2 text-sm text-[#e0e0e0] cursor-pointer select-none">
            <input type="checkbox" id="remember-me-checkbox" class="w-4 h-4 accent-[#00bcd4] cursor-pointer">
            次回から自動でログインする
        </label>
        <button id="pass-btn" class="bg-[#00bcd4] text-[#121212] border-none rounded-lg px-6 py-2.5 font-bold text-sm cursor-pointer hover:bg-[#008ba3] transition">入室する</button>
        <div id="pass-error" class="text-[#ff5252] text-xs hidden">あいことばが違います</div>
    </div>

    <!-- アプリ本体 -->
    <div id="app-content" class="hidden flex-col min-h-screen">
        <!-- サイドバー＆オーバーレイ -->
        <div id="overlay" class="overlay"></div>
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">メニュー</div>
            <ul class="sidebar-menu">
                <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app/">漢字テスト</a></li>
                <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app/page2">計算トレーニング</a></li>
                <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app2/page26.html">FamilyChat おかあさん</a></li>
                <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app2/page28.html">FamilyChat おとうさん</a></li>
                <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app2/page29.html">pngをスタンプ化</a></li>
                <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app2/page4.html">UI用語</a></li>
                <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app2/page23.html">QRcode</a></li>
                <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app2/page11.html">PDF to JPG</a></li>
                <li><a href="https://hinatabokko-jp.github.io/hinatabokko-app2/page30.html">MEMO</a></li>
            </ul>
        </aside>

        <!-- Header / Navbar -->
        <header class="sticky top-0 z-40 bg-[#1e1e1e]/90 backdrop-blur border-b border-[#333] px-6 py-3.5 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-3">
                <button id="hamburger-btn" class="text-[#00bcd4] text-xl p-1 cursor-pointer hover:opacity-80 transition" aria-label="メニューを開く">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="w-10 h-10 rounded-xl bg-[#00bcd4]/10 flex items-center justify-center text-[#00bcd4] text-xl font-bold shadow-inner">
                    <i class="fa-solid fa-pen-to-square"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide text-white">Direct Memo</h1>
                    <p class="text-xs text-zinc-400">ワンページ・ダイレクトメモ帳</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span id="saveStatus" class="text-xs text-zinc-500 flex items-center space-x-1.5 transition-opacity duration-300">
                    <i class="fa-solid fa-cloud text-[#00bcd4]/70"></i>
                    <span>自動保存済み</span>
                </span>
                <button onclick="clearAllData()" title="すべてリセット" class="p-2 text-zinc-400 hover:text-red-400 hover:bg-[#2a2a2a] rounded-xl transition text-sm">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
                <button id="changeUserBtn" title="ロックに戻る" class="px-3 py-1.5 border border-[#333] text-zinc-300 rounded-lg hover:bg-white/10 transition text-xs">
                    ロック
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-8 flex flex-col">
            
            <!-- Main Note Container -->
            <div class="w-full bg-[#1e1e1e] border border-[#333] rounded-3xl shadow-xl p-6 sm:p-8 flex flex-col space-y-6">
                
                <!-- Free Text Area -->
                <div class="flex flex-col space-y-2">
                    <label for="noteBody" class="text-xs font-medium text-zinc-400 flex items-center space-x-1.5">
                        <i class="fa-solid fa-align-left text-[#00bcd4]"></i>
                        <span>フリーメモ</span>
                    </label>
                    <textarea id="noteBody" placeholder="自由にメモを書き込んでください（自動保存されます）..." rows="8" class="w-full bg-[#252525] p-4 text-zinc-200 placeholder-zinc-600 rounded-2xl border border-[#333] text-sm leading-relaxed resize-none outline-none focus:border-[#00bcd4] transition-colors"></textarea>
                </div>

                <!-- Checklist Section -->
                <div class="flex flex-col space-y-3 pt-2">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-medium text-zinc-400 flex items-center space-x-1.5">
                            <i class="fa-solid fa-square-check text-[#00bcd4]"></i>
                            <span>チェックリスト</span>
                        </label>
                        <span id="checklistProgress" class="text-xs text-zinc-500">0 / 0 完了</span>
                    </div>

                    <!-- Checklist Input Form -->
                    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                        <input type="text" id="newChecklistItemInput" placeholder="新しいチェック項目を入力して追加..." class="flex-1 bg-[#252525] text-xs sm:text-sm text-zinc-200 placeholder-zinc-600 px-4 py-3 rounded-xl border border-[#333] outline-none focus:border-[#00bcd4] transition-colors">
                        
                        <div class="flex items-center justify-between gap-2">
                            <!-- カラー選択 -->
                            <div class="flex items-center space-x-1.5 bg-[#252525] px-3 py-2 rounded-xl border border-[#333]">
                                <span class="text-[10px] text-zinc-400">色:</span>
                                <label class="cursor-pointer"><input type="radio" name="itemColor" value="default" checked class="accent-[#00bcd4]"><span class="ml-1 text-xs text-zinc-300">標準</span></label>
                                <label class="cursor-pointer"><input type="radio" name="itemColor" value="blue" class="accent-[#00bcd4]"><span class="ml-1 text-xs text-[#00bcd4]">青</span></label>
                                <label class="cursor-pointer"><input type="radio" name="itemColor" value="green" class="accent-[#00bcd4]"><span class="ml-1 text-xs text-[#4caf50]">緑</span></label>
                                <label class="cursor-pointer"><input type="radio" name="itemColor" value="yellow" class="accent-[#00bcd4]"><span class="ml-1 text-xs text-[#ffeb3b]">黄</span></label>
                            </div>

                            <button type="button" onclick="addChecklistItem()" class="px-5 py-3 bg-[#00bcd4] hover:bg-[#008ba3] text-zinc-950 font-bold text-xs sm:text-sm rounded-xl transition shadow flex items-center space-x-1.5 shrink-0">
                                <i class="fa-solid fa-plus"></i>
                                <span>追加</span>
                            </button>
                        </div>
                    </div>

                    <!-- Checklist Items Container -->
                    <div id="checklistContainer" class="flex flex-col space-y-2.5 mt-2">
                        <!-- Dynamic checklist items injected here -->
                    </div>

                    <!-- Empty Checklist Notice -->
                    <div id="emptyChecklist" class="hidden text-center py-6 text-zinc-600 text-xs">
                        チェック項目はまだありません。上のフォームから追加してください。
                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- Custom Dialog / Notification Message Box -->
    <div id="messageBox" class="fixed bottom-6 right-6 z-50 bg-[#222] border border-[#444] text-white text-xs px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transform translate-y-20 opacity-0 transition-all duration-300">
        <i id="messageIcon" class="fa-solid fa-circle-check text-[#00bcd4] text-base"></i>
        <span id="messageText">通知メッセージ</span>
    </div>

    <!-- Firebase SDK & Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCPkZxnMh79D1OxIxYZbBbLLBi2wlyaa8Y",
            authDomain: "memo-32979.firebaseapp.com",
            projectId: "memo-32979",
            storageBucket: "memo-32979.firebasestorage.app",
            messagingSenderId: "798457900857",
            appId: "1:798457900857:web:8b5ac2812aee8c3c8402e8",
            measurementId: "G-7ZFJFTTHNW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const memoRef = ref(db, 'memo_data');
        const passcodeRef = ref(db, 'settings/passcode');

        let memoData = {
            body: '',
            checklist: []
        };
        let saveTimeout = null;
        let isInitialLoad = true;

        // あいことば認証関連
        const lockScreen = document.getElementById('lock-screen');
        const appContent = document.getElementById('app-content');
        const passInput = document.getElementById('pass-input');
        const passBtn = document.getElementById('pass-btn');
        const passError = document.getElementById('pass-error');
        const rememberMeCheckbox = document.getElementById('remember-me-checkbox');
        const changeUserBtn = document.getElementById('changeUserBtn');

        if (localStorage.getItem('memo_unlocked') === 'true' || sessionStorage.getItem('memo_unlocked') === 'true') {
            unlockApp();
        }

        async function handleAuth() {
            const inputPass = passInput.value;
            if (!inputPass) {
                passError.textContent = 'あいことばを入力してください';
                passError.style.display = 'block';
                return;
            }

            try {
                const snap = await get(passcodeRef);
                const correctPass = snap.exists() ? snap.val() : '0813';

                if (inputPass === correctPass) {
                    if (rememberMeCheckbox.checked) {
                        localStorage.setItem('memo_unlocked', 'true');
                    } else {
                        sessionStorage.setItem('memo_unlocked', 'true');
                    }
                    unlockApp();
                } else {
                    passError.textContent = 'あいことばが違います';
                    passError.style.display = 'block';
                }
            } catch (e) {
                if (inputPass === '0813') {
                    sessionStorage.setItem('memo_unlocked', 'true');
                    unlockApp();
                } else {
                    passError.textContent = 'あいことばが違います';
                    passError.style.display = 'block';
                }
            }
        }

        function unlockApp() {
            lockScreen.style.display = 'none';
            appContent.style.display = 'flex';
            initFirebaseListener();
        }

        passBtn.addEventListener('click', handleAuth);
        passInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleAuth();
        });

        changeUserBtn.addEventListener('click', () => {
            sessionStorage.removeItem('memo_unlocked');
            localStorage.removeItem('memo_unlocked');
            lockScreen.style.display = 'flex';
            appContent.style.display = 'none';
            passInput.value = '';
        });

        // ハンバーガーメニュー開閉
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }
        hamburgerBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        function initFirebaseListener() {
            onValue(memoRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    memoData = data;
                } else {
                    memoData = {
                        body: '',
                        checklist: []
                    };
                }
                
                if (isInitialLoad || document.activeElement !== document.getElementById('noteBody')) {
                    document.getElementById('noteBody').value = memoData.body || '';
                }
                renderChecklist();
                isInitialLoad = false;
            });

            setupEventListeners();
        }

        window.triggerAutoSave = function() {
            memoData.body = document.getElementById('noteBody').value;
            
            const status = document.getElementById('saveStatus');
            status.innerHTML = '<i class="fa-solid fa-rotate fa-spin text-[#00bcd4]"></i><span>保存中...</span>';
            status.classList.remove('opacity-50');

            if(saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveMemoToFirebase(true);
            }, 400);
        }

        function saveMemoToFirebase(showNotice = true) {
            set(memoRef, memoData).then(() => {
                const status = document.getElementById('saveStatus');
                status.innerHTML = '<i class="fa-solid fa-cloud text-[#00bcd4]"></i><span>自動保存済み</span>';
            }).catch((error) => {
                const status = document.getElementById('saveStatus');
                status.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-red-400"></i><span>保存失敗</span>';
            });
        }

        function setupEventListeners() {
            document.getElementById('noteBody').addEventListener('input', triggerAutoSave);

            const checklistInput = document.getElementById('newChecklistItemInput');
            checklistInput.addEventListener('keydown', function(e) {
                if(e.key === 'Enter') {
                    window.addChecklistItem();
                }
            });
        }

        window.addChecklistItem = function() {
            const input = document.getElementById('newChecklistItemInput');
            const val = input.value.trim();
            if(!val) {
                showNotification('チェック項目を入力してください', 'error');
                return;
            }

            const colorRadios = document.getElementsByName('itemColor');
            let selectedColor = 'default';
            for(const radio of colorRadios) {
                if(radio.checked) {
                    selectedColor = radio.value;
                    break;
                }
            }

            if(!memoData.checklist) memoData.checklist = [];
            memoData.checklist.push({
                text: val,
                completed: false,
                color: selectedColor
            });

            input.value = '';
            renderChecklist();
            saveMemoToFirebase(false);
            showNotification('項目を追加しました');
        }

        window.toggleChecklistItem = function(index) {
            if(memoData.checklist[index]) {
                memoData.checklist[index].completed = !memoData.checklist[index].completed;
                renderChecklist();
                saveMemoToFirebase(false);
            }
        }

        window.deleteChecklistItem = function(index) {
            memoData.checklist.splice(index, 1);
            renderChecklist();
            saveMemoToFirebase(false);
            showNotification('項目を削除しました');
        }

        window.moveItem = function(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= memoData.checklist.length) return;
            const temp = memoData.checklist[index];
            memoData.checklist[index] = memoData.checklist[newIndex];
            memoData.checklist[newIndex] = temp;
            renderChecklist();
            saveMemoToFirebase(false);
        }

        function renderChecklist() {
            const container = document.getElementById('checklistContainer');
            const emptyNotice = document.getElementById('emptyChecklist');
            const progress = document.getElementById('checklistProgress');

            if (!memoData.checklist) memoData.checklist = [];
            const total = memoData.checklist.length;
            const completedCount = memoData.checklist.filter(i => i.completed).length;
            progress.textContent = `${completedCount} / ${total} 完了`;

            if(total === 0) {
                container.innerHTML = '';
                emptyNotice.classList.remove('hidden');
                return;
            }

            emptyNotice.classList.add('hidden');
            let html = '';

            memoData.checklist.forEach((item, idx) => {
                let textColorClass = 'text-zinc-200';
                if(item.color === 'blue') textColorClass = 'text-[#00bcd4] font-medium';
                if(item.color === 'green') textColorClass = 'text-[#4caf50] font-medium';
                if(item.color === 'yellow') textColorClass = 'text-[#ffeb3b] font-medium';

                html += `
                    <div class="group flex items-center justify-between bg-[#252525] px-4 py-3 rounded-xl border border-[#333] hover:border-[#444] transition cursor-grab active:cursor-grabbing" draggable="true" ondragstart="onDragStart(event, ${idx})" ondragover="onDragOver(event)" ondrop="onDrop(event, ${idx})">
                        <div class="flex items-center space-x-3 flex-1 pr-3">
                            <i class="fa-solid fa-grip-vertical text-zinc-600 hover:text-zinc-400 text-xs cursor-grab"></i>
                            <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleChecklistItem(${idx})" class="w-4 h-4 accent-[#00bcd4] rounded bg-[#1e1e1e] border-[#555]">
                            <span class="text-xs sm:text-sm transition-all ${textColorClass} ${item.completed ? 'line-through opacity-50' : ''}">${escapeHtml(item.text)}</span>
                        </div>
                        <div class="flex items-center space-x-1">
                            <button type="button" onclick="moveItem(${idx}, -1)" title="上へ" class="text-zinc-500 hover:text-zinc-200 p-1.5 rounded-lg opacity-60 sm:opacity-0 group-hover:opacity-100 transition">
                                <i class="fa-solid fa-arrow-up text-xs"></i>
                            </button>
                            <button type="button" onclick="moveItem(${idx}, 1)" title="下へ" class="text-zinc-500 hover:text-zinc-200 p-1.5 rounded-lg opacity-60 sm:opacity-0 group-hover:opacity-100 transition">
                                <i class="fa-solid fa-arrow-down text-xs"></i>
                            </button>
                            <button type="button" onclick="deleteChecklistItem(${idx})" title="削除" class="text-zinc-500 hover:text-red-400 p-1.5 rounded-lg opacity-60 sm:opacity-0 group-hover:opacity-100 transition">
                                <i class="fa-solid fa-xmark text-sm"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ドラッグ＆ドロップ並び替えハンドラ
        let draggedIndex = null;
        window.onDragStart = function(e, index) {
            draggedIndex = index;
            e.dataTransfer.effectAllowed = 'move';
        }
        window.onDragOver = function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }
        window.onDrop = function(e, targetIndex) {
            e.preventDefault();
            if (draggedIndex === null || draggedIndex === targetIndex) return;
            const item = memoData.checklist.splice(draggedIndex, 1)[0];
            memoData.checklist.splice(targetIndex, 0, item);
            draggedIndex = null;
            renderChecklist();
            saveMemoToFirebase(false);
        }

        window.clearAllData = function() {
            if(confirm('メモおよびすべてのチェック項目をリセットしてもよろしいですか？')) {
                memoData = {
                    body: '',
                    checklist: []
                };
                document.getElementById('noteBody').value = '';
                renderChecklist();
                saveMemoToFirebase(false);
                showNotification('メモをリセットしました');
            }
        }

        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function showNotification(text, type = 'success') {
            const msgBox = document.getElementById('messageBox');
            const msgText = document.getElementById('messageText');
            const msgIcon = document.getElementById('messageIcon');

            msgText.textContent = text;
            if(type === 'success') {
                msgIcon.className = 'fa-solid fa-circle-check text-[#00bcd4] text-base';
            } else {
                msgIcon.className = 'fa-solid fa-circle-exclamation text-red-400 text-base';
            }

            msgBox.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                msgBox.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
