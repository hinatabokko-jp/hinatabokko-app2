    <!-- Tailwind CSS -->

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wa: {
                            indigo: '#0f172a',
                            accent: '#3b82f6',
                            accentHover: '#2563eb',
                            gold: '#f59e0b',
                            bg: '#090d16',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                        mono: ['"Roboto Mono"', 'monospace'],
                    }
                }
            }
        };

        function eraApp() {
            return {
                todayYear: new Date().getFullYear(),
                todayEra: '',
                
                // フォーム入力データ（デフォルト: 令和8年 / 2026年）
                selectedEra: '令和',
                rawInput: '8',
                quickYearNum: 8,

                // トースト通知状態
                toast: {
                    show: false,
                    message: ''
                },

                // 基礎元号テーブル
                eras: [
                    { name: '令和', short: 'R', startYear: 2019, startMonthDay: '0501' },
                    { name: '平成', short: 'H', startYear: 1989, startMonthDay: '0108' },
                    { name: '昭和', short: 'S', startYear: 1926, startMonthDay: '1225' },
                    { name: '大正', short: 'T', startYear: 1912, startMonthDay: '0730' },
                    { name: '明治', short: 'M', startYear: 1868, startMonthDay: '0125' }
                ],

                // リアルタイム計算プロパティ
                get calcResult() {
                    let yearNum = 2026;
                    let eraName = this.selectedEra;
                    let eraYearStr = '8年';

                    const inputStr = (this.rawInput || '').toString().trim().toUpperCase();

                    if (inputStr) {
                        // パターン1: 2026のような4桁西暦入力
                        if (/^\d{4}$/.test(inputStr)) {
                            const y = parseInt(inputStr, 10);
                            const converted = this.getJapaneseEraFromWestern(y);
                            return {
                                yearOnly: y,
                                yearWithKanji: y + '年',
                                eraFullText: `${converted.eraFull} (${y}年)`,
                                age: this.todayYear - y,
                                zodiac: this.getZodiac(y)
                            };
                        }

                        // パターン2: R8, H30, S60 のような頭文字+数字
                        const matchShort = inputStr.match(/^([RHSTM])(\d{1,3})$/);
                        if (matchShort) {
                            const prefix = matchShort[1];
                            const num = parseInt(matchShort[2], 10);
                            let targetEra = this.eras.find(e => e.short === prefix);
                            if (targetEra) {
                                eraName = targetEra.name;
                                this.selectedEra = eraName;
                                yearNum = targetEra.startYear + num - 1;
                                eraYearStr = (num === 1 ? '元' : num) + '年';
                            }
                        } 
                        // パターン3: 数字のみの場合（選択中の元号に従う）
                        else if (/^\d{1,3}$/.test(inputStr)) {
                            const num = parseInt(inputStr, 10);
                            this.quickYearNum = num;
                            if (this.selectedEra === '西暦') {
                                yearNum = num;
                                eraName = '西暦';
                                eraYearStr = num + '年';
                            } else {
                                const targetEra = this.eras.find(e => e.name === this.selectedEra);
                                if (targetEra) {
                                    yearNum = targetEra.startYear + num - 1;
                                    eraYearStr = (num === 1 ? '元' : num) + '年';
                                }
                            }
                        }
                        // パターン4: 「令和8年」「昭和60」のような和暦漢字表記
                        else {
                            for (let e of this.eras) {
                                if (inputStr.includes(e.name)) {
                                    eraName = e.name;
                                    this.selectedEra = eraName;
                                    const numMatch = inputStr.match(/\d+/);
                                    if (numMatch) {
                                        const num = parseInt(numMatch[0], 10);
                                        yearNum = e.startYear + num - 1;
                                        eraYearStr = (num === 1 ? '元' : num) + '年';
                                    }
                                    break;
                                }
                            }
                        }
                    }

                    const age = this.todayYear - yearNum;

                    return {
                        yearOnly: yearNum,
                        yearWithKanji: yearNum + '年',
                        eraFullText: eraName === '西暦' ? `${yearNum}年` : `${eraName}${eraYearStr}`,
                        age: age >= 0 ? age : 0,
                        zodiac: this.getZodiac(yearNum)
                    };
                },

                getJapaneseEraFromWestern(year) {
                    if (year >= 2019) {
                        const y = year - 2019 + 1;
                        return { eraFull: `令和${y === 1 ? '元' : y}年` };
                    } else if (year >= 1989) {
                        const y = year - 1989 + 1;
                        return { eraFull: `平成${y === 1 ? '元' : y}年` };
                    } else if (year >= 1926) {
                        const y = year - 1926 + 1;
                        return { eraFull: `昭和${y === 1 ? '元' : y}年` };
                    } else if (year >= 1912) {
                        const y = year - 1912 + 1;
                        return { eraFull: `大正${y === 1 ? '元' : y}年` };
                    }
                    return { eraFull: `${year}年` };
                },

                getZodiac(year) {
                    const zodiacs = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
                    const idx = (year - 4) % 12;
                    return zodiacs[idx >= 0 ? idx : idx + 12];
                },

                setEraYear(n) {
                    this.quickYearNum = n;
                    this.rawInput = n.toString();
                },

                setWesternYear(year) {
                    this.rawInput = year.toString();
                },

                selectEra(era) {
                    this.selectedEra = era;
                    this.onEraOrYearChanged();
                },

                onRawInput() {},

                onEraOrYearChanged() {
                    if (this.selectedEra === '西暦') {
                        this.rawInput = this.todayYear.toString();
                    } else if (this.quickYearNum) {
                        this.rawInput = this.quickYearNum.toString();
                    }
                },

                copyText(text) {
                    if (!text) return;
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    try {
                        document.execCommand('copy');
                        this.showToast(`コピーしました: ${text}`);
                    } catch (err) {
                        console.error('Copy failed', err);
                    }
                    document.body.removeChild(textarea);
                },

                showToast(msg) {
                    this.toast.message = msg;
                    this.toast.show = true;
                    setTimeout(() => {
                        this.toast.show = false;
                    }, 2000);
                },

                init() {
                    const currentYearEra = this.getJapaneseEraFromWestern(this.todayYear);
                    this.todayEra = currentYearEra.eraFull;
                }
            };
        }
    </script>

        }

        }
        .sidebar-link-icon {

        }
    </style>
</head>

                    </div>
                    <div class="grid grid-cols-5 gap-1.5">
                        <template x-for="n in 10" :key="n">
                            <button @click="setEraYear(n)" 
                                    :class="quickYearNum === n ? 'bg-blue-600 text-white font-black ring-2 ring-blue-400 border-blue-500' : 'bg-slate-800 text-slate-200 hover:bg-slate-700 border-slate-700 font-bold'"
                                    class="py-2.5 rounded-lg text-sm transition shadow-sm border" x-text="n + '年'">
                            </button>
                        </template>
                    </div>
                </div>

                <!-- 変換結果メイン表示エリア -->
                <div class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950/40 rounded-2xl p-5 text-white shadow-2xl border border-slate-800 relative overflow-hidden">
                    
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800/80 pb-4">
                        <div>
                            <span class="bg-blue-600/30 border border-blue-500/40 text-blue-300 text-xs font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">変換結果</span>
                            <div class="text-xl sm:text-2xl font-extrabold text-amber-400 mt-1" x-text="calcResult.eraFullText"></div>
                        </div>

                        <!-- コピー用ボタン -->
                        <div class="flex gap-2">
                            <button @click="copyText(calcResult.yearOnly)" 
                                    class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-1.5 border border-blue-400/50">
                                <i class="fa-regular fa-copy"></i>
                                数値 <span class="font-mono text-base text-amber-300" x-text="calcResult.yearOnly"></span> をコピー
                            </button>
                        </div>
                    </div>

                    <!-- 数字表示 -->
                    <div class="py-5 space-y-2">
                        <!-- 上段：西暦表示 -->
                        <div class="flex items-baseline gap-2">
                            <span class="text-xs text-slate-400 font-bold">西暦:</span>
                            <span class="text-5xl sm:text-6xl font-black font-mono tracking-tight text-white" x-text="calcResult.yearOnly"></span>
                            <span class="text-xl font-bold text-slate-400">年</span>
                        </div>

                        <!-- 下段：年齢・干支表示（西暦の下に配置） -->
                        <div class="flex items-center gap-3 text-xs bg-slate-900/90 px-3 py-1.5 rounded-xl border border-slate-800 w-fit">
                            <div>今年で <strong class="text-amber-400 text-sm" x-text="calcResult.age"></strong> 歳</div>
                            <span class="text-slate-700">|</span>
                            <div class="text-slate-400">干支: <span class="text-slate-200" x-text="calcResult.zodiac"></span></div>
                        </div>
                    </div>

                    <div class="text-[11px] text-slate-400 border-t border-slate-800/80 pt-2 text-center sm:text-left">
                        カルテ記載例: 「同一部位手術歴あり（<span x-text="calcResult.yearOnly"></span>年）」
                    </div>

                </div>

            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-500 py-4 border-t border-slate-900 text-center text-xs">
        電子カルテ入力支援・和暦西暦変換ナビ
    </footer>

    <script>
        // ハンバーガーメニュー制御
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const sidebar = document.getElementById("sidebar");
        const sidebarOverlay = document.getElementById("sidebarOverlay");
        const sidebarCloseBtn = document.getElementById("sidebarCloseBtn");

        function toggleSidebar() {
            const isActive = sidebar.classList.contains("active");
            if (isActive) {
                closeSidebar();
            } else {
                openSidebar();
            }
        }

        function openSidebar() {
            sidebar.classList.add("active");
            sidebarOverlay.classList.add("active");
        }

        function closeSidebar() {
            sidebar.classList.remove("active");
            sidebarOverlay.classList.remove("active");
        }

        hamburgerBtn.addEventListener("click", toggleSidebar);
        sidebarOverlay.addEventListener("click", closeSidebar);
        sidebarCloseBtn.addEventListener("click", closeSidebar);

        // PWA用のインライン Service Worker 登録 (オフラインキャッシュおよびGitHub Pages最適化)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'wareki-app-v1';
                    self.addEventListener('install', (e) => {
                        self.skipWaiting();
                    });
                    self.addEventListener('activate', (e) => {
                        e.waitUntil(clients.claim());
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(
                            fetch(e.request).catch(() => caches.match(e.request))
                        );
                    });
                `;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                const blobUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(blobUrl).catch(err => {
                    console.log('SW registration skipped or failed:', err);
                });
            });
        }
    </script>
</body>
</html>
