<!DOCTYPE html>
<html lang="ja" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Share</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap');
        body { font-family: 'M PLUS Rounded 1c', sans-serif; }
        .checkerboard-dark {
            background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                              linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                              linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col overflow-hidden">

    <header class="bg-slate-900 border-b border-slate-800 text-slate-100 shadow-lg px-4 py-3 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2 rounded-xl shadow font-bold text-xl flex items-center justify-center w-10 h-10">
                <i class="fa-solid fa-palette"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-wide">Canvas Share</h1>
                <p class="text-xs text-slate-400">ふたりでお絵描き＆レイヤー共有アプリ (ダークモード)</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <span id="user-badge" class="bg-slate-800 text-indigo-400 px-3 py-1 rounded-full text-xs font-semibold shadow-inner border border-indigo-500/30 hidden">未ログイン</span>
            <button onclick="openHistoryModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3.5 py-2 rounded-xl text-xs font-bold transition shadow flex items-center space-x-1.5">
                <i class="fa-solid fa-clock-rotate-left text-indigo-400"></i><span>保存履歴</span>
            </button>
            <button onclick="openLoginModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition shadow flex items-center space-x-1.5">
                <i class="fa-solid fa-right-to-bracket"></i><span>ログイン切替</span>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row p-3 gap-3 overflow-hidden">
        
        <!-- User 1 Workspace -->
        <section class="flex-1 bg-slate-900 rounded-2xl shadow-xl border border-slate-800 flex flex-col overflow-hidden relative">
            <div class="bg-gradient-to-r from-pink-950 to-slate-900 border-b border-pink-900/40 text-pink-200 px-4 py-2.5 flex justify-between items-center shrink-0">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-pink-500 animate-pulse"></span>
                    <h2 class="font-bold text-sm tracking-wide">User 1 ワークスペース</h2>
                </div>
                <span id="u1-status" class="text-xs bg-pink-900/60 text-pink-300 border border-pink-700/50 px-2.5 py-0.5 rounded-full font-medium">待機中</span>
            </div>
            <div class="flex-1 relative flex items-center justify-center bg-slate-950/70 overflow-hidden p-2">
                <!-- Layers Container for User 1 -->
                <div id="u1-canvas-container" class="relative shadow-2xl rounded-lg overflow-hidden checkerboard-dark cursor-crosshair border border-slate-800" style="width: 400px; height: 400px; max-width: 100%; max-height: 100%;">
                    <!-- Dynamic Layer canvases will be inserted here -->
                </div>
            </div>
            <!-- Toolbar User 1 -->
            <div class="bg-slate-900 border-t border-slate-800 p-2.5 flex flex-wrap items-center justify-between gap-2 shrink-0">
                <div class="flex items-center space-x-1.5">
                    <button onclick="setActiveUser('user1'); openBrushModal()" class="tool-btn bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-slate-300 text-xs font-bold flex items-center space-x-1 transition shadow-sm border border-slate-700">
                        <i class="fa-solid fa-brush text-pink-400"></i><span>ブラシ設定</span>
                    </button>
                    <button onclick="setActiveUser('user1'); openLayerModal()" class="tool-btn bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-slate-300 text-xs font-bold flex items-center space-x-1 transition shadow-sm border border-slate-700">
                        <i class="fa-solid fa-layer-group text-indigo-400"></i><span>レイヤー</span>
                    </button>
                    <button onclick="setTool('user1', 'eraser')" id="u1-eraser-btn" class="tool-btn bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-slate-300 text-xs font-bold flex items-center space-x-1 transition shadow-sm border border-slate-700">
                        <i class="fa-solid fa-eraser text-slate-400"></i><span>消しゴム</span>
                    </button>
                    <button onclick="setTool('user1', 'bucket')" id="u1-bucket-btn" class="tool-btn bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-slate-300 text-xs font-bold flex items-center space-x-1 transition shadow-sm border border-slate-700">
                        <i class="fa-solid fa-fill-drip text-amber-400"></i><span>バケツ</span>
                    </button>
                </div>
                <div class="flex items-center space-x-1.5">
                    <button onclick="undoCanvas('user1')" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl transition shadow-sm" title="ひとつ戻る"><i class="fa-solid fa-rotate-left"></i></button>
                    <button onclick="redoCanvas('user1')" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl transition shadow-sm" title="やりなおし"><i class="fa-solid fa-rotate-right"></i></button>
                    <button onclick="publishCanvas('user1')" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow flex items-center space-x-1">
                        <i class="fa-solid fa-paper-plane"></i><span>描き終わった</span>
                    </button>
                    <button onclick="saveMyArt('user1')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow flex items-center space-x-1">
                        <i class="fa-solid fa-floppy-disk"></i><span>保存</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- User 2 Workspace -->
        <section class="flex-1 bg-slate-900 rounded-2xl shadow-xl border border-slate-800 flex flex-col overflow-hidden relative">
            <div class="bg-gradient-to-r from-cyan-950 to-slate-900 border-b border-cyan-900/40 text-cyan-200 px-4 py-2.5 flex justify-between items-center shrink-0">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-cyan-500 animate-pulse"></span>
                    <h2 class="font-bold text-sm tracking-wide">User 2 ワークスペース</h2>
                </div>
                <span id="u2-status" class="text-xs bg-cyan-900/60 text-cyan-300 border border-cyan-700/50 px-2.5 py-0.5 rounded-full font-medium">待機中</span>
            </div>
            <div class="flex-1 relative flex items-center justify-center bg-slate-950/70 overflow-hidden p-2">
                <!-- Layers Container for User 2 -->
                <div id="u2-canvas-container" class="relative shadow-2xl rounded-lg overflow-hidden checkerboard-dark cursor-crosshair border border-slate-800" style="width: 400px; height: 400px; max-width: 100%; max-height: 100%;">
                    <!-- Dynamic Layer canvases will be inserted here -->
                </div>
            </div>
            <!-- Toolbar User 2 -->
            <div class="bg-slate-900 border-t border-slate-800 p-2.5 flex flex-wrap items-center justify-between gap-2 shrink-0">
                <div class="flex items-center space-x-1.5">
                    <button onclick="setActiveUser('user2'); openBrushModal()" class="tool-btn bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-slate-300 text-xs font-bold flex items-center space-x-1 transition shadow-sm border border-slate-700">
                        <i class="fa-solid fa-brush text-cyan-400"></i><span>ブラシ設定</span>
                    </button>
                    <button onclick="setActiveUser('user2'); openLayerModal()" class="tool-btn bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-slate-300 text-xs font-bold flex items-center space-x-1 transition shadow-sm border border-slate-700">
                        <i class="fa-solid fa-layer-group text-indigo-400"></i><span>レイヤー</span>
                    </button>
                    <button onclick="setTool('user2', 'eraser')" id="u2-eraser-btn" class="tool-btn bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-slate-300 text-xs font-bold flex items-center space-x-1 transition shadow-sm border border-slate-700">
                        <i class="fa-solid fa-eraser text-slate-400"></i><span>消しゴム</span>
                    </button>
                    <button onclick="setTool('user2', 'bucket')" id="u2-bucket-btn" class="tool-btn bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-slate-300 text-xs font-bold flex items-center space-x-1 transition shadow-sm border border-slate-700">
                        <i class="fa-solid fa-fill-drip text-amber-400"></i><span>バケツ</span>
                    </button>
                </div>
                <div class="flex items-center space-x-1.5">
                    <button onclick="undoCanvas('user2')" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl transition shadow-sm" title="ひとつ戻る"><i class="fa-solid fa-rotate-left"></i></button>
                    <button onclick="redoCanvas('user2')" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl transition shadow-sm" title="やりなおし"><i class="fa-solid fa-rotate-right"></i></button>
                    <button onclick="publishCanvas('user2')" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow flex items-center space-x-1">
                        <i class="fa-solid fa-paper-plane"></i><span>描き終わった</span>
                    </button>
                    <button onclick="saveMyArt('user2')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow flex items-center space-x-1">
                        <i class="fa-solid fa-floppy-disk"></i><span>保存</span>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- Brush, Shape & Color Modal -->
    <div id="brush-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl max-w-md w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-slate-200 text-base"><i class="fa-solid fa-palette text-indigo-400 mr-2"></i>ブラシ・スタイル設定</h3>
                <button onclick="closeModal('brush-modal')" class="text-slate-400 hover:text-slate-200 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <!-- Brush Shapes Selection -->
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">ブラシの形状（タッチ・質感）</label>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2" id="brush-shapes-grid">
                    <button onclick="updateBrushShape('normal')" id="shape-normal" class="p-2.5 rounded-xl border border-indigo-500 bg-indigo-950/60 text-indigo-300 text-xs font-bold text-left transition flex items-center space-x-2">
                        <i class="fa-solid fa-pen"></i><span>標準ペン</span>
                    </button>
                    <button onclick="updateBrushShape('calligraphy')" id="shape-calligraphy" class="p-2.5 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2">
                        <i class="fa-solid fa-pen-nib"></i><span>カリグラフィ</span>
                    </button>
                    <button onclick="updateBrushShape('airbrush')" id="shape-airbrush" class="p-2.5 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2">
                        <i class="fa-solid fa-spray-can"></i><span>エアブラシ</span>
                    </button>
                    <button onclick="updateBrushShape('crayon')" id="shape-crayon" class="p-2.5 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2">
                        <i class="fa-solid fa-marker"></i><span>クレヨン</span>
                    </button>
                    <button onclick="updateBrushShape('marker')" id="shape-marker" class="p-2.5 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2">
                        <i class="fa-solid fa-highlighter"></i><span>マーカー</span>
                    </button>
                    <button onclick="updateBrushShape('pencil')" id="shape-pencil" class="p-2.5 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2">
                        <i class="fa-solid fa-pencil"></i><span>鉛筆</span>
                    </button>
                    <button onclick="updateBrushShape('watercolor')" id="shape-watercolor" class="p-2.5 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2">
                        <i class="fa-solid fa-droplet"></i><span>水彩ブラシ</span>
                    </button>
                    <button onclick="updateBrushShape('brush')" id="shape-brush" class="p-2.5 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2">
                        <i class="fa-solid fa-paintbrush"></i><span>毛筆</span>
                    </button>
                </div>
            </div>

            <!-- Color Selection -->
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">カラー選択</label>
                <div class="flex items-center space-x-3">
                    <input type="color" id="modal-color" class="w-12 h-12 rounded-xl border border-slate-700 cursor-pointer p-0 bg-transparent" value="#ffffff" onchange="updateBrushColor(this.value)">
                    <div class="flex gap-1.5 flex-wrap flex-1">
                        <button onclick="updateBrushColor('#ffffff')" class="w-7 h-7 rounded-full bg-white border border-slate-600 shadow-sm"></button>
                        <button onclick="updateBrushColor('#f87171')" class="w-7 h-7 rounded-full bg-red-400 border border-slate-700 shadow-sm"></button>
                        <button onclick="updateBrushColor('#60a5fa')" class="w-7 h-7 rounded-full bg-blue-400 border border-slate-700 shadow-sm"></button>
                        <button onclick="updateBrushColor('#34d399')" class="w-7 h-7 rounded-full bg-emerald-400 border border-slate-700 shadow-sm"></button>
                        <button onclick="updateBrushColor('#fbbf24')" class="w-7 h-7 rounded-full bg-amber-400 border border-slate-700 shadow-sm"></button>
                        <button onclick="updateBrushColor('#f472b6')" class="w-7 h-7 rounded-full bg-pink-400 border border-slate-700 shadow-sm"></button>
                        <button onclick="updateBrushColor('#000000')" class="w-7 h-7 rounded-full bg-black border border-slate-700 shadow-sm"></button>
                    </div>
                </div>
            </div>

            <!-- Brush Size & Opacity Sliders -->
            <div class="space-y-3">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-slate-400">ブラシの太さ</label>
                        <span id="brush-size-val" class="text-xs font-bold text-indigo-400">5px</span>
                    </div>
                    <input type="range" id="modal-size" min="1" max="50" value="5" class="w-full accent-indigo-500 bg-slate-800" oninput="updateBrushSize(this.value)">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-slate-400">不透明度 (透明度)</label>
                        <span id="brush-opacity-val" class="text-xs font-bold text-indigo-400">100%</span>
                    </div>
                    <input type="range" id="modal-opacity" min="0.05" max="1" step="0.05" value="1" class="w-full accent-indigo-500 bg-slate-800" oninput="updateBrushOpacity(this.value)">
                </div>
            </div>

            <button onclick="closeModal('brush-modal')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold text-sm shadow transition">決定する</button>
        </div>
    </div>

    <!-- Photoshop-style Layer Modal -->
    <div id="layer-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl max-w-md w-full p-6 space-y-5">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-slate-200 text-base"><i class="fa-solid fa-layer-group text-indigo-400 mr-2"></i>レイヤーマネージャー</h3>
                <button onclick="closeModal('layer-modal')" class="text-slate-400 hover:text-slate-200 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-400">アクティブレイヤー</span>
                    <button onclick="addNewLayer()" class="bg-slate-800 hover:bg-slate-700 text-indigo-400 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1">
                        <i class="fa-solid fa-plus"></i><span>新規レイヤー追加</span>
                    </button>
                </div>
                <div id="layer-list-container" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <!-- Layer items generated dynamically -->
                </div>
            </div>
            <button onclick="closeModal('layer-modal')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold text-sm shadow transition">閉じる</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl max-w-sm w-full p-6 space-y-5">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-slate-200 text-base"><i class="fa-solid fa-user-shield text-indigo-400 mr-2"></i>ログイン / ユーザー選択</h3>
                <button onclick="closeModal('login-modal')" class="text-slate-400 hover:text-slate-200 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-slate-400">どちらのユーザーとしてログインするか選択してください。</p>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="loginAs('user1')" class="bg-slate-800 hover:bg-slate-700 border border-pink-900/60 text-pink-300 p-4 rounded-2xl font-bold text-center transition flex flex-col items-center space-y-2">
                    <i class="fa-solid fa-user-pen text-2xl text-pink-400"></i>
                    <span>User 1</span>
                </button>
                <button onclick="loginAs('user2')" class="bg-slate-800 hover:bg-slate-700 border border-cyan-900/60 text-cyan-300 p-4 rounded-2xl font-bold text-center transition flex flex-col items-center space-y-2">
                    <i class="fa-solid fa-user-pen text-2xl text-cyan-400"></i>
                    <span>User 2</span>
                </button>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl max-w-lg w-full p-6 space-y-5 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 shrink-0">
                <h3 class="font-bold text-slate-200 text-base"><i class="fa-solid fa-clock-rotate-left text-indigo-400 mr-2"></i>保存した作品の履歴</h3>
                <button onclick="closeModal('history-modal')" class="text-slate-400 hover:text-slate-200 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <p class="text-xs text-slate-500 text-center py-8">保存された作品はありません</p>
            </div>
            <button onclick="closeModal('history-modal')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 py-3 rounded-xl font-bold text-sm transition shrink-0">閉じる</button>
        </div>
    </div>

    <!-- Custom Notification Dialog -->
    <div id="msg-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl max-w-xs w-full p-6 space-y-4 text-center">
            <div id="msg-icon" class="w-12 h-12 bg-indigo-950 text-indigo-400 border border-indigo-800 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-info"></i>
            </div>
            <p id="msg-text" class="text-sm font-bold text-slate-200">お知らせメッセージ</p>
            <button onclick="closeModal('msg-modal')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl font-bold text-xs transition shadow">OK</button>
        </div>
    </div>

    <script type="module">

        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {

            authDomain: "canvas-share-b0784.firebaseapp.com",
            projectId: "canvas-share-b0784",
            storageBucket: "canvas-share-b0784.firebasestorage.app",
            messagingSenderId: "1034578016604",

            measurementId: "G-DWMNPSFTVB"

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'canvas-share-default';

        let currentUserRole = null;

        const workspaces = {

            },
            user2: {
                color: '#ffffff',
                size: 5,
                opacity: 1,
                shape: 'normal',
                tool: 'brush',
                layers: [
                    { id: 1, name: 'レイヤー 1', visible: true, opacity: 1, canvas: null, ctx: null }
                ],
                activeLayerId: 1,
                history: [],
                redoStack: []
            }
        };

        window.showModalMsg = function(text, type = 'info') {
            document.getElementById('msg-text').textContent = text;
            const icon = document.getElementById('msg-icon');
            if(type === 'success') {
                icon.className = "w-12 h-12 bg-emerald-950 text-emerald-400 border border-emerald-800 rounded-full flex items-center justify-center mx-auto text-xl";
                icon.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else {
                icon.className = "w-12 h-12 bg-indigo-950 text-indigo-400 border border-indigo-800 rounded-full flex items-center justify-center mx-auto text-xl";
                icon.innerHTML = '<i class="fa-solid fa-info"></i>';
            }
            document.getElementById('msg-modal').classList.remove('hidden');
        };

        window.openModal = function(id) { document.getElementById(id).classList.remove('hidden'); };
        window.closeModal = function(id) { document.getElementById(id).classList.add('hidden'); };
        window.openLoginModal = function() { openModal('login-modal'); };
        window.openBrushModal = function() { 
            const ws = workspaces[currentActiveDrawer];
            document.getElementById('modal-color').value = ws.color;
            document.getElementById('modal-size').value = ws.size;
            document.getElementById('brush-size-val').textContent = ws.size + 'px';
            document.getElementById('modal-opacity').value = ws.opacity;
            document.getElementById('brush-opacity-val').textContent = Math.round(ws.opacity * 100) + '%';
            updateBrushShapeUI(ws.shape);
            openModal('brush-modal'); 
        };
        window.openLayerModal = function() { 
            renderLayerList();
            openModal('layer-modal'); 
        };

        window.setActiveUser = function(user) {
            currentActiveDrawer = user;
        };

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.warn("Auth initialization skipped or Anonymous Auth disabled in Firebase Console:", e);
                // Firebase Authがコンソールで未有効の場合でもお絵かき機能が壊れないようにフォールバック
            }
        }

        window.loginAs = function(role) {
            currentUserRole = role;
            const badge = document.getElementById('user-badge');
            badge.textContent = role === 'user1' ? 'ログイン中: User 1' : 'ログイン中: User 2';
            badge.className = role === 'user1' ? 'bg-pink-950 text-pink-300 border border-pink-700/50 px-3 py-1 rounded-full text-xs font-semibold shadow-inner' : 'bg-cyan-950 text-cyan-300 border border-cyan-700/50 px-3 py-1 rounded-full text-xs font-semibold shadow-inner';
            badge.classList.remove('hidden');
            closeModal('login-modal');
            showModalMsg(`${role === 'user1' ? 'User 1' : 'User 2'}としてログインしました`, 'success');
        };

        function initWorkspace(userKey) {
            const container = document.getElementById(`${userKey}-canvas-container`);
            container.innerHTML = '';
            
            workspaces[userKey].layers.forEach(layer => {
                const c = document.createElement('canvas');
                c.width = 400;
                c.height = 400;
                c.className = `absolute inset-0 w-full h-full ${layer.visible ? '' : 'hidden'}`;
                c.style.opacity = layer.opacity;
                container.appendChild(c);
                layer.canvas = c;
                layer.ctx = c.getContext('2d');
            });

            setupDrawingEvents(userKey, container);
            saveState(userKey);
        }

        function setupDrawingEvents(userKey, container) {
            let isDrawing = false;
            let lastX = 0, lastY = 0;

            const getPos = (e) => {
                const rect = container.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * (400 / rect.width),
                    y: (clientY - rect.top) * (400 / rect.height)
                };
            };

            const startDraw = (e) => {
                if (!currentUserRole) {
                    currentUserRole = userKey;
                    const badge = document.getElementById('user-badge');
                    badge.textContent = `ログイン中: ${userKey === 'user1' ? 'User 1' : 'User 2'}`;
                    badge.className = userKey === 'user1' ? 'bg-pink-950 text-pink-300 border border-pink-700/50 px-3 py-1 rounded-full text-xs font-semibold shadow-inner' : 'bg-cyan-950 text-cyan-300 border border-cyan-700/50 px-3 py-1 rounded-full text-xs font-semibold shadow-inner';
                    badge.classList.remove('hidden');
                }

                isDrawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;

                const ws = workspaces[userKey];
                if (ws.tool === 'bucket') {
                    floodFill(userKey, Math.floor(pos.x), Math.floor(pos.y), ws.color, ws.opacity);
                    isDrawing = false;
                    saveState(userKey);
                } else {
                    drawPoint(userKey, pos.x, pos.y);
                }
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const ws = workspaces[userKey];
                const activeLayer = ws.layers.find(l => l.id === ws.activeLayerId);
                if (!activeLayer || !activeLayer.visible) return;

                const pos = getPos(e);
                renderBrushStroke(ws, activeLayer.ctx, lastX, lastY, pos.x, pos.y);
                lastX = pos.x;
                lastY = pos.y;
            };

            const stopDraw = () => {
                if (isDrawing) {
                    isDrawing = false;
                    saveState(userKey);
                }
            };

            container.addEventListener('mousedown', startDraw);
            container.addEventListener('mousemove', draw);
            container.addEventListener('mouseup', stopDraw);
            container.addEventListener('mouseleave', stopDraw);

            container.addEventListener('touchstart', (e) => { startDraw(e); e.preventDefault(); });
            container.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });
            container.addEventListener('touchend', stopDraw);
        }

        function drawPoint(userKey, x, y) {
            const ws = workspaces[userKey];
            const activeLayer = ws.layers.find(l => l.id === ws.activeLayerId);
            if (!activeLayer || !activeLayer.visible) return;
            renderBrushStroke(ws, activeLayer.ctx, x, y, x, y);
        }

        function renderBrushStroke(ws, ctx, x1, y1, x2, y2) {
            ctx.save();
            ctx.globalAlpha = ws.opacity;

            if (ws.tool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineWidth = ws.size;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                ctx.restore();
                return;
            }

            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = ws.color;
            ctx.fillStyle = ws.color;

            switch (ws.shape) {
                case 'calligraphy':
                    // Slanted flat nib
                    ctx.lineWidth = ws.size;
                    ctx.lineCap = 'square';
                    ctx.beginPath();
                    ctx.moveTo(x1 - ws.size/3, y1 + ws.size/3);
                    ctx.lineTo(x2 - ws.size/3, y2 + ws.size/3);
                    ctx.stroke();
                    break;

                case 'airbrush':
                    // Spray dot distribution
                    const dist = Math.hypot(x2 - x1, y2 - y1);
                    const steps = Math.max(1, Math.floor(dist));
                    for (let i = 0; i <= steps; i++) {
                        const cx = x1 + (x2 - x1) * (i / steps);
                        const cy = y1 + (y2 - y1) * (i / steps);
                        for (let j = 0; j < 8; j++) {
                            const angle = Math.random() * Math.PI * 2;
                            const r = Math.random() * (ws.size * 1.5);
                            ctx.fillRect(cx + Math.cos(angle)*r, cy + Math.sin(angle)*r, 1.2, 1.2);
                        }
                    }
                    break;

                case 'crayon':
                    // Textured dotted stroke
                    ctx.lineWidth = ws.size;
                    ctx.lineCap = 'round';
                    ctx.setLineDash([2, 3]);
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    break;

                case 'marker':
                    // Semi-transparent bold rectangle stroke
                    ctx.globalAlpha = ws.opacity * 0.7;
                    ctx.lineWidth = ws.size * 1.8;
                    ctx.lineCap = 'butt';
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    break;

                case 'pencil':
                    // Thin scratchy line
                    ctx.globalAlpha = ws.opacity * 0.8;
                    ctx.lineWidth = Math.max(1, ws.size * 0.4);
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(x1 + (Math.random()-0.5)*2, y1 + (Math.random()-0.5)*2);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    break;

                case 'watercolor':
                    // Soft blurred multi-pass stroke
                    ctx.globalAlpha = ws.opacity * 0.25;
                    for (let wOff = -ws.size/2; wOff <= ws.size/2; wOff += 2) {
                        ctx.beginPath();
                        ctx.moveTo(x1 + wOff, y1);
                        ctx.lineTo(x2 + wOff, y2);
                        ctx.lineWidth = 3;
                        ctx.stroke();
                    }
                    break;

                case 'brush':
                    // Tapered pressure-like毛筆 stroke
                    ctx.lineWidth = ws.size * 1.2;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    break;

                default: // normal
                    ctx.lineWidth = ws.size;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    break;
            }
            ctx.restore();
        }

        window.setTool = function(userKey, toolName) {
            workspaces[userKey].tool = toolName;
            document.getElementById(`${userKey}-eraser-btn`).classList.toggle('bg-slate-700', toolName === 'eraser');
            document.getElementById(`${userKey}-bucket-btn`).classList.toggle('bg-slate-700', toolName === 'bucket');
        };

        window.updateBrushColor = function(color) {
            workspaces[currentActiveDrawer].color = color;
            document.getElementById('modal-color').value = color;
        };

        window.updateBrushSize = function(size) {
            workspaces[currentActiveDrawer].size = parseInt(size);
            document.getElementById('brush-size-val').textContent = size + 'px';
        };

        window.updateBrushOpacity = function(opacity) {
            workspaces[currentActiveDrawer].opacity = parseFloat(opacity);
            document.getElementById('brush-opacity-val').textContent = Math.round(opacity * 100) + '%';
        };

        window.updateBrushShape = function(shape) {
            workspaces[currentActiveDrawer].shape = shape;
            updateBrushShapeUI(shape);
        };

        function updateBrushShapeUI(activeShape) {
            const shapes = ['normal', 'calligraphy', 'airbrush', 'crayon', 'marker', 'pencil', 'watercolor', 'brush'];
            shapes.forEach(s => {
                const btn = document.getElementById(`shape-${s}`);
                if (btn) {
                    if (s === activeShape) {
                        btn.className = "p-2.5 rounded-xl border border-indigo-500 bg-indigo-950/60 text-indigo-300 text-xs font-bold text-left transition flex items-center space-x-2";
                    } else {
                        btn.className = "p-2.5 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2";
                    }
                }
            });
        }

        function saveState(userKey) {
            const ws = workspaces[userKey];
            const snapshot = ws.layers.map(l => l.ctx.getImageData(0, 0, 400, 400));
            ws.history.push(snapshot);
            if (ws.history.length > 20) ws.history.shift();
            ws.redoStack = [];
        }

        window.undoCanvas = function(userKey) {
            const ws = workspaces[userKey];
            if (ws.history.length <= 1) return;
            const current = ws.history.pop();
            ws.redoStack.push(current);
            const prev = ws.history[ws.history.length - 1];
            ws.layers.forEach((l, idx) => {
                if (prev[idx]) l.ctx.putImageData(prev[idx], 0, 0);
            });
        };

        window.redoCanvas = function(userKey) {
            const ws = workspaces[userKey];
            if (ws.redoStack.length === 0) return;
            const next = ws.redoStack.pop();
            ws.history.push(next);
            ws.layers.forEach((l, idx) => {
                if (next[idx]) l.ctx.putImageData(next[idx], 0, 0);
            });
        };

        function floodFill(userKey, startX, startY, fillColor, opacity) {
            const ws = workspaces[userKey];
            const activeLayer = ws.layers.find(l => l.id === ws.activeLayerId);
            if (!activeLayer) return;
            const ctx = activeLayer.ctx;
            const imgData = ctx.getImageData(0, 0, 400, 400);
            const data = imgData.data;

            const getPixel = (x, y) => {
                const i = (y * 400 + x) * 4;
                return [data[i], data[i+1], data[i+2], data[i+3]];
            };

            const setPixel = (x, y, color, alpha) => {
                const i = (y * 400 + x) * 4;
                data[i] = color[0];
                data[i+1] = color[1];
                data[i+2] = color[2];
                data[i+3] = Math.round(alpha * 255);
            };

            const hexToRgb = (hex) => {
                const bigint = parseInt(hex.replace('#',''), 16);
                return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
            };

            const targetColor = getPixel(startX, startY);
            const fillRgb = hexToRgb(fillColor);

            if (targetColor[0] === fillRgb[0] && targetColor[1] === fillRgb[1] && targetColor[2] === fillRgb[2]) return;

            const queue = [[startX, startY]];
            while(queue.length > 0) {
                const [x, y] = queue.pop();
                if (x < 0 || x >= 400 || y < 0 || y >= 400) continue;
                const current = getPixel(x, y);
                if (current[0] === targetColor[0] && current[1] === targetColor[1] && current[2] === targetColor[2] && current[3] === targetColor[3]) {
                    setPixel(x, y, fillRgb, opacity);
                    queue.push([x+1, y], [x-1, y], [x, y+1], [x, y-1]);
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        window.renderLayerList = function() {
            const container = document.getElementById('layer-list-container');
            const ws = workspaces[currentActiveDrawer];
            container.innerHTML = '';

            ws.layers.slice().reverse().forEach(layer => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-3 rounded-2xl border ${layer.id === ws.activeLayerId ? 'border-indigo-500 bg-indigo-950/40' : 'border-slate-800 bg-slate-900'}`;
                div.innerHTML = `
                    <div class="flex items-center space-x-3 flex-1">
                        <button onclick="toggleLayerVisibility(${layer.id})" class="text-slate-400 hover:text-slate-200">
                            <i class="fa-solid ${layer.visible ? 'fa-eye text-indigo-400' : 'fa-eye-slash'}"></i>
                        </button>
                        <span class="font-bold text-xs text-slate-300 flex-1">${layer.name}</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <input type="range" min="0" max="1" step="0.1" value="${layer.opacity}" oninput="changeLayerOpacity(${layer.id}, this.value)" class="w-20 accent-indigo-500 bg-slate-800">
                        <button onclick="setActiveLayer(${layer.id})" class="px-2.5 py-1 rounded-xl text-xs font-bold ${layer.id === ws.activeLayerId ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300'}">選択</button>
                    </div>
                `;
                container.appendChild(div);
            });
        };

        window.addNewLayer = function() {
            const ws = workspaces[currentActiveDrawer];
            const newId = ws.layers.length + 1;
            ws.layers.push({
                id: newId,
                name: `レイヤー ${newId}`,
                visible: true,
                opacity: 1,
                canvas: null,
                ctx: null
            });
            initWorkspace(currentActiveDrawer);
            renderLayerList();
        };

        window.setActiveLayer = function(id) {
            workspaces[currentActiveDrawer].activeLayerId = id;
            renderLayerList();
        };

        window.toggleLayerVisibility = function(id) {
            const ws = workspaces[currentActiveDrawer];
            const layer = ws.layers.find(l => l.id === id);
            if (layer) {
                layer.visible = !layer.visible;
                layer.canvas.classList.toggle('hidden', !layer.visible);
                renderLayerList();
            }
        };

        window.changeLayerOpacity = function(id, val) {
            const ws = workspaces[currentActiveDrawer];
            const layer = ws.layers.find(l => l.id === id);
            if (layer) {
                layer.opacity = val;
                layer.canvas.style.opacity = val;
            }
        };

        function getMergedCanvasDataURL(userKey) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 400;
            tempCanvas.height = 400;
            const tCtx = tempCanvas.getContext('2d');
            
            workspaces[userKey].layers.forEach(layer => {
                if (layer.visible) {
                    tCtx.globalAlpha = layer.opacity;
                    tCtx.drawImage(layer.canvas, 0, 0);
                }
            });
            return tempCanvas.toDataURL();
        }

        window.publishCanvas = async function(userKey) {
            if (!auth.currentUser) {
                await initAuth();
            }
            const dataUrl = getMergedCanvasDataURL(userKey);
            try {
                if (!auth.currentUser) {
                    showModalMsg("Firebase ConsoleでAuthentication（匿名認証）を有効化すると共有可能になります。");
                    return;
                }
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', `shared_${userKey}`);
                await setDoc(docRef, {
                    image: dataUrl,
                    updatedAt: new Date().toISOString(),
                    user: userKey
                });
                showModalMsg(`${userKey === 'user1' ? 'User 1' : 'User 2'}の絵を更新しました！`, 'success');
            } catch (e) {
                console.error("Publish error:", e);
                showModalMsg("送信に失敗しました。Firebaseの設定をご確認ください。");
            }
        };

        window.saveMyArt = async function(userKey) {
            if (!auth.currentUser) {
                await initAuth();
            }
            const dataUrl = getMergedCanvasDataURL(userKey);
            try {
                if (!auth.currentUser) {
                    showModalMsg("Firebase ConsoleでAuthentication（匿名認証）を有効化すると履歴保存が可能になります。");
                    return;
                }
                const colRef = collection(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'my_artworks');
                await addDoc(colRef, {
                    image: dataUrl,
                    createdAt: new Date().toISOString(),
                    user: userKey
                });
                showModalMsg("作品をマイ履歴に保存しました！", 'success');
            } catch(e) {
                console.error("Save error:", e);
                showModalMsg("保存に失敗しました。");
            }
        };

        window.openHistoryModal = async function() {
            if (!auth.currentUser) {
                await initAuth();
            }
            openModal('history-modal');
            const listContainer = document.getElementById('history-list');
            listContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-8">読み込み中...</p>';

            try {
                if (!auth.currentUser) {
                    listContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-8">Firebase ConsoleでAuthentication（匿名認証）を有効化してください。</p>';
                    return;
                }
                const colRef = collection(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'my_artworks');
                const snapshot = await getDocs(colRef);
                listContainer.innerHTML = '';
                if(snapshot.empty) {
                    listContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-8">保存された作品はありません</p>';
                    return;
                }
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = "flex items-center justify-between p-3 bg-slate-900 border border-slate-800 rounded-2xl shadow-sm";
                    card.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <img src="${data.image}" class="w-16 h-16 object-cover rounded-xl border border-slate-700 shadow-sm bg-slate-950">
                            <div>
                                <p class="text-xs font-bold text-slate-200">${new Date(data.createdAt).toLocaleString()}</p>
                                <span class="text-[10px] bg-indigo-950 text-indigo-400 border border-indigo-800 px-2 py-0.5 rounded-full font-bold">${data.user} の作品</span>
                            </div>
                        </div>
                        <a href="${data.image}" download="canvas_share_${data.user}.png" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow">ダウンロード</a>
                    `;
                    listContainer.appendChild(card);
                });
            } catch(e) {
                console.error("History error:", e);
                listContainer.innerHTML = '<p class="text-xs text-red-400 text-center py-8">履歴の読み込みに失敗しました</p>';
            }
        };

        function subscribeSharedCanvases() {
            ['user1', 'user2'].forEach(userKey => {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', `shared_${userKey}`);
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        const statusEl = document.getElementById(`${userKey}-status`);
                        statusEl.textContent = `最終更新: ${new Date(data.updatedAt).toLocaleTimeString()}`;
                    }
                }, (error) => {
                    console.warn("Snapshot subscription error (check Firebase config):", error);
                });
            });
        }

        window.addEventListener('load', async () => {
            await initAuth();
            initWorkspace('user1');
            initWorkspace('user2');
            subscribeSharedCanvases();
        });
    </script>
