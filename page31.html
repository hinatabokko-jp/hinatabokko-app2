<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Share</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#020617',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            touch-action: none;
        }
        .checkerboard {
            background-image: 
                linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            background-color: #0f172a;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        /* スマホ縦持ち時に全体が収まるようにコンパクト化 & 横並び最適化 */
        @media (max-width: 1024px) {
            main {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                padding: 4px;
                max-width: 100vw;
            }
            .canvas-wrapper-container {
                max-height: 160px;
            }
        }
        @media (max-width: 768px) {
            body {
                font-size: 11px;
            }
            header {
                padding: 6px 10px;
            }
            main {
                grid-template-columns: 1fr;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="bg-dark-900 border-b border-dark-800 px-4 py-2.5 flex items-center justify-between shadow-lg shrink-0 z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg flex items-center justify-center w-9 h-9">
                <i class="fa-solid fa-palette text-base"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm sm:text-base text-slate-100 flex items-center gap-2">
                    Canvas Share <span class="text-[10px] bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded-full border border-indigo-500/30">メッセージ送信スタイル</span>
                </h1>
                <p class="text-[11px] text-slate-400 hidden sm:block">描いた後に「反映」ボタンを押してキャンバスを共有</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button id="help-btn" class="px-2.5 py-1.5 rounded-xl bg-dark-800 hover:bg-dark-700 border border-dark-700 text-slate-300 text-xs font-medium transition flex items-center gap-1.5">
                <i class="fa-solid fa-circle-question text-indigo-400"></i>
                <span class="hidden sm:inline">使い方</span>
            </button>
            <button id="view-history-tab-btn" class="px-2.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/20">
                <i class="fa-solid fa-box-archive"></i>
                <span>保存済み (<span id="stamp-count">0</span>)</span>
            </button>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 w-full px-2 sm:px-4 py-3 grid grid-cols-1 lg:grid-cols-2 gap-3 items-start max-w-[1500px] mx-auto">
        
        <!-- ================= プレイヤーA (左側) ================= -->
        <div class="bg-dark-900 border border-dark-800 rounded-3xl p-3 sm:p-4 shadow-xl flex flex-col gap-2.5 relative w-full">
            <div class="flex items-center justify-between pb-1.5 border-b border-dark-800">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span>
                    <h2 class="font-bold text-xs sm:text-sm text-slate-100">プレイヤー 1 (User A)</h2>
                </div>
                <div class="flex items-center gap-1.5">
                    <button class="undo-btn-a p-1.5 rounded-lg bg-dark-800 hover:bg-dark-700 border border-dark-700 text-slate-300 text-xs transition disabled:opacity-40" title="1つ戻す">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                    <button class="redo-btn-a p-1.5 rounded-lg bg-dark-800 hover:bg-dark-700 border border-dark-700 text-slate-300 text-xs transition disabled:opacity-40" title="やり直す">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                    <button class="clear-btn-a p-1.5 rounded-lg bg-dark-800 hover:bg-red-500/20 hover:text-red-400 border border-dark-700 text-slate-300 text-xs transition" title="全消去">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>

            <div class="flex flex-col items-center w-full overflow-hidden">
                <div class="relative w-full max-w-[500px] aspect-[4/3] checkerboard rounded-2xl shadow-inner border border-dark-800 overflow-hidden flex items-center justify-center cursor-crosshair canvas-wrapper-a" data-user="a"></div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 bg-dark-950/60 p-2.5 rounded-2xl border border-dark-800">
                <div class="flex items-center gap-2 justify-between">
                    <button onclick="openBrushModalFor('a')" class="flex-1 bg-dark-800 hover:bg-dark-700 border border-dark-700 text-slate-200 py-2 px-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-brush text-indigo-400"></i><span>ブラシ設定</span>
                    </button>
                    <button onclick="openBrushModalFor('a')" class="bg-dark-800 hover:bg-dark-700 border border-dark-700 px-2.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm" title="色の設定">
                        <span id="color-indicator-a" class="w-3.5 h-3.5 rounded-full border border-slate-600 shadow-inner inline-block" style="background-color: #ec4899;"></span>
                        <i class="fa-solid fa-gear text-slate-400 text-[10px]"></i>
                    </button>
                    <button onclick="openLayerModalFor('a')" class="bg-dark-800 hover:bg-dark-700 border border-dark-700 text-slate-200 py-2 px-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm" title="レイヤー">
                        <i class="fa-solid fa-layer-group text-indigo-400"></i>
                    </button>
                </div>
                <div class="grid grid-cols-3 gap-1 bg-dark-900 p-1 rounded-xl border border-dark-800">
                    <button data-tool="brush" class="tool-btn-a p-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold flex items-center justify-center gap-1 transition shadow"><i class="fa-solid fa-pen"><span>ペン</span></i></button>
                    <button data-tool="bucket" class="tool-btn-a p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-dark-800 text-xs font-bold flex items-center justify-center gap-1 transition"><i class="fa-solid fa-fill-drip"><span>ペンキ</span></i></button>
                    <button data-tool="eraser" class="tool-btn-a p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-dark-800 text-xs font-bold flex items-center justify-center gap-1 transition"><i class="fa-solid fa-eraser"><span>消ゴム</span></i></button>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button class="sync-btn-a flex-1 py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-xs shadow-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> 描画を「反映」する
                </button>
                <input type="text" class="stamp-title-a w-1/3 bg-dark-950 border border-dark-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="作品名">
                <button class="save-btn-a py-2.5 px-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-xs shadow-lg transition flex items-center gap-1">
                    <i class="fa-solid fa-floppy-disk"></i> 保存
                </button>
            </div>
        </div>

        <!-- ================= プレイヤーB (右側) ================= -->
        <div class="bg-dark-900 border border-dark-800 rounded-3xl p-3 sm:p-4 shadow-xl flex flex-col gap-2.5 relative w-full">
            <div class="flex items-center justify-between pb-1.5 border-b border-dark-800">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-pink-500 animate-pulse"></span>
                    <h2 class="font-bold text-xs sm:text-sm text-slate-100">プレイヤー 2 (User B)</h2>
                </div>
                <div class="flex items-center gap-1.5">
                    <button class="undo-btn-b p-1.5 rounded-lg bg-dark-800 hover:bg-dark-700 border border-dark-700 text-slate-300 text-xs transition disabled:opacity-40" title="1つ戻す">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                    <button class="redo-btn-b p-1.5 rounded-lg bg-dark-800 hover:bg-dark-700 border border-dark-700 text-slate-300 text-xs transition disabled:opacity-40" title="やり直す">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                    <button class="clear-btn-b p-1.5 rounded-lg bg-dark-800 hover:bg-red-500/20 hover:text-red-400 border border-dark-700 text-slate-300 text-xs transition" title="全消去">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>

            <div class="flex flex-col items-center w-full overflow-hidden">
                <div class="relative w-full max-w-[500px] aspect-[4/3] checkerboard rounded-2xl shadow-inner border border-dark-800 overflow-hidden flex items-center justify-center cursor-crosshair canvas-wrapper-b" data-user="b"></div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 bg-dark-950/60 p-2.5 rounded-2xl border border-dark-800">
                <div class="flex items-center gap-2 justify-between">
                    <button onclick="openBrushModalFor('b')" class="flex-1 bg-dark-800 hover:bg-dark-700 border border-dark-700 text-slate-200 py-2 px-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-brush text-pink-400"></i><span>ブラシ設定</span>
                    </button>
                    <button onclick="openBrushModalFor('b')" class="bg-dark-800 hover:bg-dark-700 border border-dark-700 px-2.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm" title="色の設定">
                        <span id="color-indicator-b" class="w-3.5 h-3.5 rounded-full border border-slate-600 shadow-inner inline-block" style="background-color: #6366f1;"></span>
                        <i class="fa-solid fa-gear text-slate-400 text-[10px]"></i>
                    </button>
                    <button onclick="openLayerModalFor('b')" class="bg-dark-800 hover:bg-dark-700 border border-dark-700 text-slate-200 py-2 px-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm" title="レイヤー">
                        <i class="fa-solid fa-layer-group text-pink-400"></i>
                    </button>
                </div>
                <div class="grid grid-cols-3 gap-1 bg-dark-900 p-1 rounded-xl border border-dark-800">
                    <button data-tool="brush" class="tool-btn-b p-1.5 rounded-lg bg-pink-600 text-white text-xs font-bold flex items-center justify-center gap-1 transition shadow"><i class="fa-solid fa-pen"><span>ペン</span></i></button>
                    <button data-tool="bucket" class="tool-btn-b p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-dark-800 text-xs font-bold flex items-center justify-center gap-1 transition"><i class="fa-solid fa-fill-drip"><span>ペンキ</span></i></button>
                    <button data-tool="eraser" class="tool-btn-b p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-dark-800 text-xs font-bold flex items-center justify-center gap-1 transition"><i class="fa-solid fa-eraser"><span>消ゴム</span></i></button>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button class="sync-btn-b flex-1 py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-xs shadow-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> 描画を「反映」する
                </button>
                <input type="text" class="stamp-title-b w-1/3 bg-dark-950 border border-dark-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-pink-500" placeholder="作品名">
                <button class="save-btn-b py-2.5 px-3 bg-pink-600 hover:bg-pink-500 text-white rounded-xl font-bold text-xs shadow-lg transition flex items-center gap-1">
                    <i class="fa-solid fa-floppy-disk"></i> 保存
                </button>
            </div>
        </div>

    </main>

    <!-- Modals (Brush, Layer, History, Help) -->
    <div id="brush-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-dark-900 border border-dark-800 rounded-3xl shadow-2xl max-w-4xl w-full p-5 space-y-3 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-dark-800 pb-2.5">
                <h3 class="font-bold text-slate-200 text-sm sm:text-base"><i class="fa-solid fa-palette text-indigo-400 mr-2"></i>ブラシ・スタイル・色の設定</h3>
                <button onclick="closeModal('brush-modal')" class="text-slate-400 hover:text-slate-200 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-start">
                <div class="md:col-span-7 space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">ブラシの形状</label>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2" id="brush-shapes-grid">
                            <button onclick="setBrushShape('normal')" id="shape-normal" class="p-2 rounded-xl border border-indigo-500 bg-indigo-950/60 text-indigo-300 text-xs font-bold text-left transition flex items-center space-x-2"><i class="fa-solid fa-pen"></i><span>標準ペン</span></button>
                            <button onclick="setBrushShape('calligraphy')" id="shape-calligraphy" class="p-2 rounded-xl border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2"><i class="fa-solid fa-pen-nib"></i><span>カリグラフィ</span></button>
                            <button onclick="setBrushShape('airbrush')" id="shape-airbrush" class="p-2 rounded-xl border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2"><i class="fa-solid fa-spray-can"></i><span>エアブラシ</span></button>
                            <button onclick="setBrushShape('crayon')" id="shape-crayon" class="p-2 rounded-xl border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2"><i class="fa-solid fa-marker"></i><span>クレヨン</span></button>
                            <button onclick="setBrushShape('marker')" id="shape-marker" class="p-2 rounded-xl border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2"><i class="fa-solid fa-highlighter"></i><span>マーカー</span></button>
                            <button onclick="setBrushShape('pencil')" id="shape-pencil" class="p-2 rounded-xl border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2"><i class="fa-solid fa-pencil"></i><span>鉛筆</span></button>
                            <button onclick="setBrushShape('watercolor')" id="shape-watercolor" class="p-2 rounded-xl border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2"><i class="fa-solid fa-droplet"></i><span>水彩ブラシ</span></button>
                            <button onclick="setBrushShape('brush')" id="shape-brush" class="p-2 rounded-xl border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2"><i class="fa-solid fa-paintbrush"></i><span>毛筆</span></button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">カラー選択</label>
                        <div class="flex items-center space-x-3">
                            <input type="color" id="modal-color" class="w-10 h-10 rounded-xl border border-dark-700 cursor-pointer p-0 bg-transparent" value="#ec4899" onchange="setBrushColor(this.value)">
                            <div class="flex gap-1.5 flex-wrap flex-1">
                                <button onclick="setBrushColor('#ffffff')" class="w-6 h-6 rounded-full bg-white border border-slate-600 shadow-sm"></button>
                                <button onclick="setBrushColor('#ef4444')" class="w-6 h-6 rounded-full bg-red-500 border border-dark-700 shadow-sm"></button>
                                <button onclick="setBrushColor('#f59e0b')" class="w-6 h-6 rounded-full bg-amber-500 border border-dark-700 shadow-sm"></button>
                                <button onclick="setBrushColor('#10b981')" class="w-6 h-6 rounded-full bg-emerald-500 border border-dark-700 shadow-sm"></button>
                                <button onclick="setBrushColor('#6366f1')" class="w-6 h-6 rounded-full bg-indigo-500 border border-dark-700 shadow-sm"></button>
                                <button onclick="setBrushColor('#ec4899')" class="w-6 h-6 rounded-full bg-pink-500 border border-dark-700 shadow-sm"></button>
                                <button onclick="setBrushColor('#000000')" class="w-6 h-6 rounded-full bg-black border border-dark-700 shadow-sm"></button>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-xs font-bold text-slate-400">ブラシの太さ</label>
                                <span id="brush-size-val" class="text-xs font-bold text-indigo-400">8px</span>
                            </div>
                            <input type="range" id="modal-size" min="1" max="40" value="8" class="w-full accent-indigo-500 bg-dark-800" oninput="setBrushSize(this.value)">
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-xs font-bold text-slate-400">不透明度</label>
                                <span id="brush-opacity-val" class="text-xs font-bold text-indigo-400">100%</span>
                            </div>
                            <input type="range" id="modal-opacity" min="0.05" max="1" step="0.05" value="1" class="w-full accent-indigo-500 bg-dark-800" oninput="setBrushOpacity(this.value)">
                        </div>
                    </div>
                </div>
                <div class="md:col-span-5 flex flex-col gap-2 bg-dark-950 p-3.5 rounded-2xl border border-dark-800">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-slate-300 flex items-center gap-1.5"><i class="fa-solid fa-pencil text-indigo-400"></i> 試し描き</label>
                        <button onclick="clearTestCanvas()" class="text-[11px] text-slate-400 hover:text-red-400 transition flex items-center gap-1 px-2 py-1 rounded bg-dark-800"><i class="fa-solid fa-rotate-right"></i> クリア</button>
                    </div>
                    <div class="relative w-full aspect-[4/3] checkerboard rounded-xl border border-dark-800 overflow-hidden flex items-center justify-center" id="test-canvas-wrapper">
                        <canvas id="test-canvas" class="absolute inset-0 w-full h-full touch-none"></canvas>
                    </div>
                </div>
            </div>
            <button onclick="closeModal('brush-modal')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl font-bold text-xs sm:text-sm shadow transition">決定する</button>
        </div>
    </div>

    <div id="layer-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-dark-900 border border-dark-800 rounded-3xl shadow-2xl max-w-md w-full p-5 space-y-4">
            <div class="flex justify-between items-center border-b border-dark-800 pb-2.5">
                <h3 class="font-bold text-slate-200 text-sm sm:text-base"><i class="fa-solid fa-layer-group text-indigo-400 mr-2"></i>レイヤーマネージャー</h3>
                <button onclick="closeModal('layer-modal')" class="text-slate-400 hover:text-slate-200 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-400">アクティブレイヤー</span>
                    <button onclick="addNewLayer()" class="bg-dark-800 hover:bg-dark-700 text-indigo-400 border border-dark-700 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1"><i class="fa-solid fa-plus"></i><span>新規レイヤー</span></button>
                </div>
                <div id="layer-list-container" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
            </div>
            <button onclick="closeModal('layer-modal')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl font-bold text-xs sm:text-sm shadow transition">閉じる</button>
        </div>
    </div>

    <!-- 保存済み作品モーダル -->
    <div id="history-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-dark-900 border border-dark-800 rounded-3xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-3.5 border-b border-dark-800 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="p-2 bg-indigo-500/20 text-indigo-400 rounded-xl"><i class="fa-solid fa-box-archive text-sm"></i></div>
                    <div>
                        <h2 class="font-bold text-sm sm:text-base text-slate-100">保存済み作品一覧</h2>
                        <p class="text-[11px] text-slate-400">キャンバスへの復元・ダウンロード・削除を行えます</p>
                    </div>
                </div>

    <script>
        // ==========================================
        // Firebase 設定 (反映済)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDKrAD162EYHWzB6hTR2vYUuQ7M41RjT8g",
            authDomain: "canvas-share-b0784.firebaseapp.com",
            databaseURL: "https://canvas-share-b0784-default-rtdb.firebaseio.com",
            projectId: "canvas-share-b0784",
            storageBucket: "canvas-share-b0784.firebasestorage.app",
            messagingSenderId: "1034578016604",
            appId: "1:1034578016604:web:79fefa67439c2a32cee999",
            measurementId: "G-DWMNPSFTVB"
        };

        let db = null;
        try {
            if (firebaseConfig.apiKey && !firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
            }
        } catch (e) {
            console.log("Firebase初期化エラー:", e);
        }

        const canvasWidth = 512;
        const canvasHeight = 384;
        let currentActiveUser = 'a';

        const workspaces = {
            a: {
                color: '#ec4899',
                size: 8,
                opacity: 1,
                shape: 'normal',
                tool: 'brush',
                layers: [
                    { id: 1, name: 'レイヤー 1', visible: true, opacity: 1, canvas: null, ctx: null }
                ],
                activeLayerId: 1,
                history: [],
                redoStack: []
            },
            b: {
                color: '#6366f1',
                size: 8,
                opacity: 1,
                shape: 'normal',
                tool: 'brush',
                layers: [
                    { id: 1, name: 'レイヤー 1', visible: true, opacity: 1, canvas: null, ctx: null }
                ],
                activeLayerId: 1,
                history: [],
                redoStack: []
            }
        };

        function initWorkspace(prefix) {
            const ws = workspaces[prefix];
            const container = document.querySelector(`.canvas-wrapper-${prefix}`);
            if (!container) return;
            container.innerHTML = '';

            ws.layers.forEach((layer) => {
                const cvs = document.createElement('canvas');
                cvs.className = `absolute inset-0 w-full h-full touch-none ${layer.visible ? '' : 'hidden'}`;
                cvs.width = canvasWidth;
                cvs.height = canvasHeight;
                cvs.style.opacity = layer.opacity;
                container.appendChild(cvs);
                layer.canvas = cvs;
                layer.ctx = cvs.getContext('2d', { willReadFrequently: true });
            });

            if (ws.history.length > 0) {
                const latest = ws.history[ws.history.length - 1];
                ws.layers.forEach((l, idx) => {
                    if (latest[idx]) l.ctx.putImageData(latest[idx], 0, 0);
                });
            } else {
                saveState(prefix);
            }

            if (!container.dataset.initialized) {
                setupDrawingEvents(prefix, container);
                container.dataset.initialized = "true";
            }

            // Firebaseから「反映」された最新データを受信監視
            if (db) {
                listenSyncedCanvas(prefix);
            }
        }

        // メッセージ送信方式：Firebaseから最新の同期画像を受信してキャンバスに描画する
        function listenSyncedCanvas(prefix) {
            const syncRef = db.ref(`canvas_share_message_rooms/room_v1/${prefix}/syncedImage`);
            syncRef.on('value', (snapshot) => {
                const dataUrl = snapshot.val();
                if (!dataUrl) return;

                const ws = workspaces[prefix];
                const img = new Image();
                img.onload = () => {
                    if (ws.layers[0] && ws.layers[0].ctx) {
                        ws.layers[0].ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                        ws.layers[0].ctx.drawImage(img, 0, 0);
                        saveState(prefix);
                    }
                };
                img.src = dataUrl;
            });
        }

        // 「反映」ボタンが押されたとき、現在のキャンバス画像をFirebaseに送信する
        function sendSyncCanvas(prefix) {
            const ws = workspaces[prefix];
            const tempCvs = document.createElement('canvas');
            tempCvs.width = canvasWidth; tempCvs.height = canvasHeight;
            const tCtx = tempCvs.getContext('2d');
            ws.layers.forEach(l => {
                if (l.visible && l.canvas) {
                    tCtx.globalAlpha = l.opacity;
                    tCtx.drawImage(l.canvas, 0, 0);
                }
            });

            const dataUrl = tempCvs.toDataURL('image/png');

            if (db) {
                db.ref(`canvas_share_message_rooms/room_v1/${prefix}/syncedImage`).set(dataUrl)
                    .then(() => {
                        alert(`プレイヤー${prefix.toUpperCase()}のキャンバスを反映しました！`);
                    })
                    .catch((err) => {
                        alert("反映に失敗しました: " + err.message);
                    });
            } else {
                alert("Firebaseが設定されていないため、この環境では同期されません。");
            }
        }

        function setupDrawingEvents(prefix, wrapper) {
            let isDrawing = false;
            let lastX = 0, lastY = 0;
            let lastSpeed = 0;

            const getCoords = (e) => {
                const rect = wrapper.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: Math.floor((clientX - rect.left) * (canvasWidth / rect.width)),
                    y: Math.floor((clientY - rect.top) * (canvasHeight / rect.height))
                };
            };

            const startDraw = (e) => {
                const coords = getCoords(e);
                const ws = workspaces[prefix];
                if (ws.tool === 'bucket') {
                    saveState(prefix);
                    floodFill(prefix, coords.x, coords.y, ws.color, ws.opacity);
                    return;
                }
                saveState(prefix);
                isDrawing = true;
                lastX = coords.x;
                lastY = coords.y;
                lastSpeed = 0;
                drawPoint(prefix, coords.x, coords.y);
            };

            const moveDraw = (e) => {
                if (!isDrawing) return;
                const coords = getCoords(e);
                const ws = workspaces[prefix];
                const activeLayer = ws.layers.find(l => l.id === ws.activeLayerId);
                if (!activeLayer || !activeLayer.visible) return;

                const dx = coords.x - lastX;
                const dy = coords.y - lastY;
                const speed = Math.hypot(dx, dy);
                const currentSpeed = lastSpeed * 0.7 + speed * 0.3;
                lastSpeed = currentSpeed;

                renderBrushStroke(ws, activeLayer.ctx, lastX, lastY, coords.x, coords.y, currentSpeed);
                lastX = coords.x;
                lastY = coords.y;
            };

            const endDraw = () => { isDrawing = false; lastSpeed = 0; };

            wrapper.addEventListener('mousedown', startDraw);
            wrapper.addEventListener('mousemove', moveDraw);
            window.addEventListener('mouseup', endDraw);
            wrapper.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); }, { passive: false });
            wrapper.addEventListener('touchmove', (e) => { e.preventDefault(); moveDraw(e); }, { passive: false });
            window.addEventListener('touchend', endDraw);
        }

        function drawPoint(prefix, x, y) {
            const ws = workspaces[prefix];
            const activeLayer = ws.layers.find(l => l.id === ws.activeLayerId);
            if (!activeLayer || !activeLayer.visible) return;
            renderBrushStroke(ws, activeLayer.ctx, x, y, x, y, 0);
        }

        function renderBrushStroke(ws, ctx, x1, y1, x2, y2, speed = 5) {
            ctx.save();
            ctx.globalAlpha = ws.opacity;

            if (ws.tool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
                ctx.lineWidth = ws.size;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.restore();
                return;
            }

            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = ws.color;
            ctx.fillStyle = ws.color;

            switch (ws.shape) {
                case 'calligraphy':
                    ctx.lineWidth = ws.size;
                    ctx.lineCap = 'square';
                    ctx.beginPath();
                    ctx.moveTo(x1 - ws.size/3, y1 + ws.size/3);
                    ctx.lineTo(x2 - ws.size/3, y2 + ws.size/3);
                    ctx.stroke();
                    break;
                case 'airbrush':
                    const dist = Math.hypot(x2 - x1, y2 - y1);
                    const steps = Math.max(1, Math.floor(dist));
                    for (let i = 0; i <= steps; i++) {
                        const cx = x1 + (x2 - x1) * (i / steps);
                        const cy = y1 + (y2 - y1) * (i / steps);
                        for (let j = 0; j < 6; j++) {
                            const angle = Math.random() * Math.PI * 2;
                            const r = Math.random() * (ws.size * 1.2);
                            ctx.fillRect(cx + Math.cos(angle)*r, cy + Math.sin(angle)*r, 1.2, 1.2);
                        }
                    }
                    break;
                case 'crayon':
                    ctx.lineWidth = ws.size;
                    ctx.lineCap = 'round';
                    ctx.setLineDash([2, 2]);
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    break;
                case 'marker':
                    ctx.globalAlpha = ws.opacity * 0.7;
                    ctx.lineWidth = ws.size * 1.6;
                    ctx.lineCap = 'butt';
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    break;
                case 'pencil':
                    ctx.globalAlpha = ws.opacity * 0.8;
                    ctx.lineWidth = Math.max(1, ws.size * 0.4);
                    ctx.beginPath();
                    ctx.moveTo(x1 + (Math.random()-0.5)*1.5, y1 + (Math.random()-0.5)*1.5);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    break;
                case 'watercolor':
                    ctx.globalAlpha = ws.opacity * 0.25;
                    for (let wOff = -ws.size/2; wOff <= ws.size/2; wOff += 3) {
                        ctx.beginPath();
                        ctx.moveTo(x1 + wOff, y1);
                        ctx.lineTo(x2 + wOff, y2);
                        ctx.lineWidth = 2.5;
                        ctx.stroke();
                    }
                    break;
                case 'brush':
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    const dynamicSize = Math.max(1.5, ws.size * Math.max(0.2, 1.8 - Math.min(speed * 0.08, 1.2)));
                    ctx.lineWidth = dynamicSize;
                    ctx.globalAlpha = Math.min(1, ws.opacity * (1.1 - Math.min(speed * 0.03, 0.4)));
                    
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();

                    if (ws.size > 4) {
                        ctx.globalAlpha *= 0.4;
                        ctx.lineWidth = dynamicSize * 0.5;
                        ctx.beginPath();
                        ctx.moveTo(x1 + 0.8, y1 + 0.8);
                        ctx.lineTo(x2 + 0.8, y2 + 0.8);
                        ctx.stroke();
                    }
                    break;
                default:
                    ctx.lineWidth = ws.size;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    break;
            }
            ctx.restore();
        }

        function floodFill(prefix, startX, startY, fillColorHex, opacity) {
            const ws = workspaces[prefix];
            const activeLayer = ws.layers.find(l => l.id === ws.activeLayerId);
            if (!activeLayer) return;
            const ctx = activeLayer.ctx;
            const imgData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
            const data = imgData.data;
            const startIdx = (startY * canvasWidth + startX) * 4;
            const startR = data[startIdx], startG = data[startIdx + 1], startB = data[startIdx + 2], startA = data[startIdx + 3];

            const r = parseInt(fillColorHex.slice(1, 3), 16);
            const g = parseInt(fillColorHex.slice(3, 5), 16);
            const b = parseInt(fillColorHex.slice(5, 7), 16);
            if (startR === r && startG === g && startB === b) return;

            const queue = [[startX, startY]];
            const visited = new Uint8Array(canvasWidth * canvasHeight);

            while (queue.length > 0) {
                const [x, y] = queue.pop();
                if (x < 0 || x >= canvasWidth || y < 0 || y >= canvasHeight) continue;
                const idx = y * canvasWidth + x;
                if (visited[idx]) continue;
                visited[idx] = 1;

                const currIdx = idx * 4;
                if (data[currIdx] === startR && data[currIdx+1] === startG && data[currIdx+2] === startB && data[currIdx+3] === startA) {
                    data[currIdx] = r; data[currIdx+1] = g; data[currIdx+2] = b; data[currIdx+3] = Math.round(opacity * 255);
                    queue.push([x+1, y], [x-1, y], [x, y+1], [x, y-1]);
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function saveState(prefix) {
            const ws = workspaces[prefix];
            const snapshot = ws.layers.map(l => {
                if (l.ctx) {
                    return l.ctx.getImageData(0, 0, canvasWidth, canvasHeight);
                }
                return null;
            });
            ws.history.push(snapshot);
            if (ws.history.length > 20) ws.history.shift();
            ws.redoStack = [];
            updateUndoRedoButtons(prefix);
        }

        function updateUndoRedoButtons(prefix) {
            const ws = workspaces[prefix];
            const undoBtn = document.querySelector(`.undo-btn-${prefix}`);
            const redoBtn = document.querySelector(`.redo-btn-${prefix}`);
            if (undoBtn) undoBtn.disabled = ws.history.length <= 1;
            if (redoBtn) redoBtn.disabled = ws.redoStack.length === 0;
        }

        function updateColorIndicator(prefix) {
            const ws = workspaces[prefix];
            const indicator = document.getElementById(`color-indicator-${prefix}`);
            if (indicator) {
                indicator.style.backgroundColor = ws.color;
            }
        }

        ['a', 'b'].forEach(prefix => {
            const undoBtn = document.querySelector(`.undo-btn-${prefix}`);
            const redoBtn = document.querySelector(`.redo-btn-${prefix}`);
            const clearBtn = document.querySelector(`.clear-btn-${prefix}`);
            const syncBtn = document.querySelector(`.sync-btn-${prefix}`);
            const saveBtn = document.querySelector(`.save-btn-${prefix}`);

            if (undoBtn) {
                undoBtn.addEventListener('click', () => {
                    const ws = workspaces[prefix];
                    if (ws.history.length <= 1) return;
                    ws.redoStack.push(ws.history.pop());
                    const prev = ws.history[ws.history.length - 1];
                    ws.layers.forEach((l, idx) => { if (prev[idx]) l.ctx.putImageData(prev[idx], 0, 0); });
                    updateUndoRedoButtons(prefix);
                });
            }

            if (redoBtn) {
                redoBtn.addEventListener('click', () => {
                    const ws = workspaces[prefix];
                    if (ws.redoStack.length === 0) return;
                    const next = ws.redoStack.pop();
                    ws.history.push(next);
                    ws.layers.forEach((l, idx) => { if (next[idx]) l.ctx.putImageData(next[idx], 0, 0); });
                    updateUndoRedoButtons(prefix);
                });
            }

            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    saveState(prefix);
                    workspaces[prefix].layers.forEach(l => l.ctx.clearRect(0, 0, canvasWidth, canvasHeight));
                });
            }

            // 「反映」ボタンを押したときのイベント
            if (syncBtn) {
                syncBtn.addEventListener('click', () => {
                    sendSyncCanvas(prefix);
                });
            }

            document.querySelectorAll(`.tool-btn-${prefix}`).forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll(`.tool-btn-${prefix}`).forEach(b => {
                        b.classList.remove('bg-indigo-600', 'bg-pink-600', 'text-white', 'shadow');
                        b.classList.add('text-slate-400', 'hover:text-white', 'hover:bg-dark-800');
                    });
                    btn.classList.add(prefix === 'a' ? 'bg-indigo-600' : 'bg-pink-600', 'text-white', 'shadow');
                    btn.classList.remove('text-slate-400', 'hover:text-white', 'hover:bg-dark-800');
                    workspaces[prefix].tool = btn.getAttribute('data-tool');
                });
            });

            if (saveBtn) {
                saveBtn.addEventListener('click', () => {
                    const titleInput = document.querySelector(`.stamp-title-${prefix}`);
                    const title = titleInput ? titleInput.value.trim() || `作品 (${prefix.toUpperCase()})` : `作品 (${prefix.toUpperCase()})`;
                    const ws = workspaces[prefix];
                    const tempCvs = document.createElement('canvas');
                    tempCvs.width = canvasWidth; tempCvs.height = canvasHeight;
                    const tCtx = tempCvs.getContext('2d');
                    ws.layers.forEach(l => {
                        if (l.visible && l.canvas) {
                            tCtx.globalAlpha = l.opacity;
                            tCtx.drawImage(l.canvas, 0, 0);
                        }
                    });

                    const stamps = JSON.parse(localStorage.getItem('canvas_share_artworks') || '[]');
                    stamps.unshift({ id: Date.now(), title, dataUrl: tempCvs.toDataURL('image/png'), date: new Date().toLocaleDateString() });
                    localStorage.setItem('canvas_share_artworks', JSON.stringify(stamps));
                    updateStampCount();
                    alert(`作品「${title}」を保存しました！`);
                });
            }
        });

        // Test Canvas setup in Brush Modal
        let testCanvas, testCtx;
        const testWidth = 300;
        const testHeight = 225;

        function initTestCanvas() {
            testCanvas = document.getElementById('test-canvas');
            if (!testCanvas) return;
            testCanvas.width = testWidth;
            testCanvas.height = testHeight;
            testCtx = testCanvas.getContext('2d', { willReadFrequently: true });

            const wrapper = document.getElementById('test-canvas-wrapper');
            if (!wrapper || wrapper.dataset.initialized) return;

            let isTestDrawing = false;
            let lastX = 0, lastY = 0;
            let lastSpeed = 0;

            const getCoords = (e) => {
                const rect = wrapper.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: Math.floor((clientX - rect.left) * (testWidth / rect.width)),
                    y: Math.floor((clientY - rect.top) * (testHeight / rect.height))
                };
            };

            const start = (e) => {
                const coords = getCoords(e);
                isTestDrawing = true;
                lastX = coords.x;
                lastY = coords.y;
                lastSpeed = 0;
                renderBrushStroke(workspaces[currentActiveUser], testCtx, coords.x, coords.y, coords.x, coords.y, 0);
            };

            const move = (e) => {
                if (!isTestDrawing) return;
                const coords = getCoords(e);
                const ws = workspaces[currentActiveUser];
                const dx = coords.x - lastX;
                const dy = coords.y - lastY;
                const speed = Math.hypot(dx, dy);
                const currentSpeed = lastSpeed * 0.7 + speed * 0.3;
                lastSpeed = currentSpeed;

                renderBrushStroke(ws, testCtx, lastX, lastY, coords.x, coords.y, currentSpeed);
                lastX = coords.x;
                lastY = coords.y;
            };

            const end = () => { isTestDrawing = false; lastSpeed = 0; };

            wrapper.addEventListener('mousedown', start);
            wrapper.addEventListener('mousemove', move);
            window.addEventListener('mouseup', end);
            wrapper.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); }, { passive: false });
            wrapper.addEventListener('touchmove', (e) => { e.preventDefault(); move(e); }, { passive: false });
            window.addEventListener('touchend', end);

            wrapper.dataset.initialized = "true";
        }

        window.clearTestCanvas = function() {
            if (testCtx) {
                testCtx.clearRect(0, 0, testWidth, testHeight);
            }
        };

        window.openBrushModalFor = function(prefix) {
            currentActiveUser = prefix;
            const ws = workspaces[prefix];
            const modalColor = document.getElementById('modal-color');
            const modalSize = document.getElementById('modal-size');
            const sizeVal = document.getElementById('brush-size-val');
            const modalOpacity = document.getElementById('modal-opacity');
            const opacityVal = document.getElementById('brush-opacity-val');

            if (modalColor) modalColor.value = ws.color;
            if (modalSize) modalSize.value = ws.size;
            if (sizeVal) sizeVal.textContent = ws.size + 'px';
            if (modalOpacity) modalOpacity.value = ws.opacity;
            if (opacityVal) opacityVal.textContent = Math.round(ws.opacity * 100) + '%';
            
            updateBrushShapeUI(ws.shape);
            openModal('brush-modal');
            setTimeout(initTestCanvas, 50);
        };

        window.openLayerModalFor = function(prefix) {
            currentActiveUser = prefix;
            renderLayerList();
            openModal('layer-modal');
        };

        window.openModal = function(id) {
            const m = document.getElementById(id);
            if (m) m.classList.remove('hidden');
        };

        window.closeModal = function(id) {
            const m = document.getElementById(id);
            if (m) m.classList.add('hidden');
        };

        window.setBrushColor = function(color) {
            workspaces[currentActiveUser].color = color;
            const modalColor = document.getElementById('modal-color');
            if (modalColor) modalColor.value = color;
            updateColorIndicator(currentActiveUser);
        };

        window.setBrushSize = function(size) {
            workspaces[currentActiveUser].size = parseInt(size);
            const sizeVal = document.getElementById('brush-size-val');
            if (sizeVal) sizeVal.textContent = size + 'px';
        };

        window.setBrushOpacity = function(opacity) {
            workspaces[currentActiveUser].opacity = parseFloat(opacity);
            const opacityVal = document.getElementById('brush-opacity-val');
            if (opacityVal) opacityVal.textContent = Math.round(opacity * 100) + '%';
        };

        window.setBrushShape = function(shape) {
            workspaces[currentActiveUser].shape = shape;
            updateBrushShapeUI(shape);
        };

        function updateBrushShapeUI(activeShape) {
            ['normal', 'calligraphy', 'airbrush', 'crayon', 'marker', 'pencil', 'watercolor', 'brush'].forEach(s => {
                const btn = document.getElementById(`shape-${s}`);
                if (btn) {
                    if (s === activeShape) {
                        btn.className = "p-2 rounded-xl border border-indigo-500 bg-indigo-950/60 text-indigo-300 text-xs font-bold text-left transition flex items-center space-x-2";
                    } else {
                        btn.className = "p-2 rounded-xl border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 text-xs font-bold text-left transition flex items-center space-x-2";
                    }
                }
            });
        }

        window.renderLayerList = function() {
            const container = document.getElementById('layer-list-container');
            if (!container) return;
            const ws = workspaces[currentActiveUser];
            container.innerHTML = '';
            ws.layers.slice().reverse().forEach(layer => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-3 rounded-2xl border ${layer.id === ws.activeLayerId ? 'border-indigo-500 bg-indigo-950/40' : 'border-dark-800 bg-dark-900'}`;
                div.innerHTML = `
                    <div class="flex items-center space-x-3 flex-1">
                        <button onclick="toggleLayerVisibility(${layer.id})" class="text-slate-400 hover:text-slate-200">
                            <i class="fa-solid ${layer.visible ? 'fa-eye text-indigo-400' : 'fa-eye-slash'}"></i>
                        </button>
                        <span class="font-bold text-xs text-slate-300 flex-1">${layer.name}</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <input type="range" min="0" max="1" step="0.1" value="${layer.opacity}" oninput="changeLayerOpacity(${layer.id}, this.value)" class="w-20 accent-indigo-500 bg-dark-800">
                        <button onclick="setActiveLayer(${layer.id})" class="px-2.5 py-1 rounded-xl text-xs font-bold ${layer.id === ws.activeLayerId ? 'bg-indigo-600 text-white' : 'bg-dark-800 text-slate-300'}">選択</button>
                    </div>
                `;
                container.appendChild(div);
            });
        };

        window.addNewLayer = function() {
            const ws = workspaces[currentActiveUser];
            const newId = ws.layers.length + 1;
            ws.layers.push({ id: newId, name: `レイヤー ${newId}`, visible: true, opacity: 1, canvas: null, ctx: null });
            initWorkspace(currentActiveUser);
            renderLayerList();
        };

        window.setActiveLayer = function(id) {
            workspaces[currentActiveUser].activeLayerId = id;
            renderLayerList();
        };

        window.toggleLayerVisibility = function(id) {
            const ws = workspaces[currentActiveUser];
            const layer = ws.layers.find(l => l.id === id);
            if (layer) {
                layer.visible = !layer.visible;
                if (layer.canvas) {
                    layer.canvas.classList.toggle('hidden', !layer.visible);
                }
                renderLayerList();
            }
        };

        window.changeLayerOpacity = function(id, val) {
            const ws = workspaces[currentActiveUser];
            const layer = ws.layers.find(l => l.id === id);
            if (layer) {
                layer.opacity = val;
                if (layer.canvas) {
                    layer.canvas.style.opacity = val;
                }
            }
        };

        const historyModal = document.getElementById('history-modal');
        const savedStampsGrid = document.getElementById('saved-stamps-grid');
        const stampCountSpan = document.getElementById('stamp-count');

        function updateStampCount() {
            const stamps = JSON.parse(localStorage.getItem('canvas_share_artworks') || '[]');
            if (stampCountSpan) stampCountSpan.textContent = stamps.length;
        }

        // 保存済み作品の描画および操作ボタン機能
        function renderSavedStamps() {
            if (!savedStampsGrid) return;
            const stamps = JSON.parse(localStorage.getItem('canvas_share_artworks') || '[]');
            savedStampsGrid.innerHTML = '';
            if (stamps.length === 0) {
                savedStampsGrid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 text-xs">保存された作品はまだありません。</div>`;
                return;
            }
            stamps.forEach((s, index) => {
                const card = document.createElement('div');
                card.className = 'bg-dark-950 border border-dark-800 rounded-2xl p-3 flex flex-col items-center gap-2 relative shadow-md';
                card.innerHTML = `
                    <div class="w-full aspect-[4/3] checkerboard rounded-xl border border-dark-800 overflow-hidden flex items-center justify-center">
                        <img src="${s.dataUrl}" class="w-full h-full object-contain">
                    </div>
                    <div class="w-full flex justify-between items-center px-1">
                        <span class="text-xs font-bold text-slate-200 truncate flex-1">${s.title}</span>
                        <span class="text-[10px] text-slate-500">${s.date || ''}</span>
                    </div>
                    
                    <!-- アクションボタン群 -->
                    <div class="w-full flex flex-col gap-1.5 pt-1 border-t border-dark-800/80">
                        <div class="grid grid-cols-2 gap-1">
                            <button onclick="loadArtworkToCanvas(${s.id}, 'a')" class="px-2 py-1 bg-indigo-600/80 hover:bg-indigo-600 text-white text-[10px] font-bold rounded-lg transition flex items-center justify-center gap-1">
                                <i class="fa-solid fa-arrow-left"></i> P1に反映
                            </button>
                            <button onclick="loadArtworkToCanvas(${s.id}, 'b')" class="px-2 py-1 bg-pink-600/80 hover:bg-pink-600 text-white text-[10px] font-bold rounded-lg transition flex items-center justify-center gap-1">
                                P2に反映 <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                        <div class="grid grid-cols-2 gap-1">
                            <button onclick="downloadArtwork(${s.id})" class="px-2 py-1 bg-dark-800 hover:bg-dark-700 text-slate-300 text-[10px] font-bold rounded-lg transition flex items-center justify-center gap-1 border border-dark-700">
                                <i class="fa-solid fa-download text-emerald-400"></i> 保存
                            </button>
                            <button onclick="deleteSingleArtwork(${s.id})" class="px-2 py-1 bg-dark-800 hover:bg-red-500/20 text-slate-300 hover:text-red-400 text-[10px] font-bold rounded-lg transition flex items-center justify-center gap-1 border border-dark-700">
                                <i class="fa-solid fa-trash-can text-red-400"></i> 削除
                            </button>
                        </div>
                    </div>
                `;
                savedStampsGrid.appendChild(card);
            });
        }

        // 保存済み作品をキャンバスに反映（復元）する
        window.loadArtworkToCanvas = function(id, targetUser) {
            const stamps = JSON.parse(localStorage.getItem('canvas_share_artworks') || '[]');
            const artwork = stamps.find(item => item.id === id);
            if (!artwork) return;

            const ws = workspaces[targetUser];
            const img = new Image();
            img.onload = () => {
                if (ws.layers[0] && ws.layers[0].ctx) {
                    saveState(targetUser);
                    ws.layers[0].ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                    ws.layers[0].ctx.drawImage(img, 0, 0);
                    saveState(targetUser);
                    alert(`作品「${artwork.title}」をプレイヤー${targetUser.toUpperCase()}のキャンバスに読み込みました！`);
                    closeModal('history-modal');
                }
            };
            img.src = artwork.dataUrl;
        };

        // 保存済み作品をダウンロードする
        window.downloadArtwork = function(id) {
            const stamps = JSON.parse(localStorage.getItem('canvas_share_artworks') || '[]');
            const artwork = stamps.find(item => item.id === id);
            if (!artwork) return;

            const link = document.createElement('a');
            link.href = artwork.dataUrl;
            link.download = `${artwork.title || 'canvas_artwork'}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // 個別作品の削除
        window.deleteSingleArtwork = function(id) {
            let stamps = JSON.parse(localStorage.getItem('canvas_share_artworks') || '[]');
            const artwork = stamps.find(item => item.id === id);
            if (!artwork) return;

            if (confirm(`作品「${artwork.title}」を削除してもよろしいですか？`)) {
                stamps = stamps.filter(item => item.id !== id);
                localStorage.setItem('canvas_share_artworks', JSON.stringify(stamps));
                renderSavedStamps();
                updateStampCount();
            }
        };

        const historyBtn = document.getElementById('view-history-tab-btn');
        if (historyBtn) {
            historyBtn.addEventListener('click', () => { renderSavedStamps(); if (historyModal) historyModal.classList.remove('hidden'); });
        }

        const clearStampsBtn = document.getElementById('clear-all-stamps-btn');
        if (clearStampsBtn) {
            clearStampsBtn.addEventListener('click', () => {
                if (confirm('すべての保存作品を削除しますか？')) {
                    localStorage.removeItem('canvas_share_artworks');
                    renderSavedStamps();
                    updateStampCount();
                }
            });
        }

        const helpModal = document.getElementById('help-modal');
        const helpBtn = document.getElementById('help-btn');
        if (helpBtn && helpModal) {
            helpBtn.addEventListener('click', () => helpModal.classList.remove('hidden'));
        }

        // Initialize on load
        window.addEventListener('load', () => {
            initWorkspace('a');
            initWorkspace('b');
            updateColorIndicator('a');
            updateColorIndicator('b');
            updateStampCount();
        });
    </script>
</body>
</html>
